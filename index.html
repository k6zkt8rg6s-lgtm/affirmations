          .then(() => {
            state.syncedAt = Date.now(); save(); render();
            done('Файл сохранён, ' + size + '.' + warn);
          })
          .catch(() => { done('Не удалось записать файл.', 'bad'); });
        return;
      }

      // Системное «Поделиться» — только на телефоне и планшете.
      //
      // На компьютере оно не к месту: человек нажал «сохранить в файл»
      // и ждёт окна с папками, а получал список приложений, куда можно
      // отправить. На телефоне всё наоборот — там «Поделиться» и есть
      // единственный путь положить файл в iCloud Drive, и в нём же
      // сидит пункт «Сохранить в файлы».
      //
      // Различаем по способу ввода: у телефона и планшета есть касания,
      // у настольной Safari их нет ни одного.
      if (handheld() && navigator.canShare && navigator.canShare({ files: [file] })) {
        // Передаём ТОЛЬКО файл. Если добавить title или text, iOS
        // сохраняет их отдельным текстовым файлом рядом — и на диске
        // оказывается два файла вместо одного.
        navigator.share({ files: [file] })
          .then(() => { state.syncedAt = Date.now(); save(); render();
                        done('Файл сохранён, ' + size + '.' + warn); })
          .catch(() => { quit(); /* отменил — это не ошибка, молчим */ });
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = el('a', { attrs: { href: url, download: SYNC_FILE } });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.syncedAt = Date.now(); save(); render();
      // Куда именно он лёг, решает браузер. Safari по умолчанию кладёт
      // в «Загрузки» и не спрашивает — об этом честнее сказать сразу,
      // вместе с тем, как включить вопрос.
      done('Файл сохранён: ' + SYNC_FILE + ' (' + size + ').' + warn
           + '\nЕсли Safari не спросил, куда, — ищите в «Загрузках».');
    }

    /** Крупное заметное сообщение вместо мелкой серой строчки. */
    function report(text, kind) {
      clear(status);
      status.className = 'sync-status ' + (kind || '');
      status.appendChild(el('div', { text: text }));
      // Пришли сюда по стрелке — окно за спиной у системного не нужно.
      // Об ошибке скажем отдельно, через done.
      if (!quiet) present();
    }

    /** Показать, что внутри файла, и дождаться подтверждения. */
    function showPreview(parsed, clean, source) {
      let cards = 0, decks = 0;
      for (const s of clean.sections) {
        decks += s.decks.length;
        for (const d of s.decks) cards += d.cards.length;
      }
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      const clipCount = Object.keys(clips).length;
      const when = (typeof parsed.syncedAt === 'number')
        ? humanTime(parsed.syncedAt) : 'дата неизвестна';

      clear(sheet);
      present();
      sheet.appendChild(el('h3', { text: 'Что в файле' }));
      sheet.appendChild(el('p', { class: 'hint',
        text: (source || 'данные') + ' · ' + when }));
      sheet.appendChild(el('div', { class: 'sync-status ok' }, [
        el('div', { text: 'Разделов: ' + clean.sections.length }),
        el('div', { text: 'Колод: ' + decks }),
        el('div', { text: 'Карточек: ' + cards }),
        el('div', { text: 'Голосовых записей: ' + clipCount }),
      ]));
      // Сколько карточек в файле заявляют звук — если записей при этом
      // нет, значит выбран не тот файл, и молчать об этом нельзя
      let claimAudio = 0;
      for (const sec of clean.sections) {
        for (const d of sec.decks) {
          for (const c of d.cards) if (c.audio) claimAudio++;
        }
      }
      const isBackup = parsed && parsed.kind === 'backup';

      if (clipCount) {
        sheet.appendChild(el('p', { class: 'hint', text:
          'Голосовые записи лежат внутри этого же файла и разойдутся по '
          + 'своим карточкам.' }));
      } else if (isBackup || claimAudio) {
        sheet.appendChild(el('div', { class: 'sync-status bad' }, [
          el('div', { text: 'В этом файле нет голосовых записей.' }),
          el('div', { text: isBackup
            ? 'Это резервная копия — в неё звук не входит.'
            : 'Карточки говорят про звук (' + claimAudio + '), но самих '
              + 'записей в файле нет.' }),
          el('div', { text: 'Нужен файл, сохранённый кнопкой '
            + '«↑ Сохранить в файл» в этом окне. Он называется '
            + SYNC_FILE + '.' }),
        ]));
      }

      // Два разных действия, и разница между ними важная.
      //
      // «Сделать как в файле» — то, чего обычно и ждут от переноса с
      // телефона: устройство становится точно таким же. Раньше этого
      // способа не было вовсе, загрузка только добавляла, и разделы,
      // удалённые на телефоне, оставались на компьютере жить своей
      // жизнью — рядом с новыми.
      //
      // «Только добавить» остаётся для другого случая: когда карточки
      // писались на двух устройствах и нужно свести их вместе.
      sheet.appendChild(el('p', { class: 'hint', text:
        'Обновить — устройство станет точно таким же, как в файле, вместе '
        + 'с голосом. Это обычный способ перенести последнюю версию.' }));
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: drawMain } }),
        el('button', {
          class: 'btn big', attrs: { type: 'button' },
          text: 'Обновить',
          on: { click: () => askMirror(parsed, clean, source) },
        }),
      ]));
      sheet.appendChild(el('div', { class: 'sync-row' }, [
        el('button', {
          class: 'btn sec', attrs: { type: 'button' },
          text: 'Только добавить новое',
          on: { click: () => applyImport(parsed, clean, 'merge') },
        }),
      ]));
    }

    /**
     * Перед заменой показываем, что именно исчезнет.
     *
     * Удаление отменить нечем, поэтому список — не формальность: человек
     * должен увидеть названия своими глазами, а не согласиться с общим
     * «данные будут заменены».
     */
    function askMirror(parsed, clean, source) {
      const gone = extraHere(clean);
      if (!gone.any) { applyImport(parsed, clean, 'mirror'); return; }

      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Что исчезнет' }));
      sheet.appendChild(el('p', { class: 'hint', text:
        'Этого нет в файле, поэтому на устройстве не останется. '
        + 'Вернуть будет нечем.' }));

      const lines = [];
      if (gone.sections.length) {
        lines.push('Разделы целиком: ' + gone.sections.join(', '));
      }
      if (gone.decks.length) {
        lines.push('Колоды: ' + gone.decks.join(', '));
      }
      if (gone.cards) lines.push('Карточек всего: ' + gone.cards);
      sheet.appendChild(el('div', { class: 'sync-status bad' },
        lines.map((x) => el('div', { text: x }))));
      sheet.appendChild(el('p', { class: 'hint', text:
        'Всё, что есть и здесь, и в файле, останется на месте вместе со '
        + 'своими голосовыми записями.' }));

      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Назад', on: { click: () => showPreview(parsed, clean, source) } }),
        el('button', {
          class: 'btn danger', attrs: { type: 'button' },
          text: 'Да, сделать как в файле',
          on: { click: () => applyImport(parsed, clean, 'mirror') },
        }),
      ]));
    }

    /**
     * Здесь и только здесь данные действительно попадают в приложение.
     * mode: 'mirror' — сделать как в файле, 'merge' — только добавить.
     */
    function applyImport(parsed, clean, mode) {
      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Загрузка' }));
      sheet.appendChild(status);
      report('Переношу…', 'wait');

      // При замене сначала убираем лишнее, и только потом идёт обычное
      // слияние: оно доложит то, чего на устройстве не было, и соберёт
      // связи для голосовых записей
      let cleared = 0;
      if (mode === 'mirror') cleared = mirrorState(clean);
      const res = mergeState(clean);
      state.syncedAt = Date.now();
      save(); render();

      // Записи кладём после слияния: их надо привязать к тем карточкам,
      // которые только что появились, а у них новые идентификаторы
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      const inShots = (parsed && typeof parsed.shots === 'object' && parsed.shots)
        ? parsed.shots : {};
      importClips(res.audioLinks, clips, {
        set text(v) { report(v, 'wait'); },
      }, res.added, (cards, clipsDone, info) => {
        importShots(res.shotLinks, inShots, (v) => report(v, 'wait'), (shotsDone) => {
        clear(sheet);
        sheet.appendChild(el('h3', { text: 'Готово' }));
        const lines = [];
        if (mode === 'mirror') {
          lines.push('Устройство приведено к файлу.');
          if (cleared) lines.push('Убрано голосовых записей: ' + cleared);
        }
        lines.push('Добавлено карточек: ' + cards);
        lines.push('Перенесено записей: ' + clipsDone);
        if (shotsDone) lines.push('Перенесено фотографий: ' + shotsDone);
        const inFile = (info && info.inFile) || 0;
        const kept = (info && info.kept) || 0;
        // Раньше итог сводился к «нового не оказалось», и было
        // непонятно, куда делись записи, которые видно в файле.
        // Теперь про каждую сказано, что с ней стало.
        if (kept) {
          lines.push('Уже были на этом устройстве: ' + kept);
        }
        const lost = inFile - clipsDone - kept;
        if (inFile && lost > 0) {
          const w = (info && info.why) || {};
          const reason = w.parse ? 'не удалось разобрать запись в файле'
            : w.write ? 'хранилище браузера отказалось её принять'
            : w.verify ? 'запись легла, но не прочиталась обратно'
            : w.nolink ? 'для записи не нашлось карточки в этом же файле'
            : 'причина не определена';
          lines.push('');
          lines.push('Не удалось перенести: ' + lost + '.');
          lines.push('Причина: ' + reason + '.');
        }
        if (cards === 0 && clipsDone === 0 && !kept && !inFile) {
          lines.push('');
          lines.push('Нового не оказалось — всё это уже есть на устройстве.');
        }
        sheet.appendChild(el('div', { class: 'sync-status ok' },
          lines.map((x) => el('div', { text: x }))));
        sheet.appendChild(el('div', { class: 'sheet-actions' }, [
          el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Закрыть',
                         on: { click: () => { close(); render(); } } }),
        ]));
        }, mode);
      }, mode);
    }

    /** Отметка сборки внизу окна: по ней видно, что за версия открыта. */

    /**
     * Заставить приложение перечитать себя заново.
     *
     * Приложение, поставленное в док или на экран «Домой», живёт своей
     * жизнью: у него свой кеш и свой обработчик офлайна, и обновлённый
     * файл на хостинге оно может не увидеть неделями. Получается самое
     * неприятное — на телефоне новая версия, на компьютере старая, и
     * почему, снаружи не видно. Эта кнопка выбрасывает всё накопленное и
     * перечитывает страницу.
     */
    function drawMain() {
    clear(sheet);
    sheet.appendChild(el('h3', { text: 'Обмен между устройствами' }));

    // Две кнопки, и больше ничего.
    //
    // Раньше здесь было много слов и несколько кнопок вперемешку, и
    // самое частое затруднение было простое: непонятно, какая из них в
    // какую сторону. Теперь направление видно по стрелке и сказано
    // одной строкой — что именно произойдёт.
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn big', attrs: { type: 'button' },
                     text: '↓  Взять из файла',
                     on: { click: () => fileInput.click() } }),
      el('p', { class: 'hint', text:
        'Обновить это устройство: взять последнюю версию, сохранённую '
        + 'на другом.' }),
    ]));
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn sec big', attrs: { type: 'button' },
                     text: '↑  Сохранить в файл', on: { click: sendOut } }),
      el('p', { class: 'hint', text:
        'Сохранить эту версию — карточки и голос — чтобы взять её на '
        + 'другом устройстве.' }),
    ]));

    // Запасной путь на случай, если окно выбора файла опять заупрямится.
    // Голос так не переносится — он слишком тяжёлый, чтобы держать его
    // в буфере обмена; об этом сказано прямо, чтобы не было сюрприза.
    const paste = el('textarea', {
      class: 'paste-box',
      attrs: { rows: '3', placeholder: 'Или вставьте сюда текст файла',
               autocomplete: 'off', autocorrect: 'off', spellcheck: 'false' },
    });
    const pasteBlock = el('details', { class: 'fallback' }, [
      el('summary', { text: 'Не получается выбрать файл?' }),
      el('p', { class: 'hint', text:
        'Откройте файл на другом устройстве, скопируйте всё содержимое '
        + 'и вставьте сюда. Тексты и цвета перенесутся, голосовые '
        + 'записи — нет.' }),
      paste,
      el('button', {
        class: 'btn sec', attrs: { type: 'button' }, text: 'Загрузить из текста',
        on: { click: () => {
          const v = paste.value || '';
          if (!v.trim()) { report('Поле пустое — вставьте текст.', 'bad'); return; }
          takeText(v, 'вставленный текст');
        } },
      }),
    ]);
    sheet.appendChild(status);
    if (state.syncedAt) {
      sheet.appendChild(el('p', { class: 'hint',
        text: 'Последний обмен: ' + humanTime(state.syncedAt) }));
    }
    sheet.appendChild(el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Закрыть',
                     on: { click: close } }),
    ]));

    // Всё редкое — под складкой. Это нужно раз в полгода и не должно
    // мешать двум кнопкам наверху.
    sheet.appendChild(el('details', { class: 'fallback' }, [
      el('summary', { text: 'Ещё' }),
      el('p', { class: 'hint', text:
        'Голосовые записи лежат внутри того же файла — из-за них он '
        + 'заметно тяжелее, это нормально. Сохранённый файл заодно '
        + 'служит и резервной копией: карточки и голос хранятся только '
        + 'на устройстве, и без него восстановить их будет нечем.' }),
      pasteBlock,
      el('div', { class: 'sync-row' }, [
        el('button', {
          class: 'btn sec', attrs: { type: 'button' },
          text: 'Обновить приложение',
          on: { click: () => fetchFreshApp((t) => report(t, 'wait')) },
        }),
        el('p', { class: 'hint', text:
          'Если на одном устройстве новая версия приложения, а на другом '
          + 'старая. Карточки и записи не пострадают — они хранятся '
          + 'отдельно от самого приложения.' }),
      ]),
      stamp(),
    ]));
    }

    drawMain();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });

    // Поле выбора файла кладём прямо в страницу, а не в окно: окна
    // может и не быть вовсе, а Safari не открывает выбор для поля,
    // которое не в документе.
    document.body.appendChild(fileInput);

    if (startWith === 'save') { sendOut(); return; }
    if (startWith === 'load') { fileInput.click(); return; }
    present();
  }

/* ─── 26-sync-merge.js ─────────────────────────────────────────────────
 * Слияние и перенос данных при обмене
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  /**
   * Слить входящие данные с текущими: добавить недостающее, ничего не
   * потерять. Замена «всё на всё» при синхронизации между двумя
   * устройствами гарантированно однажды сотрёт то, что было сделано
   * на другом, — поэтому только добавление, по совпадению текста.
   */
  /**
   * Чего у нас есть, а в файле нет. Считается до замены, чтобы человек
   * увидел список и решил сам: удаление отменить будет нечем.
   */
  function extraHere(incoming) {
    const sections = [], decks = [];
    let cards = 0;
    for (const sec of state.sections) {
      const inSec = incoming.sections.find((x) => x.name === sec.name);
      if (!inSec) {
        sections.push(sec.name);
        sec.decks.forEach((d) => { cards += d.cards.length; });
        continue;
      }
      for (const deck of sec.decks) {
        const inDeck = inSec.decks.find((x) => x.name === deck.name);
        if (!inDeck) {
          decks.push(sec.name + ' · ' + deck.name);
          cards += deck.cards.length;
          continue;
        }
        const inTexts = new Set(inDeck.cards.map((c) => c.text.trim()));
        deck.cards.forEach((c) => { if (!inTexts.has(c.text.trim())) cards++; });
      }
    }
    return { sections: sections, decks: decks, cards: cards,
             any: sections.length + decks.length + cards > 0 };
  }

  /**
   * Привести устройство к тому, что в файле: лишнее убрать, остальное
   * оставить как есть.
   *
   * Почему не «удалить всё и залить заново». У карточек, которые есть и
   * там и там, уже лежат голосовые записи — они привязаны к нынешним
   * идентификаторам. Пересоздать карточку значит потерять её запись,
   * даже если в файле звука нет (файл может быть резервной копией без
   * звука). Поэтому совпадающее сохраняем вместе с идентификаторами, а
   * трогаем только лишнее.
   *
   * Порядок берём из файла: раз устройство должно выглядеть как файл,
   * то и последовательность разделов, колод и карточек тоже его.
   */
  function mirrorState(incoming) {
    const dropped = [];               // чьи записи больше не нужны
    const sections = [];
    for (const inSec of incoming.sections) {
      const mine = state.sections.find((s) => s.name === inSec.name);
      const sec = mine
        ? { id: mine.id, name: mine.name, collapsed: mine.collapsed, decks: [] }
        : { id: uid(), name: inSec.name, collapsed: false, decks: [] };
      for (const inDeck of inSec.decks) {
        const myDeck = mine ? mine.decks.find((d) => d.name === inDeck.name) : null;
        const deck = myDeck
          ? { id: myDeck.id, name: myDeck.name, color: inDeck.color, cards: [] }
          : { id: uid(), name: inDeck.name, color: inDeck.color, cards: [] };
        const byText = new Map(
          myDeck ? myDeck.cards.map((c) => [c.text.trim(), c]) : []);
        for (const inCard of inDeck.cards) {
          const keep = byText.get(inCard.text.trim());
          if (keep) {
            byText.delete(inCard.text.trim());
            keep.color = inCard.color;
            keep.fav = inCard.fav;
            // Оформление тоже из файла.
            //
            // Здесь была потеря, из-за которой устройства не сходились:
            // выделил слово жирным на телефоне, перенёс на компьютер —
            // текст тот же, а оформление осталось прежним. «Как в
            // файле» значит и оформление как в файле.
            // «Как в файле» — значит и дорожки как в файле. Свои
            // дополнительные записи этой карточки убираем из хранилища:
            // список соберётся заново из файла, а иначе их звук остался
            // бы лежать мёртвым грузом, на который никто не ссылается.
            (Array.isArray(keep.extra) ? keep.extra : []).forEach((e) => {
              if (e && e.audio) dropped.push(e);
            });
            keep.extra = [];
            keep.marks = sanitizeMarks(inCard.marks, keep.text.length);
            keep.align = sanitizeAlign(inCard.align);
            keep.ink = sanitizeInk(inCard.ink);
            keep.link = sanitizeLink(inCard.link);
            keep.remind = inCard.remind === true;
            keep.head = clampStr(inCard.head, LIMITS.cardHead);
            keep.headMarks = sanitizeMarks(inCard.headMarks, keep.head.length);
            keep.headAlign = sanitizeAlign(inCard.headAlign);
            keep.headInk = sanitizeInk(inCard.headInk);
            keep.peaks = sanitizePeaks(inCard.peaks);
            keep.at = sanitizeAt(inCard.at);
            keep.inList = inCard.inList === true;
            keep.listAt = sanitizeListAt(inCard.listAt);
            // Оборот — тоже «как в файле». Свой уходит целиком: его
            // записи и снимки убираем из хранилища, а список собирается
            // заново из присланного. Иначе на устройстве осталась бы
            // половина старого оборота и половина нового.
            if (keep.back) {
              audioSlots(keep.back).forEach((sl) => dropped.push(sl));
              shotKeys(keep.back).forEach((k) => { AudioStore.del(k).catch(() => {}); });
            }
            const inBack = backFromFile(inCard.back);
            if (inBack) keep.back = inBack;
            else delete keep.back;
            keep.side = sanitizeSideNo(inCard.side);
            deck.cards.push(keep);
          } else {
            const born = { id: uid(), text: inCard.text, color: inCard.color,
                              fav: inCard.fav, remind: inCard.remind === true,
                              head: clampStr(inCard.head, LIMITS.cardHead),
                              headMarks: sanitizeMarks(inCard.headMarks,
                                clampStr(inCard.head, LIMITS.cardHead).length),
                              headAlign: sanitizeAlign(inCard.headAlign),
                              headInk: sanitizeInk(inCard.headInk),
                              audio: false, audioLen: 0,
                              parts: [],
                              marks: sanitizeMarks(inCard.marks, inCard.text.length),
                              align: sanitizeAlign(inCard.align),
                              ink: sanitizeInk(inCard.ink),
                              link: sanitizeLink(inCard.link),
                              // Место под дополнительные дорожки есть у
                              // каждой карточки: без него один и тот же
                              // файл, применённый дважды, менял бы вид
                              // карточки во второй раз
                              extra: [],
                              // Место остановки заводим сразу, пустым: без
                              // него один и тот же файл, применённый дважды,
                              // менял бы карточку во второй раз
                              at: sanitizeAt(inCard.at),
                              inList: inCard.inList === true,
                              listAt: sanitizeListAt(inCard.listAt),
                              peaks: sanitizePeaks(inCard.peaks) };
            // Оборот и то, какой стороной карточка лежала, — из файла.
            // Звук и снимки оборота приедут следом, своими кусками.
            const bornBack = backFromFile(inCard.back);
            if (bornBack) born.back = bornBack;
            born.side = sanitizeSideNo(inCard.side);
            deck.cards.push(born);
          }
        }
        // Всё, что осталось в byText, в файле не значится
        byText.forEach((c) => { sidesSlots(c).forEach((sl) => dropped.push(sl)); });
        sec.decks.push(deck);
      }
      // Колоды нашего раздела, которых в файле нет
      if (mine) {
        const kept = new Set(inSec.decks.map((d) => d.name));
        mine.decks.forEach((d) => {
          if (kept.has(d.name)) return;
          d.cards.forEach((c) => { sidesSlots(c).forEach((sl) => dropped.push(sl)); });
        });
      }
      sections.push(sec);
    }
    // Разделы, которых в файле нет вовсе
    const kept = new Set(incoming.sections.map((s) => s.name));
    state.sections.forEach((sec) => {
      if (kept.has(sec.name)) return;
      sec.decks.forEach((d) => d.cards.forEach((c) => {
        sidesSlots(c).forEach((sl) => dropped.push(sl));
      }));
    });

    state.sections = sections;
    // Звук удалённых карточек — из хранилища. Иначе он остался бы лежать
    // мёртвым грузом: карточки нет, а место занято.
    dropped.forEach((c) => {
      audioKeys(c).forEach((k) => { AudioStore.del(k).catch(() => {}); });
      shotKeys(c).forEach((k) => { AudioStore.del(k).catch(() => {}); });
    });
    return dropped.length;
  }

  /**
   * Связать дорожки из файла с местами у нас.
   *
   * У каждой дорожки в файле свой номер, и звук в файле лежит под ним.
   * У нас место может быть другим — поэтому и нужна связка: откуда взять
   * и куда положить. Первая дорожка ложится в саму карточку, остальные —
   * в новые места её списка, по порядку из файла.
   *
   * Порядок берём из показа, а не из того, как дорожки лежат в файле:
   * переставленные на одном устройстве приезжают на другое в том же
   * виде. Числа мест выдаём заново, подряд, — присланные не годятся, у
   * нас первой становится дорожка самой карточки.
   */
  function linkTracks(inCard, mine, out, existing) {
    const inSlots = audioSlots(inCard);
    if (!inSlots.length) return;
    mine.extra = [];
    inSlots.forEach((src, k) => {
      const dst = k === 0 ? mine
        : { id: uid(), audio: false, audioLen: 0, parts: [], peaks: [] };
      dst.trackPos = k;
      // Место, на котором запись остановили, едет вместе с ней. Своё у
      // карточки, которая была здесь и раньше, не трогаем при обычном
      // «добавить»: человек слушает её на этом устройстве.
      if (k > 0 || !existing) {
        dst.at = sanitizeAt(src.at);
        // И то, стоит ли запись в плейлисте: очередь собрана на одном
        // устройстве — пусть она же будет и на другом
        dst.inList = src.inList === true;
        dst.listAt = sanitizeListAt(src.listAt);
      }
      if (k > 0) mine.extra.push(dst);
      out.push({ from: src.id, card: dst, len: src.audioLen,
                 peaks: sanitizePeaks(src.peaks),
                 parts: sanitizeParts(src.parts),
                 existing: !!existing });
    });
  }

  /**
   * Связать снимки из файла с карточкой у нас.
   *
   * Как и у голоса: в файле снимок лежит под своим ключом, у нас будет
   * под новым. Список снимков карточки собираем заново — если в файле
   * их нет вовсе, значит, и на карточке их быть не должно.
   */
  function linkShots(inCard, mine, out, existing) {
    cardShots(inCard).forEach((s) => {
      out.push({ from: s.id, card: mine, w: s.w, h: s.h, existing: !!existing });
    });
    // Список снимков здесь НЕ очищается, и это важно. При обычном
    // «добавить» на карточке остаётся то, что уже снято на этом
    // устройстве: файл дополняет, а не стирает. Чистит только «как в
    // файле» — и делает это ниже, когда действительно кладёт своё.
  }

  /** Разложить снимки из файла по карточкам. */
  function importShots(links, shots, say, onDone, mode) {
    const all = links || [];
    // «Как в файле» значит как в файле: у карточек, которые были и
    // раньше, свои снимки уходят вместе с их содержимым, а на их место
    // ложатся присланные. При обычном «добавить» своё остаётся.
    if (mode === 'mirror') {
      const seen = [];
      all.forEach((l) => {
        if (!l.existing || seen.indexOf(l.card) >= 0) return;
        seen.push(l.card);
        shotKeys(l.card).forEach((k) => { AudioStore.del(k).catch(() => {}); });
        l.card.shots = [];
      });
    }
    const todo = all.filter((l) => {
      if (typeof shots[l.from] !== 'string') return false;
      // Карточка уже была, и на ней есть свои снимки — при «добавить»
      // не трогаем её вовсе: иначе одни и те же фотографии копились бы
      // при каждой загрузке файла.
      if (l.existing && mode !== 'mirror' && cardShots(l.card).length) return false;
      return true;
    });
    let ok = 0;
    const finish = () => { save(); render(); if (onDone) onDone(ok); };
    if (!todo.length) { finish(); return; }
    if (say) say('Переношу фотографии: 0 из ' + todo.length + '…');
    const step = (i) => {
      if (i >= todo.length) { finish(); return; }
      const link = todo[i];
      const cont = () => {
        if (say) say('Переношу фотографии: ' + (i + 1) + ' из ' + todo.length + '…');
        step(i + 1);
      };
      const blob = AudioStore.fromText(shots[link.from]);
      if (!blob || !blob.size) { cont(); return; }
      const key = shotKey();
      AudioStore.put(key, blob)
        .then(() => AudioStore.get(key))
        .then((back) => {
          // Отмечаем снимок на карточке только после того, как он
          // прочитался обратно: иначе в списке был бы пустой квадрат
          if (!back || !back.size) { cont(); return; }
          if (!Array.isArray(link.card.shots)) link.card.shots = [];
          link.card.shots.push({ id: key, w: link.w, h: link.h });
          ok++;
          cont();
        })
        .catch(() => cont());
    };
    step(0);
  }

  function mergeState(incoming) {
    let added = 0;
    // Пары «идентификатор в файле → карточка у нас»: по ним потом
    // разложим голосовые записи
    const audioLinks = [];
    const shotLinks = [];
    for (const inSec of incoming.sections) {
      let sec = state.sections.find((s) => s.name === inSec.name);
      if (!sec) {
        sec = { id: uid(), name: inSec.name, collapsed: false, decks: [] };
        state.sections.push(sec);
      }
      for (const inDeck of inSec.decks) {
        let deck = sec.decks.find((d) => d.name === inDeck.name);
        if (!deck) {
          deck = { id: uid(), name: inDeck.name, color: inDeck.color, cards: [] };
          sec.decks.push(deck);
        }
        const byText = new Map(deck.cards.map((c) => [c.text.trim(), c]));
        for (const inCard of inDeck.cards) {
          const key = inCard.text.trim();
          const mine = byText.get(key);
          if (mine) {
            // Карточка уже есть — сам текст не трогаем. А вот запись
            // берём в работу всегда, когда она есть в файле.
            //
            // Раньше здесь стояло условие «и только если у нас записи
            // нет» — по отметке на карточке. Отметка же может врать:
            // после восстановления копии карточка считает, что звук у
            // неё есть, хотя в хранилище пусто. Из-за этого запись из
            // файла молча пропускалась, и переносилось ноль записей при
            // том, что в файле их видно. Теперь наличие своей записи
            // проверяется по самому хранилищу, а не по отметке.
            linkTracks(inCard, mine, audioLinks, true);
            linkShots(inCard, mine, shotLinks, true);
            // Оборот. Своего нет вовсе — берём из файла целиком: иначе
            // оборот, заведённый на телефоне, никогда бы не доехал до
            // карточки, которая на компьютере уже есть. Свой есть —
            // не трогаем его текст: «добавить» ничего не стирает.
            if (inCard.back && typeof inCard.back === 'object') {
              if (!backFilled(mine)) {
                const nb = backFromFile(inCard.back);
                if (nb) { mine.back = nb; mine.side = sanitizeSideNo(inCard.side); }
              }
              const myBack = backOf(mine);
              linkTracks(inCard.back, myBack, audioLinks, true);
              linkShots(inCard.back, myBack, shotLinks, true);
            }
            continue;
          }
          if (deck.cards.length >= LIMITS.cardsPerDeck) break;
          // Форму волны переносим сразу: пересчитать её из файла на
          // iPhone нечем, а без неё дорожка выглядела бы пустой
          // Оформление переносим вместе с текстом: без него карточка
          // приезжает на другое устройство «раздетой», и человек видит
          // разное на двух экранах при одном и том же тексте
          const fresh = { id: uid(), text: inCard.text, color: inCard.color,
                          fav: inCard.fav, remind: inCard.remind === true,
                          head: clampStr(inCard.head, LIMITS.cardHead),
                          headMarks: sanitizeMarks(inCard.headMarks,
                            clampStr(inCard.head, LIMITS.cardHead).length),
                          headAlign: sanitizeAlign(inCard.headAlign),
                          headInk: sanitizeInk(inCard.headInk),
                          audio: false, audioLen: 0,
                          parts: [],
                          marks: sanitizeMarks(inCard.marks, inCard.text.length),
                          align: sanitizeAlign(inCard.align),
                          ink: sanitizeInk(inCard.ink),
                          link: sanitizeLink(inCard.link),
                          extra: [],
                          at: sanitizeAt(inCard.at),
                          inList: inCard.inList === true,
                          listAt: sanitizeListAt(inCard.listAt),
                          peaks: sanitizePeaks(inCard.peaks) };
          // Оборот новой карточки — из файла, вместе с тем, какой
          // стороной её оставили на том устройстве
          const freshBack = backFromFile(inCard.back);
          if (freshBack) fresh.back = freshBack;
          fresh.side = sanitizeSideNo(inCard.side);
          deck.cards.push(fresh);
          byText.set(key, fresh);
          added++;
          linkTracks(inCard, fresh, audioLinks, false);
          linkShots(inCard, fresh, shotLinks, false);
          if (freshBack) {
            linkTracks(inCard.back, freshBack, audioLinks, false);
            linkShots(inCard.back, freshBack, shotLinks, false);
          }
        }
      }
    }
    return { added: added, audioLinks: audioLinks, shotLinks: shotLinks };
  }

  /** Разложить голосовые записи из файла по карточкам. */
  function importClips(links, clips, status, addedCards, onDone, mode) {
    const todo = links.filter((l) => typeof clips[l.from] === 'string');
    // Сколько записей было в файле — нужно, чтобы честно объяснить
    // итог: «две записи в файле, обе уже есть» и «две записи в файле,
    // ни одна не легла» выглядят одинаково, а означают разное
    // Считаем записи, а не куски: продолжение — часть той же записи,
    // и «в файле три записи» вместо одной сбивало бы с толку
    const inFile = Object.keys(clips || {})
      .filter((k) => k.indexOf('~') < 0).length;
    let ok = 0, kept = 0, lastError = null;
    // Причины отказов копим поимённо. Гадать «наверное, кончилось
    // место» бессмысленно: в прошлый раз дело было совсем в другом,
    // а сообщение уводило в сторону.
    const why = { parse: 0, write: 0, verify: 0, nolink: 0 };

    const finish = () => {
      save(); render();
      if (typeof onDone === 'function') {
        onDone(addedCards, ok, { inFile: inFile, kept: kept, why: why });
        return;
      }
      const parts = [];
      parts.push(addedCards ? 'Добавлено карточек: ' + addedCards
                            : 'Новых карточек нет');
      if (ok) parts.push('записей: ' + ok);
      status.text = parts.join(', ') + '.';
    };

    // Записи, для которых в файле нет карточки (или наоборот)
    why.nolink = Math.max(0, inFile - todo.length);
    if (todo.length === 0) { finish(); return; }
    status.text = 'Переношу записи: 0 из ' + todo.length + '…';

    const step = (i) => {
      if (i >= todo.length) { finish(); return; }
      const link = todo[i];
      const cont = () => {
        status.text = 'Переношу записи: ' + (i + 1) + ' из '
          + todo.length + '…';
        step(i + 1);
      };

      const take = () => {
        // Запись могла приехать несколькими кусками. Берём подряд,
        // пока куски есть: оборвавшийся хвост не должен мешать
        // перенести хотя бы начало записи.
        const want = Math.max(1, (link.parts && link.parts.length) || 1);
        const blobs = [];
        for (let k = 0; k < want; k++) {
          const b = AudioStore.fromText(clips[partKey(link.from, k)]);
          if (!b || !b.size) break;
          blobs.push(b);
        }
        if (!blobs.length) { why.parse++; cont(); return; }

        // Отмечаем звук только после того, как убедились, что он
        // действительно читается обратно. Иначе карточка могла бы
        // заявлять запись, которой на деле нет.
        const put = (k) => {
          if (k < blobs.length) {
            return AudioStore.put(partKey(link.card.id, k), blobs[k])
              .then(() => put(k + 1));
          }
          return AudioStore.get(link.card.id).then((back) => {
            if (!back || !back.size) { why.verify++; cont(); return; }
            link.card.audio = true;
            const parts = (link.parts || []).slice(0, blobs.length);
            link.card.parts = parts;
            // Длину пересчитываем по тем кускам, что дошли: иначе
            // дорожка обещала бы звук, которого на устройстве нет
            link.card.audioLen = parts.length
              ? Math.round(parts.reduce((s, p) => s + p.len, 0) * 100) / 100
              : (link.len || 0);
            if (Array.isArray(link.peaks) && link.peaks.length) {
              link.card.peaks = link.peaks;
            }
            ok++;
            cont();
          });
        };
        put(0).catch((e) => { why.write++; lastError = e; cont(); });
      };

      if (!link.existing) { take(); return; }
      // «Сделать как в файле» значит именно как в файле — вместе с
      // голосом.
      //
      // Здесь была ошибка, из-за которой устройства и не могли
      // обменяться последней версией. Своя запись считалась дороже
      // чужой всегда, при любом способе загрузки. Перезаписал голос на
      // телефоне, перенёс на компьютер — текст обновился, а звук
      // остался прежний, потому что «свой». Теперь при замене
      // побеждает файл, а при обычном добавлении — как и было, своё.
      if (mode === 'mirror') { take(); return; }

      // Карточка была на устройстве. Своя запись дороже чужой — но
      // «своя» значит настоящая, а не отметка о ней.
      AudioStore.get(link.card.id).then((mine) => {
        if (mine && mine.size) {
          link.card.audio = true;      // отметка могла быть снята — вернём
          kept++;
          cont();
          return;
        }
        take();
      }).catch(take);
    };
    step(0);
  }


/* ─── 27-boot.js ───────────────────────────────────────────────────────
 * Полоска новой версии, render(), запуск и общие жесты
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Полоска «готова новая версия».
  //
  // Приложение теперь открывается из памяти устройства, не дожидаясь
  // сети, — иначе после полного закрытия оно каждый раз скачивало себя
  // заново, и человек несколько секунд смотрел на пустой экран. Плата
  // за скорость одна: свежая версия приезжает уже после открытия.
  // Значит, о ней надо сказать вслух, а не молчать — иначе непонятно,
  // применилось обновление или нет.
  // ------------------------------------------------------------------
  let freshReady = false;

  /** Пришли ли мы сюда с обновления: в адресе остаётся метка. */
  const cameFromUpdate = () => /[?&]fresh=/.test(
    (typeof location !== 'undefined' && location.search) || '');

  function freshStrip() {
    if (!freshReady) return null;
    // Если мы только что обновлялись, а версия всё равно другая — значит,
    // сайт пока отдаёт прежнюю страницу. Молчать об этом нельзя: человек
    // нажимает «Обновить» второй и третий раз и не понимает, почему
    // ничего не меняется.
    const stuck = cameFromUpdate();
    return el('div', { class: 'fresh-strip' }, [
      el('span', { class: 'fresh-text', text: stuck
        ? 'Сайт пока отдаёт прежнюю версию. Через минуту попробуйте ещё раз'
        : 'Готова новая версия' }),
      el('button', {
        class: 'fresh-go', attrs: { type: 'button' },
        text: stuck ? 'Ещё раз' : 'Обновить',
        on: {
          // Не просто перезагрузка. Обычная перезагрузка берёт страницу
          // из памяти — сначала нашей, потом браузерной, — и человек
          // видит ту же версию, что и до нажатия. Здесь память чистится
          // целиком, и страница скачивается заново.
          click: () => { fetchFreshApp(); },
        },
      }),
    ]);
  }

  /** Обработчик офлайна сообщил, что скачал новую версию. */
  function noteFresh() {
    if (freshReady) return;
    freshReady = true;
    render();
  }

  // ------------------------------------------------------------------
  function render() {
    // Где человек стоит прямо сейчас — спросить надо ДО подмены
    // содержимого: после неё страница уже другой высоты, и браузер
    // успевает зажать прокрутку.
    const wasAt = (typeof window !== 'undefined'
      && (window.scrollY || window.pageYOffset)) || 0;
    if (readerKeyHandler) {
      document.removeEventListener('keydown', readerKeyHandler);
      readerKeyHandler = null;
    }
    // Освобождаем ссылки прошлого экрана. Всё, кроме одного: запись,
    // которая играет прямо сейчас, переезжает на новый экран целой.
    // Раньше здесь обрывалось всё подряд, и переход на другую карточку
    // обрывал и звук — ровно то, чего быть не должно.
    stopRecording();
    const keepPlaying = livePark();
    runCleanup(keepPlaying);
    // Обработчики жеста «назад» висят на корне и переживают перерисовку —
    // снимаем их сами, иначе накопятся и начнут срабатывать по нескольку раз
    if (backSwipeCleanup) { backSwipeCleanup(); backSwipeCleanup = null; }
    clear(root);
    const strip = freshStrip();
    if (strip) root.appendChild(strip);
    let content;
    if (view.name === 'read') content = renderReader();
    else if (view.name === 'deck') content = renderDeck();
    else if (view.name === 'list') content = renderPlaylist();
    else content = renderHome();
    root.appendChild(content);
    // Звучащая запись либо вернулась в свою карточку, либо ей нужна
    // полоска внизу: играет-то она в любом случае
    liveSettle();

    // Возвращаемся туда, где стояли на этом экране. Если человек здесь
    // ещё не был — начинаем сверху, как и раньше.
    //
    // Но только при переходе на ДРУГОЙ экран. Перерисовка того же самого
    // (отметили избранное, свернули раздел, поправили карточку) прокрутку
    // трогать не должна: место, запомненное при уходе с экрана, к этому
    // мгновению давно другое, и человека уносило вниз ни с того ни с
    // сего. Так и было с сердечком в «Избранном»: снимаешь отметку — и
    // экран сам уезжает вниз.
    const here = spotKey(view);
    const back = here === shownKey ? wasAt : (spots[here] || 0);
    shownKey = here;
    spots[here] = back;
    window.scrollTo(0, back);
    // Второй заход на следующем кадре. Сразу после подмены содержимого
    // страница ещё не набрала высоту, и Safari молча зажимает прокрутку
    // до того, что успело поместиться, — на длинном списке это
    // возвращало в начало, хотя место мы помнили верно.
    if (back && typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => {
        // Экран мог смениться, пока кадр ждал своей очереди: быстрое
        // двойное нажатие — и доводка сработала бы уже на другом экране,
        // утащив человека неизвестно куда
        if (spotKey(view) !== here) return;
        const now = window.scrollY || window.pageYOffset || 0;
        // Не спорим с человеком: если он уже успел тронуть страницу
        // пальцем, оставляем как есть
        if (Math.abs(now - back) > 2 && now <= 2) window.scrollTo(0, back);
      });
    }

    // Приходящий экран не анимируется вовсе — и это осознанно.
    //
    // Сначала он въезжал сдвигом, потом проявлялся прозрачностью. И то и
    // другое на время анимации кладёт всю страницу на отдельный слой, а
    // страница длиннее окна. Прокрутка по такому слою включается не
    // сразу: человек возвращается на главный, сразу крутит колесо — и
    // первая попытка уходит впустую.
    //
    // Уходящий экран по-прежнему уезжает вбок, движение видно. А
    // приходящий появляется мгновенно и прокручивается с первого раза.
    // Это дороже любой анимации.
    pageEnter = 0;
  }

  // ------------------------------------------------------------------
  // Работа без интернета — только для версии, размещённой по https.
  //
  // Проверка протокола обязательна: при открытии файла двойным щелчком
  // рядом нет никакого sw.js, и попытка его зарегистрировать закончилась
  // бы ошибкой в консоли на пустом месте. Обработчик кеша живёт в
  // отдельном файле sw.js рядом с index.html.
  // ------------------------------------------------------------------
  if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
    // Обработчик сообщает, когда докачал свежую версию — показываем
    // полоску вместо того, чтобы молча подсунуть её при следующем запуске
    if (navigator.serviceWorker.addEventListener) {
      navigator.serviceWorker.addEventListener('message', (ev) => {
        if (ev && ev.data && ev.data.kind === 'fresh') noteFresh();
      });
    }
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Не зарегистрировался — приложение всё равно работает,
        // просто не откроется без сети
      });
    });
    // И вторая проверка, своя, ни от чего не зависящая.
    //
    // Обработчик кеша сообщает о новой версии сам — когда работает как
    // задумано. Но если на сайт положили только страницу, а сам
    // обработчик остался прежним, или он застрял на старой копии,
    // сообщения не будет никогда, и приложение будет годами показывать
    // «у вас последняя версия». Поэтому спрашиваем ещё и напрямую,
    // маленьким файлом: он мимо всех кешей.
    //
    // Через несколько секунд после запуска: сразу — значит отнять сеть у
    // того, что человеку нужно прямо сейчас.
    setTimeout(() => {
      askSiteVersion((site) => {
        const mine = myVersion();
        if (site && mine && site !== mine) noteFresh();
      });
    }, 4000);
  }

  // Два обработчика на всё время работы приложения — для переноса
  // удержанием. Ставятся один раз: корневой узел перерисовку переживает.
  //
  // Прокрутка. Пока элемент несут, страница ехать не должна. Одного
  // touch-action тут мало: он читается в начале касания, а решение
  // «это перенос» приходит через полсекунды. Поэтому гасим сам
  // touchmove — на pointermove это не работает, отменять прокрутку
  // умеет только touch-событие.
  root.addEventListener('touchmove', (ev) => {
    if (drag && ev.cancelable) ev.preventDefault();
  }, { passive: false });

  // Колесо и трекпад. Один обработчик на всё время работы приложения —
  // и обязательно пассивный.
  //
  // Здесь была та самая пропавшая прокрутка. Обработчик колеса на корне
  // накрывает всю площадь приложения. Обычный, способный отменить
  // событие, заставляет Safari вести прокрутку этой площади вручную —
  // и над списком карточек она попросту вставала. Мы вешали такой
  // обработчик при входе в колоду и снимали при выходе, но Safari, судя
  // по всему, площадь обратно не отпускал: после первого захода в
  // колоду и возврата прокрутка умирала и на главном экране — над
  // колодами и разделами, а по пустым полям, куда приложение не
  // достаёт, продолжала работать.
  //
  // Пассивный обработчик ничего отменить не может — и именно поэтому
  // Safari отдаёт ему события, не трогая прокрутку. Жест «назад» по
  // трекпаду он по-прежнему видит и отрабатывает.
  root.addEventListener('wheel', (ev) => {
    if (padWheelNow) padWheelNow(ev);
  }, { passive: true });

  // Щипок двумя пальцами в списке карточек ничего не увеличивает.
  // Обработчик тоже один и постоянный, а решает переменная.
  const noZoomEver = (ev) => {
    if (noZoomNow && ev.cancelable && ev.preventDefault) ev.preventDefault();
  };
  root.addEventListener('gesturestart', noZoomEver);
  root.addEventListener('gesturechange', noZoomEver);

  // Нажатие. После переноса браузер нередко досылает click по тому
  // элементу, который несли, — раздел свернулся бы, а колода открылась.
  // Гасим ровно одно нажатие сразу после переноса.
  root.addEventListener('click', (ev) => {
    if (!dragKill || Date.now() > dragKill) { dragKill = 0; return; }
    dragKill = 0;
    ev.preventDefault();
    ev.stopPropagation();
  }, true);

  // Разовая сверка отметок о звуке с хранилищем. Нужна тем, кто уже
  // восстановился из копии до этой правки: у них карточки заявляют
  // записи, которых нет, и «играть» молча упирается в пустоту.
  // Проверка идёт своим чередом и отрисовку не задерживает.
  setTimeout(() => healAudioFlags(), 0);

  render();
})();
</script>
</body>
</html>
