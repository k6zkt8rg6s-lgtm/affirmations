          f.align = align; f.ink = ink;
          f.head = head; f.headMarks = headMarks;
          f.headAlign = headAlign; f.headInk = headInk;
          card.color = v.color;      // цвет общий у обеих сторон
        } else {
          if (deck.cards.length >= LIMITS.cardsPerDeck) {
            alert('Достигнут предел карточек в колоде.'); return false;
          }
          deck.cards.push({ id: uid(), text: text, color: v.color, fav: false,
                            marks: marks, align: align, ink: ink,
                            head: head, headMarks: headMarks,
                            headAlign: headAlign, headInk: headInk });
        }
      },
      card ? () => dropCard(deck, card, true) : null);
  }

  /**
   * Убрать карточку из колоды — насовсем.
   *
   * Одно место на два пути: кнопка в окне правки и свайп по строке
   * вправо. Разойдись они — однажды один из путей забыл бы про голос,
   * и запись осталась бы висеть в хранилище навсегда.
   */
  function dropCard(deck, card, quiet) {
    const idx = deck.cards.findIndex((c) => c.id === card.id);
    // Вместе с карточкой убираем и её запись, иначе звук останется
    // висеть в хранилище: карточки нет, а место занято. Кусков
    // продолжения может быть несколько — убираем все.
    // Все дорожки карточки, а не только первая: их может быть до трёх.
    // И с обеих сторон: у оборота свои записи под своими номерами, и
    // без этого они остались бы в хранилище навсегда.
    sidesAudioKeys(card).forEach((k) => { AudioStore.del(k).catch(() => {}); });
    // И снимки: они лежат там же и точно так же остались бы висеть
    sidesShotKeys(card).forEach((k) => { AudioStore.del(k).catch(() => {}); });
    deck.cards = deck.cards.filter((c) => c.id !== card.id);
    if (view.name === 'read') {
      if (deck.cards.length === 0) {
        go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId });
      } else {
        view.index = Math.max(0, Math.min(idx, deck.cards.length - 1));
      }
    }
    // Окно правки закроется само и перерисует экран следом — второй
    // раз рисовать незачем
    if (!quiet) { save(); render(); }
  }

/* ─── 21-settings.js ───────────────────────────────────────────────────
 * Настройки, резервная копия, проверка новой версии
 *
 * Часть общего кода приложения. Собирается: python3 build.py

  // ------------------------------------------------------------------
  // Настройки: резервная копия
  // ------------------------------------------------------------------
  function humanTime(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    const pad = (n) => String(n).padStart(2, '0');
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear()
      + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /** Отметка сборки — по ней видно, какая версия открыта. */
  const stamp = () => el('p', { class: 'hint build-stamp', text: buildLabel() });

  /**
   * Забрать свежую оболочку приложения из интернета.
   *
   * Приложение хранит себя на устройстве, чтобы открываться мгновенно.
   * Обратная сторона: когда в интернете появляется исправленная версия,
   * само оно об этом узнаёт не сразу. Эта кнопка выбрасывает сохранённое
   * и перечитывает всё заново.
   *
   * Карточки и голосовые записи это не трогает совсем: они лежат в
   * другом месте — в хранилище устройства, а не в памяти страницы.
   */
  /**
   * Какая версия лежит на сайте прямо сейчас.
   *
   * Отдельный крошечный файл version.txt рядом с приложением — в нём одна
   * строка с отметкой сборки. Спрашиваем именно его, а не саму страницу,
   * и вот почему.
   *
   * Страницу отдаёт обработчик кеша: у него в памяти лежит своя копия, и
   * на любой запрос за страницей он вернёт её, даже если попросить
   * «свежую». Значит, узнать через страницу, что на сайте новее, нельзя
   * в принципе — пока обработчик сам не решит обновиться. Если он по
   * какой-то причине этого не делает, приложение остаётся слепым: именно
   * так и вышло, когда новая версия месяцами лежала на сайте, а на
   * устройстве всё показывало старую отметку.
   *
   * Маленький файл со случайной добавкой в адресе не попадает ни в один
   * кеш: ни в наш — такого адреса там нет, — ни в браузерный.
   */
  const VERSION_FILE = 'version.txt';
  function askSiteVersion(done) {
    const say = (v) => { if (typeof done === 'function') done(v); };
    if (typeof fetch !== 'function' || location.protocol !== 'https:') {
      say(null);
      return Promise.resolve(null);
    }
    const href = VERSION_FILE + '?ask=' + Date.now();
    return fetch(href, { cache: 'no-store', credentials: 'same-origin' })
      .then((res) => (res && res.ok ? res.text() : null))
      .then((text) => {
        // Файла может не быть вовсе — например, на сайт положили только
        // страницу. Тогда честно говорим «не знаю», а не выдумываем.
        const line = String(text || '').trim().split('\n')[0].trim();
        const ok = line && line.length <= 40 && line.indexOf('<') < 0 ? line : null;
        say(ok);
        return ok;
      })
      .catch(() => { say(null); return null; });
  }

  /** Наша собственная отметка — или null, если это сборка для разработки. */
  const myVersion = () => (BUILD.indexOf('#') >= 0 ? null : BUILD);

  function fetchFreshApp(say) {
    const tell = (t) => { if (typeof say === 'function') say(t); };
    tell('Забираю свежую версию…');
    const jobs = [];
    if (typeof caches !== 'undefined' && caches.keys) {
      jobs.push(caches.keys()
        .then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
        .catch(() => {}));
    }
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      jobs.push(navigator.serviceWorker.getRegistrations()
        .then((regs) => Promise.all(regs.map((r) => r.unregister())))
        .catch(() => {}));
    }
    return Promise.all(jobs).then(() => {
      if (typeof location === 'undefined') return;
      // Уходим на адрес, которого браузер ещё не видел.
      //
      // Обычная перезагрузка тут не работает, и это выяснилось на живых
      // устройствах: страницу браузер помнит у себя, отдельно от нашей
      // памяти, и на перезагрузку спокойно достаёт прежнюю копию. Снаружи
      // это выглядело так: нажимаешь «Обновить», страница мигает, и через
      // несколько секунд снова «готова новая версия» — по кругу.
      //
      // Адрес с новой меткой времени взяться из памяти не может нигде: ни
      // у нас, ни у браузера, ни у хостинга, — такого адреса никто ещё не
      // спрашивал. Метка остаётся только в текущем окне; приложение,
      // запущенное с экрана «Домой», открывается по своему обычному
      // адресу.
      const base = String(location.href || '').split('?')[0].split('#')[0];
      const fresh = base + '?fresh=' + Date.now();
      if (location.replace) { location.replace(fresh); return; }
      if (location.reload) location.reload();
    });
  }

  /**
   * Раскрыт ли на главном экране хоть один раздел.
   *
   * По этому и решает единственная кнопка наверху, что делать
   * следующим нажатием: раскрыть всё или свернуть всё.
   */
  function homeOpen() {
    if (state.sections.some((s) => !s.collapsed)) return true;
    return collectFavourites().length > 0 && !state.favCollapsed;
  }

  /**
   * Свернуть или развернуть все разделы разом.
   *
   * Раскрытость каждого раздела хранится там же, где и всё остальное, и
   * сохраняется на устройстве. Поэтому и после закрытия приложения вид
   * останется тем самым: развернули — вернётесь в развёрнутый, свернули
   * — в свёрнутый. Раскрыли вручную один раздел — так он и откроется.
   */
  function toggleAllSections() {
    const hide = homeOpen();          // что-то открыто — значит, сворачиваем
    state.sections.forEach((s) => { s.collapsed = hide; });
    state.favCollapsed = hide;
    save();
    render();
  }

  /**
   * Окно кнопки «⋯»: три редких действия, убранных с глаз.
   *
   * Окно закрывается ДО того, как начнётся само действие, и обязательно
   * в том же нажатии. Две причины. Первая: системное окно сохранения
   * иначе всплывёт поверх нашего, и наше будет висеть за его спиной —
   * этим уже жаловались. Вторая: браузер открывает выбор файла только
   * «по горячему следу» нажатия, поэтому ни одной задержки между
   * закрытием и делом быть не должно.
   */
  function openMore() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const pick = (fn) => () => { close(); fn(); };

    const item = (sign, name, hint, fn) => el('button', {
      class: 'menu-item', attrs: { type: 'button', 'aria-label': name },
      on: { click: pick(fn) },
    }, [
      el('span', { class: 'menu-sign', text: sign }),
      el('span', { class: 'menu-body' }, [
        el('span', { class: 'menu-name', text: name }),
        el('span', { class: 'menu-hint', text: hint }),
      ]),
    ]);

    const sheet = el('div', { class: 'sheet' }, [
      el('h3', { text: 'Ещё' }),
      el('div', { class: 'menu-list' }, [
        item('↑', 'Сохранить в файл',
          'Отдать всё: карточки и голосовые записи', () => openSync('save')),
        item('↓', 'Взять из файла',
          'Забрать данные с другого устройства', () => openSync('load')),
        item('★', 'Напоминания',
          'Показывать отмеченные звёздочкой на экране устройства', openRemind),
        item('↻', 'Обновить приложение',
          'Скачать свежую версию самого приложения', openRefresh),
      ]),
      el('div', { class: 'sheet-actions' }, [
        el('button', {
          class: 'btn sec', attrs: { type: 'button' },
          text: 'Закрыть', on: { click: close },
        }),
      ]),
    ]);
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

/* ─── 22-reminders.js ──────────────────────────────────────────────────
 * Напоминания: сборка календаря и выдача файла
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Напоминания: отмеченные звёздочкой карточки приходят на экран
  // устройства, когда приложение закрыто.
  //
  // Почему через Календарь, а не само приложение. Показать что-то поверх
  // других приложений сайт не может: на iPhone уведомления бывают только
  // «пуш», их присылает сервер. Локальных, которые приложение ставит
  // себе само на будущее, в вебе нет ни в стандарте, ни в Safari. А
  // сервера у нас нет и заводить его незачем: всё приложение — один файл.
  //
  // Календарь эту задачу решает целиком и без сервера. Приложение делает
  // файл событий, человек открывает его один раз — и дальше система сама
  // показывает текст аффирмации баннером в назначенные часы, на iPhone и
  // на MacBook сразу, через iCloud, и без интернета.
  //
  // Время в файле «плавающее», без часового пояса: событие в девять утра
  // остаётся девятью утра и в другой стране.
  // ------------------------------------------------------------------
  const REMIND_FILE = 'affirmations-reminders.ics';
  const REMIND_MAX = 200;       // столько событий не стыдно положить в календарь

  /**
   * Адрес самой карточки — чтобы вернуться к ней из напоминания.
   *
   * Только для приложения, живущего по https: у файла, открытого
   * двойным щелчком, адреса нет, и ссылка вела бы в никуда — лучше
   * тогда обойтись вовсе без неё.
   */
  function cardLink(card) {
    if (!card || !card.id) return '';
    if (typeof location === 'undefined' || location.protocol !== 'https:') return '';
    const base = String(location.href || '').split('?')[0].split('#')[0];
    if (!base) return '';
    return base + '?card=' + encodeURIComponent(card.id);
  }

  /** Все карточки, отмеченные звёздочкой, — по порядку колод. */
  function remindCards() {
    const out = [];
    state.sections.forEach((sec) => {
      sec.decks.forEach((deck) => {
        deck.cards.forEach((c) => { if (c.remind) out.push(c); });
      });
    });
    return out;
  }

  /** Часы напоминаний за день: с какого по какой, через сколько. */
  function remindHours(every, from, to) {
    const step = Math.max(1, Math.min(12, Math.round(every || 3)));
    const a = Math.max(0, Math.min(23, Math.round(from)));
    const b = Math.max(a, Math.min(23, Math.round(to)));
    const out = [];
    for (let h = a; h <= b; h += step) out.push(h);
    return out;
  }

  /** Двузначное число — часы и минуты в календаре пишутся только так. */
  const two = (n) => (n < 10 ? '0' + n : String(n));

  /**
   * Собрать файл календаря.
   *
   * Карточки идут по очереди, по кругу. В календаре нет способа сказать
   * «каждый раз следующая», поэтому очередь раскладывается заранее: на
   * каждую пару «день круга + час» своё событие, и повторяется оно раз в
   * K дней, где K — число отмеченных карточек. Через K дней всё
   * возвращается к началу, и круг идёт заново.
   */
  function buildReminders(cards, hours, now) {
    const K = cards.length, S = hours.length;
    if (!K || !S) return '';
    const start = now || new Date();
    const lines = [];
    const put = (s) => { lines.push(s); };
    /** Перевод строки и точка с запятой в тексте события — служебные. */
    const esc = (s) => String(s || '')
      .replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
    const day = (add) => {
      const d = new Date(start.getFullYear(), start.getMonth(),
        start.getDate() + add, 0, 0, 0);
      return String(d.getFullYear()) + two(d.getMonth() + 1) + two(d.getDate());
    };
    const now8 = String(start.getFullYear()) + two(start.getMonth() + 1)
      + two(start.getDate()) + 'T' + two(start.getHours())
      + two(start.getMinutes()) + two(start.getSeconds());

    put('BEGIN:VCALENDAR');
    put('VERSION:2.0');
    put('PRODID:-//Аффирмации//RU');
    put('CALSCALE:GREGORIAN');
    put('METHOD:PUBLISH');
    put('X-WR-CALNAME:Аффирмации');

    const total = Math.min(K * S, REMIND_MAX);
    for (let i = 0; i < total; i++) {
      const d = Math.floor(i / S), h = hours[i % S];
      const card = cards[i % K];
      const text = shortText(card.text) || 'Аффирмация';
      put('BEGIN:VEVENT');
      put('UID:aff-' + i + '-' + now8 + '@affirmations');
      put('DTSTAMP:' + now8);
      put('DTSTART:' + day(d) + 'T' + two(h) + '0000');
      put('DURATION:PT5M');
      put('RRULE:FREQ=DAILY;INTERVAL=' + K);
      put('SUMMARY:' + esc(text));
      // Ссылка на саму карточку. Уведомление рисует система, и это
      // всегда строка текста — своей карточки в него не вложить. Зато
      // от уведомления до настоящей карточки остаётся одно нажатие:
      // открыть событие и нажать ссылку. Там уже и цвет, и голос.
      const back = cardLink(card);
      put('DESCRIPTION:' + esc(card.text + (back ? '\n\n' + back : '')));
      if (back) put('URL:' + back);
      put('TRANSP:TRANSPARENT');       // время не считается занятым
      put('BEGIN:VALARM');
      put('ACTION:DISPLAY');
      put('DESCRIPTION:' + esc(text));
      put('TRIGGER:PT0S');
      put('END:VALARM');
      put('END:VEVENT');
    }
    put('END:VCALENDAR');

    // Длинные строки в календаре складываются: продолжение начинается с
    // пробела. Считаем байты, а не буквы, и рвём только между буквами —
    // иначе на разрыве получилась бы половина русской буквы.
    const fold = (s) => {
      if (utf8len(s) <= 74) return s;
      const out = [];
      let cur = '', size = 0;
      for (const ch of s) {
        const n = utf8len(ch);
        if (size + n > 74) { out.push(cur); cur = ' '; size = 1; }
        cur += ch; size += n;
      }
      out.push(cur);
      return out.join('\r\n');
    };
    return lines.map(fold).join('\r\n') + '\r\n';
  }

  /** Сколько байтов занимает строка в UTF-8. */
  function utf8len(s) {
    let n = 0;
    for (const ch of String(s)) {
      const c = ch.codePointAt(0);
      n += c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
    }
    return n;
  }

  /** Отдать файл наружу: на компьютере — «сохранить как», на телефоне — «поделиться». */
  function deliverFile(text, name, type, done) {
    const say = (t, kind) => { if (typeof done === 'function') done(t, kind); };
    if (typeof self.__capture === 'function') self.__capture(text);
    let blob;
    try { blob = new Blob([text], { type: type }); }
    catch (e) { say('Не удалось собрать файл.', 'bad'); return; }
    const kb = Math.max(1, Math.round(blob.size / 1024));

    if (self.showSaveFilePicker) {
      self.showSaveFilePicker({ suggestedName: name }).then((handle) => {
        if (!handle || !handle.createWritable) { say(''); return; }
        return handle.createWritable()
          .then((w) => w.write(blob).then(() => w.close()))
          .then(() => say('Файл сохранён, ' + kb + ' КБ.'));
      }).catch(() => say(''));
      return;
    }
    let file = null;
    try { file = new File([blob], name, { type: type }); } catch (e) { file = null; }
    if (file && handheld() && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] })
        .then(() => say('Файл готов.'))
        .catch(() => say(''));
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = el('a', { attrs: { href: url, download: name } });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    say('Файл сохранён: ' + name + '.\nЕсли Safari не спросил, куда, — '
      + 'ищите в «Загрузках» и откройте его оттуда.');
  }

  /**
   * Что делать с готовым файлом. Своё для телефона и для компьютера:
   * шаги там разные, а общая подсказка не помогла бы ни там, ни там.
   */
  function remindHowTo() {
    if (handheld()) {
      return 'Что делать с файлом:\n'
        + '1. В появившемся списке выберите «Сохранить в Файлы».\n'
        + '2. Откройте приложение «Файлы» и нажмите на этот файл.\n'
        + '3. iPhone покажет список событий — нажмите «Добавить все» '
        + 'и выберите календарь.\n'
        + 'Календаря в списке приложений не будет, и это нормально: файл '
        + 'событий не отправляют в приложение, а открывают.';
    }
    return 'Что делать с файлом:\n'
      + '1. Сохраните его (Safari обычно кладёт в «Загрузки»).\n'
      + '2. Откройте двойным щелчком — откроется Календарь.\n'
      + '3. Нажмите «Добавить все» и выберите календарь.\n'
      + 'Лучше завести для них отдельный календарь «Аффирмации»: когда '
      + 'поменяете карточки, его можно очистить целиком и добавить заново.';
  }

/* ─── 23-shots-ui.js ───────────────────────────────────────────────────
 * Ряд миниатюр над карточкой и просмотр снимка на весь экран
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Ряд миниатюр над карточкой.
  //
  // Стоит на бумаге, над самой карточкой: снимки — это про карточку, но
  // не часть её текста, и лезть на него они не должны. Ряд едет вбок,
  // поэтому число снимков ничем особо не ограничено: не поместились —
  // прокрутил.
  //
  // Короткое нажатие открывает снимок целиком. Долгое — меню: удалить
  // или отдать другой карточке. Так же, как и везде в приложении: одно
  // движение — одно действие, и перепутать их нельзя.
  // ------------------------------------------------------------------
  const SHOT_HOLD = 600;        // сколько держать, чтобы взять снимок в руку
  const SHOT_MOVE = 200;        // соседние расступаются и снимок встаёт
  const SHOT_SLOP = 8;          // палец поехал — значит, это прокрутка ряда

  /** Показать снимок в узле: достаём из хранилища и отпускаем ссылку. */
  function showShot(node, id, done) {
    AudioStore.get(id).then((blob) => {
      if (!blob || !blob.size) { if (done) done(false); return; }
      let url = '';
      try { url = URL.createObjectURL(blob); } catch (e) { if (done) done(false); return; }
      node.setAttribute('src', url);
      // Ссылку держим до ухода с экрана: пока картинка видна, она нужна
      onCleanup(() => { try { URL.revokeObjectURL(url); } catch (e) { /* уже */ } });
      if (done) done(true);
    }).catch(() => { if (done) done(false); });
  }

  /**
   * Снимок на весь экран — как в галерее.
   *
   * Устроено так же, как перелистывание карточек в колоде, и намеренно:
   * рука уже знает это движение. Три снимка лежат в одной каретке —
   * предыдущий, текущий и следующий, — и двигается только она. Соседние
   * стоят за краями экрана, поэтому при свайпе следующий заходит из-за
   * края вслед за уходящим, а не подменяется рывком.
   */
  function openShot(card, index) {
    const shots = cardShots(card);
    const many = shots.length > 1;
    let at = Math.max(0, Math.min(index, shots.length - 1));
    const wrap = el('div', { class: 'shot-view' });
    const count = el('div', { class: 'shot-count' });

    // Три места в каретке: слева, посередине, справа.
    //
    // Меняются местами сами узлы, а не картинки в них. Это важно: снимок
    // достаётся из хранилища не мгновенно, и если после хода подменять
    // содержимое, то доли секунды в середине висит прежняя картинка —
    // ровно та, от которой только что ушли. Выглядит как вспышка. А так
    // в середину встаёт тот узел, который уже виден с картинкой, и
    // догружать приходится только дальний — он за краем экрана.
    const slide = () => el('img', { class: 'shot-full', attrs: { alt: '' } });
    const a1 = slide(), a2 = slide(), a3 = slide();
    let left = a1, mid = a2, right = a3;
    const track = el('div', { class: 'shot-track' }, many ? [a1, a2, a3] : [a2]);

    const close = () => {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (keyHandler) document.removeEventListener('keydown', keyHandler);
    };

    /**
     * Насколько соседний снимок отстоит от текущего.
     *
     * Ширина окна плюс просвет: соседний целиком за краем, и в покое его
     * не видно. Меряем при обращении, а не при сборке: пока окно не
     * вставлено в страницу, ширины у него нет.
     */
    const gap = () => ((wrap.clientWidth
      || (typeof window !== 'undefined' && window.innerWidth) || 360) + 24);

    const seat = () => {
      // Середину ставим на ноль явно, а не полагаемся на то, что её
      // никто не двигал: после хода узлы меняются ролями, и серединой
      // становится тот, что только что стоял за краем экрана.
      mid.style.setProperty('transform', 'translate3d(0,0,0)');
      if (!many) return;
      const g = gap();
      left.style.setProperty('transform', 'translate3d(' + (-g) + 'px,0,0)');
      right.style.setProperty('transform', 'translate3d(' + g + 'px,0,0)');
    };

    /** Сдвинуть каретку. ms = 0 — сразу, без перехода: точно за пальцем. */
    let easing = '';
    const place = (px, ms) => {
      const move = ms ? 'transform ' + ms + 'ms ' + SLIDE_EASE : 'none';
      if (move !== easing) { easing = move; track.style.setProperty('transition', move); }
      track.style.setProperty('transform', 'translate3d(' + px.toFixed(1) + 'px,0,0)');
    };

    const tell = () => {
      count.textContent = many ? (at + 1) + ' / ' + shots.length : '';
    };
    const paint = () => {
      const s = shots[at];
      if (!s) { close(); return; }
      showShot(mid, s.id);
      if (many) {
        const n = shots.length;
        showShot(left, shots[(at - 1 + n) % n].id);
        showShot(right, shots[(at + 1) % n].id);
      }
      tell();
      seat();
    };

    // Перелистывание — сдвиг всей каретки ровно на один шаг. Содержимое
    // подменяется только ПОСЛЕ конца хода: раньше соседний ещё не на
    // месте, и подмена была бы видна скачком.
    let sliding = false;
    const step = (by, fast) => {
      if (!many || sliding) return;
      sliding = true;
      const ms = fast ? SLIDE_FAST : SLIDE_MS;
      place(-by * gap(), ms);
      let settled = false;
      const land = () => {
        if (settled) return;
        settled = true;
        sliding = false;
        at = (at + by + shots.length) % shots.length;
        // Переставляем сами узлы по кругу: тот, что подъехал, становится
        // серединой — с уже готовой картинкой. Каретка возвращается в
        // ноль, и вместе эти два действия дают ту же самую точку на
        // экране, только теперь в середине нужный снимок.
        const n = shots.length;
        let far = null, farAt = 0;
        if (by > 0) {
          far = left; left = mid; mid = right; right = far;
          farAt = (at + 1) % n;
        } else {
          far = right; right = mid; mid = left; left = far;
          farAt = (at - 1 + n) % n;
        }
        place(0, 0);
        seat();
        tell();
        // Догружаем только дальний — он за краем экрана, и его подмены
        // не видно
        if (shots[farAt]) showShot(far, shots[farAt].id);
      };
      if (track.addEventListener) {
        track.addEventListener('transitionend', land, { once: true });
      }
      // Таймер — страховка на случай, когда перехода нет вовсе:
      // свёрнутая вкладка или отключённая анимация в настройках телефона
      setTimeout(land, ms + 60);
    };

    let keyHandler = null;
    if (document.addEventListener) {
      keyHandler = (ev) => {
        if (ev.key === 'Escape') { close(); return; }
        if (ev.key === 'ArrowRight') step(1);
        if (ev.key === 'ArrowLeft') step(-1);
      };
      document.addEventListener('keydown', keyHandler);
    }

    wrap.appendChild(track);
    wrap.appendChild(count);
    wrap.appendChild(el('button', {
      class: 'shot-close', attrs: { type: 'button', 'aria-label': 'Закрыть' },
      text: '✕', on: { click: close },
    }));

    // ----------------------------------------------------------------
    // Листание: пальцем, трекпадом и мышью.
    //
    // Все три жеста делают одно и то же и считаются одинаково — тем же
    // порогом и той же скоростью, что и у карточек. Список замкнут в
    // круг: с последнего снимка вперёд попадаешь на первый, с первого
    // назад — на последний.
    // ----------------------------------------------------------------
    let id = null, x0 = 0, y0 = 0, side = null, dx = 0;
    let tPrev = 0, xPrev = 0, speed = 0;
    wrap.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary || !many || sliding) return;
      if (ev.target && ev.target !== wrap && ev.target !== mid
          && ev.target !== track) return;              // крестик не трогаем
      id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      side = null; dx = 0; speed = 0;
      tPrev = Date.now(); xPrev = ev.clientX;
    });
    wrap.addEventListener('pointermove', (ev) => {
      if (ev.pointerId !== id) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (side === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        side = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        if (side === 'x' && wrap.setPointerCapture) {
          try { wrap.setPointerCapture(id); } catch (e) { /* не поддержано */ }
        }
      }
      if (side !== 'x') return;
      if (ev.cancelable && ev.preventDefault) ev.preventDefault();
      const now = Date.now();
      if (now > tPrev) {
        speed = Math.abs(ev.clientX - xPrev) / (now - tPrev);
        tPrev = now; xPrev = ev.clientX;
      }
      dx = mx;
      if (!sliding) place(dx, 0);
    });
    const letGo = (ev) => {
      if (ev.pointerId !== id) return;
      id = null;
      if (side !== 'x') return;
      if (swipePassed(Math.abs(dx), speed)) {
        // Каретка не возвращается на место, а продолжает движение с той
        // точки, где её отпустили
        step(dx < 0 ? 1 : -1);
        return;
      }
      place(0, Math.round(SLIDE_MS * 0.7));   // не дотянули — мягко назад
    };
    wrap.addEventListener('pointerup', letGo);
    wrap.addEventListener('pointercancel', letGo);

    // Два пальца по трекпаду. Событий приходит десятки подряд, а после
    // отрыва пальцев macOS ещё долго досылает затухающую инерцию —
    // поэтому сумма копится, а хвост держит общий замок, тот же, что и
    // при листании карточек.
    let acc = 0, accTimer = null;
    wrap.addEventListener('wheel', (ev) => {
      if (!many) return;
      const push = padSide(ev);
      if (!push) return;
      const force = Math.abs(push);
      if (padBlocks(force)) return;
      acc += push;
      if (accTimer) clearTimeout(accTimer);
      accTimer = setTimeout(() => { accTimer = null; acc = 0; }, 180);
      if (Math.abs(acc) < 90) {
        if (!sliding) place(Math.max(-70, Math.min(70, -acc)), 0);
        return;
      }
      const dir = acc > 0 ? 1 : -1;
      acc = 0;
      if (accTimer) { clearTimeout(accTimer); accTimer = null; }
      padLock(force);
      step(dir);
    }, { passive: true });

    // Нажатие мимо снимка закрывает — как в галерее. Но только если это
    // было именно нажатие, а не конец жеста: иначе каждое пролистывание
    // закрывало бы просмотр.
    wrap.addEventListener('click', (ev) => {
      if (ev.target !== wrap && ev.target !== track) return;
      if (Math.abs(dx) > 4) { dx = 0; return; }
      close();
    });

    paint();
    place(0, 0);
    document.body.appendChild(wrap);
    // Со следующего кадра ширина окна известна — сажаем соседей точно
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => { seat(); });
    }
    return wrap;
  }

  /** Меню по удержанию: убрать снимок или отдать другой карточке. */
  function shotMenu(card, shot, redraw) {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const drop = () => {
      close();
      if (!confirm('Удалить эту фотографию с карточки?')) return;
      AudioStore.del(shot.id).catch(() => {});
      card.shots = cardShots(card).filter((s) => s !== shot);
      save();
      if (typeof redraw === 'function') redraw();
    };
    const away = () => {
      close();
      pickCard({
        head: 'Перенести фотографию',
        from: card,
        // У снимков предела на карточку почти нет — «занято» не бывает
        full: () => false,
        label: (c) => {
          const n = cardShots(c).length;
          return n ? 'фото: ' + n : 'без фото';
        },
        onPick: (to) => {
          if (!Array.isArray(to.shots)) to.shots = [];
          card.shots = cardShots(card).filter((s) => s !== shot);
          to.shots.push(shot);          // сам файл не двигается: ключ тот же
          save();
          render();
        },
      });
    };
    wrap.appendChild(el('div', { class: 'sheet' }, [
      el('h3', { text: 'Фотография' }),
      el('div', { class: 'menu-list' }, [
        el('button', { class: 'menu-item', attrs: { type: 'button' },
          on: { click: away } }, [
          el('span', { class: 'menu-sign', text: '→' }),
          el('span', { class: 'menu-body' }, [
            el('span', { class: 'menu-name', text: 'Перенести на другую карточку' }),
          ]),
        ]),
        el('button', { class: 'menu-item', attrs: { type: 'button' },
          on: { click: drop } }, [
          el('span', { class: 'menu-sign', text: '✕' }),
          el('span', { class: 'menu-body' }, [
            el('span', { class: 'menu-name', text: 'Удалить фотографию' }),
          ]),
        ]),
      ]),
      el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
      ]),
    ]));
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
    return wrap;
  }

  /**
   * Ряд миниатюр соседней карточки: тот же вид, но неживой.
   *
   * Нужен, чтобы подъезжающая при свайпе карточка приходила уже со
   * своими снимками. Нажимать в нём нечего: пока карточка не встала на
   * место, её снимки не трогают, а как встанет — экран собирается
   * заново, и ряд будет уже настоящий.
   */
  function paintStillShots(strip, card) {
    clear(strip);
    cardShots(card).forEach((shot) => {
      const img = el('img', { class: 'shot-thumb', attrs: { alt: '' } });
      const cell = el('div', { class: 'shot-cell', attrs: { 'aria-hidden': 'true' } },
        [img]);
      showShot(img, shot.id);
      strip.appendChild(cell);
    });
  }

  /**
   * Собрать ряд миниатюр карточки.
   *
   * Одно нажатие делает три разных дела, и различаются они движением:
   *   короткое нажатие          — открыть снимок целиком;
   *   удержание и отпускание    — меню: убрать или отдать другой карточке;
   *   удержание и движение вбок — поменять порядок в ряду.
   *
   * Порядок именно такой, как на самом телефоне: сначала снимок «берётся
   * в руку» — приподнимается, — и уже потом решается, что с ним делать.
   * Пока снимок не взят, движение пальцем прокручивает ряд, как обычно.
   */
  function paintShots(strip, card) {
    clear(strip);
    const shots = cardShots(card);
    const again = () => { paintShots(strip, card); };
    const cells = [];

    shots.forEach((shot, k) => {
      const img = el('img', { class: 'shot-thumb', attrs: { alt: '' } });
      const cell = el('button', {
        class: 'shot-cell',
        attrs: { type: 'button',
          'aria-label': 'Фотография ' + (k + 1)
            + ': нажмите, чтобы открыть; удержите, чтобы переставить, '
            + 'убрать или перенести' },
      }, [img]);
      showShot(img, shot.id);
      cells.push(cell);

      // Считаем сами, а не ждём click: на телефоне после удержания
      // браузер шлёт и его тоже, и снимок открывался бы поверх меню.
      let timer = null, x0 = 0, y0 = 0;
      let live = false;      // палец на миниатюре
      let took = false;      // снимок «взят в руку»: удержание сработало
      let moved = false;     // и его уже понесли
      let dx = 0, to = k;
      let step = 0, mids = [];

      const stopTimer = () => { if (timer) { clearTimeout(timer); timer = null; } };

      /** Снять все сдвиги и пометки ряда. */
      const bare = () => {
        cells.forEach((c) => {
          c.style.setProperty('transition', 'none');
          c.style.setProperty('transform', 'translate3d(0,0,0)');
          c.className = (c.className || '').replace(/ moving\b/g, '');
          c.className = (c.className || '').replace(/ took\b/g, '');
        });
        strip.style.removeProperty('touch-action');
      };

      /** Взять снимок в руку: приподнять и приготовиться нести. */
      const take = () => {
        took = true; to = k;
        const boxes = cells.map(rectOf);
        step = boxes[k] ? boxes[k].width : 0;
        // Середины меряем один раз, до первого сдвига: дальше миниатюры
        // едут, и мерить их заново значило бы сравнивать с тем, что само
        // движется — снимок скакал бы туда-обратно у самой границы.
        mids = boxes.map((b) => b.left + b.width / 2);
        cell.className += ' took';
        // Пока несём, ряд прокручиваться не должен: иначе одно движение
        // означало бы сразу два разных дела
        strip.style.setProperty('touch-action', 'none');
      };

      /** Куда встанет снимок, если отпустить сейчас. */
      const aim = (by) => {
        const centre = (mids[k] || 0) + by;
        let j = k;
        while (j > 0 && centre < mids[j - 1]) j--;
        while (j < cells.length - 1 && centre > mids[j + 1]) j++;
        return j;
      };

      const draw = (by) => {
        cell.style.setProperty('transition', 'none');
        cell.style.setProperty('transform', 'translate3d(' + by + 'px,0,0)');
        const want = aim(by);
        if (want === to) return;
        to = want;
        // Расступаются только те, через кого снимок прошёл. Остальным
        // ставим нулевой сдвиг: иначе прежний остался бы висеть.
        cells.forEach((c, j) => {
          if (j === k) return;
          let shift = 0;
          if (j > k && j <= to) shift = -step;
          else if (j < k && j >= to) shift = step;
          c.style.setProperty('transition', 'transform ' + SHOT_MOVE + 'ms ' + SLIDE_EASE);
          c.style.setProperty('transform', 'translate3d(' + shift + 'px,0,0)');
        });
      };

      /** Отпустили: довести до места и переписать порядок. */
      const land = () => {
        const done = to;
        cell.className += ' moving';
        cell.style.setProperty('transition', 'transform ' + SHOT_MOVE + 'ms ' + SLIDE_EASE);
        cell.style.setProperty('transform',
          'translate3d(' + ((done - k) * step) + 'px,0,0)');
        setTimeout(() => {
          bare();
          if (done !== k) {
            const list = cardShots(card);
            const it = list.splice(k, 1)[0];
            list.splice(done, 0, it);
            card.shots = list;
            save();
          }
          again();
        }, SHOT_MOVE);
      };

      cell.addEventListener('pointerdown', (ev) => {
        if (!ev.isPrimary) return;
        live = true; took = false; moved = false; dx = 0; to = k;
        x0 = ev.clientX; y0 = ev.clientY;
        stopTimer();
        timer = setTimeout(() => { timer = null; take(); }, SHOT_HOLD);
      });
      cell.addEventListener('pointermove', (ev) => {
        if (!live) return;
        const mx = ev.clientX - x0, my = ev.clientY - y0;
        if (!took) {
          // Ещё не взяли — значит, это прокрутка ряда, а не наше дело
          if (Math.abs(mx) > SHOT_SLOP || Math.abs(my) > SHOT_SLOP) {
            stopTimer(); live = false;
          }
          return;
        }
        if (!moved && Math.abs(mx) < 3) return;
        moved = true;
        if (ev.cancelable && ev.preventDefault) ev.preventDefault();
        dx = mx;
        draw(dx);
      });
      cell.addEventListener('pointerup', () => {
        stopTimer();
        if (!live) return;
        live = false;
        if (took && moved) { land(); return; }
        if (took) { bare(); shotMenu(card, shot, again); return; }
        openShot(card, k);
      });
      cell.addEventListener('pointercancel', () => {
        stopTimer();
        if (live && took) bare();
        live = false;
      });
      // Нажатие само по себе ничего не делает: всё решает пара
      // «нажал — отпустил» выше. Иначе на компьютере снимок открывался
      // бы дважды.
      cell.addEventListener('click', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      strip.appendChild(cell);
    });
  }

/* ─── 24-pickers.js ────────────────────────────────────────────────────
 * Выбор карточки, окно напоминаний, окно обновления
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  /**
   * Выбрать карточку: сначала колода, потом карточка в ней.
   *
   * Общее окно для всего, что переносят с карточки на карточку. Пока
   * таких дел два — голосовая запись и снимок, — и меняются в них только
   * заголовок да подпись справа.
   */
  function pickCard(opts) {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });
    const head = opts.head || 'Перенести';
    const isFull = opts.full || (() => false);
    const label = opts.label || (() => '');

    const askDeck = () => {
      clear(sheet);
      sheet.appendChild(el('h3', { text: head }));
      if (opts.hint) sheet.appendChild(el('p', { class: 'hint', text: opts.hint }));
      const list = el('div', { class: 'card-list scroll' });
      let any = false;
      for (const sec of state.sections) {
        for (const deck of sec.decks) {
          if (!deck.cards.length) continue;
          any = true;
          const swatch = el('span', { class: 'mini-swatch' });
          swatch.style.setProperty('background-color', deck.color);
          swatch.style.setProperty('border-color', deck.color);
          list.appendChild(el('button', {
            class: 'mini pick', attrs: { type: 'button' },
            on: { click: () => askCard(sec, deck) },
          }, [
            swatch,
            el('span', { class: 'mini-text', text: sec.name + ' · ' + deck.name }),
            el('span', { class: 'mini-num', text: cardsLabel(deck.cards.length) }),
          ]));
        }
      }
      if (any) sheet.appendChild(list);
      else {
        sheet.appendChild(el('p', { class: 'empty', text: 'Других карточек пока нет.' }));
      }
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
      ]));
    };

    const askCard = (sec, deck) => {
      clear(sheet);
      sheet.appendChild(el('h3', { text: head }));
      sheet.appendChild(el('p', { class: 'hint', text: sec.name + ' · ' + deck.name }));
      const list = el('div', { class: 'card-list scroll' });
      let any = false;
      deck.cards.forEach((c) => {
        // Переносим на ту сторону, какой карточка лежит. Иначе запись
        // уехала бы на лицо карточки, которую человек оставил
        // перевёрнутой, — и он не нашёл бы её там, куда клал.
        const to = faceOf(c);
        if (to === opts.from) return;
        any = true;
        const full = isFull(to);
        list.appendChild(el('button', {
          class: 'mini pick' + (full ? ' full' : ''),
          attrs: { type: 'button' },
          on: { click: () => { if (full) return; close(); opts.onPick(to); } },
        }, [
          // В списке — текст лица: по нему карточку и узнают. Сторона
          // видна отдельной буквой, если карточка лежит оборотом.
          el('span', { class: 'mini-text', text: shortText(c.text) || 'Без текста' }),
          c.side === 1
            ? el('span', { class: 'mini-side', text: SIDE_LETTERS[1] }) : null,
          el('span', { class: 'mini-num', text: full ? 'занято' : label(to) }),
        ]));
      });
      if (any) sheet.appendChild(list);
      else {
        sheet.appendChild(el('p', { class: 'empty',
          text: 'В этой колоде других карточек нет.' }));
      }
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Назад', on: { click: askDeck } }),
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
      ]));
    };

    askDeck();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
    return wrap;
  }

  /** Окно «Напоминания»: что показывать, когда и как это получить. */
  function openRemind() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });
    if (typeof state.remindEvery !== 'number') state.remindEvery = 3;
    if (typeof state.remindFrom !== 'number') state.remindFrom = 9;
    if (typeof state.remindTo !== 'number') state.remindTo = 21;
    const status = el('div', { class: 'sync-status' });

    const draw = () => {
      clear(sheet);
      const cards = remindCards();
      const hours = remindHours(state.remindEvery, state.remindFrom, state.remindTo);
      sheet.appendChild(el('h3', { text: 'Напоминания' }));

      if (!cards.length) {
        sheet.appendChild(el('p', { class: 'hint', text:
          'Пока ни одна карточка не отмечена звёздочкой. Откройте карточку '
          + 'и нажмите ☆ в верхнем ряду — она попадёт сюда.' }));
        sheet.appendChild(el('div', { class: 'sheet-actions' }, [
          el('button', { class: 'btn sec', attrs: { type: 'button' },
                         text: 'Закрыть', on: { click: close } }),
        ]));
        return;
      }

      sheet.appendChild(el('p', { class: 'hint', text:
        'Отмеченные карточки будут приходить на экран iPhone и MacBook — '
        + 'даже когда приложение закрыто. Идут по очереди, по кругу: '
        + 'каждый раз одна, следующая.\n'
        + 'Выглядит это как обычное уведомление: строка с текстом '
        + 'аффирмации. Своей карточки в уведомление не вложить — его '
        + 'рисует система. Зато внутри события лежит ссылка на саму '
        + 'карточку: нажали — открылась она, с цветом и голосом.' }));

      // Что именно отмечено
      const list = el('div', { class: 'card-list scroll' });
      cards.forEach((c, k) => {
        list.appendChild(el('div', { class: 'mini' }, [
          el('span', { class: 'mini-num', text: String(k + 1) }),
          el('span', { class: 'mini-text', text: shortText(c.text) || 'Без текста' }),
        ]));
      });
      sheet.appendChild(list);

      /** Строка настройки: подпись и две кнопки. */
      const dial = (label, get, set, low, high) => {
        const name = el('span', { class: 'dial-name' });
        const paint = () => { name.textContent = label(get()); };
        paint();
        const bump = (by) => () => {
          const v = Math.max(low, Math.min(high, get() + by));
          set(v);
          if (state.remindTo < state.remindFrom) state.remindTo = state.remindFrom;
          save();
          draw();
        };
        return el('div', { class: 'dial' }, [
          name,
          el('button', { class: 'iconbtn ghost', attrs: { type: 'button',
            'aria-label': 'Меньше' }, text: '−', on: { click: bump(-1) } }),
          el('button', { class: 'iconbtn ghost', attrs: { type: 'button',
            'aria-label': 'Больше' }, text: '+', on: { click: bump(1) } }),
        ]);
      };

      sheet.appendChild(dial((v) => 'Каждые ' + v + ' ч.',
        () => state.remindEvery, (v) => { state.remindEvery = v; }, 1, 12));
      sheet.appendChild(dial((v) => 'С ' + two(v) + ':00',
        () => state.remindFrom, (v) => { state.remindFrom = v; }, 0, 23));
      sheet.appendChild(dial((v) => 'До ' + two(v) + ':00',
        () => state.remindTo, (v) => { state.remindTo = v; }, 0, 23));

      const when = hours.map((h) => two(h) + ':00').join(', ');
      sheet.appendChild(el('p', { class: 'hint', text:
        'Выйдет ' + hours.length + ' в день: ' + when + '.' }));
      const total = cards.length * hours.length;
      if (total > REMIND_MAX) {
        sheet.appendChild(el('p', { class: 'hint', text:
          'Карточек и часов слишком много — в файл войдут первые '
          + REMIND_MAX + ' напоминаний. Уберите часть звёздочек или '
          + 'поставьте больший шаг.' }));
      }
      sheet.appendChild(status);

      // Здесь легко попасть в ловушку, и это уже случилось.
      //
      // На телефоне после «Создать файл» открывается список приложений,
      // и Календаря в нём НЕТ. Он туда и не должен попадать: файл
      // событий не отправляют в приложение, его открывают. Кто этого не
      // знает, выбирает первое похожее приложение из списка — и файл
      // уезжает вложением в чужую задачу, где от него никакого толку.
      // Поэтому шаги написаны прямо здесь, до нажатия, и повторяются
      // после — своими для телефона и для компьютера.
      sheet.appendChild(el('p', { class: 'hint', text: remindHowTo() }));

      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Закрыть', on: { click: close } }),
        el('button', {
          class: 'btn big', attrs: { type: 'button' },
          text: '★  Создать файл',
          on: { click: () => {
            const text = buildReminders(cards, hours, new Date());
            clear(status);
            status.className = 'sync-status wait';
            status.appendChild(el('div', { text: 'Собираю…' }));
            deliverFile(text, REMIND_FILE, 'text/calendar', (t) => {
              clear(status);
              if (!t) { status.className = 'sync-status'; return; }
              status.className = 'sync-status wait';
              status.appendChild(el('div', { text: t }));
              // Шаги повторяем и здесь: в этот момент человек уже держит
              // файл в руках и ищет, куда его деть.
              status.appendChild(el('div', { text: remindHowTo() }));
            });
          } },
        }),
      ]));
    };

    draw();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  /** Окно кнопки «↻»: одно действие и честное предупреждение. */
  function openRefresh() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const status = el('div', { class: 'sync-status' });
    // Две версии рядом: что стоит здесь и что лежит на сайте. Без этого
    // «нажимаю обновить, а версия та же» не отличить от «на сайт ничего
    // не положили»: снаружи оба случая выглядят одинаково.
    const versions = el('p', { class: 'hint', text: 'Смотрю, что на сайте…' });
    askSiteVersion((site) => {
      const mine = myVersion();
      if (!site) {
        versions.textContent = mine
          ? 'У вас версия от ' + mine + '. Что на сайте — узнать не вышло: '
            + 'нет связи или рядом с приложением не лежит файл version.txt.'
          : 'Версию сайта узнать не вышло.';
        return;
      }
      if (mine && site === mine) {
        versions.textContent = 'У вас версия от ' + mine
          + ' — ровно та же, что на сайте. Обновлять нечего.';
        return;
      }
      versions.textContent = 'У вас версия от ' + (mine || '—')
        + ', на сайте — от ' + site + '. Есть что забрать.';
    });
    const sheet = el('div', { class: 'sheet' }, [
      el('h3', { text: 'Обновить приложение' }),
      el('p', { class: 'hint', text:
        'Заберёт из интернета последнюю версию самого приложения — с '
        + 'исправлениями и новыми возможностями.' }),
      el('p', { class: 'hint', text:
        'Карточки и голосовые записи останутся на месте: они хранятся '
        + 'отдельно от приложения и при обновлении не трогаются.' }),
      versions,
      status,
      el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
        el('button', {
          class: 'btn big', attrs: { type: 'button' },
          text: '↻  Обновить',
          on: { click: () => {
            fetchFreshApp((t) => {
              clear(status);
              status.className = 'sync-status wait';
              status.appendChild(el('div', { text: t }));
            });
          } },
        }),
      ]),
      stamp(),
    ]);
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

/* ─── 24b-playlist.js ──────────────────────────────────────────────────
 * Плейлист: список записей, экран со списком, выбор записей карточки
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Плейлист — очередь голосовых записей.
  //
  // В нём лежат ЗАПИСИ, а не карточки: у карточки их может быть до трёх
  // на каждой стороне, и в очередь можно взять любую — хоть все, хоть
  // одну вторую.
  //
  // Хранится он не отдельным списком, а двумя числами на самой дорожке:
  //   inList — взята в очередь,
  //   listAt — какая она в очереди по счёту.
  //
  // Так сделано намеренно, а не из лени. Отдельный список пришлось бы
  // держать в согласии с карточками: удалили карточку — вычисти список,
  // перенесли запись на другое устройство — там у неё другой номер, и
  // список ссылается в пустоту. С отметкой на самой дорожке ничего этого
  // нет: она уезжает вместе с записью в файле обмена, исчезает вместе с
  // удалённой карточкой и не может «отстать» от неё ни при каких
  // обстоятельствах. Ровно тем же способом уже устроен порядок дорожек
  // внутри карточки (trackPos) — и по той же причине.
  // ------------------------------------------------------------------

  // LIST_MAX и sanitizeListAt объявлены не здесь, а рядом с остальными
  // проверками звука, в самом начале файла. Причина та же, по которой
  // там же стоят буквы оформления: сохранённое читается при самом
  // запуске приложения, и до этой части очередь тогда ещё не доходит —
  // приложение обрывалось бы на первом же чтении хранилища.

  /**
   * Вся очередь по порядку.
   *
   * Возвращает не голые дорожки, а всё, что нужно показать строкой:
   * сама дорожка, её карточка, сторона, номер записи на карточке и где
   * эта карточка лежит — чтобы по нажатию открыть её.
   */
  function playlistItems() {
    const out = [];
    state.sections.forEach((sec) => {
      sec.decks.forEach((deck) => {
        deck.cards.forEach((card, index) => {
          cardSides(card).forEach((side, sideNo) => {
            audioSlots(side).forEach((slot, k) => {
              if (!slot.inList) return;
              out.push({
                slot: slot, card: card, side: side, sideNo: sideNo,
                no: k + 1,                     // какая это запись на стороне
                at: sanitizeListAt(slot.listAt),
                was: out.length,               // порядок обхода — на случай равных
                sectionId: sec.id, deckId: deck.id, index: index,
              });
            });
          });
        });
      });
    });
    // При равных числах порядок остаётся прежним: сравнение по «was»
    // добавлено намеренно — иначе две записи с одним числом могли бы
    // меняться местами сами по себе при каждой отрисовке.
    out.sort((A, B) => (A.at - B.at) || (A.was - B.was));
    return out;
  }

  /** Сколько записей в очереди. */
  function playlistSize() { return playlistItems().length; }

  /** Где эта дорожка в очереди. -1 — её там нет. */
  function playlistIndexOf(slot) {
    const all = playlistItems();
    for (let i = 0; i < all.length; i++) if (all[i].slot === slot) return i;
    return -1;
  }

  /** Строка очереди по её месту. null — такого места нет. */
  function playlistAt(i) {
    const all = playlistItems();
    return (i >= 0 && i < all.length) ? all[i] : null;
  }

  /**
   * Выдать числа мест заново, подряд от нуля.
   *
   * После любого изменения: числа всегда плотные и не расходятся,
   * сколько бы раз ни переставляли.
   */
  function playlistRenumber(order) {
    (order || playlistItems()).forEach((it, i) => { it.slot.listAt = i; });
  }

  /** Взять запись в очередь — в самый конец. */
  function playlistAdd(slot) {
    if (slot.inList) return;
    const all = playlistItems();
    if (all.length >= LIST_MAX) {
      alert('В плейлисте уже ' + LIST_MAX + ' записей — больше не помещается.');
      return;
    }
    slot.inList = true;
    slot.listAt = all.length;
    playlistRenumber();
  }

  /** Убрать запись из очереди. */
  function playlistDrop(slot) {
    if (!slot || !slot.inList) return;
    slot.inList = false;
    slot.listAt = 0;
    playlistRenumber();
  }

  /** Переставить: та, что стояла на месте from, встаёт на to. */
  function playlistMove(from, to) {
    const all = playlistItems();
    if (from === to || from < 0 || to < 0
        || from >= all.length || to >= all.length) return false;
    const moved = all.splice(from, 1)[0];
    all.splice(to, 0, moved);
    playlistRenumber(all);
    return true;
  }

  /** Записи этой стороны, взятые в очередь, — по номерам на карточке. */
  function sideListNumbers(side) {
    const out = [];
    audioSlots(side).forEach((slot, k) => { if (slot.inList) out.push(k + 1); });
    return out;
  }

  // ------------------------------------------------------------------
  // Звёздочка на карточке: взять записи в плейлист.
  //
  // Одна запись — нажатие сразу кладёт её в очередь и сразу убирает.
  // Две или три — спрашиваем, какие именно: человек мог надиктовать на
  // одну карточку и утреннюю, и вечернюю версию, и в очередь ему нужна
  // сегодня одна из них.
  // ------------------------------------------------------------------

  /**
   * Окно выбора записей карточки.
   *
   * Галочки стоят там, где запись уже в очереди. Закрыли «Готово» —
   * очередь пришла в согласие с галочками: снятые ушли, поставленные
   * встали в конец.
   */
  function pickTracks(side, done) {
    const slots = audioSlots(side);
    const wrap = el('div', { class: 'modal' });
    const close = () => {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    };
    const want = slots.map((s) => !!s.inList);
    const sheet = el('div', { class: 'sheet' }, [
      el('h3', { text: 'Взять в плейлист' }),
      el('p', { class: 'hint',
        text: 'На этой карточке ' + slots.length + ' записи. Отметьте те, '
          + 'что должны играть в плейлисте.' }),
    ]);
    const list = el('div', { class: 'pick-tracks' });
    slots.forEach((slot, k) => {
      const mark = el('span', { class: 'pick-mark', text: want[k] ? '★' : '☆' });
      const row = el('button', {
        class: 'pick-track' + (want[k] ? ' on' : ''),
        attrs: { type: 'button', 'aria-pressed': String(want[k]) },
      }, [
        mark,
        el('span', { class: 'pick-track-no', text: 'Запись ' + (k + 1) }),
        el('span', { class: 'pick-track-len', text: mmss(slot.audioLen || 0) }),
      ]);
      row.addEventListener('click', () => {
        want[k] = !want[k];
        mark.textContent = want[k] ? '★' : '☆';
        row.classList.toggle('on', want[k]);
        row.setAttribute('aria-pressed', String(want[k]));
      });
      list.appendChild(row);
    });
    sheet.appendChild(list);
    sheet.appendChild(el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Отмена',
                     on: { click: close } }),
      el('button', {
        class: 'btn', attrs: { type: 'button' }, text: 'Готово',
        on: { click: () => {
          slots.forEach((slot, k) => {
            if (want[k]) playlistAdd(slot);
            else playlistDrop(slot);
          });
          close(); save();
          if (typeof done === 'function') done();
          render();
        } },
      }),
    ]));
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  /**
   * Кнопка-звёздочка для верхней полосы читалки.
   *
   * Показывается только там, где есть что брать: на стороне без записей
   * она была бы кнопкой, которая ничего не делает.
   */
  function makeListStar(side) {
    const slots = audioSlots(side);
    if (!slots.length) return null;
    const nums = sideListNumbers(side);
    const on = nums.length > 0;
    // Цифры под звёздочкой нужны только там, где записей несколько:
    // тогда по ним видно, какая именно взята. У единственной записи
    // цифра ничего не сообщает — «запись 1» и так единственная, —
    // поэтому звёздочка просто загорается, как сердечко рядом.
    const many = slots.length > 1;
    const star = el('button', {
      class: 'iconbtn liststar' + (on ? ' on' : '') + (many && on ? ' numbered' : ''),
      attrs: {
        type: 'button',
        'aria-pressed': String(on),
        'aria-label': on ? 'Убрать из плейлиста' : 'В плейлист',
        title: on
          ? (many ? 'Записи в плейлисте: ' + nums.join(', ') : 'Запись в плейлисте')
          : 'В плейлист',
      },
      text: on ? '★' : '☆',
    }, many && on ? [
      // Цифры стоят поверх кнопки, а не в её потоке: сама звёздочка от
      // них не сдвигается и не мельчает — она остаётся ровно там же, где
      // сердечко и карандаш по сторонам.
      el('span', { class: 'liststar-nums', text: nums.join('·') }),
    ] : []);
    star.addEventListener('click', () => {
      if (slots.length === 1) {
        if (slots[0].inList) playlistDrop(slots[0]);
        else playlistAdd(slots[0]);
        save(); render();
        return;
      }
      pickTracks(side);
    });
    return star;
  }

  // ------------------------------------------------------------------
  // Экран плейлиста.
  //
  // Отдельный экран, устроенный как колода: та же шапка с кнопкой
  // «назад», те же строки. Играющая обведена. Строку можно взять
  // удержанием и перенести вверх или вниз — тем же движением, каким
  // переставляются карточки в колоде.
  // ------------------------------------------------------------------

  /** Столько-то записей. */
  function tracksLabel(n) {
    const mod10 = n % 10, mod100 = n % 100;
    let word = 'записей';
    if (mod10 === 1 && mod100 !== 11) word = 'запись';

  /** Перенос строки плейлиста: только вверх и вниз, внутри списка. */
  function dragListRow(row, holder, from) {
    attachHold(row, (id, x0, y0) => {
      const host = holder.parentNode;
      const st = lift(holder, id, x0, y0, 'as-card');
      let at = -1;

      const aim = (cy) => {
        const rows = Array.prototype.slice.call(
          host && host.querySelectorAll ? host.querySelectorAll('.card-row') : [])
          .filter((n) => n !== holder);
        let k = 0;
        for (const n of rows) {
          const r = rectOf(n);
          if (cy > r.top + r.height / 2) k++; else break;
        }
        return { index: k, rows: rows };
      };

      const put = (cx, cy) => {
        const t = aim(cy);
        if (t.index === at) return;
        if (!farEnough(st, cx, cy)) return;
        at = t.index;
        flipMove(shiftable(), () => {
          const parent = st.slot.parentNode;
          if (parent) parent.removeChild(st.slot);
          const after = t.rows[at] || null;
          if (after && host.insertBefore) host.insertBefore(st.slot, after);
          else if (host) host.appendChild(st.slot);
        });
      };

      drag = {
        id: id, lastX: x0, lastY: y0,
        cancel: () => back(holder, st),
        move: (cx, cy) => {
          drag.lastX = cx; drag.lastY = cy;
          follow(holder, st, cx, cy);
          put(cx, cy);
          edgeScroll(cy);
        },
        drop: () => {
          const to = at;
          drop(holder, st, () => {
            if (to < 0 || to === from) return;
            playlistMove(from, to);
            save();
          });
        },
      };
      st.putAt = null;
      put(x0, y0);
    });
  }

  function openSync(startWith) {

    // Раньше следом за системным окном сохранения всплывало ещё и наше,
    // «Обмен между устройствами», — оно висело за спиной у системного и
    // только мешало. Теперь окно показывается лишь тогда, когда есть
    // что сказать: обзор загружаемого файла или итог.
    let shown = false;
    const quiet = startWith === 'save' || startWith === 'load';
    const present = () => {
      if (shown) return;
      shown = true;
      if (!wrap.parentNode) document.body.appendChild(wrap);
    };
    const close = () => {
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      if (fileInput.parentNode) fileInput.parentNode.removeChild(fileInput);
      shown = false;
    };

    const quit = () => { close(); };

    const done = (text, kind) => {

      sheet.appendChild(el('h3', { text: kind === 'bad' ? 'Не получилось' : 'Готово' }));

     * треть от веса звука, но зато на втором устройстве появляются
     * не только тексты, но и голос.
     */
    function buildPayload() {
      const withAudio = [];
      for (const s of state.sections) {
        for (const d of s.decks) {
          // В файл идут все дорожки: у карточки их может быть до трёх на
          // каждой стороне, и каждая — со своими кусками. Оборот
          // переносится наравне с лицом: иначе на втором устройстве
          // карточка приезжала бы наполовину пустой.
          for (const c of d.cards) sidesSlots(c).forEach((sl) => withAudio.push(sl));

      // С появлением снимков он стал ловушкой: на карточках без голоса,
      // но с фотографиями, файл уходил бы пустым. Теперь короткого пути

      if (withAudio.length) report('Собираю записи: 0 из ' + withAudio.length + '…', 'wait');
      const clips = {};
      const shots = {};
      let done = 0;

        if (i >= withAudio.length) return Promise.resolve();
        const card = withAudio[i];

        const keys = audioKeys(card);

          if (k >= keys.length) return Promise.resolve();
          return AudioStore.get(keys[k])
            .then((blob) => (blob ? AudioStore.toText(blob) : null))
            .then((text) => { if (text) clips[keys[k]] = text; })
            .catch(() => { /* кусок потерялся — берём что есть */ })
            .then(() => grab(k + 1));

          .then(() => {

              + withAudio.length + '…', 'wait');
            return next(i + 1);

      // поэтому каждый весит около трёхсот килобайт: сотня фотографий
      // добавит к файлу примерно тридцать мегабайт — много, но это

        report('Собираю фотографии: 0 из ' + all.length + '…', 'wait');

          return AudioStore.get(all[i])
            .then((blob) => (blob ? AudioStore.toText(blob) : null))
            .then((text) => { if (text) shots[all[i]] = text; })
            .catch(() => { /* снимок потерялся — берём что есть */ })

        // резервную копию (только текст) не отличить от файла обмена —
