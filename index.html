    });

    const onMove = (ev) => {
      if (ev.pointerId !== id || drag) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (axis === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        axis = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        if (axis === 'x') {
          rowGesture = true;
          // Другую открытую строку закрываем сразу: открытых больше одной
          // быть не должно, иначе непонятно, к чему относится кнопка
          if (openRow && openRow !== row) closeRow();
          if (row.setPointerCapture) {
            try { row.setPointerCapture(id); } catch (e) { /* не поддержано */ }
          }
          // Слой готовим только этой строке и только сейчас: в колоде
          // строк бывают десятки, и держать слой у каждой значит
          // нагрузить видеоядро всем списком сразу
          row.style.setProperty('will-change', 'transform');
          row.style.setProperty('transition', 'none');
        }
      }
      if (axis !== 'x') return;
      if (ev.cancelable) ev.preventDefault();
      const tNow = Date.now();
      if (tNow > tPrev) {
        speed = Math.abs(ev.clientX - xPrev) / (tNow - tPrev);
        tPrev = tNow; xPrev = ev.clientX;
      }
      // Дальше кнопки строка не уходит ни в одну сторону: за ней
      // открывать больше нечего
      dx = Math.max(-ACTION_W, Math.min(ACTION_W, was + mx));
      row.style.setProperty('transform',
        'translate3d(' + dx.toFixed(1) + 'px,0,0)');
    };

    const finish = (ev) => {
      if (ev.pointerId !== id) return;
      release();
      if (axis !== 'x') return;
      rowGesture = false;
      // После движения вбок мышь на компьютере всё равно шлёт нажатие по
      // строке. Без этой отметки строка открылась бы и тут же закрылась
      // сама, а на телефоне вдобавок открылась бы карточка.
      eatClick = true;
      // Открываем, если протянули больше половины кнопки или махнули
      // быстро; иначе строка возвращается на место.
      //
      // Сторона решает, какая кнопка откроется: ушла влево — «В колоду»
      // справа, ушла вправо — «Удалить» слева. Знак берём у самого
      // смещения, а не у движения пальца: строка могла быть уже
      // открыта, и тогда палец её просто дотягивает.
      const moved = Math.abs(dx - was);
      const far = Math.abs(dx) > ACTION_W / 2;
      const flick = moved >= SWIPE_FLICK && speed >= SWIPE_SPEED;
      // Быстрый взмах открывает строку только из закрытого положения.
      // Если строка уже открыта, решает одно: дотянули её за половину
      // кнопки или нет. Иначе взмах обратно оставлял бы кнопку
      // открытой — рука тянет закрыть, а оно не закрывается.
      let side = 0;
      if (far) side = dx < 0 ? -1 : 1;
      else if (flick && was === 0) side = (dx < 0 ? -1 : dx > 0 ? 1 : 0);
      const wantOpen = side !== 0;
      row.style.setProperty('transition',
        'transform ' + DROP_MS + 'ms ' + SLIDE_EASE);
      if (wantOpen) {
        openRow = row;
        openSide = side;
        row.style.setProperty('transform',
          'translate3d(' + (side * ACTION_W) + 'px,0,0)');
      } else {
        if (openRow === row) { openRow = null; openSide = 0; }
        row.style.setProperty('transform', 'translate3d(0,0,0)');
        // Слой остаётся у одной этой строки — той, которую вели рукой.
        // Список заново собирается при любом переходе, и там его нет.
      }
    };
    const onUp = finish;
    const onCancel = (ev) => {
      if (ev.pointerId !== id) return;
      rowGesture = false;
      finish(ev);
    };

    // Пока строка открыта, нажатие по ней только закрывает её, а карточку
    // не открывает: иначе не выйдет передумать
    row.addEventListener('click', (ev) => {
      if (eatClick) {
        eatClick = false;
        ev.preventDefault();
        ev.stopPropagation();
        return;
      }
      if (openRow !== row) return;
      ev.preventDefault();
      ev.stopPropagation();
      if (ev.stopImmediatePropagation) ev.stopImmediatePropagation();
      justClosed = row;
      closeRow();
    }, true);
  }

  /**
   * Куда перенести карточку. Список всех колод, кроме той, в которой она
   * сейчас лежит, с названием раздела — иначе одинаковые названия колод
   * в разных разделах не различить.
   */
  function moveCardTo(fromDeck, card) {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const short = card.text.length > 60 ? card.text.slice(0, 60) + '…' : card.text;
    const sheet = el('div', { class: 'sheet' }, [
      el('h3', { text: 'Перенести карточку' }),
      el('p', { class: 'hint', text: short }),
    ]);

    const list = el('div', { class: 'card-list scroll' });
    let any = false;
    for (const sec of state.sections) {
      for (const deck of sec.decks) {
        if (deck === fromDeck) continue;
        any = true;
        const swatch = el('span', { class: 'mini-swatch' });
        swatch.style.setProperty('background-color', deck.color);
        swatch.style.setProperty('border-color', deck.color);
        const full = deck.cards.length >= LIMITS.cardsPerDeck;
        list.appendChild(el('button', {
          class: 'mini pick' + (full ? ' full' : ''),
          attrs: { type: 'button' },
          on: { click: () => {
            if (full) return;
            const k = fromDeck.cards.indexOf(card);
            if (k < 0) { close(); return; }
            // Карточку переносим тем же объектом, не копией: за ней
            // тянется голосовая запись, привязанная к её же
            // идентификатору. Новая карточка осталась бы без звука.
            fromDeck.cards.splice(k, 1);
            deck.cards.push(card);
            openRow = null;
            save(); close(); render();
          } },
        }, [
          swatch,
          el('span', { class: 'mini-text',
                       text: sec.name + ' · ' + deck.name }),
          el('span', { class: 'mini-num',
                       text: full ? 'полна' : cardsLabel(deck.cards.length) }),
        ]));
      }
    }

    if (any) sheet.appendChild(list);
    else {
      sheet.appendChild(el('p', { class: 'empty',
        text: 'Других колод пока нет. Создайте ещё одну на главном экране.' }));
    }

    sheet.appendChild(el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' },
                     text: 'Отмена', on: { click: close } }),
    ]));

    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }
  // ------------------------------------------------------------------
  /**
   * Перенос карточки внутри колоды: список, только вверх и вниз.
   *
   * Номера у карточек не хранятся, а считаются при отрисовке от начала
   * списка. Поэтому после переноса нумерация сама становится сплошной:
   * верхняя всегда первая, нижняя — последняя.
   */
  function dragCard(row, holder, deck, card) {
    attachHold(row, (id, x0, y0) => {
      // Берут за строку, а поднимается обёртка: вместе со строкой едет и
      // её кнопка «В колоду», спрятанная справа
      closeRow(true);
      const host = holder.parentNode;           // .card-list
      const st = lift(holder, id, x0, y0, 'as-card');
      let at = -1;

      /** Куда встанет строка, если отпустить прямо сейчас. */
      const aim = (cy) => {
        const rows = Array.prototype.slice.call(
          host && host.querySelectorAll ? host.querySelectorAll('.card-row') : [])
          .filter((n) => n !== holder);
        let k = 0;
        for (const n of rows) {
          const r = rectOf(n);
          if (cy > r.top + r.height / 2) k++; else break;
        }
        return { index: k, rows: rows };
      };

      const put = (cx, cy) => {
        const t = aim(cy);
        if (t.index === at) return;
        if (!farEnough(st, cx, cy)) return;
        at = t.index;
        flipMove(shiftable(), () => {
          const parent = st.slot.parentNode;
          if (parent) parent.removeChild(st.slot);
          const after = t.rows[at] || null;
          if (after && host.insertBefore) host.insertBefore(st.slot, after);
          else if (host) host.appendChild(st.slot);
        });
      };
      const putFirst = (cx, cy) => { st.putAt = null; put(cx, cy); };

      drag = {
        id: id, lastX: x0, lastY: y0,
        cancel: () => back(holder, st),
        move: (cx, cy) => {
          drag.lastX = cx; drag.lastY = cy;
          follow(holder, st, cx, cy);
          put(cx, cy);
          edgeScroll(cy);
        },
        drop: () => {
          const to = at;
          drop(holder, st, () => {
            const from = deck.cards.indexOf(card);
            if (from < 0 || to < 0 || to === from) return;
            deck.cards.splice(from, 1);
            deck.cards.splice(Math.min(to, deck.cards.length), 0, card);
          });
        },
      };
      putFirst(x0, y0);
    });
  }

  // ------------------------------------------------------------------
  /** Перенос колоды: внутрь своего раздела или в любой другой. */
  function dragDeck(tile, fromSection, deck) {
    attachHold(tile, (id, x0, y0) => {
      const st = lift(tile, id, x0, y0, 'as-deck');
      let atSection = null, atIndex = -1;

      /** Раздел под пальцем: разделы идут столбиком, хватает высоты. */
      const sectionUnder = (cy) => {
        const nodes = list('movable');
        let best = null, bestGap = Infinity;
        nodes.forEach((n) => {
          const r = rectOf(n);
          const gap = cy < r.top ? r.top - cy : (cy > r.bottom ? cy - r.bottom : 0);
          if (gap < bestGap) { bestGap = gap; best = n; }
        });
        return best;
      };

      /** Место внутри сетки: сверху вниз, слева направо. */
      const indexIn = (host, cx, cy) => {
        const tiles = Array.prototype.slice.call(
          host && host.querySelectorAll ? host.querySelectorAll('.deck') : [])
          .filter((n) => n !== tile);
        let k = 0;
        for (const n of tiles) {
          const r = rectOf(n);
          if (cy > r.bottom) { k++; continue; }
          if (cy >= r.top && cx > r.left + r.width / 2) { k++; continue; }
          break;
        }
        return { index: k, tiles: tiles };
      };

      const put = (cx, cy) => {
        const host = sectionUnder(cy);
        if (!host) return;
        const grid = host.querySelector ? host.querySelector('.deck-grid') : null;
        const spot = grid ? indexIn(grid, cx, cy) : { index: 0, tiles: [] };
        if (host === atSection && spot.index === atIndex) return;
        // Курсор почти не двигался — оставляем как есть: см. PUT_SLOP
        if (!farEnough(st, cx, cy)) return;
        atSection = host; atIndex = spot.index;
        list('drop-into').forEach((n) => {
          n.className = n.className.replace(/ drop-into\b/, '');
        });
        if (!/drop-into/.test(host.className)) host.className += ' drop-into';
        flipMove(shiftable(), () => {
          const parent = st.slot.parentNode;
          if (parent) parent.removeChild(st.slot);
          const after = spot.tiles[atIndex] || null;
          if (grid && after && grid.insertBefore) grid.insertBefore(st.slot, after);
          else if (grid) grid.appendChild(st.slot);
          else host.appendChild(st.slot);      // раздел свёрнут — ячейка под шапкой
        });
      };
      /** Первая расстановка — сразу, запас на неё не распространяется. */
      const putFirst = (cx, cy) => { st.putAt = null; put(cx, cy); };

      drag = {
        id: id, lastX: x0, lastY: y0,
        move: (cx, cy) => {
          drag.lastX = cx; drag.lastY = cy;
          follow(tile, st, cx, cy);
          put(cx, cy);
          edgeScroll(cy);
        },
        cancel: () => {
          list('drop-into').forEach((n) => {
            n.className = n.className.replace(/ drop-into\b/, '');
          });
          back(tile, st);
        },
        drop: () => {
          const target = atSection, index = atIndex;
          drop(tile, st, () => {
            list('drop-into').forEach((n) => {
              n.className = n.className.replace(/ drop-into\b/, '');
            });
            const dstId = target && target.getAttribute
              ? target.getAttribute('data-section') : null;
            const dst = dstId ? findSection(dstId) : fromSection;
            if (!dst) return;
            const k = fromSection.decks.indexOf(deck);
            if (k < 0) return;
            fromSection.decks.splice(k, 1);
            const slotAt = index < 0 ? dst.decks.length
              : Math.min(index, dst.decks.length);
            dst.decks.splice(slotAt, 0, deck);
          });
        },
      };
      putFirst(x0, y0);
    });
  }

/* ─── 15-screen-reader.js ──────────────────────────────────────────────
 * Экран 3: полноэкранная карточка со свайпом
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Экран 3: полноэкранная карточка со свайпом
  // ------------------------------------------------------------------
  function renderReader() {
    const deck = findDeck(view.sectionId, view.deckId);
    if (!deck || deck.cards.length === 0) return renderDeck();

    const total = deck.cards.length;
    const i = Math.min(Math.max(view.index, 0), total - 1);
    const card = deck.cards[i];
    // Та сторона, что лежит вверх. Всё содержимое карточки — текст,
    // название, ссылка, звук, снимки — берётся только отсюда. У самой
    // карточки остаётся общее для обеих сторон: цвет, сердечко,
    // звёздочка и место в колоде.
    const face = faceOf(card);

    const paint = (node, colour) => {
      node.style.setProperty('background-color', colour);
      node.style.setProperty('border-color', CARD_EDGE[colour] || colour);
    };

    // На сцене три карточки: текущая и по одной соседней слева и справа.
    // Соседние стоят за краями экрана и едут той же кареткой, что и
    // текущая, — поэтому при свайпе следующая заходит из-за края вслед за
    // уходящей, а не появляется потом сама по себе.
    //
    // Прошлая попытка показать соседнюю провалилась: она лежала ПОД
    // текущей и выглядела застрявшей тенью. Здесь соседние не под
    // карточкой, а сбоку от неё, и в покое их не видно вовсе.
    const stage = el('div', { class: 'stage' });
    // Полоса записей внизу карточки — появляется, только если к карточке
    // действительно прикреплена запись.
    //
    // Стоит она не поверх карточки, а под текстом, отдельной частью:
    // текст занимает всё, что осталось выше. Раньше полоса висела
    // накладкой, а место под неё держалось запасом снизу — с одной
    // записью это сходилось, с тремя дорожки поехали по тексту.
    const audioBar = el('div', { class: 'audio-bar' });
    // Строка со ссылкой. Живёт под рядом кнопок и появляется только по
    // нажатию на скрепку — в покое её нет вовсе.
    const linkRow = el('div', { class: 'link-row' });
    // Ряд миниатюр над карточкой. Пустой — его не видно вовсе.
    // Миниатюры едут вместе с карточкой.
    //
    // Раньше ряд стоял на месте: карточка уезжала, а её снимки
    // оставались висеть над новой — и пропадали уже потом, отдельным
    // рывком. Теперь у миниатюр своя каретка, устроенная так же, как
    // карточная, и двигаются они одним и тем же сдвигом. Снимки уходят
    // вместе со своей карточкой, а снимки следующей приезжают вместе с
    // ней.
    const shotStrip = el('div', { class: 'shot-strip' });
    paintShots(shotStrip, face);
    const shotLine = el('div', { class: 'shot-line' });
    const shotSide = (c) => {
      const strip = el('div', { class: 'shot-strip still' });
      paintStillShots(strip, faceOf(c));
      return strip;
    };
    const bigText = el('div', { class: 'bigcard-text' });
    paintText(bigText, face.text, face.marks);
    dressText(bigText, face);
    const bigMid = el('div', { class: 'bigcard-mid' }, [bigText]);
    // Название — на самом верху карточки, отдельной строкой. Текст
    // аффирмации от этого не двигается: он остаётся в середине того, что
    // осталось. Пустого названия нет вовсе — и места оно не занимает.
    const bigHead = headLine(face);
    // Буква стороны в левом верхнем углу. Полупрозрачная и не жирная:
    // она отвечает на один вопрос — «где я сейчас» — и не должна спорить
    // с текстом. Без неё пустой оборот не отличить от пустого лица.
    const sideMark = el('span', {
      class: 'bigcard-side', attrs: { 'aria-hidden': 'true' },
      text: SIDE_LETTERS[card.side === 1 ? 1 : 0],
    });
    const big = el('div', { class: 'bigcard' }, [sideMark].concat(
      bigHead ? [bigHead, bigMid, audioBar] : [bigMid, audioBar]));
    paint(big, card.color);

    /**
     * Соседняя карточка: цвет, текст и дорожка звука, если запись есть.
     * Живого плеера ей не нужно — играть на подъезжающей карточке нельзя,
     * но выглядеть она должна точь-в-точь как настоящая.
     */
    const dress = [];        // чьи дорожки дорисовать следующим кадром
    const neighbour = (c) => {
      // Соседка показывается той стороной, какой её оставили: она
      // приедет ровно такой, какой станет текущей
      const f = faceOf(c);
      const bar = el('div', { class: 'audio-bar' });
      const sideHead = headLine(f);
      const g = el('div', {
        class: 'bigcard side',
        attrs: { 'aria-hidden': 'true' },
      }, [el('span', { class: 'bigcard-side',
                       text: SIDE_LETTERS[c.side === 1 ? 1 : 0] })]
        .concat(sideHead ? [sideHead] : []).concat([
          el('div', { class: 'bigcard-mid' }, [
            dressText(paintText(el('div', { class: 'bigcard-text' }), f.text, f.marks), f),
          ]),
          bar,
        ]));
      paint(g, c.color);
      if (audioSlots(f).length) dress.push({ bar: bar, card: f });
      return g;
    };

    // Дорожка — это почти двести столбиков громкости на каждую карточку.
    // Рисуем их следующим кадром, а не сразу: в тот кадр, когда карточка
    // подменяется после свайпа, каждая лишняя работа видна как рывок.
    // Соседки в это время всё равно за краем экрана.
    const dressSides = () => {
      while (dress.length) {
        const it = dress.pop();
        paintStill(it.bar, it.card);
      }
    };

    // Все три карточки лежат в одной каретке, и двигается только она.
    //
    // Раньше каждая карточка ехала сама: браузер держал под них три
    // отдельных слоя и на каждом кадре сводил их вместе — на телефоне это
    // и давало рывки. Теперь слой один: он рисуется один раз, а дальше
    // только сдвигается, чем и занимается видеоядро.
    // Колода замкнута в круг: за последней карточкой снова идёт первая, а
    // перед первой стоит последняя. Поэтому соседей берём по остатку —
    // упора у краёв больше нет, листать можно в любую сторону без конца.
    // Круга нет только у колоды из одной карточки: ходить некуда.
    const track = el('div', { class: 'track' });
    const loop = total > 1;
    const before = loop ? neighbour(deck.cards[(i - 1 + total) % total]) : null;
    const after = loop ? neighbour(deck.cards[(i + 1) % total]) : null;
    const shotBefore = loop ? shotSide(deck.cards[(i - 1 + total) % total]) : null;
    const shotAfter = loop ? shotSide(deck.cards[(i + 1) % total]) : null;
    if (shotBefore) shotLine.appendChild(shotBefore);
    if (shotAfter) shotLine.appendChild(shotAfter);
    shotLine.appendChild(shotStrip);
    // Место под ряд держим, если снимки есть хоть у одной из трёх: иначе
    // на подъезде соседней экран подпрыгивал бы на высоту ряда.
    const anyShots = [card, deck.cards[(i - 1 + total) % total],
      deck.cards[(i + 1) % total]].some((c) => c && cardShots(faceOf(c)).length);
    const shotDeck = el('div', { class: 'shot-deck' + (anyShots ? ' open' : '') },
      [shotLine]);
    if (before) track.appendChild(before);
    if (after) track.appendChild(after);
    track.appendChild(big);
    stage.appendChild(track);
    paintTracks(audioBar, face);

    /**
     * Насколько соседняя карточка отстоит от текущей.
     *
     * Считаем от середины сцены: полширины сцены, чтобы дойти до края
     * экрана, плюс полширины карточки, чтобы вывести её за край целиком,
     * плюс просвет между карточками. Просвет виден во время хода — это та
     * полоска бумаги, которая идёт между уходящей и приезжающей.
     *
     * Меряем при первом обращении, а не при сборке: пока карточка не
     * вставлена в страницу, ширины у неё нет.
     */
    let gap = 0;
    const measure = () => {
      // При самой первой сборке карточка ещё не в странице и меряться ей
      // нечем. Тогда считаем от ширины окна: так соседки с первого же
      // кадра стоят почти точно и не дёргаются, когда придут настоящие
      // размеры. Прежний запасной вариант был просто «360».
      const guess = (typeof window !== 'undefined' && window.innerWidth)
        ? window.innerWidth - 24 : 360;
      const sw = stage.clientWidth || guess;
      const cw = big.offsetWidth || Math.min(Math.round(sw * 0.8), 520);
      gap = Math.round((sw + cw) / 2) + CARD_GAP;
      return gap;
    };

    // Соседки стоят на своих местах и больше не двигаются: их сдвиг
    // выставляется один раз, дальше едет вся каретка целиком
    const seat = () => {
      measure();
      if (before) {
        before.style.setProperty('transform',
          'translate(-50%, -50%) translate3d(' + (-gap) + 'px, 0, 0)');
      }
      if (after) {
        after.style.setProperty('transform',
          'translate(-50%, -50%) translate3d(' + gap + 'px, 0, 0)');
      }
      // Полосы миниатюр стоят на том же расстоянии, что и карточки:
      // тогда снимки приезжают ровно вместе со своей карточкой, а не
      // раньше и не позже
      if (shotBefore) {
        shotBefore.style.setProperty('transform',
          'translate3d(' + (-gap) + 'px, 0, 0)');
      }
      if (shotAfter) {
        shotAfter.style.setProperty('transform',
          'translate3d(' + gap + 'px, 0, 0)');
      }
    };

    /**
     * Сдвинуть каретку. ms = 0 значит «сразу», без перехода: так карточка
     * идёт точно за пальцем.
     *
     * translate3d, а не translateX: так браузер наверняка отдаёт сдвиг
     * видеоядру и не перерисовывает карточки на каждом кадре.
     */
    let easing = '';
    const place = (px, ms) => {
      // Переход переписываем только когда он правда меняется. За один
      // свайп pointermove приходит сотни раз, и каждая лишняя запись в
      // стиль — это работа для браузера ровно в тот момент, когда он
      // должен рисовать кадр.
      const move = ms ? 'transform ' + ms + 'ms ' + SLIDE_EASE : 'none';
      const shift = 'translate3d(' + px.toFixed(1) + 'px, 0, 0)';
      if (move !== easing) {
        easing = move;
        track.style.setProperty('transition', move);
        shotLine.style.setProperty('transition', move);
      }
      track.style.setProperty('transform', shift);
      // Ряд миниатюр едет тем же сдвигом: он привязан к карточке
      shotLine.style.setProperty('transform', shift);
    };
    seat();
    place(0, 0);
    // Пока карточка не вставлена в страницу, её ширина неизвестна и просвет
    // посчитан на глазок. Со следующего кадра размеры настоящие — ставим
    // соседок точно и дорисовываем им дорожки, до того как человек успеет
    // коснуться экрана.
    requestAnimationFrame(() => { seat(); dressSides(); });

    // ----------------------------------------------------------------
    // Переворот карточки: двойное нажатие показывает обратную сторону.
    //
    // Ход разрезан ровно пополам, и середина приходится на перерисовку.
    // Иначе никак: содержимое карточки собирается заново на каждой
    // отрисовке, и подменить его посреди работающего перехода нечем.
    // Первая половина — здесь, в flip(): карточка поворачивается к нам
    // ребром. Вторая — вверху этой же функции, при следующем заходе: она
    // начинается ребром и доворачивается до плоскости, уже другой
    // стороной. На глаз это один непрерывный поворот.
    // ----------------------------------------------------------------
    const turned = (deg) => 'translate(-50%, -50%) rotateY(' + deg + 'deg)';
    if (flipEnter) {
      const from = flipEnter;
      flipEnter = 0;
      big.style.setProperty('transition', 'none');
      big.style.setProperty('transform', turned(from * 90));
      requestAnimationFrame(() => {
        big.style.setProperty('transition',
          'transform ' + FLIP_MS + 'ms cubic-bezier(.2,.6,.3,1)');
        big.style.setProperty('transform', turned(0));
      });
    }

    let flipping = false;
    const flip = () => {
      // Посреди перелистывания переворачивать нечего: карточка едет, и
      // человек смотрит уже на следующую
      if (flipping || sliding) return;
      flipping = true;
      // Двойное нажатие по тексту заодно выделяет слово: текст карточки
      // выделять разрешено намеренно, его копируют. Выделение снимаем —
      // карточка сейчас перевернётся, и подсвеченное слово осталось бы
      // на ней случайным пятном.
      try {
        const sel = (typeof window !== 'undefined' && window.getSelection)
          ? window.getSelection() : null;
        if (sel && sel.removeAllRanges) sel.removeAllRanges();
      } catch (e) { /* браузер не дал — не беда */ }
      // Лицо уходит влево, оборот приходит справа — и наоборот. Так
      // видно, куда карточку повернули, а не просто «мигнула».
      const dir = card.side === 1 ? -1 : 1;
      big.style.setProperty('transition',
        'transform ' + FLIP_MS + 'ms cubic-bezier(.4,0,.8,.4)');
      big.style.setProperty('transform', turned(-dir * 90));
      setTimeout(() => {
        card.side = card.side === 1 ? 0 : 1;
        // Оборот заводим прямо здесь: дальше на него будут класть текст,
        // голос и снимки, и он должен существовать со своим номером
        if (card.side === 1) backOf(card);
        // Вторую половину поворота доигрывать только если человек всё
        // ещё смотрит на карточку. Успел выйти за эти доли секунды —
        // поворачивать нечего, и оставленная отметка сыграла бы потом,
        // при следующем открытии совсем другой карточки.
        flipEnter = (view.name === 'read') ? dir : 0;
        flipping = false;
        save();
        render();
      }, FLIP_MS);
    };

    /**
     * Считать ли нажатие сюда попыткой перевернуть карточку.
     *
     * Кнопки, полоса записей и всё, что внутри неё, живут своей жизнью:
     * два нажатия по кнопке проигрывания — это два нажатия по кнопке, а
     * не переворот. Проверяем подъёмом по родителям, а не closest: он
     * есть не везде, а нам нужна одна и та же повадка всюду.
     */
    const flippable = (node) => {
      let n = node;
      while (n && n !== big) {
        const tag = n.tagName || '';
        if (tag === 'BUTTON' || tag === 'INPUT' || tag === 'A'
            || tag === 'TEXTAREA' || tag === 'CANVAS') return false;
        if ((' ' + (n.className || '') + ' ').indexOf(' audio-bar ') >= 0) return false;
        n = n.parentNode;
      }
      return n === big;
    };

    // Двойное нажатие считаем сами, а не событием dblclick. Причина:
    // на iPhone у пальца его либо нет вовсе, либо оно приходит с
    // задержкой и вместе с попыткой увеличить страницу. Через
    // pointerup один и тот же счёт работает и пальцем, и мышью на
    // MacBook — и проверяется одним и тем же тестом.
    let tapAt = 0, tapX = 0, tapY = 0;

    // Перелистывание — сдвиг всей каретки ровно на один шаг. Соседняя
    // карточка приезжает точно в середину, поэтому подменять содержимое
    // можно только ПОСЛЕ конца хода: раньше она ещё не на месте, и в
    // прежней версии это давало заметный скачок.
    //
    // Ждём именно конца перехода, а не таймера: таймер и переход считают
    // время по-разному, и подмена то опережала ход, то запаздывала —
    // отсюда и был рывок в самом конце. Таймер остаётся страховкой на
    // случай, когда перехода нет вовсе (свёрнутая вкладка, отключённая
    // анимация в настройках телефона).
    function step(delta, fast) {
      if (!loop) return;
      // Свайп во время хода не пропадает.
      //
      // Раньше он просто игнорировался, и получалось так: листаешь
      // быстро, а карточки идут через одну — между ними пауза в
      // полсекунды, и всё, что попало в неё, потеряно. Теперь такой
      // свайп запоминается и доигрывается сразу после текущего хода.
      if (sliding) {
        const want = queuedStep + delta;
        if (Math.abs(want) <= QUEUE_MAX) queuedStep = want;
        return;
      }
      // По кругу: с последней уходим на первую, с первой — на последнюю
      const next = (i + delta + total) % total;
      sliding = true;
      dressSides();            // кнопками и клавишами тоже листают
      place(-delta * measure(), fast ? SLIDE_FAST : SLIDE_MS);

      let settled = false;
      const settle = () => {
        if (settled) return;
        settled = true;
        // Пока палец на экране, страницу не перерисовываем.
        //
        // Перерисовка подменяет всё содержимое читалки, и жест, начатый
        // до неё, остался бы висеть на выброшенных узлах: его окончание
        // до нас уже не дошло бы, и свайп пропал. Дождёмся, когда палец
        // оторвётся, — экран за это время всё равно стоит на месте.
        if (dragId !== null) { pendingGo = next; return; }
        sliding = false;
        go({ name: 'read', sectionId: view.sectionId, deckId: view.deckId, index: next });
      };
      if (track.addEventListener) {
        track.addEventListener('transitionend', settle, { once: true });
      }
      setTimeout(settle, (fast ? SLIDE_FAST : SLIDE_MS) + 60);
    }

    // Свайп, сделанный во время прошлого хода, доигрываем сразу — и
    // короче обычного: человек листает быстро, ждать ему нечего.
    if (queuedStep) {
      const owed = queuedStep > 0 ? 1 : -1;
      queuedStep -= owed;
      requestAnimationFrame(() => { step(owed, true); });
    }

    // Перетаскивание карточки. Через Pointer Events, а не touch: так один
    // и тот же код работает и пальцем на iPhone, и мышью на компьютере.
    // Карточка едет за пальцем — без этого непонятно, поймался ли жест.
    let dragId = null, x0 = 0, y0 = 0, dx = 0, locked = null;
    // Куда перейти, как только палец оторвётся: ход закончился, но
    // перерисовывать под пальцем нельзя
    let pendingGo = null;
    // Порог и скорость — общие для всего приложения (SWIPE_NEED и рядом).
    // Раньше здесь было своё число 60, и одно движение пальцем в читалке
    // и в колоде срабатывало по-разному.
    let tPrev = 0, xPrev = 0, speed = 0, raw = 0;

    big.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary) return;
      dragId = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      dx = 0; raw = 0; locked = null; speed = 0;
      tPrev = Date.now(); xPrev = ev.clientX;
      // Палец лёг посреди хода — жест ведём, но каретку не трогаем.
      //
      // Сбросить её сейчас в ноль значило бы дёрнуть карточку назад на
      // середине пути. И бросать жест тоже нельзя: раньше он просто
      // пропадал, и быстрая серия свайпов шла через один.
      if (sliding) return;
      // Если кадр с дорисовкой почему-то не успел пройти, дорисовываем
      // сейчас: соседка обязана выехать уже со своей дорожкой
      dressSides();
      // Переход снимаем сразу, ещё до первого движения: если сделать это
      // на первом же pointermove, палец успевает уйти, а карточка секунду
      // догоняет его по прежней кривой — отсюда ощущение рывка в начале
      place(0, 0);
    });

    big.addEventListener('pointermove', (ev) => {
      if (ev.pointerId !== dragId) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      // Пока не решили, жест горизонтальный или вертикальный, ничего не
      // двигаем: иначе перелистывание сработает при обычной прокрутке
      if (locked === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        locked = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        if (locked === 'x' && big.setPointerCapture) {
          try { big.setPointerCapture(dragId); } catch (e) { /* не поддержано */ }
        }
      }
      if (locked !== 'x') return;
      ev.preventDefault();
      const tNow = Date.now();
      if (tNow > tPrev) {
        speed = Math.abs(ev.clientX - xPrev) / (tNow - tPrev);
        tPrev = tNow; xPrev = ev.clientX;
      }
      // Колода замкнута в круг, упираться больше некуда — карточка идёт
      // за пальцем один к одному в обе стороны. Туго она идёт только в
      // колоде из одной карточки: там и правда ходить некуда.
      // raw — сколько прошёл палец, dx — насколько уехала каретка.
      raw = mx;
      dx = loop ? mx : mx * 0.25;
      // Пока идёт ход, каретка занята: движение только запоминаем
      if (!sliding) place(dx, 0);
    });

    const endDrag = (ev) => {
      if (ev.pointerId !== dragId) return;
      dragId = null;

      // Ход закончился, пока палец был на экране. Досчитываем этот свайп
      // в очередь и только теперь перерисовываем.
      if (pendingGo !== null) {
        const to = pendingGo;
        pendingGo = null;
        if (locked === 'x' && loop && swipePassed(Math.abs(raw), speed)) {
          const d = raw < 0 ? 1 : -1;
          if (Math.abs(queuedStep + d) <= QUEUE_MAX) queuedStep += d;
        }
        sliding = false;
        go({ name: 'read', sectionId: view.sectionId, deckId: view.deckId, index: to });
        return;
      }
      // Палец (или указатель) поднялся там же, где опустился, и никуда
      // не поехал — это нажатие, а не жест. Второе такое подряд и рядом
      // переворачивает карточку.
      if (locked === null && flippable(ev.target)) {
        const now = Date.now();
        if (now - tapAt < TAP_GAP && Math.abs(ev.clientX - tapX) < TAP_NEAR
            && Math.abs(ev.clientY - tapY) < TAP_NEAR) {
          tapAt = 0;
          flip();
          return;
        }
        tapAt = now; tapX = ev.clientX; tapY = ev.clientY;
      }
      // loop проверяем здесь, а не только внутри step: в колоде из одной
      // карточки шага нет, и каретку надо вернуть на место, а не оставить
      // висеть там, где отпустили
      if (locked === 'x' && loop && swipePassed(Math.abs(raw), speed)) {
        // Свайп ВЛЕВО — следующая, ВПРАВО — предыдущая. По кругу, поэтому
        // из читалки этот жест уже никуда не выводит: с первой карточки
        // вправо попадаем на последнюю, а не в список колоды. Выйти —
        // крестиком в углу или клавишей Esc.
        // Карточка не возвращается на место, а продолжает движение
        // с того места, где её отпустили
        step(raw < 0 ? 1 : -1);
        return;
      }
      // Не дотянули до порога — вся каретка мягко возвращается на место,
      // и подъехавшая соседка уходит обратно за край
      place(0, Math.round(SLIDE_MS * 0.7));
    };
    big.addEventListener('pointerup', endDrag);
    big.addEventListener('pointercancel', endDrag);

    // Свайп двумя пальцами по трекпаду MacBook. Это НЕ перетаскивание:
    // система шлёт события колеса с горизонтальной составляющей, а
    // pointermove при этом не приходит вовсе — именно поэтому жест
    // раньше не работал на ноутбуке.
    //
    // Две сложности, которые приходится учитывать:
    //  * событий приходит десятки подряд, поэтому копим сумму сдвига;
    //  * после отрыва пальцев macOS ещё долго досылает затухающую
    //    «инерцию». Её держит общий замок (padLock рядом с PAD_BACK),
    //    и держит по тишине, а не по часам: прежняя пауза жила здесь,
    //    внутри читалки, и обнулялась вместе с перерисовкой на новую
    //    карточку — ровно посреди инерции. Отсюда и был перескок через
    //    карточку с одного свайпа.
    let wheelAcc = 0, wheelTimer = null;
    const WHEEL_TRIGGER = 90;

    stage.addEventListener('wheel', (ev) => {
      if (!loop) return;                       // одна карточка — листать нечего
      // Вертикаль и пологая диагональ — это прокрутка длинного текста
      // внутри карточки. Не гасим и не считаем: иначе колесо мыши в
      // карточке перестаёт работать вовсе.
      const side = padSide(ev);
      if (!side) return;
      const force = Math.abs(side);
      if (padBlocks(force)) return;                            // хвост прошлого жеста

      wheelAcc += side;
      if (wheelTimer) clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => {                          // пауза — начинаем заново
        wheelTimer = null; wheelAcc = 0;
      }, 180);

      if (Math.abs(wheelAcc) < WHEEL_TRIGGER) {
        // Пока порог не набран, показываем сдвиг всей каретки: видно, что
        // жест ловится и какая карточка подъезжает
        if (!sliding) place(Math.max(-70, Math.min(70, -wheelAcc)), 0);
        return;
      }

      // Пальцы влево по трекпаду дают deltaX > 0 — это «вперёд»
      const dir = wheelAcc > 0 ? 1 : -1;
      wheelAcc = 0;
      if (wheelTimer) { clearTimeout(wheelTimer); wheelTimer = null; }
      padLock(force);
      step(dir);
      // Пассивный и здесь. Читалка занимает весь экран, и обработчик,
      // способный отменять события, отнял бы у Safari быстрый путь
      // прокрутки — а внутри карточки прокручивается длинный текст.
    }, { passive: true });

    stage.addEventListener('pointerleave', () => {
      if (dragId === null && !sliding) place(0, Math.round(SLIDE_MS * 0.4));
    });

    const reader = el('div', { class: 'reader' }, [
      el('div', { class: 'reader-bar' }, [
        el('button', {
          class: 'iconbtn', attrs: { 'aria-label': 'Закрыть', type: 'button' },
          text: '✕',
          on: { click: () => go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId }) },
        }),
        // Пустое место между крестиком и кнопками. Номер карточки стоит
        // не здесь, а строкой ниже, ровно над серединой карточки.
        el('span', { class: 'reader-gap' }),
        // Ссылка, запись голоса и загрузка файлов работают со стороной,
        // а не с карточкой: что записано на обороте, остаётся на обороте
        makeLinkButton(face, linkRow),
        makeRecordControls(face, audioBar),
        makeAudioPicker(face, audioBar),
        el('button', {
          class: 'iconbtn heart' + (card.fav ? ' on' : ''),
          attrs: {
            type: 'button',
            'aria-pressed': String(!!card.fav),
            'aria-label': card.fav ? 'Убрать из избранного' : 'В избранное',
          },
          text: card.fav ? '♥' : '♡',
          on: { click: () => { card.fav = !card.fav; save(); render(); } },
        }),
        // Звёздочка — вторая отметка, рядом с сердечком и с той же
        // повадкой: нажал — загорелась, нажал ещё — погасла. Смысл
        // другой: сердечко собирает любимое в отдельный список наверху
        // главного экрана, звёздочка берёт голос этой стороны в плейлист.
        // Цвет тоже другой, тёплый: два одинаково красных значка рядом
        // читались бы как одно и то же, нажатое дважды.
        //
        // На стороне без записей её нет вовсе: брать в плейлист нечего, а
        // кнопка, которая ничего не делает, только сбивает с толку.
        makeListStar(face),
        el('button', {
          class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить', type: 'button' },
          text: '✎', on: { click: () => editCard(deck, card, face) },
        }),
      ]),
      linkRow,
      shotDeck,
      // Какая карточка из скольких. Отдельной строкой и по центру —
      // прямо над серединой карточки, а не в ряду кнопок: там он стоял
      // между крестиком и кнопками и читался как ещё одна кнопка.
      el('div', { class: 'reader-pos', text: (i + 1) + ' / ' + total }),
      stage,
      el('div', { class: 'reader-actions' }, [
        el('button', {
          class: 'btn sec', attrs: { type: 'button', 'aria-label': 'Предыдущая' },
          text: '‹ Назад', on: { click: () => step(-1) },
        }),
        el('button', {
          class: 'btn sec', attrs: { type: 'button', 'aria-label': 'Следующая' },
          text: 'Вперёд ›', on: { click: () => step(1) },
        }),
      ]),
    ]);

    // Клавиатура — чтобы удобно проверять на компьютере
    const onKey = (ev) => {
      if (ev.key === 'ArrowLeft') step(-1);
      else if (ev.key === 'ArrowRight') step(1);
      else if (ev.key === 'Escape') {
        go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId });
      }
    };
    // Снимается в render() перед следующей отрисовкой. Событий вида
    // DOMNodeRemoved намеренно избегаем: они устарели и в части браузеров
    // не срабатывают, обработчик остался бы висеть навсегда.
    document.addEventListener('keydown', onKey);
    readerKeyHandler = onKey;

    return reader;
  }

  let readerKeyHandler = null;

  // Параметры перелистывания. Кривая — та же, что в системных переходах
  // iOS: быстрый старт и долгое мягкое торможение в конце.
  // Длительность хода карточки.
  //
  // Было 524 мс — плавно, но медленно: пролистать четыре карточки
  // подряд занимало больше двух секунд, и между свайпами чувствовалась
  // остановка. Кривая осталась той же формы (резкий старт, мягкая
  // посадка), а время сокращено до трети секунды: на глаз ход такой же
  // ровный, но рука за ним успевает.
  const SLIDE_MS = 340;
  const SLIDE_EASE = 'cubic-bezier(.32,.72,0,1)';
  // Ход внутри быстрой серии. Когда человек листает подряд, каждый
  // следующий шаг короче: пальцу не приходится ждать, а движение всё
  // равно видно.
  const SLIDE_FAST = 210;
  // Сколько свайпов подряд помним, пока идёт ход. Больше трёх за раз
  // человек не делает, а без предела быстрая серия унесла бы через всю
  // колоду.
  const QUEUE_MAX = 3;
  // Куда листать сразу после перерисовки: свайп, сделанный во время
  // хода, не теряется, а доигрывается следом. Живёт снаружи читалки —
  // между двумя её перерисовками.
  let queuedStep = 0;
  // Отдельного «въезда» новой карточки больше нет: соседняя приезжает в
  // середину сама, вместе с кареткой, и подмена происходит уже на месте
  let pageEnter = 0;      // с какой стороны въезжает экран при жесте «назад»
  let sliding = false;    // идёт анимация — новые жесты игнорируем

  // Переворот карточки.
  //
  // Половина хода — здесь, вторая половина — уже на новой стороне, после
  // перерисовки. Поэтому «с какой стороны доворачивать» живёт снаружи
  // читалки, между двумя её отрисовками, — как и очередь свайпов.
  let flipEnter = 0;
  // Половина поворота. Весь ход выходит вдвое длиннее — около трети
  // секунды: столько же, сколько идёт перелистывание, и на глаз это
  // одно и то же движение по скорости.
  const FLIP_MS = 170;
  // Двойное нажатие: сколько ждём второго и насколько далеко от первого
  // его ещё считаем тем же самым. Пределы взяты как у системного
  // двойного нажатия: рука попадает, а два разных нажатия подряд не
  // склеиваются.
  const TAP_GAP = 320;
  const TAP_NEAR = 40;

  // Порог жеста — один на всё приложение. Раньше «назад» требовал 90 px,
  // а перелистывание карточки 60: одно и то же движение пальцем на разных
  // экранах срабатывало по-разному, и жест приходилось «дотягивать».
  const SWIPE_NEED = 48;      // столько хватает при спокойном движении
  const SWIPE_FLICK = 22;     // короткий взмах — если он быстрый
  const SWIPE_SPEED = 0.35;   // px/мс, порог «быстрого»
  const SWIPE_START = 6;      // с какого сдвига решаем, куда пошёл палец

  // Просвет между карточками в читалке. Видно его во время хода: полоска
  // бумаги между уходящей и приезжающей. Он же держит соседок за краем
  // экрана в покое — вместе с их тенью.
  const CARD_GAP = 56;

  /**
   * Дотянул ли человек до срабатывания. Одна проверка для всех жестов:
   * и для «назад» в колоде, и для перелистывания карточки.
   *
   * Два пути. Либо протянуть спокойно 48 px, либо махнуть коротко и
   * быстро — второй путь и делает жест коротким на ощупь: пальцем от
   * середины экрана достаточно дёрнуть на пару сантиметров.
   *
   * speed — px/мс на последнем отрезке движения, всегда по модулю.
   */
  function swipePassed(dist, speed) {
    if (dist >= SWIPE_NEED) return true;
    return dist >= SWIPE_FLICK && speed >= SWIPE_SPEED;
  }

/* ─── 16-record.js ─────────────────────────────────────────────────────
 * Запись голоса: кнопки, уровень, выбор файла, старт и стоп
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Запись и проигрывание голоса
  // ------------------------------------------------------------------
  let activeRecorder = null;     // чтобы не начать вторую запись поверх первой

  function mmss(sec) {
    const s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /**
   * 00:02,25 — минуты, секунды и сотые, как в «Диктофоне».
   *
   * Сотые именно отбрасываются, а не округляются: пока секунда не
   * наступила, показывать её нельзя. Но сначала подчищаем до тысячных —
   * дробные числа хранятся неточно, и, скажем, 125,07 внутри лежит как
   * 125,06999…, отчего на экране появлялось бы «,06».
   */
  function mmsscc(sec) {
    const cc100 = Math.floor(Math.round(Math.max(0, sec) * 1000) / 10);
    const cc = cc100 % 100;
    const whole = (cc100 - cc) / 100;
    const m = Math.floor(whole / 60);
    const s = whole % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
      + ',' + String(cc).padStart(2, '0');
  }

  /** Блок записи: одна кнопка до старта, три во время. */
  function makeRecordControls(card, audioBar) {
    const box = el('div', { class: 'rec-box' });

    const startBtn = el('button', {
      class: 'iconbtn rec', attrs: { type: 'button', 'aria-label': 'Записать голос' },
      text: '●',
    });
    const pauseBtn = el('button', {
      class: 'iconbtn rec-ctl', attrs: { type: 'button', 'aria-label': 'Пауза' },
      text: '❚❚',
    });
    const stopBtn = el('button', {
      class: 'iconbtn rec-ctl', attrs: { type: 'button', 'aria-label': 'Завершить запись' },
      text: '■',
    });
    const timer = el('span', { class: 'rec-time' });

    // До старта видна только круглая кнопка. Пауза и стоп появляются
    // рядом с ней уже во время записи.
    const idle = () => {
      clear(box);
      box.appendChild(startBtn);
      startBtn.classList.remove('on');
      startBtn.textContent = '●';
      startBtn.setAttribute('aria-label', 'Записать голос');
      timer.textContent = '';
    };
    const live = () => {
      clear(box);
      box.appendChild(startBtn);
      if (canPause()) box.appendChild(pauseBtn);
      box.appendChild(stopBtn);
      box.appendChild(timer);
      markPaused(false);
    };

    function canPause() {
      return typeof self.MediaRecorder !== 'undefined'
        && typeof self.MediaRecorder.prototype.pause === 'function';
    }

    startBtn.addEventListener('click', () => {
      if (activeRecorder) return;                 // уже пишем
      const sup = recordingSupport();
      if (!sup.ok) { alert(RECORD_HELP[sup.why]); return; }
      // Прежние записи остаются на месте — новая ложится следующей
      // дорожкой. Мест три; когда заняты все, говорим об этом прямо.
      const slot = freeSlot(card);
      if (!slot) {
        alert('На карточке уже ' + TRACKS_MAX + ' записи — больше не поместится. '
          + 'Удалите одну крестиком на её дорожке.');
        return;
      }
      startRecording(slot, audioBar, {
        tick: (text) => { timer.textContent = text; },
        live: live, idle: idle, pauseBtn: pauseBtn,
      }, false, () => { paintTracks(audioBar, card); });
    });

    // Значок паузы не меняется никогда — меняется только его плотность.
    // Идёт запись — знак приглушён; поставили на паузу — наливается
    // цветом. Подмена значка на кружок сбивала с толку: он становился
    // похож на кнопку старта, хотя делает совсем другое.
    const markPaused = (paused) => {
      pauseBtn.classList.toggle('paused', paused);
      pauseBtn.classList.toggle('recording', !paused);
      pauseBtn.setAttribute('aria-label', paused ? 'Продолжить запись' : 'Пауза');
      startBtn.classList.toggle('on', !paused);   // пульсация только при записи
    };

    pauseBtn.addEventListener('click', () => {
      const r = activeRecorder;
      if (!r) return;
      if (r.state === 'recording') { r.pause(); markPaused(true); }
      else if (r.state === 'paused') { r.resume(); markPaused(false); }
    });

    stopBtn.addEventListener('click', stopRecording);

    idle();
    return box;
  }

  /**
   * Замер громкости прямо с микрофона во время записи.
   *
   * Возвращает две вещи: sample() — снять текущий уровень, finish() —
   * свернуть накопленное в форму волны и отпустить звуковой узел.
   *
   * Почему именно так. Разбор готового файла (decodeAudioData) на
   * компьютере проходит, а на iPhone нет: Safari не умеет читать webm,
   * и разбор вне нажатия кнопки там часто просто не запускается. Здесь
   * же уровень берётся до сжатия, поэтому формат файла и браузер роли
   * не играют — дорожка появляется одинаково везде.
   */
  function live_meter(stream) {
    const Ctx = self.AudioContext || self.webkitAudioContext;
    const empty = { sample() {}, finish() { return []; }, top() { return 100; } };
    if (!Ctx) return empty;
    let ctx, node, buf;
    try {
      ctx = new Ctx();
      if (typeof ctx.resume === 'function') ctx.resume();   // iOS держит его спящим
      node = ctx.createAnalyser();
      node.fftSize = 1024;
      // Байтовый срез поддерживают все браузеры, включая старые Safari.
      // Значения идут вокруг 128 — это и есть тишина.
      buf = new Uint8Array(node.fftSize);
      ctx.createMediaStreamSource(stream).connect(node);
    } catch (e) { return empty; }

    const levels = [];
    // Самое громкое место за всю запись. Замеры ниже нормируются на
    // него, поэтому сама эта величина нужна отдельно: по ней куски
    // одной записи приводятся к общей шкале громкости.
    let loudest = 0;
    return {
      top() { return loudest || 100; },
      sample() {
        try {
          node.getByteTimeDomainData(buf);
          let peak = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = Math.abs(buf[i] - 128);
            if (v > peak) peak = v;
          }
          levels.push(peak);
        } catch (e) { /* узел уже закрыт */ }
      },
      finish() {
        try { ctx.close(); } catch (e) { /* уже закрыт */ }
        if (!levels.length) return [];
        // Растягиваем замеры на PEAK_COUNT столбиков и нормируем по
        // самому громкому месту: иначе тихая запись выглядит пустой
        const top = Math.max.apply(null, levels);
        loudest = top;
        if (top < 2) return [];            // была тишина — рисовать нечего
        const out = [];
        for (let i = 0; i < PEAK_COUNT; i++) {
          const from = Math.floor(i * levels.length / PEAK_COUNT);
          const to = Math.max(from + 1,
            Math.floor((i + 1) * levels.length / PEAK_COUNT));
          let peak = 0;
          for (let j = from; j < to && j < levels.length; j++) {
            if (levels[j] > peak) peak = levels[j];
          }
          out.push(Math.round(peak * 100 / top));
        }
        return out;
      },
    };
  }

  // Предел на готовый файл. Записи хранятся на самом устройстве и целиком
  // уезжают в файл обмена — гигабайтный подкаст туда просто не пролезет.
  const PICK_MAX_MB = 25;

  /**
   * Узнать, играется ли файл здесь, и сколько он длится.
   *
   * Проверяем ДО того, как класть в хранилище. Иначе карточка получила
   * бы запись, которую браузер не умеет открыть, — на вид звук есть,
   * а нажимаешь «играть» и тишина.
   *
   * Заодно берём длину у самого файла: это единственное надёжное место,
   * своих часов записи у чужого файла нет.
   */
  function probeAudio(blob) {
    return new Promise((done) => {
      let url = null;
      try { url = URL.createObjectURL(blob); } catch (e) { done(null); return; }
      const a = new Audio();
      let settled = false;
      const finish = (secs) => {
        if (settled) return;
        settled = true;
        try { a.pause(); } catch (e) { /* уже */ }
        try { URL.revokeObjectURL(url); } catch (e) { /* уже */ }
        done(secs);
      };
      a.preload = 'metadata';
      a.onloadedmetadata = () => {
        const d = a.duration;
        finish((typeof d === 'number' && isFinite(d) && d > 0) ? d : 0);
      };
      a.onerror = () => finish(null);
      // Если браузер молчит, ждать вечно нельзя: у некоторых форматов он
      // не отвечает ни успехом, ни ошибкой
      setTimeout(() => finish(settled ? undefined : null), 8000);
      a.src = url;
      try { a.load(); } catch (e) { /* сам разберётся */ }
    });
  }

  /**
   * Кнопка «загрузить готовую запись».
   *
   * Рядом с кнопкой записи, но делает противоположное: не пишет новое, а
   * берёт то, что уже записано — в «Диктофоне», в iCloud Drive, на
   * компьютере. Формат Apple (m4a, он же MPEG-4 Audio) читается без
   * всякого преобразования: ровно в нём Safari и сам записывает голос.
   */
  function makeAudioPicker(card, audioBar) {
    const btn = el('button', {
      class: 'iconbtn ghost pick',
      attrs: { type: 'button', 'aria-label': 'Загрузить готовую запись' },
      text: '↓',
    });
    // Тип НЕ указан, и это проверено дважды на живом телефоне.
    //
    // Заманчиво написать accept="audio/*": тогда iPhone открывает папки
    // сразу, без лишнего шага «медиатека / снять фото / выбрать файл».
    // Но он же начинает гасить всё, чей вид система не сопоставила со
    // списком. Записи, положенные в iCloud с компьютера, как раз из
    // таких: видно их прекрасно, а нажать нельзя — папки чёрные, файлы
    // бледные. Один лишний шаг лучше, чем невозможность выбрать файл.
    //
    // Что за файл выбрали на самом деле, всё равно проверяем сами —
    // попыткой его открыть.
    const input = el('input', {
      // multiple — чтобы из медиатеки можно было отметить сразу
      // несколько снимков и не ходить за каждым отдельно
      attrs: { type: 'file', multiple: 'multiple' },
      style: { display: 'none' },
    });

    const busy = (on) => {
      btn.disabled = on;
      btn.textContent = on ? '…' : '↓';
    };

    btn.addEventListener('click', () => {
      if (activeRecorder) { alert('Сейчас идёт запись — сначала остановите её.'); return; }
      // Места проверяем здесь только для звука: снимков помещается
      // много, и упереться в предел на этой кнопке почти невозможно.
      // Отказывать заранее нельзя — человек мог идти за фотографией.
      input.click();
    });

    const NOT_OURS = 'Этот файл здесь не открывается. Подойдёт фотография '
      + '(jpeg, png, heic) или запись «Диктофона» (m4a), а также mp3, wav и aac.';

    /**
     * Разобрать один выбранный файл.
     *
     * Снимок это или запись — решаем сами, по самому файлу. Кнопка одна
     * на оба случая: человек нажимает «загрузить» и берёт из медиатеки
     * что нужно, а разбираться, что именно принесли, — наша забота.
     *
     * Тип, который сообщает система, бывает пустым — особенно у файлов
     * из облака. Поэтому он только подсказка: когда он молчит, файл
     * сначала пробуют открыть как картинку, а потом как звук. Не вышло
     * ни так, ни так — значит, это и правда что-то чужое.
     *
     * Отвечает одним словом: что получилось. Ругаться будет вызывающий,
     * и один раз за всё — файлов может быть выбрано много.
     */
    function takeOne(file) {
      return new Promise((done) => {
        if (file.size > PICK_MAX_MB * 1024 * 1024) { done('big'); return; }
        if (!file.size) { done('empty'); return; }

        const looksImage = String(file.type || '').indexOf('image/') === 0;
        const looksAudio = String(file.type || '').indexOf('audio/') === 0;
        const named = /\.(m4a|mp3|wav|aac|caf|aiff?)$/i.test(file.name || '');

        /** Взять как фотографию. next — что делать, если не вышло. */
        const asShot = (next) => {
          if (cardShots(card).length >= SHOTS_MAX) { done('full'); return; }
          shrinkShot(file).then((small) => {
            if (!small) { next(); return; }
            const key = shotKey();
            AudioStore.put(key, small.blob)
              .then(() => AudioStore.get(key))
              .then((back) => {
                // Отмечаем снимок на карточке только после того, как он
                // прочитался обратно: иначе в ряду был бы пустой квадрат
                if (!back || !back.size) { done('store'); return; }
                if (!Array.isArray(card.shots)) card.shots = [];
                card.shots.push({ id: key, w: small.w, h: small.h });
                save();
                done('shot');
              })
              .catch(() => done('store'));
          }).catch(next);
        };

        /** Взять как запись. */
        const asAudio = () => {
          probeAudio(file).then((secs) => {
            if (secs === null) { done('bad'); return null; }
            // Ничего прежнего не убираем: файл ложится своей дорожкой, а
            // соседние записи и их продолжения остаются как были.
            const slot = freeSlot(card);
            if (!slot) { done('tracks'); return null; }
            // Место могло быть занято раньше и освобождено крестиком —
            // чужих кусков в нём остаться не должно
            audioKeys(slot).slice(1).forEach((k) => {
              AudioStore.del(k).catch(() => {});
            });
            return AudioStore.put(slot.id, file)
              .then(() => AudioStore.get(slot.id))
              .then((back) => {
                if (!back || !back.size) { done('store'); return null; }
                const len = Math.max(1, Math.round((secs || 0) * 100) / 100);
                slot.audio = true;
                slot.audioLen = len;
                slot.parts = [{ len: len, top: 100, head: 0 }];
                slot.peaks = [];
                save();
                done('audio');
                // Рисунок волны считаем из самого файла — уже после
                // того, как ответили: он к делу не относится, и ждать
                // его незачем.
                return computePeaks(file).then((peaks) => {
                  if (!peaks || !peaks.length) return null;
                  slot.peaks = peaks; save(); render();
                  return null;
                }).catch(() => null);
              });
          }).catch(() => done('bad'));
        };

        if (looksImage) { asShot(() => done('bad-image')); return; }
        if (!looksAudio && !named) { asShot(asAudio); return; }
        asAudio();
      });
    }

    input.addEventListener('change', () => {
      // Из медиатеки можно взять сразу несколько снимков — берём все,
      // по очереди. Список копируем: поле сбрасываем тут же, иначе один
      // и тот же файл во второй раз уже не выберется.
      const files = Array.prototype.slice.call(input.files || []);
      input.value = '';
      if (!files.length) return;
      if (!AudioStore.available()) {
        alert('Хранилище недоступно — записи негде хранить.'); return;
      }

      busy(true);
      const got = { shot: 0, audio: 0 };
      const lost = [];
      const step = (i) => {
        if (i >= files.length) { finish(); return; }
        takeOne(files[i]).then((how) => {
          if (how === 'shot' || how === 'audio') got[how]++;
          else lost.push(how);
          step(i + 1);
        });
      };

      /** Один итог на всё: файлов бывает выбрано много. */
      const finish = () => {
        busy(false);
        if (got.shot || got.audio) render();
        if (!lost.length) return;
        const one = files.length === 1;
        const why = lost[0];
        if (one) {
          alert(why === 'big'
              ? 'Файл больше ' + PICK_MAX_MB + ' МБ. Такой не поместится: он '
                + 'хранится на самом устройстве и целиком уезжает в файл обмена.'
            : why === 'empty' ? 'Файл пустой.'
            : why === 'full' ? 'На карточке уже ' + SHOTS_MAX
                + ' фотографий — больше не поместится.'
            : why === 'tracks' ? 'На карточке уже ' + TRACKS_MAX + ' записи — '
                + 'больше не поместится. Удалите одну крестиком на её дорожке.'
            : why === 'store' ? 'Не удалось сохранить. Попробуйте ещё раз.'
            : why === 'bad-image' ? 'Эту фотографию не удалось прочитать. '
                + 'Попробуйте другую.'
            : NOT_OURS);
          return;
        }
        const lines = [];
        if (got.shot) lines.push('Добавлено фотографий: ' + got.shot + '.');
        if (got.audio) lines.push('Добавлено записей: ' + got.audio + '.');
        lines.push('Не удалось взять: ' + lost.length + '.');
        if (lost.indexOf('big') >= 0) {
          lines.push('Часть файлов больше ' + PICK_MAX_MB + ' МБ.');
        }
        if (lost.indexOf('full') >= 0) {
          lines.push('На карточке уже ' + SHOTS_MAX + ' фотографий.');
        }
        if (lost.indexOf('bad') >= 0 || lost.indexOf('bad-image') >= 0) {
          lines.push('Часть файлов здесь не открывается.');
        }
        alert(lines.join('\n'));
      };

      step(0);
    });

    return el('span', { class: 'pick-box' }, [btn, input]);
  }

  /**
   * Записать голос на карточку.
   *
   * append — дописать продолжение к тому, что уже есть. Новый кусок
   * ложится в хранилище отдельным ключом и приписывается к списку
   * кусков карточки; длина и рисунок звука складываются с прежними.
   */
  function startRecording(card, audioBar, ui, append, repaint) {
    // Чем перерисовать дорожку, когда запись легла в хранилище. У второй
    // и третьей записи это своя строка, а не вся полоса, — поэтому кто
    // именно рисует, решает вызывающий.
    const redraw = () => {
      if (typeof repaint === 'function') { repaint(); return; }
      clear(audioBar); buildPlayer(audioBar, card);
    };
    // Сколько ещё можно записать. У дозаписи потолок общий с тем, что
    // уже лежит на карточке, иначе пятиминутный предел обходился бы
    // простым нажатием «дописать».
    // Потолок у каждой дорожки свой: они и живут отдельно друг от друга.
    const already = append ? (card.audioLen || 0) : 0;
    const room = Math.max(0, AUDIO_CAP - already);
    if (append && room < 1) {
      alert('На этой дорожке уже пять минут звука — больше не поместится. '
        + 'Запишите отдельную дорожку.');
      ui.idle();
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      // Safari отдаёт mp4, Chrome — webm. Не навязываем формат: пусть
      // браузер выберет свой, иначе на одном из них запись не стартует.
      let rec;
      try { rec = new self.MediaRecorder(stream); }
      catch (e) {
        stream.getTracks().forEach((t) => t.stop());
        alert('Не удалось начать запись.'); ui.idle(); return;
      }

      const chunks = [];

      // Форму волны снимаем прямо с микрофона, пока идёт запись.
      //
      // Раньше её считали из готового файла. На компьютере это работало,
      // а на iPhone — нет: Safari не умеет разбирать webm, да и разбор
      // вне нажатия кнопки там часто не запускается. Здесь же мы читаем
      // звук ДО сжатия, поэтому способ не зависит ни от формата файла,
      // ни от браузера.
      const live = live_meter(stream);

      // Время считаем сами и с учётом пауз: длительность самого файла
      // браузеры отдают ненадёжно, а на паузе счётчик обязан замереть
      let elapsed = 0, since = Date.now();
      const tick = setInterval(() => {
        const now = rec.state === 'recording' ? elapsed + (Date.now() - since) / 1000 : elapsed;
        ui.tick(mmss(now), now);
        if (rec.state === 'recording') live.sample();   // тишину на паузе не пишем
        if (now >= room) stopRecording();     // потолок 5 минут на карточку
      }, 200);

      rec.onpause = () => { elapsed += (Date.now() - since) / 1000; };
      rec.onresume = () => { since = Date.now(); };
      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = () => {
        clearInterval(tick);
        if (rec.state !== 'paused') elapsed += (Date.now() - since) / 1000;
        // Микрофон отпускаем сразу: иначе индикатор записи в системе
        // продолжает гореть, и это выглядит так, будто нас подслушивают
        stream.getTracks().forEach((t) => t.stop());
        activeRecorder = null;
        ui.idle();
        if (ui.pauseBtn) ui.pauseBtn.classList.remove('paused', 'recording');

        const snapped = live.finish();
        const loud = live.top();

        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        if (!blob.size) {
          // Пусто — но плеер уже написал «Сохраняю…». Возвращаем его в
          // нормальный вид, иначе подпись зависла бы навсегда
          if (append) { redraw(); }
          return;
        }

        // ---- дозапись: новый кусок в конец, всё остальное складываем
        if (append) {
          const was = audioParts(card);
          const slot = was.length;
          if (slot >= AUDIO_PARTS_MAX) {
            alert('К одной записи можно дописать не больше '
              + (AUDIO_PARTS_MAX - 1) + ' продолжений.');
            return;
          }
          const grew = Math.max(0.5, Math.round(elapsed * 100) / 100);
          const key = partKey(card.id, slot);
          AudioStore.put(key, blob)
            .then(() => AudioStore.get(key))
            .then((back) => {
              if (!back || !back.size) {
                alert('Продолжение не сохранилось. Попробуйте ещё раз.');
                redraw();
                return;
              }
              const hadLen = card.audioLen || 0;
              let hadTop = 100;
              was.forEach((p) => { if (p.top > hadTop) hadTop = p.top; });
              card.parts = was.concat([{ len: grew, top: loud }]);
              card.peaks = joinPeaks(card.peaks, hadLen, hadTop, snapped, grew, loud);
              card.audioLen = Math.round((hadLen + grew) * 100) / 100;
              card.audio = true;
              save();
              redraw();
            })
            .catch(() => {
              alert('Не удалось сохранить продолжение.');
              redraw();
            });
          return;
        }

        AudioStore.put(card.id, blob)
          .then(() => AudioStore.get(card.id))
          .then((back) => {
          if (!back || !back.size) {
            alert('Запись не сохранилась. Попробуйте ещё раз.'); return;
          }
          // Запись начата заново — прежние куски продолжения не при чём
          const stale = audioKeys(card).slice(1);
          stale.forEach((k) => { AudioStore.del(k).catch(() => {}); });
          card.audio = true;
          card.audioLen = Math.max(1, Math.round(elapsed));
          // Форма волны уже снята с микрофона — рисуем сразу
          card.peaks = snapped;
          // Один кусок во всю длину. Сумма длин кусков обязана
          // совпадать с общей длиной — по ней считается перемотка
          card.parts = [{ len: card.audioLen, top: loud }];
          save();
          redraw();
          // Если с микрофона снять не удалось (старый браузер), пробуем
          // разобрать сам файл — на компьютере это работает
          if (snapped.length) return;
          computePeaks(blob).then((peaks) => {
            if (!peaks || !peaks.length) return;
            card.peaks = peaks; save();
            redraw();
          }).catch(() => {});
        }).catch(() => alert('Не удалось сохранить запись.'));
      };

      activeRecorder = rec;
      ui.live();
      rec.start();
    }).catch((err) => {
      // Кнопка обязана вернуться в исходное состояние: иначе после
      // отказа в микрофоне она осталась бы висеть значком «стоп»,
      // и нажать на неё второй раз было бы уже нечем
      ui.idle();
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      alert(denied
        ? 'Доступ к микрофону запрещён. Разрешите его для этой страницы в настройках браузера.'
        : 'Микрофон недоступен.');
    });
  }

  function stopRecording() {
    if (activeRecorder && activeRecorder.state !== 'inactive') activeRecorder.stop();
  }

/* ─── 17-wave.js ───────────────────────────────────────────────────────
 * Форма волны: столбики, лицо плеера, склейка кусков без стыка
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // Столбик занимает 2 px и ещё пиксель на просвет. По этому шагу и
  // считается, сколько их поместится.
  const BAR_STEP = 3;
  const BAR_MIN = 24;      // меньше — уже не рисунок звука, а частокол

  /**
   * Сколько столбиков поместится в дорожке такой ширины.
   *
   * Здесь была ошибка, из-за которой на телефоне дорожка выглядела
   * пустой. Столбиков всегда рисовалось 190 — столько, сколько замеров
   * хранится у карточки. На компьютере дорожка широкая, и они помещались.
   * На телефоне она около 190 px: каждому столбику доставалось меньше
   * пикселя, и они попросту не рисовались. Выглядело как пустой сосуд.
   */
  function barsThatFit(width) {
    const w = Math.max(0, Number(width) || 0);
    if (!w) return PEAK_COUNT;
    return Math.max(BAR_MIN, Math.min(PEAK_COUNT, Math.floor((w - 12) / BAR_STEP)));
  }

  /**
   * Столбики громкости в сосуде. Возвращает их списком: по нему потом
   * подсвечивается уже прозвучавшая часть.
   *
   * count — сколько столбиков нарисовать. Замеров у карточки всегда
   * PEAK_COUNT, поэтому при меньшем числе столбиков каждый берёт среднее
   * по своему куску: так рисунок звука сохраняется целиком, а не
   * прореживается через одного.
   */
  function drawBars(barBox, peaks, count) {
    clear(barBox);
    const n = Math.max(1, Math.floor(count || PEAK_COUNT));
    const bars = [];
    const src = (peaks && peaks.length) ? peaks : null;
    for (let i = 0; i < n; i++) {
      let v = 8;
      if (src) {
        const from = Math.floor(i * src.length / n);
        const to = Math.max(from + 1, Math.floor((i + 1) * src.length / n));
        let sum = 0;
        for (let k = from; k < to && k < src.length; k++) sum += src[k];
        v = Math.round(sum / (to - from));
      }
      const b = el('i');
      // Пока формы волны нет — ровная тонкая линия, а не пустота:
      // так видно, что дорожка есть и по ней можно перематывать
      b.style.setProperty('height', Math.max(8, v) + '%');
      barBox.appendChild(b);
      bars.push(b);
    }
    return bars;
  }

  /**
   * Внешний вид дорожки, без поведения: кнопка, сосуд со столбиками,
   * подпись времени.
   *
   * Отдельно от плеера, потому что тот же самый вид нужен соседним
   * карточкам в читалке. Там дорожка только показывается — но выглядеть
   * должна в точности так же, иначе в момент подмены она бы дёрнулась.
   */
  function playerFace(card) {
    const play = el('button', {
      class: 'audio-btn', attrs: { type: 'button', 'aria-label': 'Прослушать запись' },
      text: '▶',
    });
    // Дорожка сделана как сосуд: пустая полоса, которая по мере
    // проигрывания наполняется слева направо. Столбики громкости лежат
    // поверх заливки, чтобы было видно, где голос, а где тишина.
    const wave = el('div', { class: 'wave', attrs: { 'aria-hidden': 'true' } });
    const fill = el('span', { class: 'wave-fill' });
    const barBox = el('div', { class: 'wave-bars' });
    const head = el('span', { class: 'wave-head' });
    wave.appendChild(fill);
    wave.appendChild(barBox);
    wave.appendChild(head);

    const total = card.audioLen || 0;
    const label = el('span', {
      class: 'audio-label',
      text: total ? '00:00,00 / ' + mmsscc(total) : 'Запись',
    });

    const face = { play, wave, fill, barBox, head, label, total,
                   bars: drawBars(barBox, card.peaks) };

    /**
     * Пересчитать число столбиков под настоящую ширину дорожки.
     *
     * Пока дорожка не вставлена в страницу, ширины у неё нет, поэтому
     * первый раз рисуем «сколько есть», а со следующего кадра — сколько
     * действительно помещается.
     */
    face.refit = () => {
      const want = barsThatFit(wave.clientWidth || 0);
      if (want === face.bars.length) return false;
      face.bars = drawBars(barBox, card.peaks, want);
      return true;
    };
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => { face.refit(); });
    }

    return face;
  }

  /**
   * Дорожка на соседней карточке в читалке: тот же вид, но неживой.
   *
   * Нужна, чтобы подъезжающая при свайпе карточка приходила уже со своей
   * дорожкой. Раньше соседка была без неё, и плеер появлялся отдельным
   * рывком уже после того, как карточка встала на место.
   *
   * Кнопки на месте, но выключены: карточка помечена aria-hidden, и в
   * обход по Tab они попадать не должны. Кнопку удаления рисуем тоже —
   * без неё сосуд оказался бы шире, и при подмене он бы сжался.
   */
  function stillPlayer(bar, card) {
    const face = playerFace(card);
    face.play.setAttribute('tabindex', '-1');
    const more = el('button', {
      class: 'audio-more',
      attrs: { type: 'button', 'aria-label': 'Дописать к записи', tabindex: '-1' },
      text: '●',
    });
    const del = el('button', {
      class: 'audio-del',
      attrs: { type: 'button', 'aria-label': 'Удалить запись', tabindex: '-1' },
      text: '✕',
    });
    bar.appendChild(el('div', { class: 'audio-row' }, [face.play, face.wave,
      el('div', { class: 'audio-side' }, [more, del])]));
    bar.appendChild(face.label);
  }

  // Сколько звука готовы разобрать целиком ради бесшовной сшивки.
  // Разобранный звук лежит в памяти несжатым: минута — примерно
  // одиннадцать мегабайт. Три минуты телефон переживёт, больше — уже
  // нет, и такая запись пойдёт прежним путём, через два проигрывателя.
  const SMOOTH_CAP = 180;
  const EDGE_TRIM = 0.25;    // сколько тишины на краю куска готовы срезать
  const JOIN_FADE = 0.008;   // сглаживание на самом стыке, секунды

  /**
   * Где в куске начинается и заканчивается голос.
   *
   * Между кусками слышался провал, и дело не только в загрузке. Сжатие
   * добавляет к записи немного тишины в начале — так устроен любой
   * кодек. А кнопку «стоп» человек нажимает не в тот же миг, когда
   * замолчал, поэтому в конце тоже остаётся пауза. Складываясь, они и
   * дают то самое «разделение» на стыке. Ищем настоящие границы голоса
   * и играем только их.
   *
   * Срезаем осторожно: не больше четверти секунды с каждого края и
   * только то, что тише двух процентов от самого громкого места.
   */
  function voiceEdges(buf) {
    const data = buf.getChannelData(0);
    const rate = buf.sampleRate || 48000;
    const n = data.length;
    if (!n) return { from: 0, len: 0 };
    let peak = 0;
    for (let i = 0; i < n; i += 7) {
      const v = data[i] < 0 ? -data[i] : data[i];
      if (v > peak) peak = v;
    }
    if (peak < 0.002) return { from: 0, len: n / rate };   // весь кусок тихий
    const gate = Math.max(0.003, peak * 0.02);
    const room = Math.floor(rate * EDGE_TRIM);
    let a = 0;
    while (a < room && a < n && (data[a] < 0 ? -data[a] : data[a]) < gate) a++;
    let b = n;
    const floor = n - room;
    while (b > floor && b > a + 1) {
      const v = data[b - 1] < 0 ? -data[b - 1] : data[b - 1];
      if (v >= gate) break;
      b--;
    }
    return { from: a / rate, len: Math.max(0.02, (b - a) / rate) };
  }

  /**
   * Бесшовное проигрывание склеенной записи.
   *
   * Прежний способ — два проигрывателя по очереди — убрал загрузку в
   * момент стыка, но не убрал сам стык. Между двумя файлами всё равно
   * оставался зазор в несколько миллисекунд, а ползунок на переходе
   * прыгал: длина куска бралась с часов, тикавших во время записи, и не
   * совпадала с тем, сколько звука на самом деле в файле.
   *
   * Здесь всё иначе. Куски разбираются в звук целиком и выкладываются
   * на общую шкалу времени звукового движка вплотную друг к другу — с
   * точностью до отсчёта, тридцати-с-чем-то тысячных долей секунды.
   * Стыка не остаётся вовсе: для движка это одна непрерывная запись.
   * Время тоже берётся у него, поэтому ползунок едет ровно, а не
   * вздрагивает на границах.
   *
   * Возвращает null, если движок недоступен, — тогда работает прежний
   * способ. Замолчать приложение не имеет права ни при каких условиях.
   */
  function smoothChain(card, list) {
    const Ctx = self.AudioContext || self.webkitAudioContext;
    if (!Ctx || !list || list.length < 2) return null;
    let whole = 0;
    list.forEach((p) => { whole += p.len; });
    if (whole > SMOOTH_CAP) return null;          // слишком длинно для памяти

    // Движок заводим не сразу, а по первому нажатию.
    //
    // Браузер разрешает держать их всего несколько штук на страницу, а
    // карточек с записями может быть много: пролистав десяток, мы бы
    // упёрлись в предел, и звук пропал бы вовсе. К тому же движок,
    // созданный без участия человека, Chrome сразу усыпляет и пишет об
    // этом в консоль.
    let ctx = null;
    function engine() {
      if (ctx) return ctx;
      try { ctx = new Ctx(); } catch (e) { ctx = null; }
      // Движок сам сообщает, когда его усыпили. Это самый честный
      // признак ухода в фон: неважно, нажали кнопку блокировки,
      // перешли в другое приложение или позвонили — если он уснул,
      // звук надо срочно передавать обычному проигрывателю.
      if (ctx && ctx.addEventListener) {
        try {
          ctx.addEventListener('statechange', () => {
            if (ctx && ctx.state !== 'running' && running && hooks.asleep) {
              hooks.asleep();
            }
          });
        } catch (e) { /* не поддерживается — обойдёмся событиями страницы */ }
      }
      return ctx;
    }

    const pieces = [];        // {buf, from, len} — уже без тишины по краям
    const offs = [];          // с какой секунды начинается каждый кусок
    let total = 0;
    let ready = false;
    let pos = 0;              // где мы сейчас, если ничего не звучит
    let anchor = 0;           // время движка, отвечающее pos
    let running = false;
    let sources = [];
    let turn = 0;             // номер захода: старые источники не мешают новым
    const hooks = { end: null, fail: null, asleep: null };

    function decodeOne(i) {
      return AudioStore.get(partKey(card.id, i))
        .then((blob) => (blob && blob.size ? blob.arrayBuffer() : null))
        .then((raw) => {
          if (!raw) return null;
          return new Promise((ok, no) => {
            // Обещание понимают не все: у старых Safari только два
            // обработчика, и без запасного пути там ничего не разберётся
            let out = null;
            try { out = ctx.decodeAudioData(raw, ok, no); }
            catch (e) { no(e); return; }
            if (out && typeof out.then === 'function') out.then(ok, no);
          });
        });
    }

    /** Разобрать все куски и разложить их по общей шкале. */
    function prepare() {
      const step = (i) => {
        if (i >= list.length) return true;
        return decodeOne(i).then((buf) => {
          if (!buf) throw new Error('кусок не разобрался');
          const cut = voiceEdges(buf);
          pieces.push({ buf: buf, from: cut.from, len: cut.len });
          return step(i + 1);
        });
      };
      return Promise.resolve().then(() => step(0)).then(() => {
