   * Возвращает две вещи: sample() — снять текущий уровень, finish() —
   * свернуть накопленное в форму волны и отпустить звуковой узел.
   *
   * Почему именно так. Разбор готового файла (decodeAudioData) на
   * компьютере проходит, а на iPhone нет: Safari не умеет читать webm,
   * и разбор вне нажатия кнопки там часто просто не запускается. Здесь
   * же уровень берётся до сжатия, поэтому формат файла и браузер роли
   * не играют — дорожка появляется одинаково везде.
   */
  function live_meter(stream) {
    const Ctx = self.AudioContext || self.webkitAudioContext;
    const empty = { sample() {}, finish() { return []; } };
    if (!Ctx) return empty;
    let ctx, node, buf;
    try {
      ctx = new Ctx();
      if (typeof ctx.resume === 'function') ctx.resume();   // iOS держит его спящим
      node = ctx.createAnalyser();
      node.fftSize = 1024;
      // Байтовый срез поддерживают все браузеры, включая старые Safari.
      // Значения идут вокруг 128 — это и есть тишина.
      buf = new Uint8Array(node.fftSize);
      ctx.createMediaStreamSource(stream).connect(node);
    } catch (e) { return empty; }

    const levels = [];
    return {
      sample() {
        try {
          node.getByteTimeDomainData(buf);
          let peak = 0;
          for (let i = 0; i < buf.length; i++) {
            const v = Math.abs(buf[i] - 128);
            if (v > peak) peak = v;
          }
          levels.push(peak);
        } catch (e) { /* узел уже закрыт */ }
      },
      finish() {
        try { ctx.close(); } catch (e) { /* уже закрыт */ }
        if (!levels.length) return [];
        // Растягиваем замеры на PEAK_COUNT столбиков и нормируем по
        // самому громкому месту: иначе тихая запись выглядит пустой
        const top = Math.max.apply(null, levels);
        if (top < 2) return [];            // была тишина — рисовать нечего
        const out = [];
        for (let i = 0; i < PEAK_COUNT; i++) {
          const from = Math.floor(i * levels.length / PEAK_COUNT);
          const to = Math.max(from + 1,
            Math.floor((i + 1) * levels.length / PEAK_COUNT));
          let peak = 0;
          for (let j = from; j < to && j < levels.length; j++) {
            if (levels[j] > peak) peak = levels[j];
          }
          out.push(Math.round(peak * 100 / top));
        }
        return out;
      },
    };
  }

  function startRecording(card, audioBar, ui) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      // Safari отдаёт mp4, Chrome — webm. Не навязываем формат: пусть
      // браузер выберет свой, иначе на одном из них запись не стартует.
      let rec;
      try { rec = new self.MediaRecorder(stream); }
      catch (e) {
        stream.getTracks().forEach((t) => t.stop());
        alert('Не удалось начать запись.'); return;
      }

      const chunks = [];

      // Форму волны снимаем прямо с микрофона, пока идёт запись.
      //
      // Раньше её считали из готового файла. На компьютере это работало,
      // а на iPhone — нет: Safari не умеет разбирать webm, да и разбор
      // вне нажатия кнопки там часто не запускается. Здесь же мы читаем
      // звук ДО сжатия, поэтому способ не зависит ни от формата файла,
      // ни от браузера.
      const live = live_meter(stream);

      // Время считаем сами и с учётом пауз: длительность самого файла
      // браузеры отдают ненадёжно, а на паузе счётчик обязан замереть
      let elapsed = 0, since = Date.now();
      const tick = setInterval(() => {
        const now = rec.state === 'recording' ? elapsed + (Date.now() - since) / 1000 : elapsed;
        ui.timer.textContent = mmss(now);
        if (rec.state === 'recording') live.sample();   // тишину на паузе не пишем
        if (now >= 300) stopRecording();          // потолок 5 минут на карточку
      }, 200);

      rec.onpause = () => { elapsed += (Date.now() - since) / 1000; };
      rec.onresume = () => { since = Date.now(); };
      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
      rec.onstop = () => {
        clearInterval(tick);
        if (rec.state !== 'paused') elapsed += (Date.now() - since) / 1000;
        // Микрофон отпускаем сразу: иначе индикатор записи в системе
        // продолжает гореть, и это выглядит так, будто нас подслушивают
        stream.getTracks().forEach((t) => t.stop());
        activeRecorder = null;
        ui.idle();
        ui.pauseBtn.classList.remove('paused', 'recording');

        const snapped = live.finish();

        const blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        if (!blob.size) return;
        AudioStore.put(card.id, blob)
          .then(() => AudioStore.get(card.id))
          .then((back) => {
          if (!back || !back.size) {
            alert('Запись не сохранилась. Попробуйте ещё раз.'); return;
          }
          card.audio = true;
          card.audioLen = Math.max(1, Math.round(elapsed));
          // Форма волны уже снята с микрофона — рисуем сразу
          card.peaks = snapped;
          save();
          clear(audioBar); buildPlayer(audioBar, card);
          // Если с микрофона снять не удалось (старый браузер), пробуем
          // разобрать сам файл — на компьютере это работает
          if (snapped.length) return;
          computePeaks(blob).then((peaks) => {
            if (!peaks || !peaks.length) return;
            card.peaks = peaks; save();
            clear(audioBar); buildPlayer(audioBar, card);
          }).catch(() => {});
        }).catch(() => alert('Не удалось сохранить запись.'));
      };

      activeRecorder = rec;
      ui.live();
      rec.start();
    }).catch((err) => {
      const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
      alert(denied
        ? 'Доступ к микрофону запрещён. Разрешите его для этой страницы в настройках браузера.'
        : 'Микрофон недоступен.');
    });
  }

  function stopRecording() {
    if (activeRecorder && activeRecorder.state !== 'inactive') activeRecorder.stop();
  }

  /**
   * Столбики громкости в сосуде. Возвращает их списком: по нему потом
   * подсвечивается уже прозвучавшая часть.
   */
  function drawBars(barBox, peaks) {
    clear(barBox);
    const bars = [];
    const src = (peaks && peaks.length) ? peaks : null;
    for (let i = 0; i < PEAK_COUNT; i++) {
      // Пока формы волны нет — ровная тонкая линия, а не пустота:
      // так видно, что дорожка есть и по ней можно перематывать
      const v = src ? src[Math.floor(i * src.length / PEAK_COUNT)] : 8;
      const b = el('i');
      b.style.setProperty('height', Math.max(6, v) + '%');
      barBox.appendChild(b);
      bars.push(b);
    }
    return bars;
  }

  /**
   * Внешний вид дорожки, без поведения: кнопка, сосуд со столбиками,
   * подпись времени.
   *
   * Отдельно от плеера, потому что тот же самый вид нужен соседним
   * карточкам в читалке. Там дорожка только показывается — но выглядеть
   * должна в точности так же, иначе в момент подмены она бы дёрнулась.
   */
  function playerFace(card) {
    const play = el('button', {
      class: 'audio-btn', attrs: { type: 'button', 'aria-label': 'Прослушать запись' },
      text: '▶',
    });
    // Дорожка сделана как сосуд: пустая полоса, которая по мере
    // проигрывания наполняется слева направо. Столбики громкости лежат
    // поверх заливки, чтобы было видно, где голос, а где тишина.
    const wave = el('div', { class: 'wave', attrs: { 'aria-hidden': 'true' } });
    const fill = el('span', { class: 'wave-fill' });
    const barBox = el('div', { class: 'wave-bars' });
    const head = el('span', { class: 'wave-head' });
    wave.appendChild(fill);
    wave.appendChild(barBox);
    wave.appendChild(head);

    const total = card.audioLen || 0;
    const label = el('span', {
      class: 'audio-label',
      text: total ? '00:00,00 / ' + mmsscc(total) : 'Запись',
    });

    return { play, wave, fill, barBox, head, label, total,
             bars: drawBars(barBox, card.peaks) };
  }

  /**
   * Дорожка на соседней карточке в читалке: тот же вид, но неживой.
   *
   * Нужна, чтобы подъезжающая при свайпе карточка приходила уже со своей
   * дорожкой. Раньше соседка была без неё, и плеер появлялся отдельным
   * рывком уже после того, как карточка встала на место.
   *
   * Кнопки на месте, но выключены: карточка помечена aria-hidden, и в
   * обход по Tab они попадать не должны. Кнопку удаления рисуем тоже —
   * без неё сосуд оказался бы шире, и при подмене он бы сжался.
   */
  function stillPlayer(bar, card) {
    const face = playerFace(card);
    face.play.setAttribute('tabindex', '-1');
    const del = el('button', {
      class: 'audio-del',
      attrs: { type: 'button', 'aria-label': 'Удалить запись', tabindex: '-1' },
      text: '✕',
    });
    bar.appendChild(el('div', { class: 'audio-row' }, [face.play, face.wave, del]));
    bar.appendChild(face.label);
  }

  /** Плеер внизу карточки: кнопка, дорожка волны, время до сотых. */
  function buildPlayer(bar, card) {
    const face = playerFace(card);
    const play = face.play, wave = face.wave, fill = face.fill;
    const barBox = face.barBox, head = face.head, label = face.label;
    const total = face.total;
    let bars = face.bars;

    const duration = () => (audio && isFinite(audio.duration) && audio.duration > 0)
      ? audio.duration : total;

    const setTime = (cur) => {
      const dur = duration();
      // Общую длину берём из карточки: у записей «на лету» браузер
      // нередко отдаёт Infinity, и без запаса получилось бы «0:03 / NaN»
      label.textContent = dur
        ? mmsscc(cur) + ' / ' + mmsscc(dur)
        : mmsscc(cur);
      const p = dur ? Math.max(0, Math.min(1, cur / dur)) : 0;
      const pct = (p * 100).toFixed(2) + '%';
      // Сосуд наполняется: плотная часть — то, что уже прозвучало
      fill.style.setProperty('width', pct);
      head.style.setProperty('left', pct);
      // Столбики на залитой части становятся светлыми, иначе на плотном
      // фоне они бы пропали и звуковой рисунок исчез бы под наполнением
      const upto = Math.round(p * bars.length);
      for (let i = 0; i < bars.length; i++) {
        const want = i < upto ? 'played' : '';
        if (bars[i].className !== want) bars[i].className = want;
      }
      setWaveClass(p);
    };

    /** Пометки на дорожке: «играет» и «полон». */
    let playing = false;
    const setWaveClass = (p) => {
      // На самом верху черта уже не нужна — сосуд просто полон
      wave.className = 'wave' + (playing ? ' playing' : '')
        + (p >= 0.999 ? ' full' : '');
    };

    // Линия должна ехать плавно. Событие timeupdate приходит редко,
    // раза четыре в секунду, и линия дёргалась бы рывками — поэтому
    // во время проигрывания обновляем покадрово.
    let raf = 0;
    const follow = () => {
      if (!audio || audio.paused) { raf = 0; return; }
      setTime(audio.currentTime);
      raf = requestAnimationFrame(follow);
    };
    const stopFollow = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
    const del = el('button', {
      class: 'audio-del', attrs: { type: 'button', 'aria-label': 'Удалить запись' },
      text: '✕',
      on: {
        click: () => {
          if (!confirm('Удалить голосовую запись с этой карточки?')) return;
          stopFollow();
          if (audio) audio.pause();
          AudioStore.del(card.id).catch(() => {});
          card.audio = false; card.audioLen = 0; card.peaks = [];
          save(); clear(bar);
        },
      },
    });

    let audio = null, url = null, loading = false;

    /** Достать запись и подготовить проигрывание. */
    function ensureAudio() {
      if (audio) return Promise.resolve(audio);
      if (loading) return Promise.reject(new Error('busy'));
      loading = true;
      return AudioStore.get(card.id).then((blob) => {
        loading = false;
        if (!blob || !blob.size) {
          // Отметка врёт — снимаем её, чтобы карточка не обещала звук,
          // которого нет. Чаще всего так бывает после восстановления
          // резервной копии: в ней только текст, звука там нет.
          label.textContent = 'Запись не найдена — отметка снята';
          card.audio = false; card.audioLen = 0; card.peaks = [];
          save();
          setTimeout(() => { clear(bar); }, 1200);
          return null;
        }
        url = URL.createObjectURL(blob);
        audio = new Audio(url);
        audio.preload = 'metadata';
        audio.ontimeupdate = () => { if (audio.paused) setTime(audio.currentTime); };
        audio.onloadedmetadata = () => setTime(audio.currentTime || 0);
        audio.onplay = () => {
          play.textContent = '❚❚'; playing = true;
          setTime(audio.currentTime); stopFollow(); follow();
        };
        audio.onpause = () => {
          play.textContent = '▶'; playing = false;
          stopFollow(); setTime(audio.currentTime);
        };
        audio.onended = () => {
          play.textContent = '▶'; playing = false; stopFollow(); setTime(0);
        };
        audio.onerror = () => { label.textContent = 'Не удалось воспроизвести'; };

        // У старых записей формы волны нет — считаем сейчас и запоминаем,
        // чтобы в следующий раз она появилась сразу
        if (!card.peaks || card.peaks.length === 0) {
          computePeaks(blob).then((peaks) => {
            if (peaks && peaks.length) {
              card.peaks = peaks; save();
              bars = drawBars(barBox, peaks);
              setTime(audio ? audio.currentTime : 0);
            }
          }).catch(() => {});
        }
        return audio;
      }).catch(() => {
        loading = false;
        label.textContent = 'Не удалось открыть запись';
        return null;
      });
    }

    play.addEventListener('click', () => {
      if (audio && !audio.paused) { audio.pause(); return; }
      ensureAudio().then((a) => { if (a) a.play(); }).catch(() => {});
    });

    // Перемотка нажатием и протягиванием по дорожке
    const seekTo = (clientX) => {
      const box = wave.getBoundingClientRect ? wave.getBoundingClientRect() : null;
      if (!box || !box.width) return;
      const p = Math.max(0, Math.min(1, (clientX - box.left) / box.width));
      const dur = duration();
      if (!dur) return;
      setTime(p * dur);
      ensureAudio().then((a) => { if (a) a.currentTime = p * dur; }).catch(() => {});
    };
    let seeking = false;
    wave.addEventListener('pointerdown', (ev) => {
      seeking = true;
      if (wave.setPointerCapture) wave.setPointerCapture(ev.pointerId);
      seekTo(ev.clientX);
      ev.stopPropagation();     // не отдаём жест перелистыванию карточки
    });
    wave.addEventListener('pointermove', (ev) => {
      if (!seeking) return;
      seekTo(ev.clientX);
      ev.stopPropagation();
    });
    wave.addEventListener('pointerup', () => { seeking = false; });
    wave.addEventListener('pointercancel', () => { seeking = false; });

    if (total) setTime(0);   // без длины подпись остаётся «Запись»

    // Ссылку на объект надо освободить, иначе память держится до
    // перезагрузки страницы
    audioCleanup.push(() => {
      stopFollow();
      if (audio) { audio.pause(); }
      if (url) URL.revokeObjectURL(url);
    });

    bar.appendChild(el('div', { class: 'audio-row' }, [play, wave, del]));
    bar.appendChild(label);
  }

  let audioCleanup = [];

  // ------------------------------------------------------------------
  // Модальные окна
  // ------------------------------------------------------------------
  function modal(title, fields, onSave, onDelete) {
    const wrap = el('div', { class: 'modal' });
    const inputs = {};

    const sheet = el('div', { class: 'sheet' }, [el('h3', { text: title })]);

    for (const f of fields) {
      if (f.type === 'colors') {
        const row = el('div', { class: 'swatches' });
        let palette = f.palette || COLORS;
        // Если карточка покрашена в цвет из прежней бледной палитры,
        // показываем его первым отдельным образцом. Иначе при открытии
        // окна выбор молча съезжал бы на жёлтый и карточка меняла цвет
        // от одного лишь захода в редактирование.
        if (f.value && !palette.includes(f.value)) palette = [f.value].concat(palette);
        let chosen = palette.includes(f.value) ? f.value : palette[0];
        palette.forEach((c) => {
          const b = el('button', {
            class: 'swatch', style: { background: c },
            attrs: { type: 'button', 'aria-pressed': String(c === chosen),
                     'aria-label': 'Цвет' },
          });
          b.addEventListener('click', () => {
            chosen = c;
            row.querySelectorAll('.swatch').forEach((n) => n.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
          });
          row.appendChild(b);
        });
        inputs[f.key] = { get value() { return chosen; } };
        sheet.appendChild(el('label', { class: 'field' }, [
          el('span', { text: f.label }), row,
        ]));
        continue;
      }
      const input = f.type === 'textarea'
        ? el('textarea', { attrs: { maxlength: String(f.max), rows: '6' } })
        : el('input', { attrs: { type: 'text', maxlength: String(f.max),
                                 autocapitalize: 'sentences', spellcheck: 'false' } });
      input.value = f.value || '';
      inputs[f.key] = input;
      sheet.appendChild(el('label', { class: 'field' }, [
        el('span', { text: f.label }), input,
      ]));
    }

    const close = () => {
      // Сначала снимаем фокус с поля, потом убираем окно. Пока поле в
      // фокусе, iPhone держит клавиатуру и сдвинутый экран; если убрать
      // окно вместе с полем, возвращать вид системе уже не с чего —
      // и страница остаётся смещённой и увеличенной.
      const act = document.activeElement;
      if (act && typeof act.blur === 'function') act.blur();
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      // Экран мог уехать вслед за клавиатурой — ставим его на место
      if (typeof window.scrollTo === 'function') window.scrollTo(0, 0);
    };

    const actions = el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Отмена',
                     on: { click: close } }),
      el('button', {
        class: 'btn', attrs: { type: 'button' }, text: 'Сохранить',
        on: {
          click: () => {
            const values = {};
            for (const k of Object.keys(inputs)) values[k] = inputs[k].value;
            if (onSave(values) !== false) { close(); save(); render(); }
          },
        },
      }),
    ]);
    sheet.appendChild(actions);

    if (onDelete) {
      sheet.appendChild(el('button', {
        class: 'btn danger', attrs: { type: 'button' },
        style: { width: '100%', 'margin-top': '10px' },
        text: 'Удалить',
        on: {
          click: () => {
            if (!confirm('Удалить без возможности вернуть?')) return;
            onDelete(); close(); save(); render();
          },
        },
      }));
    }

    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
    const first = sheet.querySelector('input, textarea');
    if (first) first.focus();
  }

  function editSection(section) {
    modal(section ? 'Раздел' : 'Новый раздел',
      [{ key: 'name', label: 'Название', value: section ? section.name : '',
         max: LIMITS.sectionName }],
      (v) => {
        const name = v.name.trim();
        if (!name) return false;
        if (section) section.name = name;
        else {
          if (state.sections.length >= LIMITS.sections) {
            alert('Достигнут предел разделов.'); return false;
          }
          state.sections.push({ id: uid(), name: name, decks: [] });
        }
      },
      section ? () => {
        state.sections = state.sections.filter((s) => s.id !== section.id);
        go({ name: 'home' });
      } : null);
  }

  function editDeck(section, deck) {
    modal(deck ? 'Колода' : 'Новая колода', [
      { key: 'name', label: 'Название', value: deck ? deck.name : '', max: LIMITS.deckName },
      { key: 'color', label: 'Цвет', type: 'colors', value: deck ? deck.color : COLORS[0] },
    ], (v) => {
      const name = v.name.trim();
      if (!name) return false;
      if (deck) { deck.name = name; deck.color = v.color; }
      else {
        if (section.decks.length >= LIMITS.decksPerSection) {
          alert('Достигнут предел колод в разделе.'); return false;
        }
        section.decks.push({ id: uid(), name: name, color: v.color, cards: [] });
      }
    }, deck ? () => {
      section.decks = section.decks.filter((d) => d.id !== deck.id);
      go({ name: 'home' });
    } : null);
  }

  function editCard(deck, card) {
    modal(card ? 'Карточка' : 'Новая карточка', [
      { key: 'text', label: 'Текст аффирмации', type: 'textarea',
        value: card ? card.text : '', max: LIMITS.cardText },
      { key: 'color', label: 'Цвет карточки', type: 'colors',
        palette: CARD_COLORS, value: card ? card.color : CARD_COLORS[0] },
    ],
      (v) => {
        const text = v.text.trim();
        if (!text) return false;
        if (card) { card.text = text; card.color = v.color; }
        else {
          if (deck.cards.length >= LIMITS.cardsPerDeck) {
            alert('Достигнут предел карточек в колоде.'); return false;
          }
          deck.cards.push({ id: uid(), text: text, color: v.color, fav: false });
        }
      },
      card ? () => {
        const idx = deck.cards.findIndex((c) => c.id === card.id);
        // Вместе с карточкой убираем и её запись, иначе звук останется
        // висеть в хранилище навсегда — никто уже на него не сошлётся
        if (card.audio) AudioStore.del(card.id).catch(() => {});
        deck.cards = deck.cards.filter((c) => c.id !== card.id);
        if (view.name === 'read') {
          if (deck.cards.length === 0) {
            go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId });
          } else {
            view.index = Math.max(0, Math.min(idx, deck.cards.length - 1));
          }
        }
      } : null);
  }

  // ------------------------------------------------------------------
  // Настройки: резервная копия
  // ------------------------------------------------------------------
  function openSettings() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };

    const fileInput = el('input', {
      // Фильтра по типу нет намеренно — по той же причине, что и в
      // окне синхронизации: с ним iPhone гасит нужный файл. Что внутри,
      // проверяем по содержимому.
      attrs: { type: 'file' },
      style: { display: 'none' },
    });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      if (f.size > 5 * 1024 * 1024) { alert('Файл слишком большой.'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        let parsed = null;
        try { parsed = JSON.parse(String(reader.result)); }
        catch (e) { alert('Это не похоже на файл резервной копии.'); return; }
        // Тот же разбор, что и для хранилища: чужой файл не должен
        // протащить в приложение ничего, кроме текста
        const clean = sanitizeState(parsed);
        if (clean.sections.length === 0) { alert('В файле нет разделов.'); return; }
        if (!confirm('Заменить всё содержимое данными из файла?')) return;
        state = clean; save(); close(); go({ name: 'home' });
        // В резервной копии только текст. Карточки из неё уверены, что
        // у них есть звук, — сверяем с хранилищем и снимаем лишние
        // отметки, иначе «играть» упрётся в пустоту.
        healAudioFlags((n) => {
          if (n) {
            alert('Восстановлено из копии.\n\nВ копии нет голосовых '
              + 'записей — отметка о звуке снята у ' + n
              + ' карточек. Сами записи остались на том устройстве, где '
              + 'их сделали; перенести их можно через синхронизацию.');
          }
        });
      };
      reader.readAsText(f);
    });

    const sheet = el('div', { class: 'sheet' }, [
      el('h3', { text: 'Настройки' }),
      el('p', { class: 'hint', text:
        'Все карточки хранятся только на этом устройстве. Приложение не '
        + 'обращается в интернет и никуда ничего не отправляет.' }),
      el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Сохранить копию', on: { click: exportBackup } }),
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Загрузить копию', on: { click: () => fileInput.click() } }),
      ]),
      el('p', { class: 'hint', text:
        'Копия — обычный файл на вашем компьютере. Пригодится, если очистить '
        + 'данные браузера: без копии карточки восстановить будет нельзя.' }),
      el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Закрыть',
                       on: { click: close } }),
      ]),
      fileInput,
    ]);

    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  function humanTime(ts) {
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '—';
    const pad = (n) => String(n).padStart(2, '0');
    return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear()
      + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /**
   * Синхронизация через файл в iCloud Drive.
   *
   * Почему так, а не «по-настоящему». У браузера нет доступа к iCloud —
   * такого интерфейса не существует ни в Safari, ни где-либо ещё. Зато
   * системное окно выбора файла на iPhone показывает iCloud Drive как
   * обычную папку, а окно «Поделиться» умеет туда сохранять. Этого
   * достаточно, чтобы переносить карточки между устройствами через ту же
   * облачную папку, без сервера и без учётной записи.
   */
  function openSync() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });
    const status = el('div', { class: 'sync-status' });

    // Без accept намеренно. Фильтр по типу тут только вредит: iPhone
    // тогда гасит нужный файл в окне выбора. Что за файл — решаем по
    // содержимому, а не по имени: так и надёжнее, и безопаснее.
    const fileInput = el('input', {
      attrs: { type: 'file' },
      style: { display: 'none' },
    });

    /**
     * Разобрать текст файла обмена.
     *
     * Возвращает разобранный объект или null. Убираем невидимую метку
     * кодировки в начале (её добавляют многие редакторы и облачные
     * папки) — из-за одного такого символа разбор падал бы на файле,
     * с которым на самом деле всё в порядке.
     */
    function parseSync(raw) {
      const text = String(raw == null ? '' : raw).replace(/^\uFEFF/, '').trim();
      if (!text) return null;
      try { return JSON.parse(text); } catch (e) { return null; }
    }

    /** Общий путь для файла и для вставленного текста. */
    function takeText(raw, whatChosen) {
      const parsed = parseSync(raw);
      if (!parsed) {
        report('Это не похоже на данные синхронизации.\nВыбрано: '
               + whatChosen
               + '\nНужен файл ' + SYNC_FILE + ' (или прежний '
               + 'affirmations-sync.json), сохранённый кнопкой '
               + '«Сохранить в файл».', 'bad');
        return;
      }
      const clean = sanitizeState(parsed);
      if (clean.sections.length === 0) {
        report('В данных нет разделов — загружать нечего.', 'bad'); return;
      }
      // Ничего не меняем сразу: сперва показываем, что внутри, и ждём
      // подтверждения. Раньше выбор файла молча всё применял, и было
      // непонятно, сработало вообще или нет.
      showPreview(parsed, clean, whatChosen);
    }

    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      // Потолок поднят: теперь в файл входят и голосовые записи,
      // а они весят куда больше текста
      if (f.size > 200 * 1024 * 1024) {
        report('Файл слишком большой', 'bad'); return;
      }
      report('Читаю файл…', 'wait');
      const reader = new FileReader();
      reader.onerror = () => report('Файл не читается', 'bad');
      reader.onload = () => takeText(reader.result, f.name || 'файл без имени');
      reader.readAsText(f);
    });

    /**
     * Собрать файл синхронизации ВМЕСТЕ с голосовыми записями.
     *
     * Записи лежат в IndexedDB двоичными объектами, а в JSON их не
     * положишь — переводим в base64. Файл от этого растёт примерно на
     * треть от веса звука, но зато на втором устройстве появляются
     * не только тексты, но и голос.
     */
    function buildPayload() {
      const withAudio = [];
      for (const s of state.sections) {
        for (const d of s.decks) {
          for (const c of d.cards) if (c.audio) withAudio.push(c);
        }
      }
      if (withAudio.length === 0) {
        return Promise.resolve(JSON.stringify(Object.assign({}, state, {
          kind: 'sync', syncedAt: Date.now(),
          clipCount: 0, clipsExpected: 0, clips: {},
        }), null, 2));
      }

      report('Собираю записи: 0 из ' + withAudio.length + '…', 'wait');
      const clips = {};
      let done = 0;

      const next = (i) => {
        if (i >= withAudio.length) return Promise.resolve();
        const card = withAudio[i];
        return AudioStore.get(card.id)
          .then((blob) => (blob ? AudioStore.toText(blob) : null))
          .then((text) => { if (text) clips[card.id] = text; })
          .catch(() => { /* запись потерялась — переносим карточку без неё */ })
          .then(() => {
            done++;
            report('Собираю записи: ' + done + ' из '
              + withAudio.length + '…', 'wait');
            return next(i + 1);
          });
      };

      return next(0).then(() => {
        clear(status);
        // Помечаем файл: что это и сколько записей внутри. Иначе
        // резервную копию (только текст) не отличить от файла обмена —
        // оба лежат на рабочем столе с расширением .txt.
        return JSON.stringify(Object.assign({}, state, {
          kind: 'sync', syncedAt: Date.now(),
          clipCount: Object.keys(clips).length,
          clipsExpected: withAudio.length,
          clips: clips,
        }), null, 2);
      });
    }

    function sendOut() {
      buildPayload().then(deliver).catch(() => {
        report('Не удалось собрать файл.', 'bad');
      });
    }

    function deliver(text) {
      if (typeof self.__capture === 'function') self.__capture(text);
      // Тип и расширение — обычный текст, а НЕ json.
      //
      // Это не мелочь оформления, а обход поведения iOS: в окне выбора
      // файла система гасит всё, что не умеет открыть сама, и .json туда
      // попадает — файл видно, но нажать нельзя, и никакой accept этого
      // не меняет. Простой текст iOS открывать умеет, поэтому такой файл
      // выбирается свободно. Внутри лежит тот же самый JSON.
      const blob = new Blob([text], { type: 'text/plain' });
      const mb = blob.size / 1048576;
      const file = new File([blob], SYNC_FILE, { type: 'text/plain' });
      // Через системное «Поделиться» файл кладётся прямо в iCloud Drive.
      // Если браузер этого не умеет — обычное скачивание, а дальше
      // пользователь сам перекладывает файл в облачную папку.
      const size = mb < 1 ? Math.round(blob.size / 1024) + ' КБ'
                          : mb.toFixed(1) + ' МБ';
      // Если часть записей не удалось положить в файл — сказать сразу,
      // а не выяснять это уже на втором устройстве
      let warn = '';
      try {
        const meta = JSON.parse(text);
        const got = meta.clipCount || 0, want = meta.clipsExpected || 0;
        if (want > got) {
          warn = '\nВНИМАНИЕ: в файл вошло записей ' + got + ' из ' + want + '.';
        } else if (got) {
          warn = '\nЗаписей внутри: ' + got + '.';
        }
      } catch (e) { /* не смогли заглянуть — не страшно */ }

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // Передаём ТОЛЬКО файл. Если добавить title или text, iOS
        // сохраняет их отдельным текстовым файлом рядом — и на диске
        // оказывается два файла вместо одного.
        navigator.share({ files: [file] })
          .then(() => { state.syncedAt = Date.now(); save(); render();
                        report('Файл сохранён, ' + size + '.' + warn, 'ok'); })
          .catch(() => { /* пользователь отменил — это не ошибка */ });
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = el('a', { attrs: { href: url, download: SYNC_FILE } });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.syncedAt = Date.now(); save(); render();
      report('Файл сохранён: ' + SYNC_FILE + ' (' + size + ').' + warn
             + '\nПоложите его в папку iCloud Drive.', 'ok');
    }

    /** Крупное заметное сообщение вместо мелкой серой строчки. */
    function report(text, kind) {
      clear(status);
      status.className = 'sync-status ' + (kind || '');
      status.appendChild(el('div', { text: text }));
    }

    /** Показать, что внутри файла, и дождаться подтверждения. */
    function showPreview(parsed, clean, source) {
      let cards = 0, decks = 0;
      for (const s of clean.sections) {
        decks += s.decks.length;
        for (const d of s.decks) cards += d.cards.length;
      }
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      const clipCount = Object.keys(clips).length;
      const when = (typeof parsed.syncedAt === 'number')
        ? humanTime(parsed.syncedAt) : 'дата неизвестна';

      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Что в файле' }));
      sheet.appendChild(el('p', { class: 'hint',
        text: (source || 'данные') + ' · ' + when }));
      sheet.appendChild(el('div', { class: 'sync-status ok' }, [
        el('div', { text: 'Разделов: ' + clean.sections.length }),
        el('div', { text: 'Колод: ' + decks }),
        el('div', { text: 'Карточек: ' + cards }),
        el('div', { text: 'Голосовых записей: ' + clipCount }),
      ]));
      // Сколько карточек в файле заявляют звук — если записей при этом
      // нет, значит выбран не тот файл, и молчать об этом нельзя
      let claimAudio = 0;
      for (const sec of clean.sections) {
        for (const d of sec.decks) {
          for (const c of d.cards) if (c.audio) claimAudio++;
        }
      }
      const isBackup = parsed && parsed.kind === 'backup';

      if (clipCount) {
        sheet.appendChild(el('p', { class: 'hint', text:
          'Голосовые записи лежат внутри этого же файла и разойдутся по '
          + 'своим карточкам. Ваши карточки не пострадают: добавится '
          + 'только то, чего здесь ещё нет.' }));
      } else if (isBackup || claimAudio) {
        sheet.appendChild(el('div', { class: 'sync-status bad' }, [
          el('div', { text: 'В этом файле нет голосовых записей.' }),
          el('div', { text: isBackup
            ? 'Это резервная копия — в неё звук не входит.'
            : 'Карточки говорят про звук (' + claimAudio + '), но самих '
              + 'записей в файле нет.' }),
          el('div', { text: 'Нужен файл, сохранённый кнопкой '
            + '«↑ Сохранить в файл» в этом окне. Он называется '
            + SYNC_FILE + '.' }),
        ]));
      } else {
        sheet.appendChild(el('p', { class: 'hint', text:
          'Ваши карточки не пострадают: добавится только то, чего здесь '
          + 'ещё нет. Совпадающие пропускаются.' }));
      }
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: drawMain } }),
        el('button', {
          class: 'btn', attrs: { type: 'button' },
          text: 'Загрузить в приложение',
          on: { click: () => applyImport(parsed, clean) },
        }),
      ]));
    }

    /** Здесь и только здесь данные действительно попадают в приложение. */
    function applyImport(parsed, clean) {
      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Загрузка' }));
      sheet.appendChild(status);
      report('Переношу…', 'wait');

      const res = mergeState(clean);
      state.syncedAt = Date.now();
      save(); render();

      // Записи кладём после слияния: их надо привязать к тем карточкам,
      // которые только что появились, а у них новые идентификаторы
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      importClips(res.audioLinks, clips, {
        set text(v) { report(v, 'wait'); },
      }, res.added, (cards, clipsDone, info) => {
        clear(sheet);
        sheet.appendChild(el('h3', { text: 'Готово' }));
        const lines = [];
        lines.push('Добавлено карточек: ' + cards);
        lines.push('Перенесено записей: ' + clipsDone);
        const inFile = (info && info.inFile) || 0;
        const kept = (info && info.kept) || 0;
        // Раньше итог сводился к «нового не оказалось», и было
        // непонятно, куда делись записи, которые видно в файле.
        // Теперь про каждую сказано, что с ней стало.
        if (kept) {
          lines.push('Уже были на этом устройстве: ' + kept);
        }
        const lost = inFile - clipsDone - kept;
        if (inFile && lost > 0) {
          const w = (info && info.why) || {};
          const reason = w.parse ? 'не удалось разобрать запись в файле'
            : w.write ? 'хранилище браузера отказалось её принять'
            : w.verify ? 'запись легла, но не прочиталась обратно'
            : w.nolink ? 'для записи не нашлось карточки в этом же файле'
            : 'причина не определена';
          lines.push('');
          lines.push('Не удалось перенести: ' + lost + '.');
          lines.push('Причина: ' + reason + '.');
        }
        if (cards === 0 && clipsDone === 0 && !kept && !inFile) {
          lines.push('');
          lines.push('Нового не оказалось — всё это уже есть на устройстве.');
        }
        sheet.appendChild(el('div', { class: 'sync-status ok' },
          lines.map((x) => el('div', { text: x }))));
        sheet.appendChild(el('div', { class: 'sheet-actions' }, [
          el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Закрыть',
                         on: { click: () => { close(); render(); } } }),
        ]));
      });
    }

    function drawMain() {
    clear(sheet);
    sheet.appendChild(el('h3', { text: 'Синхронизация' }));
    sheet.appendChild(el('p', { class: 'hint', text:
      'Перенос карточек и голосовых записей между устройствами через файл '
      + 'в iCloud Drive.' }));

    // Слова «выгрузить» и «загрузить» отличаются одной буквой и легко
    // путаются. Пишем прямо, в какую сторону идут данные.
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn', attrs: { type: 'button' },
                     text: '↑  Сохранить в файл', on: { click: sendOut } }),
      el('p', { class: 'hint', text:
        'Отсюда — в файл. Делайте на том устройстве, где вносили изменения.' }),
    ]));
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' },
                     text: '↓  Взять из файла',
                     on: { click: () => fileInput.click() } }),
      el('p', { class: 'hint', text:
        'Из файла — сюда. Делайте на втором устройстве. Ваши карточки '
        + 'не стираются, добавляются только недостающие.' }),
    ]));

    // Запасной путь на случай, если окно выбора файла опять заупрямится.
    // Голос так не переносится — он слишком тяжёлый, чтобы держать его
    // в буфере обмена; об этом сказано прямо, чтобы не было сюрприза.
    const paste = el('textarea', {
      class: 'paste-box',
      attrs: { rows: '3', placeholder: 'Или вставьте сюда текст файла',
               autocomplete: 'off', autocorrect: 'off', spellcheck: 'false' },
    });
    sheet.appendChild(el('details', { class: 'fallback' }, [
      el('summary', { text: 'Не получается выбрать файл?' }),
      el('p', { class: 'hint', text:
        'Откройте файл на другом устройстве, скопируйте всё содержимое '
        + 'и вставьте сюда. Тексты и цвета перенесутся, голосовые '
        + 'записи — нет.' }),
      paste,
      el('button', {
        class: 'btn sec', attrs: { type: 'button' }, text: 'Загрузить из текста',
        on: { click: () => {
          const v = paste.value || '';
          if (!v.trim()) { report('Поле пустое — вставьте текст.', 'bad'); return; }
          takeText(v, 'вставленный текст');
        } },
      }),
    ]));
    sheet.appendChild(status);
    if (state.syncedAt) {
      sheet.appendChild(el('p', { class: 'hint',
        text: 'Последний раз: ' + humanTime(state.syncedAt) }));
    }
    sheet.appendChild(el('p', { class: 'hint', text:
      'Голосовые записи переносятся вместе с карточками. Из-за них файл '
      + 'заметно тяжелее — это нормально. Если запись уже есть на этом '
      + 'устройстве, она сохраняется, чужая её не затирает.' }));
    sheet.appendChild(el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Закрыть',
                     on: { click: close } }),
    ]));
    sheet.appendChild(fileInput);
    }

    drawMain();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  /**
   * Слить входящие данные с текущими: добавить недостающее, ничего не
   * потерять. Замена «всё на всё» при синхронизации между двумя
   * устройствами гарантированно однажды сотрёт то, что было сделано
   * на другом, — поэтому только добавление, по совпадению текста.
   */
  function mergeState(incoming) {
    let added = 0;
    // Пары «идентификатор в файле → карточка у нас»: по ним потом
    // разложим голосовые записи
    const audioLinks = [];
    for (const inSec of incoming.sections) {
      let sec = state.sections.find((s) => s.name === inSec.name);
      if (!sec) {
        sec = { id: uid(), name: inSec.name, collapsed: false, decks: [] };
        state.sections.push(sec);
      }
      for (const inDeck of inSec.decks) {
        let deck = sec.decks.find((d) => d.name === inDeck.name);
        if (!deck) {
          deck = { id: uid(), name: inDeck.name, color: inDeck.color, cards: [] };
          sec.decks.push(deck);
        }
        const byText = new Map(deck.cards.map((c) => [c.text.trim(), c]));
        for (const inCard of inDeck.cards) {
          const key = inCard.text.trim();
          const mine = byText.get(key);
          if (mine) {
            // Карточка уже есть — сам текст не трогаем. А вот запись
            // берём в работу всегда, когда она есть в файле.
            //
            // Раньше здесь стояло условие «и только если у нас записи
            // нет» — по отметке на карточке. Отметка же может врать:
            // после восстановления копии карточка считает, что звук у
            // неё есть, хотя в хранилище пусто. Из-за этого запись из
            // файла молча пропускалась, и переносилось ноль записей при
            // том, что в файле их видно. Теперь наличие своей записи
            // проверяется по самому хранилищу, а не по отметке.
            if (inCard.audio) {
              audioLinks.push({ from: inCard.id, card: mine, len: inCard.audioLen,
                                peaks: sanitizePeaks(inCard.peaks),
                                existing: true });
            }
            continue;
          }
          if (deck.cards.length >= LIMITS.cardsPerDeck) break;
          // Форму волны переносим сразу: пересчитать её из файла на
          // iPhone нечем, а без неё дорожка выглядела бы пустой
          const fresh = { id: uid(), text: inCard.text, color: inCard.color,
                          fav: inCard.fav, audio: false, audioLen: 0,
                          peaks: sanitizePeaks(inCard.peaks) };
          deck.cards.push(fresh);
          byText.set(key, fresh);
          added++;
          if (inCard.audio) {
            audioLinks.push({ from: inCard.id, card: fresh, len: inCard.audioLen,
                              peaks: sanitizePeaks(inCard.peaks) });
          }
        }
      }
    }
    return { added: added, audioLinks: audioLinks };
  }

  /** Разложить голосовые записи из файла по карточкам. */
  function importClips(links, clips, status, addedCards, onDone) {
    const todo = links.filter((l) => typeof clips[l.from] === 'string');
    // Сколько записей было в файле — нужно, чтобы честно объяснить
    // итог: «две записи в файле, обе уже есть» и «две записи в файле,
    // ни одна не легла» выглядят одинаково, а означают разное
    const inFile = Object.keys(clips || {}).length;
    let ok = 0, kept = 0, lastError = null;
    // Причины отказов копим поимённо. Гадать «наверное, кончилось
    // место» бессмысленно: в прошлый раз дело было совсем в другом,
    // а сообщение уводило в сторону.
    const why = { parse: 0, write: 0, verify: 0, nolink: 0 };

    const finish = () => {
      save(); render();
      if (typeof onDone === 'function') {
        onDone(addedCards, ok, { inFile: inFile, kept: kept, why: why });
        return;
      }
      const parts = [];
      parts.push(addedCards ? 'Добавлено карточек: ' + addedCards
                            : 'Новых карточек нет');
      if (ok) parts.push('записей: ' + ok);
      status.text = parts.join(', ') + '.';
    };

    // Записи, для которых в файле нет карточки (или наоборот)
    why.nolink = Math.max(0, inFile - todo.length);
    if (todo.length === 0) { finish(); return; }
    status.text = 'Переношу записи: 0 из ' + todo.length + '…';

    const step = (i) => {
      if (i >= todo.length) { finish(); return; }
      const link = todo[i];
      const cont = () => {
        status.text = 'Переношу записи: ' + (i + 1) + ' из '
          + todo.length + '…';
        step(i + 1);
      };

      const take = () => {
        const blob = AudioStore.fromText(clips[link.from]);
        if (!blob || !blob.size) { why.parse++; cont(); return; }
        // Отмечаем звук только после того, как убедились, что он
        // действительно читается обратно. Иначе карточка могла бы
        // заявлять запись, которой на деле нет.
        AudioStore.put(link.card.id, blob)
          .then(() => AudioStore.get(link.card.id))
          .then((back) => {
            if (!back || !back.size) { why.verify++; cont(); return; }
            link.card.audio = true;
            link.card.audioLen = link.len || 0;
            if (Array.isArray(link.peaks) && link.peaks.length) {
              link.card.peaks = link.peaks;
            }
            ok++;
            cont();
          })
          .catch((e) => { why.write++; lastError = e; cont(); });
      };

      if (!link.existing) { take(); return; }
      // Карточка была на устройстве. Своя запись дороже чужой — но
      // «своя» значит настоящая, а не отметка о ней.
      AudioStore.get(link.card.id).then((mine) => {
        if (mine && mine.size) {
          link.card.audio = true;      // отметка могла быть снята — вернём
          kept++;
          cont();
          return;
        }
        take();
      }).catch(take);
    };
    step(0);
  }

  function exportBackup() {
    // Тот же расчёт, что и у файла обмена: обычный текст iPhone даёт
    // выбрать, а .json — нет
    const blob = new Blob([JSON.stringify(
      Object.assign({}, state, { kind: 'backup' }), null, 2)],
      { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { attrs: { href: url, download: 'affirmations-только-текст.txt' } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ------------------------------------------------------------------
  function render() {
    if (readerKeyHandler) {
      document.removeEventListener('keydown', readerKeyHandler);
      readerKeyHandler = null;
    }
    // Останавливаем звук и освобождаем ссылки прошлого экрана: без этого
    // запись продолжала бы играть после перехода на другую карточку
    stopRecording();
    audioCleanup.forEach((fn) => { try { fn(); } catch (e) { /* уже убрано */ } });
    audioCleanup = [];
    // Обработчики жеста «назад» висят на корне и переживают перерисовку —
    // снимаем их сами, иначе накопятся и начнут срабатывать по нескольку раз
    if (backSwipeCleanup) { backSwipeCleanup(); backSwipeCleanup = null; }
    clear(root);
    let content;
    if (view.name === 'read') content = renderReader();
    else if (view.name === 'deck') content = renderDeck();
    else content = renderHome();
    root.appendChild(content);
    window.scrollTo(0, 0);

    // Экран въезжает с той стороны, куда ушёл предыдущий. Смещение
    // ставим сразу, а снимаем на следующем кадре: в одном кадре браузер
    // не увидит промежуточного состояния и анимации не получится.
    if (pageEnter !== 0) {
      const dir = pageEnter;
      pageEnter = 0;
      const target = root.firstChild;
      if (target && target.style) {
        const w = target.offsetWidth || 400;
        target.style.setProperty('transition', 'none');
        target.style.setProperty('transform',
          'translateX(' + (dir > 0 ? w * 0.4 : -w * 0.4) + 'px)');
        target.style.setProperty('opacity', '0.4');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            target.style.setProperty('transition',
              'transform ' + SLIDE_MS + 'ms ' + SLIDE_EASE
              + ', opacity ' + Math.round(SLIDE_MS * 0.6) + 'ms linear');
            target.style.setProperty('transform', 'translateX(0)');
            target.style.setProperty('opacity', '1');
          });
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Работа без интернета — только для версии, размещённой по https.
  //
  // Проверка протокола обязательна: при открытии файла двойным щелчком
  // рядом нет никакого sw.js, и попытка его зарегистрировать закончилась
  // бы ошибкой в консоли на пустом месте. Обработчик кеша живёт в
  // отдельном файле sw.js рядом с index.html.
  // ------------------------------------------------------------------
  if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Не зарегистрировался — приложение всё равно работает,
        // просто не откроется без сети
      });
    });
  }

  // Разовая сверка отметок о звуке с хранилищем. Нужна тем, кто уже
  // восстановился из копии до этой правки: у них карточки заявляют
  // записи, которых нет, и «играть» молча упирается в пустоту.
  // Проверка идёт своим чередом и отрисовку не задерживает.
  setTimeout(() => healAudioFlags(), 0);

  render();
})();
</script>
</body>
</html>
