<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  Политика безопасности. Скрипт и стили разрешены по контрольной сумме,
  а не по источнику: подменить их нельзя, сумма не сойдётся.
    default-src 'none'     — по умолчанию запрещено всё
    img-src 'self' data: blob:
                           — картинки только свои: из самого файла, из
                             строки data: и из объектов, созданных на
                             этом же устройстве. Без blob: фотографии с
                             телефона не открывались вовсе: браузер молча
                             отказывался их показывать, а приложение
                             видело только «не удалось прочитать»
    media-src blob:        — звук только свой, созданный на этом устройстве;
                             подгрузить запись с чужого адреса нельзя
    worker-src 'self'      — офлайн-режим только из своего же файла
    connect-src 'self'     — обращаться можно ровно к своему же адресу и
                             никуда больше. Нужно для одной вещи: узнать,
                             какая версия лежит на сайте (version.txt).
                             При 'none' этот вопрос браузер запрещал, и
                             приложение всегда думало, что обновлений нет
    form-action 'none'     — формы никуда не отправляются
    frame-ancestors 'none' — страницу нельзя встроить в чужой сайт
  Данным физически некуда утечь: чужие адреса закрыты полностью.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'sha256-Qv3NMJEdk3WneGduRVL2Ix+8W4jokwDxd0Iv3BSwpFg=';
               style-src 'sha256-hXVbdJJnQBLtmmpUFiXokF80OU4poOhIYB78ucUxGTM=';
               img-src 'self' data: blob:;
               media-src blob:;
               worker-src 'self';
               manifest-src 'self';
               connect-src 'self';
               form-action 'none';
               base-uri 'none';
               frame-ancestors 'none';
               object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Аффирмации">
<title>Аффирмации</title>
<!--
  Манифест и иконка нужны для добавления на экран «Домой». iOS берёт
  иконку только из apple-touch-icon и только в PNG: со ссылкой на SVG
  он молча подставит вместо неё снимок страницы.
  При открытии одиночного файла этих спутников рядом нет — ссылки просто
  ни к чему не приведут и ничего не сломают.
-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>/* Аффирмации — оформление.
   Один файл, никаких внешних шрифтов и картинок: всё, что грузится
   из сети, — это лишний способ подсунуть код. Шрифты системные. */

:root {
  --paper: #F4F3EF;          /* тон бумаги с фотографии */
  --dot: #C9C7C0;            /* точки на фоне */
  --ink: #1C1B19;
  --ink-soft: #6B6862;
  --card-yellow: #E6C84C;    /* цвет карточки с фотографии */
  --card-yellow-edge: #D4B63C;
  --sheet: #FFFFFF;
  --hair: rgba(0, 0, 0, .08);
  --danger: #C0392B;
  --heart: #E23B3B;
  --star: #D9930B;      /* тёплый янтарь: отметка «в напоминания» */
  --radius-l: 22px;
  --radius-m: 16px;
  --tap: 44px;               /* минимальная зона нажатия по гайдлайнам Apple */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* Кнопки и поля — обычные коробки, а не системные элементы.
 *
 * Вот где на самом деле пропадала прокрутка колесом на компьютере. Пока у
 * кнопки системный вид, Safari считает её своей частью и колесо над ней
 * обрабатывает сам, странице не отдавая. А это приложение почти целиком
 * состоит из кнопок: и колоды, и заголовки разделов, и каждая строка
 * карточки — кнопки, их тут шесть десятков. Свободными от них остаются
 * только пустые поля по бокам — ровно там прокрутка и работала.
 *
 * На вид не влияет ничего: у всех кнопок здесь свой фон, своя рамка,
 * свой шрифт и свои скругления, системного не осталось ни следа. Поля
 * ввода тоже нарисованы сами (см. .field input и .rich-input).
 */
button, input, textarea {
  -webkit-appearance: none;
  appearance: none;
}

/* Высота страницы. Отсюда и шла пропавшая прокрутка на компьютере.
 *
 * Было: и у html, и у body ровно height: 100% — то есть коробка body
 * размером точно в окно, а всё содержимое из неё торчит наружу. Курсор
 * над таким содержимым попадает в body, а прокручивать body нечего:
 * коробка-то ровно в окно. Дальше, к самому окну, событие не уходит —
 * его останавливает overscroll-behavior. Поэтому колесо работало только
 * над пустыми полями, где под курсором уже не body, а сама страница.
 *
 * Стало: у html высота окна, у body — не меньше окна. Коробка body
 * растёт вместе с содержимым, торчать из неё нечему, и прокрутка
 * работает над любой точкой экрана. «Резинка» выключена там, где ей и
 * место, — у html: оттуда это правило и передаётся окну.
 */
html {
  height: 100%;
  overscroll-behavior-y: none;      /* без «резинки» при прокрутке */
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  -webkit-text-size-adjust: 100%;   /* iOS не масштабирует текст сам */
  /* Цвет бумаги задан и здесь, на самом внешнем слое. Пока страница не
     нарисована, видно именно его: без этой строки iPhone при запуске
     показывал чёрный прямоугольник, и открытие выглядело так, будто
     приложение зависло. */
  background-color: var(--paper);
}

body {
  font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  /* Точечная сетка как на фотографии — рисуется градиентом, без картинки */
  background-image: radial-gradient(var(--dot) 1.15px, transparent 1.15px);
  background-size: 22px 22px;
  background-position: 0 0;
}

.app {
  /* Ровно в окно и ни пикселем больше: пока содержимого мало, прокручивать
     нечего и экран стоит на месте. Проценты тут больше не годятся — у body
     высота теперь по содержимому, и процент от неё считать не от чего.
     dvh — это высота окна без панелей браузера; старый Safari его не знает
     и возьмёт строку выше. */
  min-height: 100vh;
  min-height: 100dvh;
  /* Колонкой — чтобы экран внутри дотягивался до низа окна: жест «назад»
     ловится и в пустой области под коротким списком */
  display: flex;
  flex-direction: column;
  padding: max(12px, env(safe-area-inset-top)) 16px
           max(16px, env(safe-area-inset-bottom)) 16px;
  max-width: 720px;
  margin: 0 auto;
  /* Горизонталь отдана приложению на ВСЕЙ площади экрана, а не только
     внутри обёртки .page. Раньше в пустой области под коротким списком
     действовало значение по умолчанию: браузер считал движение началом
     прокрутки, присылал pointercancel — и жест «назад» обрывался. Именно
     поэтому он работал не везде. pinch-zoom оставляем, иначе пропадёт
     увеличение текста двумя пальцами. */
  touch-action: pan-y pinch-zoom;
}

/* В списке карточек два пальца означают «назад», а не масштаб.
   Увеличение там только мешает: экран едет вслед за руками, и если
   система заодно начнёт менять размер, движение выходит рваным.
   На остальных экранах увеличение двумя пальцами остаётся. */
.page.no-zoom { touch-action: pan-y; }

/* Полоска «готова новая версия».
   Приложение открывается из памяти устройства, поэтому свежая версия
   докачивается уже после запуска. Молчать об этом нельзя — иначе
   непонятно, применилось обновление или нет. */
.fresh-strip {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 10px;
  padding: 8px 10px 8px 14px;
  border-radius: var(--radius-m);
  background: rgba(0, 0, 0, .05);
  font-size: 14px;
}
.fresh-text { flex: 1; color: var(--ink-soft); }
.fresh-go {
  border: 0;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font: 600 14px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 9px 14px;
  min-height: 34px;
  cursor: pointer;
  flex: none;
}
.fresh-go:active { opacity: .75; }

/* ---------- Шапка ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  margin-bottom: 6px;
}
.topbar h1 {
  font: 700 30px/1.15 -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  flex: 1;
  letter-spacing: -.4px;
}
.topbar h1.small { font-size: 22px; }

.iconbtn {
  min-width: var(--tap);
  min-height: var(--tap);
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, .05);
  color: var(--ink);
  font-size: 19px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.iconbtn:active { background: rgba(0, 0, 0, .12); }
.iconbtn.ghost { background: transparent; }

/* Кнопка «свернуть или развернуть всё».
   Значок — две галочки, расходящиеся от середины: сверху вверх, снизу
   вниз. Знак этот привычен по спискам и папкам и читается сразу.

   Нарисован рамками, а не картинкой и не шрифтом: чёткий на любом
   экране, берёт цвет у кнопки и ничего не подгружает.

   Вид не меняется от нажатия — так и просили. Кнопка одна и делает
   одно: переключает. Что именно вышло, видно по самому экрану. */
.iconbtn.fold { color: var(--ink); }
.fold-mark {
  display: block;
  position: relative;
  width: 18px;
  height: 18px;
  pointer-events: none;      /* колесо и нажатие достаются кнопке */
}
.fold-mark::before,
.fold-mark::after {
  content: "";
  position: absolute;
  left: 50%;
  width: 9px;
  height: 9px;
  border: 1.7px solid currentColor;
  border-left-color: transparent;
  border-bottom-color: transparent;
  border-radius: 1px;
}
.fold-mark::before { top: 1px; transform: translateX(-50%) rotate(-45deg); }
.fold-mark::after { bottom: 1px; transform: translateX(-50%) rotate(135deg); }

/* Кнопка ссылки в ряду кнопок карточки.
   Такая же, как соседние: прозрачная, без тёмного кружка, только силуэт.
   Пока ссылки нет — бледная, будто набросана карандашом: место занято, а
   внимания не просит. Появилась ссылка — красная. */
.iconbtn.link { background: transparent; color: var(--ink-soft); opacity: .4; }
.iconbtn.link.on { color: var(--heart); opacity: 1; }

/* Звено цепи: две скруглённые петли под наклоном, с нахлёстом.
   Нарисовано рамками — ни картинок, ни шрифтовых символов. */
.link-mark {
  display: block;
  position: relative;
  width: 20px;
  height: 20px;
  pointer-events: none;
}
.link-mark::before,
.link-mark::after {
  content: "";
  position: absolute;
  top: 5.5px;
  width: 13px;
  height: 9px;
  border: 1.7px solid currentColor;
  border-radius: 999px;
  transform: rotate(-45deg);
}
.link-mark::before { left: 0; }
.link-mark::after { right: 0; }

/* Строка ссылки под рядом кнопок. В покое её нет вовсе. */
.link-row { display: none; }
.link-row.on { display: block; margin: 8px 2px 0; }

/* Одна строка и на телефоне, и на компьютере: слева «Удалить», в
   середине поле, справа «Открыть» и «ОК». Ничего не переносится вниз —
   раньше на узком экране кнопки сваливались под поле. Ширину отдаём
   полю: кнопки узкие и не сжимаются. */
.link-line {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 6px;
}
.link-input {
  flex: 1 1 auto;
  min-width: 0;
  border: 1px solid var(--hair);
  border-radius: 12px;
  padding: 10px 12px;
  background: var(--sheet);
  color: var(--ink);
  font-family: inherit;
  /* 16 px обязательны: при меньшем Safari на iPhone увеличивает страницу */
  font-size: 16px;
}
/* Обе кнопки — маленькие квадраты одного размера: слева убрать, справа
   перейти. Кнопки «ОК» здесь нет: адрес запоминается сам, как только
   становится похож на адрес, — нажимать было нечего. */
.link-line button {
  flex: none;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 1px solid var(--hair);
  border-radius: 12px;
  background: var(--sheet);
  color: var(--ink);
  font: 500 17px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.link-line .link-drop { color: var(--danger); }
.link-line .link-open { color: var(--ink); }
.link-warn { display: block; margin-top: 6px; font-size: 13px; color: var(--danger); }
.link-warn:empty { display: none; }

/* Сердечко: пустое — обычное, залитое — красное */
.iconbtn.heart { background: transparent; font-size: 22px; color: var(--ink-soft); }
.iconbtn.heart.on { color: var(--heart); }
/* Звёздочка — «в напоминания». Ведёт себя как сердечко: в покое тёмная,
   как все кнопки ряда, и загорается только когда отмечена. Цвет тёплый,
   а не красный: рядом с сердечком два одинаково красных значка читались
   бы как одно и то же, случайно нажатое дважды. */
.iconbtn.star { background: transparent; font-size: 21px; color: var(--ink-soft); }
.iconbtn.star.on { color: var(--star); }
.mini-heart { color: var(--heart); font-size: 16px; flex: none; }
.mini-audio { color: var(--ink-soft); font-size: 15px; flex: none; }
/* Метка «есть оборот» в строке карточки. Крупнее значка звука и
   заметно бледнее: это не действие и не отметка, а напоминание, что у
   карточки есть вторая сторона. */
.mini-side {
  flex: none;
  font-weight: 400;
  font-size: 15px;
  line-height: 1;
  color: var(--ink-soft);
  opacity: .45;
}

/* Кнопка записи.
   В покое — такая же тёмная и такого же размера, как сердечко и
   карандаш рядом: это просто одна из кнопок карточки, и выделяться ей
   незачем. Красной она становится только когда запись идёт — тем же
   способом, что и сердечко, которое загорается лишь у избранного. */
.iconbtn.rec {
  background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
  padding: 0;
}
.iconbtn.rec.on {
  color: var(--heart);
  background: rgba(226, 59, 59, .12);
  animation: pulse 1.1s infinite;
}
.rec-time {
  font-size: 13px;
  color: var(--heart);
  font-variant-numeric: tabular-nums;   /* цифры не прыгают по ширине */
  min-width: 34px;
}
@keyframes pulse { 50% { opacity: .5; } }

/* Пауза и стоп появляются рядом с кнопкой записи только во время записи */
.rec-box { display: flex; align-items: center; gap: 2px; }

/* Загрузить готовую запись — стрелка вниз рядом с кнопкой записи.
   Обёртка нужна из-за спрятанного поля выбора файла: класть его внутрь
   кнопки нельзя, а рядом в строке оно заняло бы место. */
.pick-box { display: flex; align-items: center; }
.iconbtn.ghost.pick { color: var(--ink-soft); font-size: 19px; }
.iconbtn.ghost.pick:disabled { opacity: .45; cursor: default; }
.iconbtn.rec-ctl {
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  min-width: 34px;
  min-height: var(--tap);
}
.iconbtn.rec-ctl:active { background: rgba(0, 0, 0, .10); }

/* Знак паузы всегда один и тот же — меняется только плотность.
   Идёт запись — приглушён; на паузе — наливается цветом и весом. */
.iconbtn.rec-ctl.recording { opacity: .38; font-weight: 400; }
.iconbtn.rec-ctl.paused {
  opacity: 1;
  font-weight: 800;
  color: var(--heart);
  transform: scale(1.12);
}
.iconbtn.rec-ctl { transition: opacity .18s ease, transform .18s ease; }

/* Строка избранного: слева нажимаемая зона, справа отдельное сердечко */
.mini-open {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: transparent;
  padding: 0;
  min-height: var(--tap);
  cursor: pointer;
  font: inherit;
  color: inherit;
  text-align: left;
  min-width: 0;
}
.mini-open:active { opacity: .6; }

/* Полоса записей внизу карточки.
 *
 * Раньше она лежала накладкой поверх карточки, а место под неё
 * освобождалось запасом снизу — одним числом на все случаи. С одной
 * записью это сходилось, с тремя перестало: полоса выросла втрое, а
 * запас остался прежним, и дорожки поехали по тексту.
 *
 * Теперь полоса занимает настоящее место в карточке: текст живёт над
 * ней и получает ровно то, что осталось. Сколько бы дорожек ни было,
 * закрыть текст они уже не могут — под ними просто нет места.
 * Наружу вылезает на 10 пикселей за поля текста: так дорожка идёт
 * от края до края карточки, как и была. */
.audio-bar {
  flex: none;
  margin: 12px -10px 0;
  /* Цвет карточки передаётся дорожкам дальше: строка едет поверх
     спрятанной кнопки «В карточку» и просвечивать не должна, а карточки
     бывают разного цвета. */
  background-color: inherit;
}
.audio-bar:empty { display: none; margin: 0; }

/* Дорожки записей, одна под другой. Их может быть до трёх, и каждая
   живёт сама по себе: свой проигрыватель, своя дозапись, своё
   удаление. */
/* Обёртка дорожки. Под строкой у правого края лежит кнопка «В карточку»
   и открывается, когда строку уводят влево. overflow прячет её в покое.
   Цвет наследуется от карточки: строка едет поверх кнопки и просвечивать
   не должна, а карточки бывают разного цвета. */
.track-slot {
  position: relative;
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-m);
  background-color: inherit;
}
.track-slot + .track-slot { margin-top: 8px; }
.track-row {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  background-color: inherit;
}
/* Номер слева. Появляется только когда записей больше одной: при
   единственной он ничего не сообщает.
   Он же и ручка: за номер дорожку тянут вверх или вниз, чтобы поменять
   порядок. Поэтому у него есть подложка — иначе непонятно, что за него
   можно взяться, — но тихая: командует здесь дорожка, а не номер.
   touch-action: none обязателен: этот жест ведём сами, и отдавать его
   браузеру под прокрутку страницы нельзя. */
.track-no {
  flex: none;
  width: 20px;
  min-height: 34px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: rgba(0, 0, 0, .07);
  text-align: center;
  font: inherit;
  font-size: 12px;
  color: #2B2408;
  opacity: .6;
  cursor: grab;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
.track-no:active { cursor: grabbing; background: rgba(0, 0, 0, .14); opacity: .9; }
/* Строку несут: она идёт поверх соседних и чуть отделяется тенью, чтобы
   было видно, что она оторвана от столбика. Пометка стоит на обёртке —
   при перестановке едет именно обёртка, вместе со скрытой кнопкой. */
.track-slot.moving { z-index: 2; }
.track-slot.moving .wave,
.track-slot.moving .audio-btn { box-shadow: 0 5px 12px rgba(0, 0, 0, .18); }
.track-slot.moving .track-no { background: rgba(0, 0, 0, .14); opacity: .9; }
.track-box { flex: 1; min-width: 0; }
/* Кнопки записи и удаления прижаты друг к другу и стоят парой у правого
   края: так дорожке достаётся вся оставшаяся ширина, а рука тянется к
   одному месту, а не к двум разным. */
.audio-row { display: flex; align-items: center; gap: 8px; }
.audio-side { display: flex; align-items: center; gap: 0; flex: none; }
.audio-btn {
  min-width: 40px;
  min-height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, .14);
  color: #2B2408;
  font-size: 15px;
  cursor: pointer;
  flex: none;
}
.audio-btn:active { background: rgba(0, 0, 0, .24); }
/* Время прослушивания — намеренно тихое: цифры не должны спорить
   с текстом аффирмации, они справочные */
.audio-label {
  display: block;
  text-align: center;
  margin-top: 6px;
  font-size: 13px;
  color: rgba(43, 36, 8, .5);
  font-variant-numeric: tabular-nums;   /* сотые не дёргают ширину */
  letter-spacing: .3px;
}

/* Дорожка звука — «сосуд», который наполняется.
   Цвет тот же, что у кружка кнопки play: rgba(0,0,0,.14) поверх карточки.
   Оба элемента затемняют карточку одинаково, поэтому дорожка и кнопка
   выглядят одним целым на любом цвете карточки — не только на жёлтой.
   Рамки нет намеренно: у кружка её тоже нет. */
.wave {
  position: relative;
  flex: 1;
  height: 34px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .14);
  overflow: hidden;
  cursor: pointer;
  touch-action: none;      /* дорожка перематывает, а не листает карточку */
  min-width: 0;
}
/* Пока играет, цвет самой дорожки не меняется: разницу показывает
   наполнение. Раньше дорожка ещё и светлела, и вместе с почти чёрной
   заливкой это выглядело как два разных элемента. */

/* Наполнение — та часть, что уже прозвучала. Ровно на 15% темнее
   дорожки: чёрный на .15 поверх дорожки даёт 0,85 от её яркости.
   Прежде здесь был плотный тёмно-серый #57534A — он читался как чёрная
   полоса и спорил с карточкой.
   Ширина задаётся из кода на каждом кадре, поэтому перехода нет —
   иначе заливка отставала бы от звука. */
.wave-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: rgba(0, 0, 0, .15);
  pointer-events: none;
}
/* Столбики лежат поверх заливки и не мешают ей: между ними видно фон */
.wave-bars {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 0 6px;
  pointer-events: none;
}
/* Столбик громкости. Ширина считается кодом от ширины дорожки, здесь
   только вид: скруглённые концы, чтобы тишина читалась как пунктир, а
   не как обрубленные палочки. */
.wave-bars i {
  flex: 1 1 2px;
  min-width: 1.5px;
  background: rgba(43, 36, 8, .38);
  border-radius: 999px;
  transition: background .1s linear;
}
/* На пройденной части столбики остаются тёмными, только чуть плотнее.
   Светлыми они были потому, что заливка была почти чёрной; теперь она
   светлая, и белые столбики на ней просто исчезли бы. */
.wave-bars i.played { background: rgba(43, 36, 8, .58); }
/* Край наполнения — тонкая тёмная черта: видно точное место.
   Не чистый чёрный: рядом со светлой заливкой он бил бы по глазам. */
/* Черта проигрывания. Прозрачность ставится кодом: пока запись не пошла,
   черты не видно — иначе она стояла бы у самого края и читалась как
   тёмная точка, будто там что-то есть. */
.wave-head {
  position: absolute;
  top: 3px;
  bottom: 3px;
  left: 0;
  width: 2px;
  margin-left: -1px;
  border-radius: 999px;
  background: rgba(43, 36, 8, .55);
  opacity: 0;
  transition: opacity .15s ease;
  pointer-events: none;
}
/* Дошли до конца — сосуд полон, край растворяется */
.wave.full .wave-head { opacity: 0; }

.audio-del {
  border: 0;
  background: transparent;
  color: rgba(43, 36, 8, .55);
  font-size: 15px;
  min-width: 28px;
  min-height: 30px;
  padding: 0;
  cursor: pointer;
  flex: none;
}

/* Дописать к записи. Стоит перед крестиком: удаление остаётся с краю,
   и палец не попадает по нему вместо продолжения.
   Точка красная — тот же знак, что и на главной кнопке записи, чтобы
   не пришлось догадываться, что делает эта кнопка. */
.audio-more {
  border: 0;
  background: transparent;
  /* Тот же приглушённый тёмный, что у кнопки play и у крестика.
     Красной точке здесь не место: рядом с текстом аффирмации она
     перетягивает взгляд на себя. */
  color: rgba(43, 36, 8, .55);
  font-size: 11px;          /* точка мельче крестика — она и тише по смыслу */
  min-width: 28px;
  min-height: 30px;
  border-radius: 50%;
  cursor: pointer;
  flex: none;
  transition: background .18s ease, color .18s ease;
}
.audio-more:active { background: rgba(0, 0, 0, .10); }
/* Идёт дозапись: знак меняется на «стоп» и наливается цветом.
   Пульсирует здесь только эта кнопка, поэтому пропустить работающую
   запись невозможно и без красного. */
.audio-more.on {
  color: #2B2408;
  font-size: 13px;
  background: rgba(0, 0, 0, .14);
  animation: pulse 1.1s infinite;
}
/* Пока пишем, слушать и удалять нечего */
.audio-btn:disabled, .audio-del:disabled { opacity: .35; cursor: default; }

/* Записей больше одной — строка становится ниже.
 *
 * Три полных дорожки заняли бы у текста половину карточки. Поэтому,
 * когда записей несколько, кружок, сосуд и подпись времени убавляются в
 * росте — примерно на четверть каждый. Длина дорожки не меняется:
 * сужать её незачем, дорога здесь именно высота.
 *
 * При единственной записи всё остаётся ровно как было: у того, что уже
 * записано на карточках, вид не должен меняться из-за появления новой
 * возможности, которой человек не пользуется.
 *
 * Правила стоят после основных, а не до: так видно, что это именно
 * поправка к готовому виду, а не отдельная его разновидность. */
.track-row.many .audio-btn { min-width: 34px; min-height: 34px; font-size: 13px; }
.track-row.many .wave { height: 26px; }
.track-row.many .audio-label {
  margin-top: 1px;
  font-size: 11px;
  line-height: 14px;
}
.track-row.many .audio-del,
.track-row.many .audio-more { min-height: 26px; }
.track-slot.many + .track-slot.many { margin-top: 4px; }

/* ---------- Разделы и колоды ---------- */
.section { margin: 22px 0 6px; }
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
}
.section-head h2 {
  font: 600 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--ink-soft);
  margin: 0;
}

/* Заголовок раздела — кнопка сворачивания на всю ширину.
   Прозрачный фон и border: 0 здесь обязательны: это настоящий <button>,
   и без них браузер рисует его своим серым прямоугольником — название
   раздела оказывается в рамке. */
.section-toggle {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  padding: 8px 0;
  min-height: var(--tap);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
}
.section-toggle:active { opacity: .6; }

/* Уголок сворачивания — маленький значок слева от названия. Повёрнут
   вниз, когда раздел раскрыт, и влево, когда свёрнут. */
.chev {
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1;
  transition: transform .18s ease;
  transform: rotate(0deg);
  flex: none;
}
.chev.closed { transform: rotate(-90deg); }
.section-count { color: var(--ink-soft); font-size: 13px; margin-left: auto; }
.section.collapsed { margin-bottom: 0; }

/* Список избранного в окне управления не должен вытеснять кнопки */
.card-list.scroll { max-height: 46vh; overflow-y: auto; }
.mini.row { cursor: default; }
.mini.row:active { background: var(--sheet); }

.deck-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 10px;
}
@media (max-width: 380px) { .deck-grid { grid-template-columns: 1fr; } }

/* Колода нарисована стопкой: два листа выглядывают из-под верхнего */
.deck {
  position: relative;
  border: 0;
  text-align: left;
  border-radius: var(--radius-m);
  padding: 16px 14px 14px;
  min-height: 104px;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
}
.deck::before,
.deck::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  border-radius: var(--radius-m);
  background-color: inherit;
  z-index: -1;
}
/* Затемнение — не фильтром, а слоем краски поверх того же цвета.
   filter заставляет Safari держать под каждый листок отдельный слой, а
   листков по два на колоду. При прокрутке длинного главного экрана это
   как раз та работа, из-за которой движение перестаёт быть гладким.
   Вид тот же: 8 % и 16 % темноты. */
.deck::before {
  bottom: -5px; height: 20px;
  background-image: linear-gradient(rgba(0, 0, 0, .08), rgba(0, 0, 0, .08));
}
.deck::after {
  left: 15px; right: 15px; bottom: -9px; height: 20px;
  background-image: linear-gradient(rgba(0, 0, 0, .16), rgba(0, 0, 0, .16));
}
.deck.single::before, .deck.single::after { display: none; }
.deck:active { transform: scale(.985); }

.deck-title {
  font: 600 17px/1.25 -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  word-break: break-word;
}
.deck-count { font-size: 13px; opacity: .85; margin-top: 8px; }

/* ---------- Оформление куска текста в карточке ----------
   Хранится не как разметка, а как отметки «с такого символа по такой».
   Здесь только вид: жирный и курсив классами, подчёркивание и
   зачёркивание — одним свойством из кода, потому что два отдельных
   правила перебили бы друг друга и вместе бы не показались. */
/* Кусок оформленного текста. Всё, что перечислено ниже, — защита от
   чужих правил: кусок обязан остаться в строке, того же размера и цвета,
   что и текст вокруг. Меняться ему позволено только начертанием. */
.mk {
  display: inline;
  font-size: inherit;
  line-height: inherit;
  color: inherit;
  margin: 0;
  padding: 0;
  text-underline-offset: 2px;
}
.mk-b { font-weight: 700; }
.mk-i { font-style: italic; }

/* Поле текста аффирмации. Не обычное поле ввода: в нём весь текст был бы
   одного вида, и показать жирным только выделенное слово нечем. Здесь
   область, где оформление рисуется теми же кусками, что и на карточке. */
.rich-input {
  display: block;
  width: 100%;
  min-height: 132px;
  max-height: 40vh;
  overflow-y: auto;
  padding: 12px 14px;
  border: 1px solid var(--hair);
  border-radius: var(--radius-m);
  background: var(--sheet);
  color: var(--ink);
  /* 16 px обязательны: при меньшем Safari на iPhone увеличивает страницу */
  font: 400 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
  white-space: pre-wrap;
  word-break: break-word;
  -webkit-user-select: text;
  user-select: text;
}
/* Поле названия — в одну строку. Растёт само, если текст длинный, но
   в покое занимает ровно строку: это заголовок, а не второй текст. */
.rich-input.one {
  min-height: 46px;
  font-size: 17px;
  font-weight: 600;
}
.rich-input:focus { outline: 2px solid var(--ink-soft); outline-offset: 1px; }
/* Пустое поле не должно схлопываться в полоску */
.rich-input:empty::before { content: ''; display: inline-block; }

/* Кнопки оформления. Стоят всегда, а не появляются по выделению: так
   сразу видно, что оформить текст вообще можно. */
.rich-bar { display: flex; gap: 8px; margin: 8px 2px 2px; }
.rich-btn {
  min-width: 48px;
  min-height: 40px;
  border: 1px solid var(--hair);
  border-radius: 10px;
  background: var(--sheet);
  color: var(--ink);
  font: 500 17px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  cursor: pointer;
}
.rich-btn:active { background: rgba(0, 0, 0, .06); }
/* Оформление, которое уже стоит на выделенном, видно по самой кнопке */
.rich-btn.on { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.rich-btn[aria-label="Жирный"] { font-weight: 800; }
.rich-btn[aria-label="Курсив"] { font-style: italic; }
.rich-btn[aria-label="Подчёркнутый"] { text-decoration: underline; }
.rich-btn[aria-label="Зачёркнутый"] { text-decoration: line-through; }

/* Вторая строка панели: выравнивание. Кнопки те же по размеру, что и
   буквы оформления, — рука тянется к одной высоте. */
.rich-bar-2 { margin-top: 8px; }
.rich-btn.align { display: inline-flex; align-items: center; justify-content: center; }

/* Значок выравнивания — четыре полоски, нарисованные градиентом по фону.
   Ни картинок, ни шрифтовых символов: те на разных устройствах разной
   ширины, и ряд из четырёх кнопок выходил бы неровным. Короткая полоска
   прижимается к своему краю — по ней и видно, что делает кнопка. */
.align-mark {
  display: block;
  width: 18px;
  height: 13px;
  pointer-events: none;
  background-image: linear-gradient(currentColor, currentColor),
                    linear-gradient(currentColor, currentColor),
                    linear-gradient(currentColor, currentColor),
                    linear-gradient(currentColor, currentColor);
  background-repeat: no-repeat;
  background-size: 100% 1.7px, 62% 1.7px, 100% 1.7px, 62% 1.7px;
  background-position: left 0, left 3.8px, left 7.6px, left 11.4px;
}
.align-center .align-mark {
  background-position: center 0, center 3.8px, center 7.6px, center 11.4px;
}
.align-right .align-mark {
  background-position: right 0, right 3.8px, right 7.6px, right 11.4px;
}
/* «По ширине»: полоски одинаковой длины, обе кромки ровные — текст
   занимает всю ширину. Это тот же значок, что в Pages и в других
   редакторах, и читается он сразу. */
.align-justify .align-mark {
  background-size: 100% 1.7px, 100% 1.7px, 100% 1.7px, 100% 1.7px;
  background-position: left 0, left 3.8px, left 7.6px, left 11.4px;
}

/* Выравнивание по ширине: откуда берутся дыры между словами и что с
   ними делать.
 *
 * Растянуть строку до обоих краёв браузер может только пробелами — сам
 * текст он не трогает. Насколько сильно придётся тянуть, зависит от
 * того, что не поместилось: если следующее слово длинное и разорвать
 * его нельзя, дыра будет во всю оставшуюся ширину. Именно так и вышло
 * на присланной фотографии: за первой строкой стояло слово из тридцати
 * букв без единого пробела, целиком оно в строку не влезало, а
 * разрывать его было запрещено — вот строку и раздуло.
 *
 * Две строки ниже это и снимают. Первая разрешает переносить слова по
 * слогам (язык страницы задан, переносы русские). Вторая разрешает
 * разорвать слово в любом месте, когда иначе никак, — длинные адреса и
 * наборы букв перестают распирать строку.
 *
 * Только для «по ширине»: остальным выравниваниям это не нужно, там
 * строку никто не растягивает и слова рвать незачем. */
.bigcard-text.just,
.rich-input.just {
  -webkit-hyphens: auto;
  hyphens: auto;
  overflow-wrap: anywhere;
}

/* Цвет текста. Кружки, а не круг с оттенками: на карточке всё должно
   остаться читаемым, а из круга легко достать блёклое или слепящее. */
.ink-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 2px 2px;
}
.ink-dot {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 1px solid var(--hair);
  cursor: pointer;
  padding: 0;
}
/* Выбранный обведён кольцом цвета чернил, а не заливкой: иначе не видно
   самого цвета, ради которого кружок и нажимают */
.ink-dot.on {
  box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--ink);
}

/* ---------- Список карточек внутри колоды ---------- */
.card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

/* Обёртка строки. Кнопка «В колоду» лежит под строкой у правого края и
   открывается, когда строка уезжает влево. overflow прячет её в покое:
   без него она торчала бы сбоку всегда. */
.card-row {
  position: relative;
  /* hidden заводит внутри область прокрутки, и колесо над строкой
     достаётся ей, а не странице. clip просто отрезает по краю и
     областью прокрутки не становится. Старый Safari clip не знает и
     возьмёт строку выше — вид от этого не меняется. */
  overflow: hidden;
  overflow: clip;
  border-radius: var(--radius-m);
}
.row-actions {
  position: absolute;
  top: 0;
  bottom: 0;
  right: 0;
  width: 96px;
  display: flex;
}
/* Вторая кнопка — у левого края. Строка уезжает вправо, и открывается
   удаление. Две стороны, два действия: рука их не перепутает. */
.row-actions.left { right: auto; left: 0; }
.row-move {
  flex: 1;
  border: 0;
  border-radius: 0;
  background: var(--ink-soft);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.2;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.row-move:active { background: var(--ink); }
.row-move-icon { font-size: 18px; line-height: 1; }
.row-move-text { font-size: 12px; letter-spacing: .2px; }

/* Удаление — красным. Единственное действие в списке, которое нельзя
   отменить, и выглядеть как остальные оно не должно. */
.row-kill {
  flex: 1;
  border: 0;
  border-radius: 0;
  background: var(--danger);
  color: #fff;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.2;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.row-kill:active { background: #9C2C20; }

/* Сама строка едет поверх кнопки. Фон обязателен и непрозрачен: сквозь
   строку кнопка просвечивать не должна. */
.card-row > .mini {
  position: relative;
  z-index: 1;
  width: 100%;
  /* will-change здесь тоже нет. Строк в колоде бывают десятки, и
     готовый слой на каждую — это десятки слоёв в списке, который
     человек прокручивает. Слой просит сам свайп, для одной строки и
     только пока она едет. */
}

/* ---------- Фотографии на карточке ----------
   Ряд миниатюр стоит на бумаге, над самой карточкой: снимки — про
   карточку, но не часть её текста, и лезть на него они не должны.
   Ряд едет вбок, поэтому снимков может быть сколько угодно: не
   поместились — прокрутил пальцем. */
/* Обёртка ряда: в ней едет каретка из трёх полос — предыдущей, текущей
   и следующей. Место под ряд держится, пока снимки есть хоть у одной из
   трёх карточек: иначе на подъезде соседней экран подпрыгивал бы. */
.shot-deck {
  position: relative;
  height: 0;
  overflow: hidden;
  overflow: clip;
}
.shot-deck.open { height: 58px; }
.shot-line {
  position: absolute;
  inset: 0;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
/* Соседние полосы стоят за краями экрана — их сдвиг ставит код */
.shot-line > .shot-strip {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
}
/* Соседние ряды неживые: пока карточка не встала на место, её
   снимки не трогают. Имя у класса своё, не общее «side»: тем
   помечены соседние карточки, и путать эти два не надо. */
.shot-strip.still { pointer-events: none; }

.shot-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
  padding: 2px 0;
  margin: 6px 0 2px;
  /* Ряд прокручивается сам, а карточку под ним листают вбок. Чтобы эти
     два движения не спорили, горизонталь здесь отдана ряду. */
  touch-action: pan-x;
  scrollbar-width: none;
}
.shot-strip::-webkit-scrollbar { display: none; }
.shot-strip:empty { display: none; }
.shot-cell {
  position: relative;
  flex: none;
  width: 46px;
  height: 46px;
  padding: 0;
  border: 0;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(0, 0, 0, .06);
  cursor: pointer;
  -webkit-touch-callout: none;   /* удержание — наше меню, а не системное */
  user-select: none;
  -webkit-user-select: none;
}
.shot-cell:active { opacity: .75; }
/* Снимок взят в руку: приподнялся и оторвался от ряда. Видно сразу, что
   дальше его можно нести вбок, а не просто держать. */
.shot-cell.took {
  box-shadow: 0 6px 16px rgba(0, 0, 0, .28);
  z-index: 2;
  opacity: 1;
}
/* Приподнимаем саму картинку, а не ячейку: сдвиг ячейки занят — им
   снимок несут вбок, и второй transform его бы затёр. */
.shot-cell.took .shot-thumb {
  transform: scale(1.12);
  transition: transform .12s ease-out;
}
.shot-cell.moving { z-index: 2; }
.shot-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Снимок на весь экран. Чёрный фон и ничего лишнего: смотреть так
   смотреть. Закрывается крестиком, нажатием мимо снимка и клавишей. */
.shot-view {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(0, 0, 0, .92);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
  /* Горизонталь забираем себе: по ней листают снимки. Всё остальное
     остаётся браузеру — увеличение двумя пальцами тут кстати. */
  touch-action: pan-y pinch-zoom;
}
/* Каретка со снимками: в ней три места — предыдущий, текущий и
   следующий. Двигается только она, а снимки внутри стоят неподвижно.
   Так же устроено перелистывание карточек в колоде, и это не совпадение:
   одно движение руки должно ощущаться одинаково везде. */
.shot-track {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
/* Каждое место стоит по центру экрана. Центрируется полями auto внутри
   растянутой рамки — так сдвиг из кода остаётся чисто горизонтальным и
   не спорит с центровкой. Соседние отодвинуты за края; в покое их не
   видно. */
.shot-track .shot-full {
  position: absolute;
  inset: 0;
  margin: auto;
  transform: translate3d(0, 0, 0);
}

.shot-full {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 6px;
  /* Снимок тянут вбок, чтобы перейти к следующему. Браузер норовит
     вместо этого начать своё перетаскивание картинки — на компьютере
     это выглядит как призрак снимка, уезжающий за курсором. */
  -webkit-user-drag: none;
  user-select: none;
  -webkit-user-select: none;
}
.shot-close {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: 12px;
  min-width: var(--tap);
  min-height: var(--tap);
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, .18);
  color: #fff;
  font-size: 19px;
  cursor: pointer;
}
.shot-count {
  position: absolute;
  bottom: max(14px, env(safe-area-inset-bottom));
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255, 255, 255, .7);
  font-size: 13px;
  pointer-events: none;
}

/* Строка настройки напоминаний: подпись слева, «меньше» и «больше»
   справа. Не поле ввода: цифру тут набирать нечего, её меняют шагами. */
.dial {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 8px 0;
}
.dial-name { flex: 1; font-size: 16px; }

/* Колода, в которую переносим. Список выбора — те же строки, но нажатие
   у них другое, поэтому и вид чуть иной: без номера слева. */
/* В списке строка показывает название, если оно есть. Чуть плотнее
   обычного текста: так видно, что это заголовок карточки. */
.mini-text.head { font-weight: 600; }

.mini.pick { cursor: pointer; }
.mini.pick .mini-num { color: var(--ink-soft); font-size: 13px; margin-left: auto; }
.mini.pick.full { opacity: .45; cursor: default; }

.mini {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--hair);
  background: var(--sheet);
  border-radius: var(--radius-m);
  padding: 12px 14px;
  min-height: var(--tap);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 16px;
  color: var(--ink);
}
.mini:active { background: #F7F6F3; }
.mini-swatch {
  width: 34px;
  height: 44px;
  border-radius: 6px;
  background: var(--card-yellow);
  border: 1px solid var(--card-yellow-edge);
  flex: none;
}
.mini-text {
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
  /* Здесь и пряталась пропавшая прокрутка в списке карточек.
     Текст обрезан двумя строками, и содержимого в этой рамке больше, чем
     видно. Для Safari это готовая область прокрутки: колесо над ней он
     отдаёт ей, а она обрезана и никуда не едет. Прокрутка «не работала
     над карточками» и оживала, стоило увести указатель на поля.
     Убираем текст из-под указателя: нажатие всё равно ловит кнопка
     строки, а колесо уходит странице, как и положено. */
  pointer-events: none;
}
.mini-num { color: var(--ink-soft); font-size: 14px; flex: none; }

/* ---------- Полноэкранная карточка ---------- */
.reader {
  position: fixed;
  inset: 0;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.15px, transparent 1.15px);
  background-size: 22px 22px;
  display: flex;
  flex-direction: column;
  z-index: 20;
  padding: max(8px, env(safe-area-inset-top)) 12px
           max(12px, env(safe-area-inset-bottom)) 12px;
  /* Соседние карточки стоят за краями экрана. clip, а не hidden: hidden
     заводит внутри область прокрутки, и браузер вынужден проверять её на
     каждом кадре хода — как раз то, от чего мы уходим. clip просто
     отрезает по краю. Старый Safari его не знает и молча пропустит: экран
     всё равно position:fixed, за пределы страницы соседки не вылезут. */
  overflow: clip;
}
.reader-bar { display: flex; align-items: center; gap: 8px; min-height: var(--tap); }
/* Пустое место в ряду кнопок: крестик слева, кнопки справа */
.reader-gap { flex: 1; }

/* Номер карточки — отдельной строкой, ровно по центру экрана и прямо
   над карточкой. Ширина во всю строку, поэтому середина текста совпадает
   с серединой карточки и на телефоне, и на компьютере. */
.reader-pos {
  display: block;
  width: 100%;
  text-align: center;
  color: var(--ink-soft);
  font-size: 14px;
  margin: 4px 0 8px;
}

.stage {
  flex: 1;
  position: relative;
  touch-action: pan-y;
}

/* Каретка: единственное, что двигается при перелистывании. Все три
   карточки лежат внутри и едут вместе с ней.
   will-change и translate3d просят браузер подготовить один слой заранее
   и дальше только сдвигать его. Раньше слоёв было три, и на телефоне их
   сведение на каждом кадре давало рывки. */
.track {
  position: absolute;
  inset: 0;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  /* Глубина для переворота карточки. Соседние карточки от неё не
     страдают: их сдвиг чисто горизонтальный, без поворота и без
     глубины, а такому перспектива ничего не меняет. Без неё поворот
     читался бы не как переворот бумажки, а как сжатие по ширине. */
  perspective: 1100px;
  -webkit-perspective: 1100px;
}

/* Карточка занимает 80% ширины и 80% доступной высоты — как просили.
   Все карточки, включая текущую, стоят по центру сцены абсолютно: так их
   геометрия совпадает точно и в момент подмены ничего не смещается. */
.bigcard {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 520px;
  height: 80%;
  border-radius: 10px;
  background-color: var(--card-yellow);
  border: 1px solid var(--card-yellow-edge);
  /* Карточку тянут пальцем — браузер не должен перехватывать жест
     под свою прокрутку, иначе перелистывание срабатывает через раз */
  touch-action: pan-y;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .16), 0 2px 4px rgba(0, 0, 0, .12);
  /* Столбиком: текст сверху, полоса записей под ним. Столбиком, а не в
     строку, именно из-за записей — теперь они занимают своё место, а не
     висят поверх текста. */
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 28px 24px;
  z-index: 1;              /* текущая карточка поверх соседних */
  /* Едва заметная волокнистость бумаги */
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
}
/* Название карточки — на самом верху, отдельной строкой.
 *
 * Крупное и того же цвета, что текст, без черты снизу: разделяет их
 * только воздух. Выравнивание и цвет у названия свои — их ставит код,
 * по тому, что выбрано в поле названия. Занимает столько строк, сколько
 * нужно; текст аффирмации от этого не двигается — он стоит в середине
 * того, что осталось.
 */
.bigcard-head {
  flex: none;
  font: 700 clamp(15px, 3.6vw, 19px)/1.25 -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #2B2408;
  letter-spacing: -.2px;
  word-break: break-word;
  white-space: pre-wrap;
  margin-bottom: 10px;
  user-select: text;
  -webkit-user-select: text;
}

/* Середина карточки — всё место, кроме полосы записей. Текст стоит в
   ней по центру; когда записей нет, это вся карточка, и выглядит она
   в точности как прежде.
   min-height: 0 обязателен: без него длинный текст растянул бы середину
   и выдавил полосу за нижний край карточки вместо того, чтобы
   прокручиваться внутри. */
/* Буква стороны: А — лицо, Б — оборот.
 *
 * Стоит в самом углу и намеренно бледная: отвечает на единственный
 * вопрос «где я сейчас» и не должна спорить ни с названием, ни с
 * текстом. Не жирная — жирная читалась бы как заголовок. Нажатия
 * пропускает сквозь себя: под ней край карточки, за который её тянут.
 */
.bigcard-side {
  position: absolute;
  top: 6px;
  left: 12px;
  font: 400 clamp(19px, 4.6vw, 26px)/1 -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  color: #2B2408;
  opacity: .26;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}

.bigcard-mid {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.bigcard-text {
  font: 500 clamp(20px, 5.4vw, 30px)/1.35 -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
  color: #2B2408;
  overflow-y: auto;
  max-height: 100%;
  width: 100%;
  word-break: break-word;
  white-space: pre-wrap;      /* переносы строк пользователя сохраняются */
}
/* С записями нижнее поле меньше: дорожки должны стоять низко, у самого
   края карточки, а не висеть посреди неё. Запаса под них больше нет —
   место они занимают сами. */
.bigcard:has(.audio-bar:not(:empty)) { padding-bottom: 14px; }
.bigcard:active { cursor: grabbing; }
.bigcard-text { user-select: text; -webkit-user-select: text; }

/* Соседняя карточка — та, что подъезжает при свайпе.
   Размеры и вид те же, что у текущей: в момент подмены они совпадают
   точно, поэтому переход незаметен. Стоит не под карточкой, а сбоку от
   неё, за краем экрана, — в покое её не видно.
   Собственный сдвиг ставится из кода один раз, при сборке экрана: дальше
   двигается только каретка, а карточки внутри неё стоят неподвижно. */
.bigcard.side {
  pointer-events: none;          /* палец её не хватает и текст не выделяет */
  z-index: 0;
  cursor: default;
}
.bigcard.side .bigcard-text { overflow: hidden; user-select: none; }
/* Запаса под плеер у соседней больше нет — и не нужно. Прежде полоса
   висела накладкой, и место под неё приходилось держать заранее, иначе
   в момент подмены текст прыгал вверх. Теперь полоса занимает место
   сама: как только соседке дорисуют дорожки, текст в ней встанет
   там же, где встанет и после подмены. */


.reader-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding-top: 10px;
}

/* ---------- Кнопки и формы ---------- */
.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  min-height: var(--tap);
  font: 600 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--ink);
  color: #fff;
  cursor: pointer;
}
.btn.sec { background: rgba(0, 0, 0, .06); color: var(--ink); }
.btn.danger { background: var(--danger); }
.btn:active { opacity: .85; }
/* Две главные кнопки обмена. Крупные и во всю ширину: между ними и
   выбирают, а стрелка сразу показывает направление. */
.btn.big {
  width: 100%;
  min-height: 52px;
  font-size: 17px;
  letter-spacing: .2px;
}
/* «Больше не напоминать» — действие есть, но голоса ему не надо */
.btn.quiet {
  width: 100%;
  margin-top: 10px;
  background: transparent;
  color: var(--ink-soft);
  font-weight: 400;
  font-size: 14px;
  min-height: 38px;
}

.add-tile {
  border: 1.5px dashed rgba(0, 0, 0, .22);
  background: transparent;
  border-radius: var(--radius-m);
  min-height: 104px;
  color: var(--ink-soft);
  font-family: inherit;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.3;
  cursor: pointer;
}
.add-tile:active { background: rgba(0, 0, 0, .04); }

.empty { color: var(--ink-soft); padding: 28px 6px; text-align: center; }

/* ---------- Модальное окно ---------- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .38);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 40;
}
.sheet {
  background: var(--sheet);
  width: 100%;
  max-width: 560px;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px max(18px, env(safe-area-inset-bottom));
}
@media (min-width: 560px) {
  .modal { align-items: center; }
  .sheet { border-radius: 20px; }
}
.sheet h3 { margin: 0 0 14px; font-size: 19px; }
.field { display: block; margin-bottom: 12px; }
/* Подпись поля. Только прямой потомок, через `>`.
   Без этого правило доставало и до кусков оформленного текста внутри
   поля: каждый выделенный кусок становился блоком, уезжал на отдельную
   строку и мельчал до размера подписи. На вид это читалось так, будто
   после нажатия «Ж» текст перепрыгнул в другое место. */
.field > span { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
/* Подпись у поля с оформлением. Само поле нарочно не внутри <label>:
   для редактируемой области метка перехватывает нажатие, выделение
   теряется, и системное меню «Шрифт» показывается погашенным. */
.field-label { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%;
  border: 1px solid var(--hair);
  border-radius: 12px;
  padding: 12px;
  /* Размер и семейство — двумя отдельными строками, и это важно.
     Сокращённая запись «font: 400 17px/1.4 inherit» недействительна:
     семейство шрифта в ней нельзя задать словом inherit, поэтому браузер
     отбрасывал правило целиком. Поле оставалось с системным размером
     около 13 px, а Safari увеличивает страницу на любом поле мельче
     16 px — отсюда и был скачок масштаба при открытии редактирования. */
  font-family: inherit;
  font-weight: 400;
  font-size: 17px;
  line-height: 1.4;
  background: #FCFCFB;
  color: var(--ink);
}
.field textarea { min-height: 132px; resize: vertical; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 38px; height: 38px; border-radius: 10px;
  border: 2px solid transparent; cursor: pointer;
}
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { flex: 1; }

/* Список за кнопкой «⋯». Строки крупные: сюда попадают редко, и каждая
   строка должна читаться с одного взгляда — что она сделает и зачем. */
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-item {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  text-align: left;
  border: 1px solid var(--hair);
  background: var(--paper);
  border-radius: 14px;
  padding: 12px 14px;
  min-height: var(--tap);
  cursor: pointer;
  font-family: inherit;
  color: var(--ink);
}
.menu-item:active { background: #F0EEE9; }
.menu-sign { font-size: 22px; line-height: 1; width: 24px; text-align: center; flex: none; }
.menu-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.menu-name { font-size: 16px; }
.menu-hint { font-size: 13px; color: var(--ink-soft); }

/* Пояснение под заголовком. Переводы строк в тексте сохраняются:
   в подсказках бывают шаги по пунктам, и слипаться в кашу они не
   должны. */
.hint {
  font-size: 13px;
  color: var(--ink-soft);
  margin: 10px 2px 0;
  white-space: pre-line;
}
/* Отметка сборки. Нарочно тихая: она справочная, но должна быть видна —
   по ней проверяют, одна ли версия открыта на телефоне и на компьютере. */
.build-stamp { text-align: center; opacity: .6; font-size: 12px; margin-top: 14px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Отметка о последней синхронизации — справочная, не должна тянуть внимание */
.sync-note {
  margin: -2px 2px 4px;
  font-size: 12px;
  color: var(--ink-soft);
  opacity: .8;
}

/* Обёртка экрана. Нужна для жеста «назад»: экран едет целиком.
   touch-action оставляет вертикальную прокрутку системе, а горизонталь
   отдаёт нам — иначе жест конфликтует со скроллом списка. */
.page {
  touch-action: pan-y pinch-zoom;
  /* Точка отсчёта для поднятого элемента — и это не мелочь.
   *
   * Плитка колоды, которую несут, выходит из потока (position: absolute)
   * и получает left/top, посчитанные от этой обёртки. Но отсчитываются
   * они не от той рамки, которую мы имели в виду, а от ближайшего
   * предка с собственным положением. Пока такого предка не было, за
   * точку отсчёта браузер брал сам холст страницы.
   *
   * На телефоне ошибка была почти незаметна: окно узкое, обёртка
   * занимает его целиком, и расхождение равнялось внутреннему отступу —
   * шестнадцати пикселям. На компьютере окно широкое, .app стоит по
   * середине с ограничением в 720 px, и от края экрана до обёртки
   * набегает несколько сотен пикселей. Ровно на столько плитка и
   * убегала влево в тот миг, когда её начинали тянуть.
   *
   * Одна эта строка делает обёртку точкой отсчёта — и плитка остаётся
   * там, где её взяли, при любой ширине окна и любой прокрутке.
   * Слоя на видеоядре relative не создаёт, прокрутки не касается. */
  position: relative;
  /* Обёртка тянется до низа окна: жест ловится и в пустой области под
     списком, и экран уезжает целиком, а не только та часть, где текст.
     Растягивает её колонка выше — .app; проценты для этого больше не
     нужны, а с ними обёртка ещё и норовила стать выше окна. */
  flex: 1 0 auto;
  /* Ни transform, ни will-change в покое здесь нет — и это важно.
     Экран длиннее окна, и постоянный слой во всю его высоту Safari
     держит на видеоядре всё время. Прокрутка колесом мыши по такому
     слою на компьютере просто переставала работать. Сдвиг и подготовку
     слоя ставит сам жест, на те доли секунды, пока экран едет. */
}

/* Блок синхронизации: кнопка и под ней пояснение, куда идут данные */
.sync-row { margin: 14px 0; }
.sync-row .btn { width: 100%; }
.sync-row .hint { margin: 6px 2px 0; }

/* Результат синхронизации. Раньше это была мелкая серая строчка, и её
   попросту не замечали — человек не понимал, сработало или нет. */
.sync-status { margin: 12px 0; }
.sync-status:empty { display: none; }
.sync-status > div {
  font-size: 16px;
  line-height: 1.5;
  white-space: pre-line;
  padding: 2px 0;
}
.sync-status.ok {
  background: #EFF6EF;
  border: 1px solid #CBE3CB;
  border-radius: 12px;
  padding: 12px 14px;
}
.sync-status.bad {
  background: #FBEFEE;
  border: 1px solid #EDC9C5;
  border-radius: 12px;
  padding: 12px 14px;
  color: #8A2A20;
}
.sync-status.wait { color: var(--ink-soft); padding: 4px 2px; }

/* Запасной способ загрузки, если окно выбора файла не даёт нажать файл */
.fallback { margin-top: 14px; border-top: 1px solid var(--hair); padding-top: 10px; }
.fallback summary {
  font-size: 14px;
  color: var(--ink-soft);
  cursor: pointer;
  min-height: 32px;
  display: flex;
  align-items: center;
}
.paste-box {
  width: 100%;
  font: 400 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  border: 1px solid var(--hair);
  border-radius: var(--radius-m);
  padding: 10px 12px;
  background: var(--sheet);
  color: var(--ink);
  resize: vertical;
  margin-bottom: 10px;
}

/* ---------- Перенос удержанием ----------
   Раздел блока стоит в самом конце файла намеренно. Правила ниже должны
   перебивать обычный вид элементов, а у .lifted и .deck одинаковый вес:
   при прежнем порядке `position: relative` у плитки колоды побеждал, и
   поднятая плитка оставалась в потоке. Тогда left и top отсчитывались не
   от страницы, а от её собственного места в сетке — и плитка прыгала
   из-под пальца вниз ровно на своё смещение. */

/* За заголовок раздела, за плитку колоды и за строку карточки берут
   долгим нажатием. Долгое нажатие в Safari по умолчанию вызывает своё
   меню и выделение текста — здесь это только мешает. */
.section-head, .deck, .mini, .card-row {
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}

/* Поднятый элемент. Выходит из потока и едет за пальцем: сдвиг ставится
   из кода, здесь только вид. Тень заметно глубже обычной — по ней и
   понятно, что элемент оторван от страницы и его несут.
   Селектор с двумя классами взят ради веса: он обязан победить
   `position: relative` у .deck, иначе плитка не оторвётся от сетки. */
.section.lifted, .deck.lifted, .card-row.lifted {
  position: absolute;
  z-index: 30;
  margin: 0;
  box-shadow: 0 16px 34px rgba(0, 0, 0, .22), 0 4px 10px rgba(0, 0, 0, .14);
  will-change: transform;
  cursor: grabbing;
}
/* Заголовок раздела сам по себе прозрачный — под ним надо показать
   бумагу, иначе поднятый раздел просвечивал бы насквозь */
.section.lifted {
  background-color: var(--paper);
  border-radius: var(--radius-m);
  padding: 4px 10px;
}
/* Сдвиг поднятой плитки ведёт код, поэтому обычное «вдавливание»
   нажатием тут только мешало бы */
.deck.lifted:active { transform: none; }
/* Поднятая строка списка карточек: она белая и на бумаге почти теряется,
   поэтому обводку делаем чуть заметнее обычной */
.card-row.lifted > .mini { border-color: rgba(0, 0, 0, .16); }

/* Пустое место, куда элемент встанет, если отпустить. Пунктир — тот же,
   что у плитки «+ Колода»: рука уже знает, что это место под что-то. */
.drop-slot {
  border: 1.5px dashed rgba(0, 0, 0, .22);
  border-radius: var(--radius-m);
  background: rgba(0, 0, 0, .03);
  box-sizing: border-box;
}
/* Ячейка на месте раздела повторяет и его внешние отступы: иначе
   страница подпрыгнула бы на их высоту в момент подъёма */
.drop-slot.as-section { margin: 22px 0 6px; }
/* В списке карточек расстояние между строками задаёт gap самого списка,
   поэтому ячейке свои отступы не нужны — она просто занимает строку */
.drop-slot.as-card { margin: 0; }
/* В свёрнутом разделе ячейка появляется под шапкой — ей нужен отступ */
.section.movable > .drop-slot { margin-top: 10px; min-height: 44px; }

/* Раздел, в который колода попадёт. Подсветка мягкая: она подсказывает,
   а не кричит. */
.drop-into { border-radius: var(--radius-m); }
.drop-into > .section-head h2,
.drop-into > .section-head .chev { color: var(--ink); }


/* ------------------------------------------------------------------
   Полоска записи внизу экрана.

   Появляется, когда человек ушёл с карточки, а запись играет дальше.
   Внутри — та самая дорожка, что играла в карточке: не копия и не
   картинка, а она сама, переставленная сюда вместе со всеми своими
   обработчиками. Поэтому кнопка, волна и перемотка работают здесь
   ровно так же.

   Стоит у нижнего края и не уезжает при прокрутке: на телефоне туда
   палец дотягивается легче всего. Отступ снизу — под домашнюю черту
   iPhone, иначе она перечёркивала бы дорожку.
   ------------------------------------------------------------------ */
.mini-play {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;                 /* выше страницы, но ниже окон правки */
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: rgba(250, 249, 246, .96);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid rgba(0, 0, 0, .10);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, .07);
}

/* Верхняя строка: откуда играет и крестик */
.mini-play-top {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 2px;
}

/* Начало текста карточки. Нажатие возвращает туда, откуда играет. */
.mini-play-open {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 0;
  padding: 4px 2px;
  margin: 0;
  font: 400 13px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
  color: var(--ink-soft);
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mini-play-note { flex: none; opacity: .7; }
.mini-play-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.mini-play-open:active .mini-play-text { opacity: .55; }

.mini-play-close {
  flex: none;
  min-width: 32px;
  min-height: 32px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.mini-play-close:active { background: rgba(0, 0, 0, .07); }

/* Дозапись и удаление в полоске не показываем: здесь слушают, а не
   правят. Ошибиться и стереть запись, промахнувшись мимо паузы, было бы
   слишком дорого. */
.mini-play .audio-side { display: none; }
.mini-play .track-box { flex: 1; min-width: 0; }
.mini-play .audio-label { font-size: 11px; }

/* Место под полоску, чтобы она не накрывала последнюю строку списка и
   кнопки внизу читалки. */
.app.with-mini { padding-bottom: 96px; }


/* ------------------------------------------------------------------
   Плейлист: звёздочка на карточке, окно выбора записей, экран списка.
   ------------------------------------------------------------------ */

/* Звёздочка «взять голос в плейлист».
   Под значком — номера взятых записей маленькими цифрами: по ним видно,
   какая именно запись карточки стоит в очереди, а не только то, что
   что-то стоит. Место под цифры держим всегда, даже пустым, иначе
   кнопка прыгала бы по высоте в тот миг, когда запись берут. */
/* В покое — тёмная, как все кнопки ряда; загорается только когда запись
   взята в очередь. Размер и место те же, что у сердечка слева и
   карандаша справа: закрашивание не должно двигать её с места. */
.iconbtn.liststar {
  position: relative;
  background: transparent;
  font-size: 21px;
  color: var(--ink-soft);
}
.iconbtn.liststar.on { color: var(--star); }

/* Номера взятых записей — только когда записей на стороне несколько.
   Лежат ПОВЕРХ кнопки, а не в её потоке: сама звёздочка от них не
   сдвигается и не мельчает. У единственной записи их нет вовсе — цифра
   «1» там ничего не сообщает. */
.liststar-nums {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 2px;
  text-align: center;
  pointer-events: none;
  font: 600 9px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  letter-spacing: .5px;
  color: var(--star);
}
/* Звёздочку с цифрами не двигаем вовсе: она остаётся ровно по центру
   кнопки, как и без них. Цифры помещаются ниже её лучей сами — значок
   не занимает всю высоту строки. Метка нужна только чтобы отличить это
   состояние в разметке. */
.iconbtn.liststar.numbered { line-height: 1; }

/* Окно «какие записи взять» — когда их на карточке больше одной */
.pick-tracks { display: flex; flex-direction: column; gap: 8px; margin: 4px 0 12px; }
.pick-track {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: var(--tap);
  padding: 8px 12px;
  border: 1px solid var(--hair);
  border-radius: var(--radius-m);
  background: var(--sheet);
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.pick-track.on { border-color: var(--star); background: rgba(217, 147, 11, .08); }
.pick-mark { flex: none; font-size: 17px; color: var(--star); }
.pick-track-no { flex: 1; }
.pick-track-len { flex: none; font-size: 13px; color: var(--ink-soft); }

/* Экран плейлиста. Строка та же, что в колоде, но под текстом — вторая
   строчка помельче: какая это запись, сколько длится, играет ли. */
.list-count { font-size: 13px; color: var(--ink-soft); flex: none; }
.list-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.list-sub { font-size: 12px; color: var(--ink-soft); }
.mini.playing { box-shadow: 0 0 0 2px var(--star), 0 1px 2px rgba(0, 0, 0, .05); }

/* Кнопка плейлиста в шапке главного экрана и в полоске внизу */
.iconbtn.listbtn { color: var(--star); }

.mini-play-list,
.mini-play-step {
  flex: none;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  font: inherit;
}
.mini-play-list {
  min-width: 32px;
  min-height: 32px;
  font-size: 14px;
  color: var(--star);
  background: rgba(217, 147, 11, .14);
}
.mini-play-list:active { background: rgba(217, 147, 11, .26); }

/* Стрелки по краям живой дорожки: предыдущая и следующая запись очереди.
   Гаснут, когда шагать некуда, — и тогда просто ничего не делают. */
/* Стрелки равняются по ВЕРХУ, а не по середине.
   Причина: рядом с ними не одна кнопка, а вся дорожка целиком — ряд с
   кнопкой и волной, а под ним ещё строка времени. По середине такой
   стопки стрелки уезжали вниз и вставали ниже кнопки проигрывания.
   Верх у ряда с кнопкой и у стрелок общий, высота одна и та же (40 px),
   поэтому по верху они встают ровно в одну линию с ней. */
.mini-play-line { display: flex; align-items: flex-start; gap: 8px; }
/* Кружок ровно такой же, как у кнопки проигрывания рядом: три круглые
   кнопки в одну линию читаются как один набор, а не как «кнопка и два
   значка по краям». */
.mini-play-step {
  min-width: 40px;
  min-height: 40px;
  border-radius: 50%;
  background: rgba(0, 0, 0, .14);
  color: #2B2408;
  font-size: 17px;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.mini-play-step:active { background: rgba(0, 0, 0, .22); }
.mini-play-step.off { opacity: .28; cursor: default; }
</style>
</head>
<body>
<main id="app" class="app"></main>
<script>/* СОБРАННЫЙ ФАЙЛ. Правки здесь пропадут при следующей сборке.
 * Код лежит в src/ — правьте там и запускайте python3 build.py
 * Что в какой части: КАРТА-ПРОЕКТА.md */
/* ─── 00-open.js ───────────────────────────────────────────────────────
 * Шапка файла и открытие общей области видимости
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

/* Аффирмации — логика приложения.
 *
 * ПРИНЦИПЫ БЕЗОПАСНОСТИ, заложенные в код:
 *
 * 1. Сети нет вообще. Ни fetch, ни XMLHttpRequest, ни WebSocket не
 *    вызываются; в index.html политика CSP запрещает их на уровне браузера
 *    (connect-src 'none'). Данные физически не могут утечь.
 * 2. Текст пользователя НИКОГДА не попадает в innerHTML. Только
 *    textContent и createElement. Это закрывает XSS: даже если вставить
 *    в карточку <img onerror=...>, это останется видимым текстом.
 * 3. Ничего не выполняется динамически: ни eval, ни new Function,
 *    ни строковых обработчиков в разметке.
 * 4. Всё, что читается из хранилища, проходит проверку типов и длин.
 *    Испорченный или подменённый JSON не свалит приложение и не пролезет
 *    в интерфейс неожиданным типом.
 * 5. Импорт резервной копии проходит ту же проверку, что и хранилище.
 */
'use strict';

(function () {
/* ─── 01-config.js ─────────────────────────────────────────────────────
 * Ключ хранилища, отметка сборки, пределы, цвета
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  const STORE_KEY = 'affirmations.v1';
  // Отметка сборки. Подставляется при сборке файла; в версии для
  // разработки так и остаётся с решётками. Нужна, чтобы на каждом
  // устройстве можно было своими глазами убедиться, какая версия
  // открыта: иначе «на телефоне работает, на компьютере нет» проверить
  // нечем — а чаще всего это просто старый файл на одном из них.
  const BUILD = '13.08.2026, 13:35';
  const buildLabel = () => (BUILD.indexOf('#') >= 0
    ? 'версия для разработки' : 'версия от ' + BUILD);

  // Ограничения длины: защита и от случайной вставки книги, и от попытки
  // раздуть хранилище до отказа
  const LIMITS = {
    sectionName: 60,
    deckName: 60,
    cardText: 2000,
    cardHead: 200,       // название карточки: строка, а не второй текст
    sections: 50,
    decksPerSection: 100,
    cardsPerDeck: 500,
  };

  // Цвета плиток колод
  const COLORS = ['#D9534F', '#7E8A6E', '#E8974A', '#8C93E0',
                  '#7FBF7F', '#5E86C7', '#B87FBF', '#4F9E9E'];

  // Цвета карточки. Все восемь одинаково насыщенные: прежние бледные
  // оттенки выглядели полупрозрачными рядом с жёлтым, и казалось, будто
  // они недоступны. Тёмный текст на каждом из них держит контраст не
  // ниже 5,7 : 1 — это выше требования 4,5 : 1.
  const CARD_COLORS = ['#E6C84C', '#F0A93C', '#EE8172', '#6FB0E3',
                       '#6FC58C', '#AE72E0', '#5FC7C0', '#EE76AC'];

  // Бледная палитра прежних версий. В выборе её больше нет, но карточки,
  // покрашенные раньше, должны сохранить свой цвет: без этого списка
  // проверка данных сочла бы цвет чужим и перекрасила бы всё в жёлтый.
  const LEGACY_COLORS = ['#F2E6C9', '#F3C9C0', '#CFE0EE', '#CFE6D2',
                         '#E8D7EE', '#FFFDF6', '#DCD6C8'];
  const KNOWN_COLORS = CARD_COLORS.concat(LEGACY_COLORS);

  const CARD_EDGE = {
    '#E6C84C': '#C5AC41', '#F0A93C': '#CE9133', '#EE8172': '#CC6E62',
    '#6FB0E3': '#5F97C3', '#6FC58C': '#5FA978', '#AE72E0': '#9562C0',
    '#5FC7C0': '#51ABA5', '#EE76AC': '#CC6593',
    // прежние бледные
    '#F2E6C9': '#DFD0AF', '#F3C9C0': '#DFAFA6', '#CFE0EE': '#B2C9DA',
    '#CFE6D2': '#B2D0B6', '#E8D7EE': '#CDB8D6', '#FFFDF6': '#E6E2D6',
    '#DCD6C8': '#C4BCA9',
  };

  // ------------------------------------------------------------------
  // Хранилище
  // ------------------------------------------------------------------
  function uid() {
    // crypto.randomUUID есть в Safari 15.4+; запасной путь — тоже из
    // криптографического генератора, а не из Math.random
    if (self.crypto && typeof self.crypto.randomUUID === 'function') {
      return self.crypto.randomUUID();
    }
    const a = new Uint8Array(16);
    self.crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  const PEAK_COUNT = 190;   // столько столбиков рисуем в дорожке

  // Сколько кусков можно склеить в одну запись на карточке.
  //
  // Запись, к которой дописали продолжение, хранится не одним файлом,
  // а несколькими. Склеить их в один нельзя: браузер отдаёт сжатый
  // звук (webm или mp4), и два таких куска, положенные подряд, не
  // проигрываются — заголовок в начале описывает только первый.
  // Раскодировать и пересобрать тоже не выход: несжатый звук весит
  // в десятки раз больше и не пролезает ни в хранилище, ни в файл
  // обмена. Поэтому куски лежат порознь, а приложение показывает и
  // проигрывает их как одну запись.
  // Полоса у левого края экрана, отданная жесту «назад».
  //
  // Внутри неё одно движение вправо возвращает на главный экран — где
  // бы палец ни начинал по высоте. Дальше от края то же движение по
  // строке карточки открывает удаление. Ширина взята как у системного
  // жеста iPhone: рука попадает не глядя, а обычные нажатия по списку
  // не задевает — карточки начинаются заметно правее.
  const EDGE_BACK = 28;

  // Сколько надо провести двумя пальцами по трекпаду, чтобы вернуться.
  //
  // Больше, чем пальцем по экрану, и намеренно. Трекпад отдаёт движение
  // мелкими порциями, они складываются быстро, а случайное горизонтальное
  // движение при обычной прокрутке — обычное дело. С коротким порогом
  // приложение выбрасывало бы из колоды само по себе.
  const PAD_BACK = 90;

/* ─── 02-trackpad-lock.js ──────────────────────────────────────────────
 * Трекпад: один жест — одно действие, замок против инерции
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Один жест по трекпаду — одно действие. Замок против инерции.
  //
  // Здесь и была ошибка «одним свайпом перескакиваю через карточку».
  // У трекпада нет конца жеста: пальцы уже подняты, а macOS ещё секунду
  // досылает затухающую прокрутку — «инерцию». Приложение считало её
  // новым движением, набирало порог второй раз и листало ещё раз.
  //
  // Пауза после срабатывания не помогала: она жила внутри читалки, а
  // читалка через треть секунды перерисовывается на новую карточку —
  // вместе с ней пауза начиналась с нуля, ровно посреди инерции.
  // Поэтому замок вынесен сюда, наружу: перерисовка его не трогает.
  //
  // Снимаем замок не по часам, а по тишине: пока события идут, жест
  // считается тем же самым. Сколько там длится инерция — неважно.
  const PAD_QUIET = 260;      // тишина, после которой жест считается новым

  // Сколько замок держит намертво, что бы ни пришло.
  //
  // Порог набирается в середине движения — пальцы ещё идут по трекпаду и
  // шлют события дальше. Поток у них рваный: сила скачет от нуля до
  // десятков и обратно, это нормальная работа сенсора. Любая попытка
  // распознать «новый свайп» по такому скачку срабатывает прямо здесь, на
  // хвосте того же самого движения, — и карточка перелистывается второй
  // раз. Отсюда и было «одним свайпом перескакиваю через карточку».
  //
  // Поэтому первую треть секунды после срабатывания не слушаем вообще
  // ничего. Двух отдельных свайпов быстрее человек не делает.
  const PAD_HOLD = 320;

  // Дальше замок снимается сам, когда поток сперва заметно ослабнет, а
  // потом снова наберёт силу: инерция только затухает, а рука, легшая на
  // трекпад снова, силу прибавляет. Смотрим не на отдельные события, а на
  // сглаженную силу — иначе одиночный выброс сойдёт за новое движение.
  // Насколько горизонталь должна перевешивать вертикаль, чтобы движение
  // считалось нашим.
  //
  // Просто «больше» тут мало. У мыши с наклоняемым колесом и у Magic
  // Mouse при обычной прокрутке вбок постоянно набегают единицы, а то и
  // десятки. По правилу «больше» приложение забирало такие события себе
  // и гасило их — человек крутит колесо, а страница стоит.
  const PAD_SIDE = 1.4;

  /**
   * Горизонтальный сдвиг события — но только если движение ЯВНО
   * горизонтальное. Иначе ноль: это обычная прокрутка, и трогать её
   * нельзя ни на одном экране.
   */
  function padSide(ev) {
    const dx = (ev && ev.deltaX) || 0;
    const ax = Math.abs(dx), ay = Math.abs((ev && ev.deltaY) || 0);
    if (ax < 1 || ax < ay * PAD_SIDE) return 0;
    return dx;
  }

  const PAD_SMOOTH = 0.3;     // вес нового события в сглаженной силе
  const PAD_FADE = 0.25;      // во столько раз поток должен ослабнуть
  const PAD_FADE_MIN = 6;     // либо просто стать слабее этого
  const PAD_RISE = 3;         // и во столько раз потом вырасти
  const PAD_RISE_MIN = 5;     // слабее этого толчком не считаем вовсе

  let padHeld = false;        // жест уже сработал, ждём тишины
  let padHeldTimer = null;
  let padSince = 0;           // когда сработал
  let padAvg = 0;             // сглаженная сила потока
  let padTop = 0;             // самая большая сглаженная сила
  let padLow = 0;             // самая маленькая после ослабления
  let padFaded = false;       // поток уже заметно ослаб

  /** Поток ещё идёт — отодвигаем снятие замка. */
  function padAlive() {
    if (padHeldTimer) clearTimeout(padHeldTimer);
    padHeldTimer = setTimeout(padFree, PAD_QUIET);
  }

  /** Снять замок: жест окончательно закончился. */
  function padFree() {
    if (padHeldTimer) { clearTimeout(padHeldTimer); padHeldTimer = null; }
    padHeld = false; padAvg = 0; padTop = 0; padLow = 0; padFaded = false;
  }

  /** Замок после сработавшего жеста: до конца потока больше ничего. */
  function padLock(force) {
    padHeld = true;
    padSince = Date.now();
    padAvg = force || 0;
    padTop = padAvg;
    padLow = padAvg;
    padFaded = false;
    padAlive();
  }

  /**
   * Относится ли это событие к уже сработавшему жесту.
   *
   * Возвращает true, пока идёт тот же самый жест: и остаток движения
   * пальцами, и вся инерция после него.
   */
  function padBlocks(force) {
    if (!padHeld) return false;
    padAvg = padAvg * (1 - PAD_SMOOTH) + force * PAD_SMOOTH;
    if (padAvg > padTop) padTop = padAvg;
    // Первую треть секунды не рассуждаем вовсе: там пальцы ещё идут
    if (Date.now() - padSince >= PAD_HOLD) {
      if (!padFaded) {
        if (padAvg <= Math.max(padTop * PAD_FADE, PAD_FADE_MIN)) {
          padFaded = true; padLow = padAvg;
        }
      } else if (padAvg < padLow) {
        padLow = padAvg;                          // инерция всё ещё гаснет
      } else if (padAvg >= Math.max(padLow * PAD_RISE, PAD_RISE_MIN)) {
        padFree();                                // а это уже новый свайп
        return false;
      }
    }
    padAlive();
    return true;
  }

  // Отдельного сторожа на документе больше нет — и не будет.
  //
  // Он гасил хвост инерции, чтобы Safari не увёл из приложения назад по
  // своей истории. Но ради этого приходилось держать на документе
  // обработчик, способный отменять события, а такой обработчик ломает
