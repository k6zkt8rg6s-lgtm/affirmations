        offs.length = 0;
        total = 0;
        pieces.forEach((p) => { offs.push(total); total += p.len; });
        ready = true;
        return true;
      });
    }

    function stopAll() {
      turn++;
      sources.forEach((s) => { try { s.stop(); } catch (e) { /* уже */ } });
      sources = [];
    }

    /**
     * Выложить куски начиная с секунды t. Каждый следующий встаёт ровно
     * туда, где кончился предыдущий, — зазору взяться неоткуда.
     */
    function layOut(t) {
      const mine = ++turn;
      const lead = 0.06;                 // движку нужно чуть-чуть форы
      const base = ctx.currentTime + lead;
      anchor = base;
      pos = Math.max(0, Math.min(t, total));

      let first = 0;
      while (first + 1 < pieces.length && pos >= offs[first + 1]) first++;

      for (let i = first; i < pieces.length; i++) {
        const p = pieces[i];
        // Сколько этого куска пропускаем. Пропуск бывает только у того
        // куска, на который пришлась точка старта; все следующие идут
        // с самого начала и встают вплотную к предыдущему.
        const off = (i === first) ? Math.max(0, pos - offs[i]) : 0;
        const when = base + Math.max(0, offs[i] + off - pos);
        const play = p.len - off;
        if (play <= 0.001) continue;

        let src, gain;
        try {
          src = ctx.createBufferSource();
          gain = ctx.createGain();
        } catch (e) { return false; }
        src.buffer = p.buf;
        src.connect(gain);
        gain.connect(ctx.destination);

        // Короткое сглаживание на самих стыках. Даже после срезки
        // тишины начало новой записи может дать щелчок: микрофон
        // включается не бесшумно. Восемь тысячных секунды на слух не
        // заметны, а щелчок съедают.
        const till = when + play;
        const joinIn = i > first || off > 0.001 ? true : false;
        try {
          gain.gain.setValueAtTime(joinIn ? 0 : 1, when);
          if (joinIn) gain.gain.linearRampToValueAtTime(1, when + JOIN_FADE);
          if (i < pieces.length - 1) {
            gain.gain.setValueAtTime(1, Math.max(when + JOIN_FADE, till - JOIN_FADE));
            gain.gain.linearRampToValueAtTime(0, till);
          }
        } catch (e) { /* без сглаживания тоже сойдёт */ }

        try { src.start(when, p.from + off, play); }
        catch (e) { return false; }

        if (i === pieces.length - 1) {
          src.onended = () => {
            if (mine !== turn) return;   // это отголосок прежнего захода
            running = false;
            pos = total;
            if (hooks.end) hooks.end();
          };
        }
        sources.push(src);
      }
      running = true;
      return true;
    }

    const api = {
      // Разобрать звук можно только после нажатия: до него движок спит
      start(from) {
        if (!engine()) {
          if (hooks.fail) hooks.fail();
          return Promise.resolve(false);
        }
        const wake = (ctx.state === 'suspended' && ctx.resume)
          ? ctx.resume().catch(() => {}) : Promise.resolve();
        return wake
          .then(() => (ready ? true : prepare()))
          .then(() => {
            stopAll();
            return layOut(typeof from === 'number' ? from : pos);
          })
          .catch(() => { if (hooks.fail) hooks.fail(); return false; });
      },
      pause() {
        if (!running) return;
        pos = api.time();
        stopAll();
        running = false;
      },
      seek(t) {
        pos = Math.max(0, Math.min(t, total || 0));
        if (running) { stopAll(); layOut(pos); }
      },
      time() {
        if (!running || !ctx) return pos;
        // Время берём у самого движка. Это его собственные часы, они
        // идут вместе со звуком и не зависят ни от кадров отрисовки,
        // ни от того, какой кусок сейчас звучит, — потому ползунок и
        // едет ровно через все стыки.
        const gone = ctx.currentTime - anchor;
        return Math.max(pos, Math.min(total, pos + Math.max(0, gone)));
      },
      total() { return total; },
      playing() { return running; },
      /**
       * Не усыплён ли движок.
       *
       * Телефон может заморозить приложение, не дав ему ни одного
       * события: обработчики просто не выполнялись. Тогда движок
       * считает, что играет, а звука давно нет. Проверять надо у
       * самого движка, а не у нашей отметки.
       */
      awake() { return !!ctx && ctx.state === 'running'; },
      ready() { return ready; },
      /** Настоящие длины кусков — их стоит запомнить на карточке. */
      lengths() { return pieces.map((p) => Math.round(p.len * 100) / 100); },
      /**
       * Где искать секунду t в исходных файлах.
       *
       * Нужно при уходе в фон: там звук доигрывает обычный
       * проигрыватель, а он работает с целыми файлами — вместе со
       * срезанной у нас тишиной. Возвращаем номер куска и место
       * внутри самого файла, а не внутри обрезанного.
       */
      locate(t) {
        if (!ready || !pieces.length) return null;
        const want = Math.max(0, Math.min(t, total));
        let i = 0;
        while (i + 1 < pieces.length && want >= offs[i + 1]) i++;
        return { i: i, at: pieces[i].from + (want - offs[i]) };
      },
      /** Сколько тишины срезано в начале каждого куска. */
      heads() { return pieces.map((p) => p.from); },
      onEnd(fn) { hooks.end = fn; },
      onFail(fn) { hooks.fail = fn; },
      /** Движок усыпили — звук надо срочно передать другому. */
      onAsleep(fn) { hooks.asleep = fn; },
      close() {
        stopAll();
        pieces.length = 0;
        ready = false;
        if (ctx) { try { if (ctx.close) ctx.close(); } catch (e) { /* уже */ } }
        ctx = null;
      },
    };
    return api;
  }

/* ─── 18-tracks.js ─────────────────────────────────────────────────────
 * Дорожки: отрисовка, перенос между карточками, захват пальцем
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  /** Плеер внизу карточки: кнопка, дорожка волны, время до сотых. */
  /**
   * Все дорожки карточки, одна под другой.
   *
   * Каждая — сама по себе: свой проигрыватель, своя дозапись, своё
   * удаление. Номер слева ставим только когда записей больше одной: при
   * единственной он ничего не сообщает и лишь занимает место.
   *
   * Перерисовываем всю полосу целиком, а не одну строку: после удаления
   * или добавления меняются номера у соседних, и держать их в согласии
   * поштучно — верный способ однажды разойтись.
   */
  function paintTracks(bar, card) {
    clear(bar);
    const slots = audioSlots(card);
    const many = slots.length > 1;
    const again = () => { paintTracks(bar, card); };
    slots.forEach((slot, k) => {
      // Дорожка, которая сейчас звучит, возвращается в карточку тем же
      // самым узлом, каким уехала. Собрать её заново значило бы оборвать
      // звук — а он должен идти, пока человек ходит по колодам.
      const alive = liveIs(slot);
      const box = alive ? livePlay.box : el('div', { class: 'track-box' });
      // Живой узел вставляем не здесь, а ниже, через liveHome: он сейчас
      // висит в полоске внизу, и снять его оттуда надо по-честному —
      // иначе он окажется в двух местах сразу.
      const row = el('div', { class: 'track-row' + (many ? ' many' : '') },
        (many ? [trackGrip(bar, card, k, again)] : []).concat(alive ? [] : [box]));
      // Обёртка нужна двум разным движениям сразу. Вбок едет сама строка,
      // и из-под неё открывается кнопка «В карточку». Вверх-вниз, при
      // перестановке дорожек, едет обёртка целиком — вместе со своей
      // кнопкой, иначе кнопка осталась бы стоять на месте.
      const move = el('button', {
        class: 'row-move', attrs: { type: 'button',
          'aria-label': 'Перенести запись на другую карточку' },
        on: { click: () => { closeRow(true); moveTrackTo(card, slot, k); } },
      }, [
        el('span', { class: 'row-move-icon', text: '→' }),
        el('span', { class: 'row-move-text', text: 'В карточку' }),
      ]);
      const slotBox = el('div', { class: 'track-slot' + (many ? ' many' : '') }, [
        el('div', { class: 'row-actions' }, [move]),
        row,
      ]);
      bar.appendChild(slotBox);
      // Движение вбок по дорожке — наше, а не перелистывание карточки.
      // Без этого одно и то же движение значило бы сразу две вещи.
      row.addEventListener('pointerdown', (ev) => {
        if (ev.stopPropagation) ev.stopPropagation();
      });
      attachRowSwipe(row);
      const opts = {
        repaint: again,
        gone: () => { dropTrack(card, slot); save(); again(); },
        // Начало текста — для полоски внизу: по нему видно, чья это
        // запись, когда самой карточки на экране уже нет
        title: shortText(card.text) || 'Запись',
      };
      if (alive) liveHome(row, opts);
      else buildPlayer(box, slot, opts);
    });
  }

  /**
   * Куда перенести запись. Сначала колода, потом карточка в ней.
   *
   * Двумя шагами, а не одним списком всех карточек подряд: карточек
   * бывают сотни, и искать нужную в общей куче — то же самое, что не
   * искать вовсе. Колод же немного, и по названию колоды сразу видно,
   * куда идти.
   */
  function moveTrackTo(fromCard, slot, index) {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });
    const head = 'Перенести запись ' + (index + 1);

    /** Первый шаг: выбрать колоду. */
    const askDeck = () => {
      clear(sheet);
      sheet.appendChild(el('h3', { text: head }));
      sheet.appendChild(el('p', { class: 'hint',
        text: 'Выберите колоду, потом карточку. На карточке помещается '
          + TRACKS_MAX + ' записи.' }));
      const list = el('div', { class: 'card-list scroll' });
      let any = false;
      for (const sec of state.sections) {
        for (const deck of sec.decks) {
          if (!deck.cards.length) continue;
          any = true;
          const swatch = el('span', { class: 'mini-swatch' });
          swatch.style.setProperty('background-color', deck.color);
          swatch.style.setProperty('border-color', deck.color);
          list.appendChild(el('button', {
            class: 'mini pick', attrs: { type: 'button' },
            on: { click: () => askCard(sec, deck) },
          }, [
            swatch,
            el('span', { class: 'mini-text', text: sec.name + ' · ' + deck.name }),
            el('span', { class: 'mini-num', text: cardsLabel(deck.cards.length) }),
          ]));
        }
      }
      if (any) sheet.appendChild(list);
      else {
        sheet.appendChild(el('p', { class: 'empty',
          text: 'Других карточек пока нет.' }));
      }
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
      ]));
    };

    /** Второй шаг: выбрать карточку в этой колоде. */
    const askCard = (sec, deck) => {
      clear(sheet);
      sheet.appendChild(el('h3', { text: head }));
      sheet.appendChild(el('p', { class: 'hint', text: sec.name + ' · ' + deck.name }));
      const list = el('div', { class: 'card-list scroll' });
      let any = false;
      deck.cards.forEach((c) => {
        // Запись ложится на ту сторону, какой карточка лежит: человек
        // оставил её оборотом — туда и кладём, там он её и будет искать
        const to = faceOf(c);
        if (to === fromCard) return;          // сама себе она не нужна
        any = true;
        const busy = audioSlots(to).length;
        const full = busy >= TRACKS_MAX;
        list.appendChild(el('button', {
          class: 'mini pick' + (full ? ' full' : ''),
          attrs: { type: 'button' },
          on: { click: () => {
            if (full) return;
            take(to);
          } },
        }, [
          el('span', { class: 'mini-text', text: shortText(c.text) || 'Без текста' }),
          c.side === 1
            ? el('span', { class: 'mini-side', text: SIDE_LETTERS[1] }) : null,
          el('span', { class: 'mini-num',
                       text: full ? 'занято' : (busy ? 'записей: ' + busy : 'пусто') }),
        ]));
      });
      if (any) sheet.appendChild(list);
      else {
        sheet.appendChild(el('p', { class: 'empty',
          text: 'В этой колоде других карточек нет.' }));
      }
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Назад', on: { click: askDeck } }),
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: close } }),
      ]));
    };

    /** Собственно перенос. Первая дорожка переписывается — это не мгновенно. */
    const take = (toCard) => {
      clear(sheet);
      sheet.appendChild(el('h3', { text: head }));
      sheet.appendChild(el('p', { class: 'hint', text: 'Переношу…' }));
      moveTrackToCard(fromCard, slot, toCard, (ok, why) => {
        close();
        if (ok) {
          // Перерисовываем весь экран: дорожка ушла с этой карточки, и
          // соседние сдвинулись — полосу проще собрать заново целиком.
          openRow = null;
          render();
          return;
        }
        if (why === 'full') {
          alert('На той карточке уже ' + TRACKS_MAX + ' записи. '
            + 'Больше туда не поместится: удалите одну или выберите другую.');
          return;
        }
        alert('Запись перенести не удалось — она осталась на месте.');
      });
    };

    askDeck();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  // Перестановка дорожек.
  //
  // Три коротких строки в один столбик — поэтому ничего не вынимаем из
  // потока и не считаем координаты страницы, как при переносе колод.
  // Строку ведёт сдвиг, соседние расступаются таким же сдвигом, а порядок
  // переписывается только по отпусканию: перерисовать полосу под пальцем
  // значило бы оборвать движение рывком.
  //
  // Тянут за номер. Отдельная ручка нужна потому, что всё остальное в
  // строке уже занято: по дорожке перематывают, по кнопкам нажимают, а по
  // самой карточке листают. Номер же ничего не делал, и рука тянется
  // именно к нему — он и говорит, какая это дорожка по счёту.
  const TRACK_SLOP = 3;      // с какого сдвига считаем, что дорожку тянут
  const TRACK_MS = 200;      // соседние расступаются и дорожка встаёт

  function trackGrip(bar, card, index, redraw) {
    const grip = el('button', {
      class: 'track-no',
      attrs: { type: 'button',
               'aria-label': 'Запись ' + (index + 1)
                 + ': потяните вверх или вниз, чтобы переставить' },
      text: String(index + 1),
    });

    let id = null, y0 = 0, live = false, off = null;
    let rows = [], mine = null, step = 0, mids = [], to = index;

    /** Снять все сдвиги и пометку «несут». */
    const bare = () => {
      rows.forEach((r) => {
        r.style.setProperty('transition', 'none');
        r.style.setProperty('transform', 'translate3d(0,0,0)');
      });
      if (mine) mine.className = (mine.className || '').replace(/ moving\b/g, '');
    };

    const quit = () => { if (off) { off(); off = null; } id = null; live = false; };

    const begin = () => {
      live = true;
      to = index;
      rows = Array.prototype.slice.call(bar.children || []);
      const boxes = rows.map(rectOf);
      mine = rows[index] || null;
      step = boxes[index] ? boxes[index].height : 0;
      // Середины строк меряем один раз, до первого сдвига. Дальше строки
      // едут, и мерить их заново значило бы сравнивать с тем, что само
      // движется: дорожка перескакивала бы туда-обратно у самой границы.
      mids = boxes.map((b) => b.top + b.height / 2);
      if (mine) mine.className += ' moving';
    };

    /** Куда встанет дорожка, если отпустить сейчас. */
    const aim = (dy) => {
      const centre = (mids[index] || 0) + dy;
      let k = index;
      while (k > 0 && centre < mids[k - 1]) k--;
      while (k < rows.length - 1 && centre > mids[k + 1]) k++;
      return k;
    };

    const draw = (dy) => {
      if (mine) {
        mine.style.setProperty('transition', 'none');
        mine.style.setProperty('transform', 'translate3d(0,' + dy + 'px,0)');
      }
      const want = aim(dy);
      if (want === to) return;
      to = want;
      // Расступаются только те, через кого дорожка прошла. Остальные
      // стоят: сдвиг ставим всем, но нулевой — иначе прежний остался бы
      // висеть, и строка не вернулась бы на место.
      rows.forEach((r, k) => {
        if (k === index) return;
        let by = 0;
        if (k > index && k <= to) by = -step;
        else if (k < index && k >= to) by = step;
        r.style.setProperty('transition', 'transform ' + TRACK_MS + 'ms ' + SLIDE_EASE);
        r.style.setProperty('transform', 'translate3d(0,' + by + 'px,0)');
      });
    };

    /** Отпустили: довести строку до места и переписать порядок. */
    const land = () => {
      const done = to;
      if (mine) {
        mine.style.setProperty('transition', 'transform ' + TRACK_MS + 'ms ' + SLIDE_EASE);
        mine.style.setProperty('transform',
          'translate3d(0,' + ((done - index) * step) + 'px,0)');
      }
      setTimeout(() => {
        bare();
        if (moveTrack(card, index, done)) save();
        if (typeof redraw === 'function') redraw();
      }, TRACK_MS);
    };

    grip.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary) return;
      // Жест наш: карточка не должна принять его за перелистывание, а
      // страница — за прокрутку
      if (ev.stopPropagation) ev.stopPropagation();
      quit();
      id = ev.pointerId;
      y0 = ev.clientY;

      const onMove = (e) => {
        if (e.pointerId !== id) return;
        const dy = e.clientY - y0;
        if (!live) {
          if (Math.abs(dy) < TRACK_SLOP) return;
          begin();
        }
        if (e.cancelable && e.preventDefault) e.preventDefault();
        draw(dy);
      };
      const onUp = (e) => {
        if (e.pointerId !== id) return;
        const was = live;
        quit();
        if (was) land();
      };
      // Жест прервали — порядок остаётся прежним, строки возвращаются
      const onCancel = (e) => {
        if (e.pointerId !== id) return;
        const was = live;
        quit();
        if (was) { bare(); if (typeof redraw === 'function') redraw(); }
      };
      off = whileGesture({ pointermove: onMove, pointerup: onUp,
                           pointercancel: onCancel });
      if (grip.setPointerCapture) {
        try { grip.setPointerCapture(id); } catch (e) { /* не поддержано */ }
      }
    });

    return grip;
  }

  /** То же самое, но для соседней карточки: без живого звука. */
  function paintStill(bar, card) {
    clear(bar);
    const slots = audioSlots(card);
    const many = slots.length > 1;
    slots.forEach((slot, k) => {
      const box = el('div', { class: 'track-box' });
      // Обёртка та же, что и у живой полосы: размеры обязаны совпадать
      // до пикселя, иначе в момент подмены дорожка дёрнулась бы.
      bar.appendChild(el('div', { class: 'track-slot' + (many ? ' many' : '') }, [
        el('div', { class: 'track-row' + (many ? ' many' : '') }, many
          ? [el('span', { class: 'track-no', text: String(k + 1) }), box]
          : [box]),
      ]));
      stillPlayer(box, slot);
    });
  }

/* ─── 19-player.js ─────────────────────────────────────────────────────
 * Проигрыватель карточки — buildPlayer
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  /**
   * Проигрыватель одной записи.
   *
   * card здесь — не обязательно карточка: это «место записи», и у второй
   * с третьей дорожек оно своё. Полей у него ровно столько же, сколько у
   * карточки со звуком, поэтому всё, что ниже, одинаково работает и для
   * первой записи, и для остальных.
   *
   * opts.gone — что делать по крестику. Для второй и третьей дорожек там
   * убирается только своя запись, а соседние остаются.
   */
  function buildPlayer(bar, card, opts) {
    opts = opts || {};
    // Что делать по крестику, спрашиваем каждый раз заново, а не
    // запоминаем при сборке. Звучащий проигрыватель переезжает между
    // экранами и живёт дольше той отрисовки, в которой родился: с
    // запомненным действием он однажды удалил бы дорожку, дёрнув за
    // обработчик экрана, которого давно нет.
    const killTrack = () => opts.gone;
    // Метка для отложенной уборки. Пока эта запись звучит, перерисовка
    // экрана её уборку не выполняет — проигрыватель переезжает целым.
    const token = {};
    const face = playerFace(card);
    const play = face.play, wave = face.wave, fill = face.fill;
    const barBox = face.barBox, head = face.head, label = face.label;
    const total = face.total;
    let bars = face.bars;

    // Куски записи. Снаружи это одна дорожка с одним временем, внутри —
    // несколько отдельных файлов, которые проигрываются подряд.
    const list = audioParts(card);
    const offs = [];            // с какой секунды начинается каждый кусок
    let acc = 0;
    list.forEach((p) => { offs.push(Math.round(acc * 100) / 100); acc += p.len; });
    const chainLen = Math.round(acc * 100) / 100;
    const many = list.length > 1;
    let idx = 0;                // какой кусок сейчас в проигрывателе

    // Бесшовный путь для склеенной записи. Пока он жив, элементы звука
    // не участвуют вовсе — куски выложены на общую шкалу движка.
    //
    // Для очереди он не годится и потому выключается. Движок оживает
    // только по нажатию человека, а очередь запускает следующую запись
    // сама, без нажатия: там нужен обычный элемент звука — тот самый,
    // разбуженный когда-то и слушающийся дальше без спроса.
    let smooth = (many && !opts.element) ? smoothChain(card, list) : null;
    const seamless = () => !!(smooth && smooth.ready());

    const duration = () => {
      // Настоящую длину знает только разобранный звук: наши записанные
      // числа взяты с часов во время записи и с содержимым файла не
      // совпадают — ровно на эту разницу ползунок и прыгал на стыке
      if (seamless()) return smooth.total() || chainLen || total;
      if (many) return chainLen || total;
      return (audio && isFinite(audio.duration) && audio.duration > 0)
        ? audio.duration : total;
    };

    // Сколько тишины в начале каждого куска. Обычный проигрыватель
    // играет целые файлы — вместе с ней, — поэтому и он теперь начинает
    // кусок не с нуля, а с этого места. Значение меряется один раз при
    // разборе звука и хранится на карточке.
    let heads = list.map((p) => p.head || 0);

    // Кто сейчас распоряжается звуком.
    //
    // Пока экран горит — движок: он сшивает куски без стыка. Как только
    // приложение уходит в фон, звук переходит к обычному проигрывателю,
    // и обратно уже не возвращается. Всё остальное — время, ползунок,
    // кнопка — спрашивает именно у хозяина, а не угадывает.
    let owner = (many && smooth) ? 'smooth' : 'element';

    /** Сколько прошло с начала всей записи, а не текущего куска. */
    const at = () => {
      if (owner === 'smooth') return seamless() ? smooth.time() : 0;
      if (!audio) return 0;
      const back = heads[idx] || 0;
      return Math.max(0, (offs[idx] || 0) - back + (audio.currentTime || 0));
    };

    const setTime = (cur) => {
      const dur = duration();
      // Черта показывает, докуда доиграло. Пока не нажали «играть», она
      // стояла бы в самом начале и читалась как тёмная точка у края
      // сосуда — будто там что-то есть. Прячем до первого звука.
      head.style.setProperty('opacity', (playing || cur > 0) ? '1' : '0');
      // Общую длину берём из карточки: у записей «на лету» браузер
      // нередко отдаёт Infinity, и без запаса получилось бы «0:03 / NaN»
      label.textContent = dur
        ? mmsscc(cur) + ' / ' + mmsscc(dur)
        : mmsscc(cur);
      const p = dur ? Math.max(0, Math.min(1, cur / dur)) : 0;
      const pct = (p * 100).toFixed(2) + '%';
      // Сосуд наполняется: плотная часть — то, что уже прозвучало
      fill.style.setProperty('width', pct);
      head.style.setProperty('left', pct);
      // Столбики на залитой части становятся светлыми, иначе на плотном
      // фоне они бы пропали и звуковой рисунок исчез бы под наполнением
      const upto = Math.round(p * bars.length);
      for (let i = 0; i < bars.length; i++) {
        const want = i < upto ? 'played' : '';
        if (bars[i].className !== want) bars[i].className = want;
      }
      setWaveClass(p);
    };

    /** Пометки на дорожке: «играет» и «полон». */
    let playing = false;
    const setWaveClass = (p) => {
      // На самом верху черта уже не нужна — сосуд просто полон
      wave.className = 'wave' + (playing ? ' playing' : '')
        + (p >= 0.999 ? ' full' : '');
    };

    // Линия должна ехать плавно. Событие timeupdate приходит редко,
    // раза четыре в секунду, и линия дёргалась бы рывками — поэтому
    // во время проигрывания обновляем покадрово.
    let raf = 0;
    const follow = () => {
      if (owner === 'smooth') {
        if (!seamless() || !smooth.playing()) { raf = 0; return; }
      } else if (!audio || audio.paused) { raf = 0; return; }
      setTime(at());
      raf = requestAnimationFrame(follow);
    };
    const stopFollow = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };

    // Место, с которого продолжать. Берётся с дорожки: там оно и
    // осталось с прошлого раза — хоть с прошлой минуты, хоть с прошлой
    // недели, хоть с другого устройства.
    let resumeAt = sanitizeAt(card.at);

    /**
     * Запомнить, где остановились.
     *
     * У самого конца запоминать нечего: в следующий раз человек хочет
     * услышать запись сначала, а не последние полсекунды. Поэтому конец
     * записывается нулём — как будто её и не слушали.
     */
    const rememberAt = () => {
      const dur = duration();
      const t = at();
      const keep = (!dur || t >= dur - 0.3) ? 0 : Math.round(t * 100) / 100;
      if (Math.abs(sanitizeAt(card.at) - keep) < 0.05) return;
      card.at = keep;
      save();
    };

    /** Остановить всё, чем бы оно ни игралось. */
    const hush = () => {
      stopFollow();
      if (smooth) smooth.pause();
      if (audio && !audio.paused) audio.pause();
    };

    const del = el('button', {
      class: 'audio-del', attrs: { type: 'button', 'aria-label': 'Удалить запись' },
      text: '✕',
      on: {
        click: () => {
          if (taping) return;             // идёт дозапись — не до удаления
          if (!confirm('Удалить голосовую запись с этой карточки?')) return;
          hush();
          // Убираем ровно эту дорожку. Остальные — соседние записи той
          // же карточки — остаются на месте: за это отвечает killTrack.
          const kill = killTrack();
          if (kill) { kill(); return; }
          forgetAudio(card);              // вместе со всеми продолжениями
          save(); clear(bar);
        },
      },
    });

    // ------------------------------------------------------------------
    // Два проигрывателя по очереди.
    //
    // Куски записи лежат отдельными файлами, и стык между ними — самое
    // уязвимое место. Пока источник менялся у одного и того же элемента,
    // браузеру в момент стыка приходилось бросать текущий звук и
    // загружать новый: получался щелчок и провал в тишину. Теперь
    // следующий кусок заранее заряжается во второй элемент, и к моменту
    // стыка он уже готов — остаётся только запустить.
    //
    // Оба элемента будятся в тот же миг, когда человек нажимает
    // «играть»: на iPhone звучать может только тот элемент, которому
    // разрешили это внутри нажатия. Если второй разбудить не удалось,
    // работает прежний путь через первый элемент — хуже, но не молча.
    // ------------------------------------------------------------------
    const pool = [null, null];
    let live = 0;               // какой из двух сейчас звучит
    let audio = null;           // он же, под привычным именем
    let loading = false;
    const urls = [];            // ссылки на куски, чтобы не доставать дважды
    let want = -1;              // куда перемотать, как только кусок загрузится
    const FADE_MS = 90;         // затухание на стыке

    /** Ссылка на кусок i. null — куска нет в хранилище. */
    function partUrl(i) {
      if (urls[i]) return Promise.resolve(urls[i]);
      return AudioStore.get(partKey(card.id, i)).then((blob) => {
        if (!blob || !blob.size) return null;
        urls[i] = URL.createObjectURL(blob);
        return urls[i];
      });
    }

    /**
     * Плавно вывести кусок на полную громкость.
     *
     * Начало новой записи всегда даёт лёгкий призвук: микрофон только
     * что включился. Без сглаживания он слышен на стыке как треск.
     * На iPhone громкостью управляет система, и присвоение там просто
     * ничего не делает — стык всё равно остаётся ровным за счёт того,
     * что кусок заряжен заранее.
     */
    function fadeIn(a) {
      if (typeof requestAnimationFrame !== 'function') return;
      const from = Date.now();
      const step = () => {
        if (a !== audio) { try { a.volume = 1; } catch (e) { /* нельзя */ } return; }
        const k = Math.min(1, (Date.now() - from) / FADE_MS);
        try { a.volume = k; } catch (e) { return; }
        if (k < 1) requestAnimationFrame(step);
      };
      try { a.volume = 0; } catch (e) { return; }
      requestAnimationFrame(step);
    }

    /**
     * Зарядить кусок i в свободный элемент — заранее, а не на стыке.
     *
     * Заодно сразу отматываем его на то место, где начинается голос:
     * тишину в начале файла слышно как провал между кусками.
     */
    function preload(i) {
      if (!many || i < 0 || i >= list.length) return;
      const spare = pool[1 - live];
      if (!spare || spare.__part === i) return;
      partUrl(i).then((u) => {
        if (!u || spare !== pool[1 - live]) return;
        spare.__part = i;
        spare.src = u;
        spare.preload = 'auto';
        if (typeof spare.load === 'function') spare.load();
        const skip = heads[i] || 0;
        if (skip > 0.01) { try { spare.currentTime = skip; } catch (e) { /* позже */ } }
      }).catch(() => {});
    }

    /** Разбудить второй элемент, пока мы внутри нажатия человека. */
    let woke = false;
    function wakeSpare() {
      if (woke || !many) return;
      const spare = pool[1 - live];
      if (!spare || !spare.src) return;
      woke = true;
      try {
        spare.muted = true;              // будим беззвучно
        const pr = spare.play();
        const settle = () => {
          spare.pause();
          try { spare.currentTime = 0; } catch (e) { /* ещё не готов */ }
          spare.muted = false;
        };
        if (pr && pr.then) pr.then(settle).catch(() => { spare.muted = false; woke = false; });
        else settle();
      } catch (e) { woke = false; }
    }

    /**
     * Передать звук следующему куску — тот самый стык.
     *
     * Если следующий кусок уже заряжен во второй элемент, переключение
     * мгновенное. Если нет (не успели или элемент не разбудили) —
     * возвращаемся к прежнему способу через тот же элемент.
     */
    function handOver(i) {
      const spare = pool[1 - live];
      if (!spare || spare.__part !== i || !spare.src) return goPart(i, true);
      const prev = audio;
      live = 1 - live;
      audio = spare;
      idx = i;
      // Будили его беззвучно — снять глушение обязательно, иначе
      // продолжение записи проиграло бы в полной тишине
      audio.muted = false;
      fadeIn(audio);
      const pr = audio.play();
      if (pr && pr.catch) {
        pr.catch(() => {
          // Не пустили — отыгрываем назад и идём прежним путём
          live = 1 - live; audio = prev;
          goPart(i, true);
        });
      }
      if (prev) { try { prev.currentTime = 0; } catch (e) { /* неважно */ } }
      preload(i + 1);
      return Promise.resolve(audio);
    }

    /**
     * Поставить кусок i в тот элемент, который звучит сейчас.
     *
     * Запасной путь: перемотка на другой кусок и случай, когда второй
     * элемент оказался не готов.
     */
    function goPart(i, autoplay) {
      return partUrl(i).then((u) => {
        if (!u) {                        // кусок потерялся — дальше нечего
          play.textContent = '▶'; playing = false; stopFollow();
          label.textContent = 'Продолжение записи не найдено';
          return null;
        }
        idx = i;
        audio.__part = i;
        // Куда встать внутри куска, решаем ДО загрузки.
        //
        // Здесь была ошибка: это стояло после load(), а load() сразу
        // сообщает, что кусок готов, — и к моменту, когда мы называли
        // место, его уже никто не спрашивал. Тишина в начале куска так
        // и не пропускалась.
        if (want < 0 && (heads[i] || 0) > 0.01) want = heads[i];
        audio.src = u;
        // Без явной перезагрузки Safari какое-то время держит прежний
        // кусок и отдаёт его время — черта прыгала бы назад
        if (typeof audio.load === 'function') audio.load();
        if (autoplay) {
          try { audio.volume = 1; } catch (e) { /* нельзя */ }
          const pr = audio.play();
          if (pr && pr.catch) pr.catch(() => {});
        }
        preload(i + 1);
        return audio;
      }).catch(() => null);
    }

    /** Достать запись и подготовить проигрывание. */
    function ensureAudio() {
      if (audio) return Promise.resolve(audio);
      if (loading) return Promise.reject(new Error('busy'));
      loading = true;
      return partUrl(0).then((u) => {
        loading = false;
        if (!u) {
          // Отметка врёт — снимаем её, чтобы карточка не обещала звук,
          // которого нет. Чаще всего так бывает после восстановления
          // резервной копии: в ней только текст, звука там нет.
          //
          // Снимаем ТОЛЬКО отметку. Удалять при этом что-либо из
          // хранилища нельзя: хранилище на iPhone способно ответить
          // пустотой на живую запись, и тогда мы своими руками
          // уничтожили бы голос, который на самом деле цел.
          label.textContent = 'Запись не найдена — отметка снята';
          card.audio = false;
          save();
          setTimeout(() => { clear(bar); }, 1200);
          return null;
        }
        idx = 0;
        // Обработчики одни на оба элемента и молчат, пока элемент не
        // звучит: заряжаемый кусок не должен двигать черту и подписи
        const wire = (a) => {
          a.preload = 'auto';
          a.ontimeupdate = () => {
            if (a !== audio || owner !== 'element') return;
            // Страховка на случай, когда экран погас или приложение ушло
            // в фон: покадровые вызовы там останавливаются, и нарастание
            // громкости могло бы замереть на нуле — продолжение записи
            // играло бы беззвучно. Это событие приходит и в фоне.
            if (a.currentTime > 0.4 && a.volume < 1) {
              try { a.volume = 1; } catch (e) { /* громкость не наша */ }
            }
            if (a.paused) setTime(at());
          };
          a.onloadedmetadata = () => {
            if (a !== audio) return;
            // Перемотку выставляем всегда: кусок могли зарядить заранее
            // Перемотку на другой кусок выставляем только здесь: пока он
            // не загружен, браузер её просто не примет
            if (want >= 0) {
              try { a.currentTime = want; } catch (e) { /* не принял */ }
              want = -1;
            }
            setTime(at());
          };
          // Пока звук у движка, элемент подаёт голос только для
          // подготовки — трогать кнопку и подпись он не должен
          a.onplay = () => { if (a === audio && owner === 'element') markPlaying(); };
          a.onpause = () => { if (a === audio && owner === 'element') markStopped(); };
          a.onended = () => {
            if (a !== audio || owner !== 'element') return;
            // Кусок кончился — сразу передаём звук следующему, чтобы для
            // человека это осталось одной непрерывной записью
            if (many && idx + 1 < list.length) { handOver(idx + 1); return; }
            play.textContent = '▶'; playing = false;
            tellSystem('paused');
            stopFollow();
            setTime(0);
            if (many) goPart(0, false);   // вернуться к началу для повтора
            card.at = 0; save();          // слушали до конца — начинать снова сначала
            liveEnded(card);
          };
          a.onerror = () => {
            if (a === audio && owner === 'element') {
              label.textContent = 'Не удалось воспроизвести';
            }
          };
          return a;
        };

        // Очередь даёт свой, заранее разбуженный элемент: только ему
        // разрешено зазвучать без нажатия человека
        if (opts.element) {
          audio = wire(opts.element);
          audio.src = u;
          if (typeof audio.load === 'function') audio.load();
        } else {
          audio = wire(new Audio(u));
        }
        audio.__part = 0;
        pool[0] = audio;
        live = 0;
        // Второй элемент нужен только склеенной записи.
        //
        // Источник ему сразу даём тот же, что и первому. Не ради звука —
        // ради того, чтобы было что будить: разбудить пустой элемент
        // нельзя, а достать следующий кусок из хранилища мы успеем уже
        // после того, как человек отпустит палец. Через мгновение
        // preload подменит источник на настоящий следующий кусок.
        if (many) {
          pool[1] = wire(new Audio());
          pool[1].src = u;
          preload(1);
        }

        // У старых записей формы волны нет — считаем сейчас и запоминаем,
        // чтобы в следующий раз она появилась сразу. Только для цельной
        // записи: по одному первому куску рисунок всей волны не построить.
        if (!many && (!card.peaks || card.peaks.length === 0)) {
          AudioStore.get(card.id).then((blob) => {
            if (!blob) return null;
            return computePeaks(blob).then((peaks) => {
              if (!peaks || !peaks.length) return;
              card.peaks = peaks; save();
              bars = drawBars(barBox, peaks, bars.length);
              setTime(at());
            });
          }).catch(() => {});
        }
        return audio;
      }).catch(() => {
        loading = false;
        label.textContent = 'Не удалось открыть запись';
        return null;
      });
    }

    /**
     * Сказать системе, что здесь играет запись.
     *
     * Это не украшение. Пока страница просто издаёт звук, iPhone
     * считает её обычной страницей и в фоне глушит. Заполненная
     * карточка проигрывания переводит её в разряд настоящего
     * проигрывателя: запись видно в пункте управления, ею можно
     * управлять с экрана блокировки, и система не обрывает её, когда
     * человек уходит на домашний экран.
     */
    function tellSystem(state) {
      const ms = (typeof navigator !== 'undefined') ? navigator.mediaSession : null;
      if (!ms) return;
      try {
        if (state === 'playing' && typeof self.MediaMetadata === 'function') {
          const line = String(card.text || '').split('\n')[0].trim();
          ms.metadata = new self.MediaMetadata({
            title: line.slice(0, 70) || 'Запись',
            artist: 'Аффирмации',
          });
        }
        ms.playbackState = state;
        if (ms.setActionHandler) {
          ms.setActionHandler('play', () => { if (!playing) play.click(); });
          ms.setActionHandler('pause', () => { if (playing) play.click(); });
        }
      } catch (e) { /* система не поддерживает — не беда */ }
    }
    onCleanup(() => {
      const ms = (typeof navigator !== 'undefined') ? navigator.mediaSession : null;
      if (!ms) return;
      try {
        ms.playbackState = 'none';
        if (ms.setActionHandler) {
          ms.setActionHandler('play', null);
          ms.setActionHandler('pause', null);
        }
      } catch (e) { /* уже нечего снимать */ }
    }, token);

    /** Пометить экран как «играет» — общее для обоих способов. */
    const markPlaying = () => {
      play.textContent = '❚❚'; playing = true;
      tellSystem('playing');
      // С этого мгновения проигрыватель переживает переходы: уходя с
      // карточки, он переедет в полоску внизу и продолжит играть
      liveTake(card, bar, opts, api, token, opts.title || 'Запись');
      // Пока играет запись из плейлиста, следующей понадобится
      // разбуженный элемент — будим его, пока мы внутри нажатия
      if (card.inList) queueWake();
      setTime(at()); stopFollow(); follow();
    };
    const markStopped = () => {
      play.textContent = '▶'; playing = false;
      tellSystem('paused');
      rememberAt();
      stopFollow(); setTime(at());
    };

    // Что полоска внизу разрешает делать с этой записью снаружи.
    const api = {
      playing: () => playing,
      close: () => { rememberAt(); hush(); markStopped(); },
      // После переезда дорожка стала другой ширины — столбиков в неё
      // помещается другое число
      refit: () => { if (face.refit()) { bars = face.bars; setTime(at()); } },
    };

    /**
     * Встать туда, где остановились в прошлый раз.
     *
     * Делается внутри уже готового элемента, а не отдельным заходом в
     * хранилище: второй заход столкнулся бы с первым, тот ответил бы
     * «занято», и нажатие «играть» кончалось бы тишиной.
     */
    function applyResume(a) {
      if (resumeAt <= 0) return;
      const t = resumeAt;
      resumeAt = 0;
      if (!many) { try { a.currentTime = t; } catch (e) { /* не принял */ } return; }
      let i = 0;
      while (i + 1 < list.length && t >= offs[i + 1]) i++;
      const local = Math.max(0, t - offs[i]);
      if (i === idx) { try { a.currentTime = local; } catch (e) { /* не принял */ } return; }
      want = local;
      goPart(i, false);
    }

    // Прежний способ — на случай, если движок откажет
    const playByElement = () => {
      ensureAudio().then((a) => {
        if (!a) return;
        applyResume(a);
        try { a.volume = 1; } catch (e) { /* громкость не наша */ }
        const pr = a.play();
        if (pr && pr.catch) pr.catch(() => {});
        // Пока не вышли из нажатия — будим и второй элемент, иначе на
        // iPhone продолжение записи просто не пустят звучать
        wakeSpare();
      }).catch(() => {});
    };

    // ------------------------------------------------------------------
    // Уход в фон.
    //
    // Человек нажал «играть» и смахнул приложение на домашний экран.
    // Запись при этом обрывалась, и вот почему: куски мы сшиваем
    // звуковым движком, а его iPhone в фоне усыпляет — это правило
    // системы, обойти его нельзя. Обычный проигрыватель система в фоне
    // не трогает.
    //
    // Поэтому на самом пороге ухода передаём звук ему, ровно с той
    // секунды, где остановились. Шов в этот миг может чуть щёлкнуть,
    // зато запись доигрывает до конца, а не обрывается на полуслове.
    // Экран в этот момент всё равно погашен — щелчка никто не увидит.
    // ------------------------------------------------------------------
    /**
     * Подготовить передачу заранее, ещё пока играет движок.
     *
     * Это оказалось важнее всего остального. Когда человек нажимает
     * кнопку блокировки, телефон замораживает приложение почти сразу —
     * времени сходить в хранилище за записью уже нет. Если готовиться
     * в этот момент, передача просто не успеет, и звук оборвётся.
     *
     * Поэтому проигрыватели заводятся и заряжаются заранее, пока экран
     * ещё горит. В момент блокировки остаётся одно действие: сказать
     * «играй» — и это происходит мгновенно.
     */
    let armed = false;
    function armBackground() {
      if (armed || !many) return;
      armed = true;
      ensureAudio().then((a) => {
        if (!a) { armed = false; return; }
        try { a.muted = true; } catch (e) { /* нельзя */ }
        const pr = a.play();
        const calm = () => {
          try { a.pause(); a.muted = false; } catch (e) { /* нельзя */ }
        };
        if (pr && pr.then) pr.then(calm).catch(() => { calm(); armed = false; });
        else calm();
        wakeSpare();
      }).catch(() => { armed = false; });
    }

    /**
     * Отдать звук обычному проигрывателю. Ни одного ожидания внутри:
     * всё, что нужно, уже подготовлено.
     */
    function handToBackground() {
      if (!seamless() || !smooth.playing()) return false;
      const spot = smooth.locate(smooth.time());
      if (!spot) return false;
      heads = smooth.heads();
      smooth.pause();
      stopFollow();
      if (!audio) { armBackground(); return false; }   // не успели подготовиться
      owner = 'element';
      try { audio.muted = false; audio.volume = 1; } catch (e) { /* нельзя */ }
      want = spot.at;
      goPart(spot.i, true);
      return true;
    }

    /**
     * Приложение ушло с экрана. Ловим это тремя разными способами, и
     * все три нужны.
     *
     *   visibilitychange — уход на домашний экран и переход в другое
     *     приложение;
     *   pagehide — иногда единственное, что приходит при блокировке
     *     экрана кнопкой;
     *   сам движок — он сообщает, что его усыпили, и это самый честный
     *     признак: неважно, почему это случилось.
     *
     * Лишние срабатывания не страшны: если звук уже передан, повторный
     * вызов ничего не делает.
     */
    const gone = () => {
      // Приложение уходит с экрана — и может не вернуться вовсе:
      // человек закроет его совсем. Место запоминаем сейчас, пока есть
      // у кого спросить.
      rememberAt();
      handToBackground();
    };
    const onVisible = () => {
      if (typeof document === 'undefined') return;
      if (document.hidden || document.visibilityState === 'hidden') { gone(); return; }
      // Вернулись. Звук уже у обычного проигрывателя — там и оставляем:
      // передавать его обратно на ходу значит устроить ещё один шов
      // ради красоты, которой никто не заметит.
      //
      // А если телефон заморозил нас, не успев ничего сообщить, звук мог
      // и оборваться. Тогда молча поднимаем его с того же места.
      if (playing) {
        // Движок мог уснуть, пока приложение было заморожено, и
        // сообщить об этом ему было нечем. Спрашиваем у него самого.
        const died = owner === 'smooth'
          && (!seamless() || !smooth.awake() || !smooth.playing());
        if (died) {
          const spot = smooth && smooth.ready()
            ? smooth.locate(smooth.time()) : null;
          if (spot && audio) {
            owner = 'element';
            heads = smooth.heads();
            try { audio.muted = false; audio.volume = 1; } catch (e) { /* нельзя */ }
            want = spot.at;
            goPart(spot.i, true);
          } else { markStopped(); }
        }
        stopFollow(); follow();
      }
    };
    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('visibilitychange', onVisible);
      onCleanup(() => {
        if (document.removeEventListener) {
          document.removeEventListener('visibilitychange', onVisible);
        }
      }, token);
    }
    if (typeof window !== 'undefined' && window.addEventListener) {
      window.addEventListener('pagehide', gone);
      window.addEventListener('blur', gone);
      onCleanup(() => {
        if (window.removeEventListener) {
          window.removeEventListener('pagehide', gone);
          window.removeEventListener('blur', gone);
        }
      }, token);
    }

    if (smooth) {
      smooth.onEnd(() => {
        markStopped(); smooth.seek(0); setTime(0);
        liveEnded(card);        // доиграла — в полоске внизу ей больше нечего делать
      });
      smooth.onAsleep(() => { handToBackground(); });
      smooth.onFail(() => {
        // Движок не справился — тихо отдаём звук прежнему способу.
        // Человек этого знать не должен: он просто нажал «играть».
        if (smooth) { try { smooth.close(); } catch (e) { /* уже */ } }
        smooth = null;
        owner = 'element';
        playByElement();
      });
    }

    /** Нажали «играть» — или очередь запустила запись сама. */
    const togglePlay = () => {
      if (taping) return;                    // сейчас пишем, а не слушаем
      if (owner === 'smooth' && smooth && smooth.playing()) {
        smooth.pause(); markStopped(); return;
      }
      if (owner === 'element' && audio && !audio.paused) { audio.pause(); return; }
      if (owner === 'smooth' && smooth) {
        // Разбор звука идёт после нажатия: до него движок спит, а на
        // iPhone разбудить его можно только рукой человека
        smooth.start().then((ok) => {
          if (!ok || !smooth) return;
          fixLengths();
          if (resumeAt > 0) { smooth.seek(resumeAt); resumeAt = 0; }
          markPlaying();
          // Пока экран горит, готовим передачу звука. При блокировке
          // экрана телефон замораживает приложение почти мгновенно, и
          // собираться в тот момент уже поздно.
          armBackground();
        }).catch(() => {});
        return;
      }
      playByElement();
    };
    play.addEventListener('click', togglePlay);
    api.toggle = togglePlay;

    /**
     * Запомнить настоящие длины кусков.
     *
     * Записанные числа взяты с часов, тикавших во время записи. Разобрав
     * звук, мы впервые узнаём, сколько в куске на самом деле — и
     * запоминаем, чтобы в следующий раз подпись и ползунок были верны
     * ещё до нажатия «играть».
     */
    let fixed = false;
    function fixLengths() {
      if (fixed || !seamless()) return;
      fixed = true;
      const real = smooth.lengths();
      const tops = smooth.heads();
      if (real.length !== list.length) return;
      let sum = 0;
      real.forEach((v) => { sum += v; });
      sum = Math.round(sum * 100) / 100;
      const prev = audioParts(card);
      const same = Math.abs(sum - (card.audioLen || 0)) < 0.02
        && prev.every((p, i) => Math.abs((p.head || 0) - tops[i]) < 0.01);
      if (same) return;
      card.parts = real.map((len, i) => ({
        len: len,
        top: prev[i] ? prev[i].top : 100,
        head: Math.round(tops[i] * 1000) / 1000,
      }));
      card.audioLen = sum;
      heads = tops.slice();
      save();
    }

    // ------------------------------------------------------------------
    // Дозапись: одно нажатие — продолжаю, второе — останавливаю.
    // Кнопка стоит перед крестиком, чтобы удаление осталось с краю и
    // палец не попадал по нему вместо продолжения.
    // ------------------------------------------------------------------
    let taping = false;
    const more = el('button', {
      class: 'audio-more',
      attrs: { type: 'button', 'aria-label': 'Дописать к записи' },
      text: '●',
    });
    const showTaping = (on) => {
      taping = on;
      more.classList.toggle('on', on);
      more.textContent = on ? '■' : '●';
      more.setAttribute('aria-label', on ? 'Остановить дозапись' : 'Дописать к записи');
      play.disabled = on;
      del.disabled = on;
    };
    more.addEventListener('click', () => {
      if (taping) { stopRecording(); return; }
      if (activeRecorder) return;            // где-то уже идёт запись
      const sup = recordingSupport();
      if (!sup.ok) { alert(RECORD_HELP[sup.why]); return; }
      if (list.length >= AUDIO_PARTS_MAX) {
        alert('К одной записи можно дописать не больше '
          + (AUDIO_PARTS_MAX - 1) + ' продолжений.');
        return;
      }
      hush();
      showTaping(true);
      label.textContent = 'Дописываю… 0:00';
      startRecording(card, bar, {
        tick: (text) => { label.textContent = 'Дописываю… ' + text; },
        live: () => {},
        // Кусок уже записан, но ещё не лёг в хранилище. Плеер соберут
        // заново, когда лёг; до тех пор говорим, что происходит.
        idle: () => { showTaping(false); label.textContent = 'Сохраняю…'; },
        pauseBtn: null,
      }, true, opts && opts.repaint);
    });

    // Перемотка нажатием и протягиванием по дорожке
    const seekTo = (clientX) => {
      const box = wave.getBoundingClientRect ? wave.getBoundingClientRect() : null;
      if (!box || !box.width) return;
      const p = Math.max(0, Math.min(1, (clientX - box.left) / box.width));
      const dur = duration();
      if (!dur) return;
      const t = p * dur;
      resumeAt = 0;          // человек сам выбрал место — прошлое ни к чему
      setTime(t);
      // Бесшовный путь перематывает сам: куски заново выкладываются на
      // шкалу от нужной секунды, без всякой догрузки
      if (owner === 'smooth' && seamless()) { smooth.seek(t); return; }
      ensureAudio().then((a) => {
        if (!a) return;
        if (!many) { a.currentTime = t; return; }
        // Найти кусок, в который попала точка, и перемотать внутри него
        let i = 0;
        while (i + 1 < list.length && t >= offs[i + 1]) i++;
        const local = Math.max(0, t - offs[i]);
        if (i === idx) {
          try { a.currentTime = local; } catch (e) { /* не принял */ }
          return;
        }
        want = local;
        goPart(i, !a.paused);
      }).catch(() => {});
    };
    let seeking = false;
    wave.addEventListener('pointerdown', (ev) => {
      if (taping) return;              // во время дозаписи перематывать нечего
      seeking = true;
      if (wave.setPointerCapture) wave.setPointerCapture(ev.pointerId);
      seekTo(ev.clientX);
      ev.stopPropagation();     // не отдаём жест перелистыванию карточки
    });
    wave.addEventListener('pointermove', (ev) => {
      if (!seeking) return;
      seekTo(ev.clientX);
      ev.stopPropagation();
    });
    wave.addEventListener('pointerup', () => { seeking = false; });
    wave.addEventListener('pointercancel', () => { seeking = false; });

    if (total) setTime(resumeAt);   // без длины подпись остаётся «Запись»
    else head.style.setProperty('opacity', '0');
    // Со следующего кадра ширина дорожки уже известна — берём столько
    // столбиков, сколько в неё влезает, и заново красим пройденную часть
    if (typeof requestAnimationFrame === 'function') {
      requestAnimationFrame(() => {
        if (face.refit()) { bars = face.bars; setTime(at()); }
      });
    }

    // Ссылки на объекты надо освободить, иначе память держится до
    // перезагрузки страницы. Кусков может быть несколько — отпускаем все.
    onCleanup(() => {
      stopFollow();
      // Разобранный звук занимает в памяти в десятки раз больше сжатого —
      // отпускаем его сразу, а не ждём перезагрузки страницы
      if (smooth) { try { smooth.close(); } catch (e) { /* уже */ } smooth = null; }
      pool.forEach((a) => { if (a) { try { a.pause(); } catch (e) { /* уже */ } } });
      urls.forEach((u) => { if (u) URL.revokeObjectURL(u); });
    }, token);

    bar.appendChild(el('div', { class: 'audio-row' }, [play, wave,
      el('div', { class: 'audio-side' }, [more, del])]));
    bar.appendChild(label);
    return api;
  }

  let audioCleanup = [];

/* ─── 19b-live-play.js ─────────────────────────────────────────────────
 * Запись, которая играет дальше при переходах, и полоска внизу экрана
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Запись не обрывается при переходе на другую карточку.
  //
  // Как это сделано — и почему именно так. Каждый переход собирает экран
  // заново: старое содержимое выбрасывается целиком, и проигрыватель
  // вместе с ним. Перенести звук в отдельный, независимый от экрана
  // проигрыватель значило бы переписать заново самое сложное место
  // приложения — сшивку кусков без стыка, передачу звука в фон при
  // блокировке экрана, два элемента по очереди. Всё это далось долго и
  // работает.
  //
  // Поэтому звучащий проигрыватель не пересобирается, а ПЕРЕЕЗЖАЕТ. Его
  // узел снимается с уходящего экрана до того, как тот будет очищен, и
  // переставляется в полоску внизу. Ни один обработчик при этом не
  // теряется, ни один элемент звука не закрывается: для самого
  // проигрывателя ничего не произошло, он даже не заметил переезда.
  // Вернулись на ту же карточку — тот же самый узел переезжает обратно
  // на своё место в полосе записей.
  //
  // Отсюда и правило: живой проигрыватель ровно один. Второй звук,
  // пущенный поверх, просто забирает опеку себе.
  // ------------------------------------------------------------------

  // Кто сейчас под опекой. null — играть нечему.
  //
  //   slot  — дорожка (карточка или место записи), чей это звук
  //   box   — тот самый узел, который переезжает
  //   opts  — что делать по крестику и после дозаписи; обновляется при
  //           каждом возвращении в карточку, потому что перерисовка
  //           заводит новые обработчики
  //   api   — что проигрыватель разрешает делать снаружи
  //   token — метка для уборки: по ней его уборка не выполняется вместе
  //           с уборкой уходящего экрана
  //   home  — узел сейчас в карточке (true) или в полоске (false)
  //   spot  — где эта карточка лежит: по нажатию на полоску туда и идём
  let livePlay = null;
  let miniBar = null;

  /**
   * Отложенная уборка с меткой хозяина.
   *
   * Раньше это был просто список действий, и перерисовка выполняла его
   * целиком. Теперь у звучащего проигрывателя своя метка, и его уборка
   * остаётся ждать: он переезжает, а не закрывается.
   */
  function onCleanup(fn, own) {
    audioCleanup.push({ run: fn, own: own || null });
  }

  /** Выполнить отложенную уборку, кроме уборки живого проигрывателя. */
  function runCleanup(keep) {
    const rest = [];
    audioCleanup.forEach((c) => {
      if (keep && c.own === keep) { rest.push(c); return; }
      try { c.run(); } catch (e) { /* уже убрано */ }
    });
    audioCleanup = rest;
  }

  /** Переставить узел, отцепив его от прежнего места. */
  function adopt(parent, node) {
    if (!parent || !node) return;
    if (node.parentNode && node.parentNode.removeChild) {
      node.parentNode.removeChild(node);
    }
    parent.appendChild(node);
  }

  /** Эта ли дорожка сейчас под опекой. */
  function liveIs(slot) { return !!(livePlay && livePlay.slot === slot); }

  /**
   * Взять проигрыватель под опеку. Вызывается в тот миг, когда пошёл
   * звук, — а не при сборке экрана: пока никто не нажал «играть»,
   * переживать переходы нечему.
   */
  function liveTake(slot, box, opts, api, token, title) {
    // Уже под опекой — ничего не трогаем. Иначе нажатие «играть» в самой
    // полоске сочло бы, что проигрыватель вернулся в карточку.
    if (liveIs(slot)) return;
    if (livePlay) {
      // Прежний звучал в этой же карточке — пусть остаётся обычным
      // проигрывателем, его уберут вместе с экраном. Прежний висел в
      // полоске — закрываем совсем, иначе он остался бы ничей.
      if (livePlay.home) liveForget();
      else liveDrop();
    }
    livePlay = {
      slot: slot, box: box, opts: opts, api: api, token: token,
      title: title || 'Запись',
      // Запись, пущенную очередью, никто в карточку не ставил: её узел
      // сразу живёт в полоске внизу, и место карточки приходит извне.
      home: !opts.queue,
      spot: opts.spot || { sectionId: view.sectionId, deckId: view.deckId,
                           index: view.index },
    };
    // Запись пустила очередь: её узел никто в карточку не ставил, и
    // показать полоску, кроме нас, некому. Звук трогается не сразу, а
    // когда хранилище отдаст запись, — поэтому и полоска появляется
    // здесь, а не в той отрисовке, из которой запись запустили.
    if (!livePlay.home) {
      miniShow();
      // На экране списка отмечена играющая строка — она сменилась
      if (view.name === 'list') render();
    }
  }

  /** Снять опеку, ничего не закрывая: узел остаётся обычным на экране. */
  function liveForget() {
    if (!livePlay) return;
    const token = livePlay.token;
    livePlay = null;
    // Его уборка больше не особенная — пусть выполнится с общим экраном
    audioCleanup.forEach((c) => { if (c.own === token) c.own = null; });
    miniHide();
  }

  /**
   * Закрыть совсем: остановить звук, запомнить место, убрать полоску.
   *
   * Именно это делает крестик на полоске. Место, на котором остановились,
   * остаётся записанным на дорожке — в следующий раз запись продолжится
   * отсюда, а не начнётся заново.
   */
  function liveDrop() {
    const it = livePlay;
    if (!it) return;
    livePlay = null;
    try { it.api.close(); } catch (e) { /* закрывать уже нечего */ }
    runCleanup(null);           // теперь и его уборка выполняется
    if (it.box && it.box.parentNode && it.box.parentNode.removeChild) {
      it.box.parentNode.removeChild(it.box);
    }
    miniHide();
  }

  /**
   * Запись доиграла до конца.
   *
   * Стоит она в карточке — пусть стоит: человек на неё смотрит. Висит в
   * полоске внизу — убираем: полоска говорит «идёт запись», а она уже
   * не идёт.
   */
  function liveEnded(slot) {
    if (!liveIs(slot)) return;
    // Запись из плейлиста не заканчивает дело, а передаёт его дальше:
    // следующая идёт сразу, без паузы и без нажатия.
    const i = playlistIndexOf(slot);
    if (i >= 0 && playlistAt(i + 1)) { playQueueAt(i + 1); return; }
    if (livePlay.home) return;
    liveDrop();
  }

  // ------------------------------------------------------------------
  // Очередь: один элемент звука на весь плейлист.
  //
  // Здесь всё держится на одном правиле браузера: элемент, которому
  // однажды разрешили зазвучать внутри нажатия человека, дальше слушается
  // без спроса — ему можно ставить новый источник и запускать сколько
  // угодно раз. Новый элемент такого права не имеет, и на iPhone
  // следующая запись просто не пошла бы.
  //
  // Поэтому элемент у очереди один и тот же на всё время работы. Будим
  // его крошечной тишиной — в тот самый миг, когда человек нажимает
  // «играть» на записи из плейлиста или выбирает запись в самом списке.
  // ------------------------------------------------------------------
  let queueEl = null;
  let silence = '';

  /** Ссылка на пол-мгновения тишины. Нужна только чтобы разбудить звук. */
  function silenceUrl() {
    if (silence) return silence;
    // Простейший wav: заголовок и горстка нулей. Строим сами, потому что
    // ссылка вида data: запрещена политикой безопасности, а объект —
    // разрешён: он рождён на этом же устройстве.
    const n = 400;
    const buf = new Uint8Array(44 + n * 2);
    const put = (at, str) => {
      for (let i = 0; i < str.length; i++) buf[at + i] = str.charCodeAt(i);
    };
    const put32 = (at, v) => {
      buf[at] = v & 255; buf[at + 1] = (v >> 8) & 255;
      buf[at + 2] = (v >> 16) & 255; buf[at + 3] = (v >> 24) & 255;
    };
    const put16 = (at, v) => { buf[at] = v & 255; buf[at + 1] = (v >> 8) & 255; };
    put(0, 'RIFF'); put32(4, 36 + n * 2); put(8, 'WAVE');
    put(12, 'fmt '); put32(16, 16); put16(20, 1); put16(22, 1);
    put32(24, 8000); put32(28, 16000); put16(32, 2); put16(34, 16);
    put(36, 'data'); put32(40, n * 2);
    try {
      silence = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
    } catch (e) { silence = ''; }
    return silence;
  }

  /**
   * Разбудить общий элемент очереди.
   *
   * Звать только изнутри нажатия человека — в этом весь смысл.
   * Повторные вызовы ничего не делают: элемент уже разбужен.
   */
  function queueWake() {
    if (queueEl || typeof Audio !== 'function') return queueEl;
    try {
      const a = new Audio();
      const u = silenceUrl();
      if (u) a.src = u;
      a.muted = true;
      const calm = () => {
        try { a.pause(); a.muted = false; a.currentTime = 0; }
        catch (e) { /* уже */ }
      };
      const pr = a.play();
      if (pr && pr.then) pr.then(calm).catch(calm);
      else calm();
      queueEl = a;
    } catch (e) { queueEl = null; }
    return queueEl;
  }

  /**
   * Передать звук очереди: то, что играло раньше, замолкает.
   *
   * Стояло оно в карточке — узел там и остаётся, обычным проигрывателем:
   * убирать его нельзя, человек на него смотрит. Висело в полоске —
   * закрываем совсем.
   */
  function liveHandOver() {
    if (!livePlay) return;
    if (!livePlay.home) { liveDrop(); return; }
    try { livePlay.api.close(); } catch (e) { /* уже нечего */ }
    liveForget();
  }

  /** Запустить запись, стоящую в очереди под этим номером. */
  function playQueueAt(i) {
    const it = playlistAt(i);
    if (!it) return false;
    queueWake();
    liveHandOver();
    const box = el('div', { class: 'track-box' });
    const api = buildPlayer(box, it.slot, {
      title: shortText(it.side.text) || shortText(it.card.text) || 'Запись',
      element: queueEl,
      queue: true,
      spot: { sectionId: it.sectionId, deckId: it.deckId, index: it.index },
      repaint: () => render(),
      gone: () => { playlistDrop(it.slot); save(); render(); },
    });
    api.toggle();
    return true;
  }

  /** Предыдущая или следующая запись очереди — прямо из полоски. */
  function queueStep(delta) {
    if (!livePlay) return false;
    const i = playlistIndexOf(livePlay.slot);
    if (i < 0) return false;
    return playQueueAt(i + delta);
  }

  /** Есть ли куда шагнуть от того, что играет сейчас. */
  function queueCan(delta) {
    if (!livePlay) return false;
    const i = playlistIndexOf(livePlay.slot);
    return i >= 0 && !!playlistAt(i + delta);
  }

  /**
   * Перед перерисовкой: снять живой узел с уходящего экрана.
   *
   * Возвращает метку, уборку которой выполнять нельзя. null — живого
   * проигрывателя нет или он больше не нужен.
   */
  function livePark() {
    if (!livePlay) return null;
    // Замолчавший проигрыватель, стоящий в карточке, ничем не отличается
    // от обычного: везти с собой молчание незачем.
    if (livePlay.home && !livePlay.api.playing()) { liveForget(); return null; }
    livePlay.home = false;
    if (livePlay.box.parentNode && livePlay.box.parentNode.removeChild) {
      livePlay.box.parentNode.removeChild(livePlay.box);
    }
    return livePlay.token;
  }

  /**
   * После перерисовки: узел вернулся в карточку — полоска не нужна;
   * не вернулся — показываем полоску.
   */
  function liveSettle() {
    if (!livePlay || livePlay.home) { miniHide(); return; }
    miniShow();
  }

  /**
   * Вернуть живой узел на его место в карточке.
   *
   * Обработчики у него старые, с прошлой отрисовки, и часть из них
   * смотрит на узлы, которых уже нет. Поэтому вместе с узлом обновляем
   * и то, что он зовёт наружу: перерисовку полосы и удаление дорожки.
   */
  function liveHome(row, opts) {
    if (!livePlay) return;
    livePlay.home = true;
    if (opts) {
      livePlay.opts.repaint = opts.repaint;
      livePlay.opts.gone = opts.gone;
    }
    livePlay.spot = { sectionId: view.sectionId, deckId: view.deckId,
                      index: view.index };
    adopt(row, livePlay.box);
    if (livePlay.api.refit) livePlay.api.refit();
  }

  // ------------------------------------------------------------------
  // Полоска внизу экрана.
  //
  // Стоит у нижнего края и никуда не уезжает: на телефоне туда палец
  // дотягивается легче всего. Внутри — та самая дорожка, что играла в
  // карточке, целиком: кнопка, волна, время. Она живая — можно
  // остановить, продолжить и перемотать, не возвращаясь в карточку.
  //
  // Сверху строка с началом текста карточки: нажатие на неё
  // возвращает туда, откуда играет. Крестик справа закрывает совсем.
  // ------------------------------------------------------------------
  function miniShow() {
    if (!miniBar) {
      miniBar = el('div', {
        class: 'mini-play',
        attrs: { role: 'region', 'aria-label': 'Идёт запись' },
      });
      document.body.appendChild(miniBar);
    }
    clear(miniBar);
    const open = el('button', {
      class: 'mini-play-open',
      attrs: { type: 'button', 'aria-label': 'Вернуться к карточке' },
      on: { click: () => {
        const s = livePlay && livePlay.spot;
        if (!s) return;
        go({ name: 'read', sectionId: s.sectionId, deckId: s.deckId, index: s.index });
      } },
    }, [
      el('span', { class: 'mini-play-note', attrs: { 'aria-hidden': 'true' }, text: '♪' }),
      el('span', { class: 'mini-play-text', text: livePlay.title }),
    ]);
    // Кнопка списка. Нажатие на пустое место полоски возвращает к
    // карточке, а эта — открывает плейлист: два разных места, два разных
    // действия, промахнуться нельзя.
    const toList = el('button', {
      class: 'mini-play-list',
      attrs: { type: 'button', 'aria-label': 'Открыть плейлист',
               title: 'Плейлист' },
      text: '☰',
      on: { click: () => openPlaylist() },
    });
    const close = el('button', {
      class: 'mini-play-close',
      attrs: { type: 'button', 'aria-label': 'Закрыть проигрыватель' },
      text: '✕',
      on: { click: () => { liveDrop(); render(); } },
    });
    miniBar.appendChild(el('div', { class: 'mini-play-top' },
      [open, toList, close]));

    // Стрелки по краям живой дорожки: предыдущая и следующая запись
    // очереди, не открывая список. Гаснут, когда шагать некуда, —
    // и тогда просто ничего не делают.
    const step = (delta, sign, name) => el('button', {
      class: 'mini-play-step' + (queueCan(delta) ? '' : ' off'),
      attrs: { type: 'button', 'aria-label': name, title: name,
               'aria-disabled': String(!queueCan(delta)) },
      text: sign,
      on: { click: () => { queueStep(delta); } },
    });
    const line = el('div', { class: 'mini-play-line' }, [
      step(-1, '‹', 'Предыдущая запись'),
    ]);
    miniBar.appendChild(line);
    adopt(line, livePlay.box);
    line.appendChild(step(1, '›', 'Следующая запись'));
    if (livePlay.api.refit) livePlay.api.refit();
    if (root && root.classList) root.classList.add('with-mini');
  }

  function miniHide() {
    if (miniBar && miniBar.parentNode && miniBar.parentNode.removeChild) {
      miniBar.parentNode.removeChild(miniBar);
    }
    miniBar = null;
    if (root && root.classList) root.classList.remove('with-mini');
  }
/* ─── 20-modals.js ─────────────────────────────────────────────────────
 * Модальные окна: правка раздела, колоды, карточки
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Модальные окна
  // ------------------------------------------------------------------
  function modal(title, fields, onSave, onDelete) {
    const wrap = el('div', { class: 'modal' });
    const inputs = {};
    // Где стояла страница до открытия окна. Клавиатура на iPhone двигает
    // её вверх, и после закрытия вернуть надо именно сюда.
    const wasAt = (typeof window !== 'undefined')
      ? (window.scrollY || window.pageYOffset || 0) : 0;

    const sheet = el('div', { class: 'sheet' }, [el('h3', { text: title })]);

    for (const f of fields) {
      if (f.type === 'colors') {
        const row = el('div', { class: 'swatches' });
        let palette = f.palette || COLORS;
        // Если карточка покрашена в цвет из прежней бледной палитры,
        // показываем его первым отдельным образцом. Иначе при открытии
        // окна выбор молча съезжал бы на жёлтый и карточка меняла цвет
        // от одного лишь захода в редактирование.
        if (f.value && !palette.includes(f.value)) palette = [f.value].concat(palette);
        let chosen = palette.includes(f.value) ? f.value : palette[0];
        palette.forEach((c) => {
          const b = el('button', {
            class: 'swatch', style: { background: c },
            attrs: { type: 'button', 'aria-pressed': String(c === chosen),
                     'aria-label': 'Цвет' },
          });
          b.addEventListener('click', () => {
            chosen = c;
            row.querySelectorAll('.swatch').forEach((n) => n.setAttribute('aria-pressed', 'false'));
            b.setAttribute('aria-pressed', 'true');
          });
          row.appendChild(b);
        });
        inputs[f.key] = { get value() { return chosen; } };
        sheet.appendChild(el('label', { class: 'field' }, [
          el('span', { text: f.label }), row,
        ]));
        continue;
      }
      // Текст аффирмации — своё поле: в нём оформление видно сразу
      if (f.rich) { inputs[f.key] = richField(sheet, f); continue; }
      const input = f.type === 'textarea'
        ? el('textarea', { attrs: { maxlength: String(f.max), rows: '6' } })
        : el('input', { attrs: { type: 'text', maxlength: String(f.max),
                                 autocapitalize: 'sentences', spellcheck: 'false' } });
      input.value = f.value || '';
      inputs[f.key] = input;
      sheet.appendChild(el('label', { class: 'field' }, [
        el('span', { text: f.label }), input,
      ]));
    }

    const close = () => {
      // Сначала снимаем фокус с поля, потом убираем окно. Пока поле в
      // фокусе, iPhone держит клавиатуру и сдвинутый экран; если убрать
      // окно вместе с полем, возвращать вид системе уже не с чего —
      // и страница остаётся смещённой и увеличенной.
      const act = document.activeElement;
      if (act && typeof act.blur === 'function') act.blur();
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
      // Экран мог уехать вслед за клавиатурой — ставим его на место.
      // Именно на то место, где человек был, а не в начало списка:
      // редактировали десятую колоду снизу — туда и возвращаемся.
      if (typeof window.scrollTo === 'function') window.scrollTo(0, wasAt);
    };

    const actions = el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Отмена',
                     on: { click: close } }),
      el('button', {
        class: 'btn', attrs: { type: 'button' }, text: 'Сохранить',
        on: {
          click: () => {
            const values = {};
            for (const k of Object.keys(inputs)) {
              values[k] = inputs[k].value;
              if (inputs[k].__marks) values[k + 'Marks'] = inputs[k].__marks();
              if (inputs[k].__align) values[k + 'Align'] = inputs[k].__align();
              if (inputs[k].__ink) values[k + 'Ink'] = inputs[k].__ink();
            }
            if (onSave(values) !== false) { close(); save(); render(); }
          },
        },
      }),
    ]);
    sheet.appendChild(actions);

    if (onDelete) {
      sheet.appendChild(el('button', {
        class: 'btn danger', attrs: { type: 'button' },
        style: { width: '100%', 'margin-top': '10px' },
        text: 'Удалить',
        on: {
          click: () => {
            if (!confirm('Удалить без возможности вернуть?')) return;
            onDelete(); close(); save(); render();
          },
        },
      }));
    }

    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
    const first = sheet.querySelector('input, textarea');
    if (first) first.focus();
  }

  function editSection(section) {
    modal(section ? 'Раздел' : 'Новый раздел',
      [{ key: 'name', label: 'Название', value: section ? section.name : '',
         max: LIMITS.sectionName }],
      (v) => {
        const name = v.name.trim();
        if (!name) return false;
        if (section) section.name = name;
        else {
          if (state.sections.length >= LIMITS.sections) {
            alert('Достигнут предел разделов.'); return false;
          }
          state.sections.push({ id: uid(), name: name, decks: [] });
        }
      },
      section ? () => {
        state.sections = state.sections.filter((s) => s.id !== section.id);
        go({ name: 'home' });
      } : null);
  }

  function editDeck(section, deck) {
    modal(deck ? 'Колода' : 'Новая колода', [
      { key: 'name', label: 'Название', value: deck ? deck.name : '', max: LIMITS.deckName },
      { key: 'color', label: 'Цвет', type: 'colors', value: deck ? deck.color : COLORS[0] },
    ], (v) => {
      const name = v.name.trim();
      if (!name) return false;
      if (deck) { deck.name = name; deck.color = v.color; }
      else {
        if (section.decks.length >= LIMITS.decksPerSection) {
          alert('Достигнут предел колод в разделе.'); return false;
        }
        section.decks.push({ id: uid(), name: name, color: v.color, cards: [] });
      }
    }, deck ? () => {
      section.decks = section.decks.filter((d) => d.id !== deck.id);
      go({ name: 'home' });
    } : null);
  }

  /**
   * Правка карточки. face — та сторона, которую сейчас правят.
   *
   * Из читалки приходит сторона, лежащая вверх; из списка колоды и при
   * создании новой карточки — ничего, и тогда правится лицо. Текст,
   * название, оформление и ссылка принадлежат стороне. Цвет — самой
   * карточке: она одна, и у настоящей бумажки обе стороны одного цвета.
   */
  function editCard(deck, card, face) {
    const f = face || card;
    const isBack = !!(card && face && face !== card);
    modal(card ? (isBack ? 'Оборот карточки' : 'Карточка') : 'Новая карточка', [
      // Название стоит первым и занимает одну строку. Поля разделены
      // полностью: что набрано здесь, в текст аффирмации не перетекает,
      // и оформление у каждого своё.
      { key: 'head', label: 'Название карточки', rich: true, one: true,
        value: f ? (f.head || '') : '',
        marks: f ? f.headMarks : [],
        align: f ? f.headAlign : ALIGN_DEFAULT,
        ink: f ? f.headInk : INK_DEFAULT,
        max: LIMITS.cardHead },
      { key: 'text', label: isBack ? 'Текст на обороте' : 'Текст аффирмации',
        type: 'textarea', rich: true,
        value: f ? f.text : '', marks: f ? f.marks : [],
        align: f ? f.align : ALIGN_DEFAULT,
        ink: f ? f.ink : INK_DEFAULT,
        max: LIMITS.cardText },
      { key: 'color', label: 'Цвет карточки', type: 'colors',
        palette: CARD_COLORS, value: card ? card.color : CARD_COLORS[0] },
    ],
      (v) => {
        // Пробелы по краям обрезаем — значит, и отметки надо подвинуть
        // на столько же, иначе оформление съедет на пару букв
        const text = v.text.trim();
        // Пустой оборот — обычное дело: там может лежать одна фотография
        // или одна запись голоса, и требовать к ним ещё и текст незачем.
        // Лицо без текста по-прежнему не сохраняется: карточка без слов
        // не отличалась бы в списке ни от одной другой.
        if (!text && !isBack) return false;
        const marks = shiftMarks(v.textMarks || [], v.text, text);
        const align = sanitizeAlign(v.textAlign);
        const ink = sanitizeInk(v.textInk);
        // Название — то же самое, но со своими отметками и своим видом
        const head = String(v.head || '').trim();
        const headMarks = shiftMarks(v.headMarks || [], v.head || '', head);
        const headAlign = sanitizeAlign(v.headAlign);
        const headInk = sanitizeInk(v.headInk);
        if (card) {
          f.text = text; f.marks = marks;
