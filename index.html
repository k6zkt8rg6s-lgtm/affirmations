/* ─── 07-audio-store.js ────────────────────────────────────────────────
 * Хранилище голосовых записей (IndexedDB)
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Хранилище голосовых записей
  //
  // Отдельно от карточек и намеренно. В localStorage лежат только строки,
  // и объём там около 5 МБ на весь сайт — одна минута записи в base64
  // съела бы почти всё. Поэтому звук идёт в IndexedDB, где хранится
  // двоичными объектами как есть, без раздувания.
  //
  // Никуда не отправляется: connect-src 'none' запрещает любые запросы,
  // запись остаётся на устройстве.
  // ------------------------------------------------------------------
  const AudioStore = (function () {
    const DB = 'affirmations-audio', STORE = 'clips';
    let dbp = null;

    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        if (!self.indexedDB) { reject(new Error('no-indexeddb')); return; }
        const req = self.indexedDB.open(DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbp;
    }

    /**
     * Одна операция с хранилищем.
     *
     * Запись считается состоявшейся не тогда, когда прошёл запрос, а
     * когда закрылась вся сделка (oncomplete). Разница не теоретическая:
     * запрос успевает отчитаться раньше, чем данные легли на диск, и
     * если в этот момент перерисовать страницу, запись может пропасть —
     * карточка будет говорить, что звук есть, а звука не будет.
     */
    function tx(mode, fn) {
      return open().then((db) => new Promise((resolve, reject) => {
        let t;
        try { t = db.transaction(STORE, mode); }
        catch (e) { reject(e); return; }
        let out;
        const req = fn(t.objectStore(STORE));
        req.onsuccess = () => { out = req.result; };
        req.onerror = () => reject(req.error);
        t.onabort = () => reject(t.error || new Error('aborted'));
        t.onerror = () => reject(t.error);
        // Ждём именно закрытия сделки. Проверять, поддерживается ли
        // такое событие, незачем: оно есть во всех реализациях, а
        // запасной путь «резолвить по успеху запроса» возвращал бы нас
        // ровно к той ошибке, из-за которой запись пропадала.
        t.oncomplete = () => resolve(out);
      }));
    }

    /**
     * Записи храним не объектом Blob, а его содержимым.
     *
     * Safari кладёт Blob в хранилище отдельным файлом, и эта связка
     * ненадёжна: объект сохраняется, а при чтении возвращается пустым.
     * Простой массив байтов лежит внутри самой базы и читается везде
     * одинаково. Тип звука держим рядом, чтобы собрать Blob обратно.
     */
    function pack(blob) {
      if (!blob) return Promise.resolve(null);
      if (typeof blob.arrayBuffer === 'function') {
        return blob.arrayBuffer().then((buf) => (
          { kind: 'clip', type: blob.type || 'audio/webm', buf: buf }));
      }
      return Promise.resolve(blob);   // старый браузер — кладём как есть
    }

    function unpack(value) {
      if (!value) return null;
      // Записи, сохранённые прежними версиями, лежат объектом Blob
      if (!value.kind) return value;
      try { return new Blob([value.buf], { type: value.type || 'audio/webm' }); }
      catch (e) { return null; }
    }

    return {
      put: (id, blob) => pack(blob).then((v) => tx('readwrite', (s) => s.put(v, id))),
      get: (id) => tx('readonly', (s) => s.get(id)).then(unpack),
      del: (id) => tx('readwrite', (s) => s.delete(id)),
      /** Все ключи хранилища. Нужны, чтобы находить осиротевшие записи:
       *  карточки уже нет, а её звук занимает место. */
      /**
       * Все ключи хранилища — или null, если спросить не вышло.
       *
       * Разница между «пусто» и «не смогли спросить» здесь важнее
       * всего: приняв одно за другое, приложение решит, что записей
       * нет, и снимет отметки с живых карточек.
       */
      keys: () => tx('readonly', (s) => s.getAllKeys())
        .then((r) => (Array.isArray(r) ? r : null)).catch(() => null),
      available: () => !!self.indexedDB,

      /** Запись → строка, пригодная для файла синхронизации. */
      toText: (blob) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));   // data:audio/...;base64,...
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
      }),

      /** Обратно: строка из файла → запись.
       *  Через fetch на data-адрес было бы короче, но connect-src 'none'
       *  такие запросы запрещает — разбираем base64 вручную. */
      fromText: (text) => {
        const str = String(text || '');
        if (str.slice(0, 5) !== 'data:') return null;
        const comma = str.indexOf(',');
        if (comma < 0) return null;

        // Заголовок разбираем по частям, а не одним шаблоном.
        //
        // Здесь была ошибка, из-за которой записи не доезжали до второго
        // устройства. Шаблон ждал ровно «data:тип;base64,», а браузеры
        // пишут в тип ещё и кодек: «audio/webm;codecs=opus»,
        // «audio/mp4;codecs=mp4a.40.2». Такая строка под шаблон не
        // подходила, разбор возвращал пустоту, и запись молча
        // пропускалась — при том что в файле она была.
        const head = str.slice(5, comma).split(';');
        const type = head[0] || 'audio/webm';
        let base64 = false;
        for (let i = 1; i < head.length; i++) {
          if (head[i].trim().toLowerCase() === 'base64') base64 = true;
        }
        const body = str.slice(comma + 1);

        try {
          if (base64) {
            // Пробелы и переводы строк иногда добавляют почтовые и
            // облачные посредники — они не часть данных
            const bin = atob(body.replace(/\s+/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            if (!bytes.length) return null;
            return new Blob([bytes], { type: type });
          }
          return new Blob([decodeURIComponent(body)], { type: type });
        } catch (e) {
          return null;   // повреждённая строка — просто пропускаем запись
        }
      },
    };
  })();

  /**
   * Убрать отметку «есть запись» у карточек, у которых записи нет.
   *
   * Такое расхождение возникает законным путём: резервная копия — это
   * только текст, звук в неё не входит. Восстановив её, приложение
   * получало карточки, уверенные в наличии звука, а при нажатии на
   * «играть» упиралось в пустоту. Здесь мы сверяем отметки с
   * действительностью один раз и приводим их в порядок.
   *
   * onDone получает число исправленных карточек.
   */
  function healAudioFlags(onDone) {
    const done = (n) => { if (typeof onDone === 'function') onDone(n); };
    if (!AudioStore.available()) { done(0); return; }

    const cards = [];
    for (const sec of state.sections) {
      for (const deck of sec.decks) {
        // Обе стороны карточки: у оборота свои записи под своими
        // номерами, и сверять их надо так же, как записи лица
        for (const card of deck.cards) {
          cardSides(card).forEach((s) => cards.push(s));
        }
      }
    }
    if (!cards.length) { done(0); return; }

    // Спрашиваем у хранилища ВЕСЬ список ключей разом.
    //
    // Раньше здесь опрашивали записи по одной, и это оказалось опасно:
    // хранилище на iPhone иногда отвечает пустотой на совершенно живую
    // запись — особенно сразу после запуска. Один такой промах, и
    // карточка теряла голос. Общий список надёжнее: он либо приходит
    // целиком, либо не приходит вовсе, и тогда мы просто ничего не
    // трогаем.
    AudioStore.keys().then((keys) => {
      if (!Array.isArray(keys)) { done(0); return; }
      // Пустое хранилище при непустых отметках — почти наверняка осечка,
      // а не то, что все записи разом исчезли. Молчим и ждём следующего
      // запуска: снять отметки мы всегда успеем, вернуть их — нет.
      const claim = cards.filter((c) => c.audio).length;
      if (!keys.length && claim > 0) { done(0); return; }

      const have = new Set(keys);
      let fixed = 0, back = 0;
      // Вторая и третья дорожки проверяются так же, как первая: у них
      // тоже свой номер в хранилище. Записи и здесь НЕ удаляются —
      // снимается только отметка.
      cards.forEach((card) => {
        const extra = Array.isArray(card.extra) ? card.extra : [];
        extra.forEach((e) => {
          if (e && e.audio && !have.has(e.id)) { e.audio = false; fixed++; }
        });
        if (extra.some((e) => e && !e.audio)) {
          card.extra = extra.filter((e) => e && e.audio);
        }
        const real = have.has(card.id);
        if (card.audio && !real) {
          // Отметку снимаем, но САМИ ЗАПИСИ НЕ ТРОГАЕМ. Здесь была
          // ошибка, из-за которой голос пропадал безвозвратно: заодно
          // с отметкой удалялось и содержимое. Отметку вернуть можно,
          // запись — уже ничем.
          card.audio = false;
          fixed++;
          return;
        }
        if (!card.audio && real) {
          // Запись на месте, а карточка о ней забыла — возвращаем.
          // Так голос находится сам, без всякого участия человека.
          card.audio = true;
          if (!card.audioLen) {
            const parts = sanitizeParts(card.parts);
            card.audioLen = parts.length
              ? Math.round(parts.reduce((s, p) => s + p.len, 0) * 100) / 100 : 1;
          }
          back++;
        }
      });
      if (fixed || back) { save(); render(); }
      done(fixed + back);
    }).catch(() => done(0));   // хранилище недоступно — не трогаем
  }

  /** Можно ли вообще записывать здесь и сейчас. */
  function recordingSupport() {
    if (!self.isSecureContext) {
      return { ok: false, why: 'context' };   // открыто как файл, не через сервер
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia
        || typeof self.MediaRecorder === 'undefined') {
      return { ok: false, why: 'unsupported' };
    }
    if (!AudioStore.available()) return { ok: false, why: 'storage' };
    return { ok: true };
  }

  const RECORD_HELP = {
    context: 'Запись звука недоступна, когда файл открыт напрямую: браузер '
      + 'разрешает микрофон только на защищённой странице. Запустите '
      + 'приложение через start.command — по адресу localhost запись '
      + 'работает. На iPhone нужен тот же способ.',
    unsupported: 'Этот браузер не умеет записывать звук. Попробуйте Safari '
      + 'или Chrome посвежее.',
    storage: 'Браузер не даёт сохранить запись. В приватном окне это '
      + 'ограничение обычное — откройте обычное окно.',
  };

/* ─── 08-dom-nav.js ────────────────────────────────────────────────────
 * Утилиты DOM, состояние навигации, переходы между экранами
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Утилиты DOM. Текст только через textContent — никакого innerHTML.
  // ------------------------------------------------------------------
  function el(tag, opts, children) {
    const node = document.createElement(tag);
    if (opts) {
      if (opts.class) node.className = opts.class;
      if (opts.text != null) node.textContent = String(opts.text);
      if (opts.attrs) {
        for (const k of Object.keys(opts.attrs)) {
          node.setAttribute(k, String(opts.attrs[k]));
        }
      }
      if (opts.style) {
        for (const k of Object.keys(opts.style)) {
          node.style.setProperty(k, String(opts.style[k]));
        }
      }
      if (opts.on) {
        for (const k of Object.keys(opts.on)) node.addEventListener(k, opts.on[k]);
      }
    }
    if (children) {
      for (const c of children) if (c) node.appendChild(c);
    }
    return node;
  }

  function clear(node) {
    // Сначала сам текст узла, потом дети. Порядок важен: узел мог быть
    // заполнен и тем, и другим — например, оформленная карточка сперва
    // рисовалась простым текстом, а потом кусками. Убрать только детей
    // мало: прежний текст остался бы и склеился с новым.
    node.textContent = '';
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ------------------------------------------------------------------
  // Состояние навигации
  // ------------------------------------------------------------------
  let state = load();
  let view = { name: 'home', sectionId: null, deckId: null, index: 0 };
  const root = document.getElementById('app');

  /**
   * Открыть сразу нужную карточку, если её попросили в адресе.
   *
   * Так работает переход из напоминания: в событии календаря лежит
   * ссылка на приложение с номером карточки, и по ней открывается не
   * главный экран, а сама карточка — с её цветом, текстом и голосом.
   * Уведомление системное, нарисовать в нём карточку нельзя; но от
   * уведомления до настоящей карточки остаётся одно нажатие.
   */
  function openFromAddress() {
    const q = (typeof location !== 'undefined' && location.search) || '';
    const m = /[?&]card=([^&#]+)/.exec(q);
    if (!m) return;
    let want = '';
    try { want = decodeURIComponent(m[1]); } catch (e) { want = m[1]; }
    if (!want) return;
    for (const sec of state.sections) {
      for (const deck of sec.decks) {
        const k = deck.cards.findIndex((c) => c.id === want);
        if (k >= 0) {
          view = { name: 'read', sectionId: sec.id, deckId: deck.id, index: k };
          return;
        }
      }
    }
    // Карточки нет — значит, её удалили или переименовали устройство.
    // Молча остаёмся на главном экране: ругаться тут не на что.
  }
  openFromAddress();

  function findSection(id) { return state.sections.find((s) => s.id === id) || null; }
  function findDeck(sectionId, deckId) {
    const s = findSection(sectionId);
    return s ? (s.decks.find((d) => d.id === deckId) || null) : null;
  }

  // ------------------------------------------------------------------
  // Где человек стоял на каждом экране.
  //
  // Когда все разделы раскрыты, главный экран длиннее телефона: пока
  // доберёшься до нижней колоды, прокрутишь половину списка. Зайти в
  // неё и вернуться — и приложение выбрасывало в самое начало, а
  // искать это место приходилось заново, каждый раз.
  //
  // Ключ у каждого экрана свой: у главного один, у каждой колоды —
  // свой. Поэтому возврат приводит туда, где стоял, а вход в другую
  // колоду начинается сверху, как и должен.
  // ------------------------------------------------------------------
  const spots = {};
  const spotKey = (v) => (v.name === 'deck' ? 'deck:' + v.deckId
    : v.name === 'read' ? 'read:' + v.deckId : 'home');
  // Какой экран сейчас на виду. Нужно, чтобы отличить переход на другой
  // экран от простой перерисовки того же самого: место запоминается для
  // перехода, а при перерисовке трогать прокрутку нельзя.
  let shownKey = null;

  function go(next) {
    // Запоминаем место ДО перерисовки: после неё страница уже другой
    // высоты, и спрашивать у неё поздно
    if (typeof window !== 'undefined') {
      spots[spotKey(view)] = window.scrollY || window.pageYOffset || 0;
    }
    view = Object.assign({ name: 'home', sectionId: null, deckId: null, index: 0 }, next);
    render();
  }

/* ─── 09-screen-home.js ────────────────────────────────────────────────
 * Экран 1: разделы и колоды
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Экран 1: разделы и колоды
  // ------------------------------------------------------------------
  function renderHome() {
    const frag = document.createDocumentFragment();

    // Наверху две кнопки, и обе на каждый день.
    //
    // Слева — «свернуть или развернуть всё»: список разделов длинный, и
    // чаще всего нужно либо увидеть его целиком, либо свернуть до одних
    // названий. Раньше это приходилось делать по разделу за раз.
    //
    // Справа — «⋯»: за ней прячутся три редких действия — отдать файл,
    // взять файл и обновить само приложение. Каждым из них пользуются
    // раз в неделю, а место наверху они занимали всё время.
    const anyOpen = homeOpen();
    frag.appendChild(el('div', { class: 'topbar' }, [
      el('h1', { text: 'Аффирмации' }),
      el('button', {
        class: 'iconbtn fold', attrs: {
          type: 'button',
          // Подпись постоянная, как и сам значок: кнопка одна и делает
          // одно — переключает. Что именно случится, видно по экрану, а
          // не по кнопке. Для голосового чтения состояние передаётся
          // отдельно, через aria-expanded, — на вид это не влияет.
          'aria-label': 'Свернуть или развернуть все разделы',
          title: 'Свернуть или развернуть все разделы',
          'aria-expanded': String(anyOpen),
        },
        on: { click: () => toggleAllSections() },
      }, [
        // Две галочки, расходящиеся от середины. Рисуются рамками, без
        // картинок и без SVG: так значок остаётся чётким на любом экране
        // и берёт цвет у самой кнопки.
        el('span', { class: 'fold-mark' }),
      ]),
      // Плейлист — прямо отсюда, не открывая ни одной карточки и не
      // запуская звука. Показывается, только когда в нём что-то есть:
      // пустой список открывать незачем.
      playlistSize() ? el('button', {
        class: 'iconbtn listbtn', attrs: {
          'aria-label': 'Плейлист', title: 'Плейлист', type: 'button' },
        text: '☰', on: { click: () => openPlaylist() },
      }) : null,
      el('button', {
        class: 'iconbtn', attrs: {
          'aria-label': 'Ещё', title: 'Ещё', type: 'button' },
        text: '⋯', on: { click: openMore },
      }),
    ]));

    if (state.syncedAt) {
      frag.appendChild(el('p', { class: 'sync-note',
        text: 'Последняя синхронизация: ' + humanTime(state.syncedAt) }));
    }

    if (state.sections.length === 0) {
      frag.appendChild(el('p', { class: 'empty', text: 'Пока пусто. Создайте первый раздел.' }));
    }

    // Избранное — не отдельная колода, а ссылки на настоящие карточки.
    // Так удаление и правка всегда идут по одному живому объекту, и не
    // возникает копии, которая рассинхронизируется с оригиналом.
    const favs = collectFavourites();
    if (favs.length > 0) {
      const favHead = el('div', { class: 'section-head' }, [
        el('button', {
          class: 'section-toggle', attrs: {
            type: 'button', 'aria-expanded': String(!state.favCollapsed) },
          on: { click: () => { state.favCollapsed = !state.favCollapsed; save(); render(); } },
        }, [
          el('span', { class: 'chev' + (state.favCollapsed ? ' closed' : ''), text: '⌄' }),
          el('h2', { text: 'Избранное' }),
          el('span', { class: 'section-count', text: cardsLabel(favs.length) }),
        ]),
        el('button', {
          class: 'iconbtn ghost',
          attrs: { 'aria-label': 'Управление избранным', type: 'button' },
          text: '✎', on: { click: manageFavourites },
        }),
      ]);

      const favSection = el('div', { class: 'section' }, [favHead]);
      if (!state.favCollapsed) {
        const list = el('div', { class: 'card-list' });
        favs.forEach((f) => {
          const sw = el('span', { class: 'mini-swatch' });
          sw.style.setProperty('background-color', f.card.color);
          sw.style.setProperty('border-color', CARD_EDGE[f.card.color] || f.card.color);

          // Строка — не кнопка, а контейнер: внутри две независимые зоны.
          // Иначе нажатие на сердечко срабатывало бы и как открытие карточки.
          const open = el('button', {
            class: 'mini-open', attrs: { type: 'button' },
            on: { click: () => go({ name: 'read', sectionId: f.sectionId,
                                    deckId: f.deckId, index: f.index }) },
          }, [
            sw,
            f.card.head
              ? paintText(el('span', { class: 'mini-text head' }),
                          f.card.head, f.card.headMarks)
              : paintText(el('span', { class: 'mini-text' }), f.card.text, f.card.marks),
            f.card.audio ? el('span', { class: 'mini-audio', text: '♪' }) : null,
          ]);

          const heart = el('button', {
            class: 'iconbtn heart on', attrs: {
              type: 'button', 'aria-pressed': 'true',
              'aria-label': 'Убрать из избранного' },
            text: '♥',
            on: { click: () => { f.card.fav = false; save(); render(); } },
          });

          list.appendChild(el('div', { class: 'mini' }, [open, heart]));
        });
        favSection.appendChild(list);
      }
      frag.appendChild(favSection);
    }

    for (const section of state.sections) {
      // Заголовок раздела — кнопка: нажатие сворачивает и разворачивает.
      // Карандаш вынесен отдельной кнопкой рядом, иначе правка и
      // сворачивание конфликтовали бы на одном нажатии.
      const toggle = el('button', {
        class: 'section-toggle', attrs: {
          type: 'button',
          'aria-expanded': String(!section.collapsed),
        },
        on: { click: () => { section.collapsed = !section.collapsed; save(); render(); } },
      }, [
        el('span', { class: 'chev' + (section.collapsed ? ' closed' : ''), text: '⌄' }),
        el('h2', { text: section.name }),
        el('span', { class: 'section-count', text: decksLabel(section.decks.length) }),
      ]);

      const head = el('div', { class: 'section-head' }, [
        toggle,
        el('button', {
          class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить раздел', type: 'button' },
          text: '✎', on: { click: () => editSection(section) },
        }),
      ]);

      // movable и data-section — метки для переноса удержанием.
      // «Избранное» выше тоже нарисовано как раздел, но переносить его
      // некуда: у него нет колод. Поэтому метку получают только настоящие
      // разделы, и перенос ориентируется именно по ней.
      if (section.collapsed) {
        const box = el('div', {
          class: 'section movable collapsed',
          attrs: { 'data-section': section.id },
        }, [head]);
        frag.appendChild(box);
        dragSection(head, section);
        continue;
      }

      const grid = el('div', { class: 'deck-grid' });
      for (const deck of section.decks) {
        const single = deck.cards.length <= 1;
        const tile = el('button', {
          class: 'deck' + (single ? ' single' : ''),
          style: { background: deck.color },
          attrs: { type: 'button' },
          on: { click: () => go({ name: 'deck', sectionId: section.id, deckId: deck.id }) },
        }, [
          el('p', { class: 'deck-title', text: deck.name }),
          el('span', { class: 'deck-count', text: cardsLabel(deck.cards.length) }),
        ]);
        dragDeck(tile, section, deck);
        grid.appendChild(tile);
      }
      grid.appendChild(el('button', {
        class: 'add-tile', attrs: { type: 'button' },
        text: '+ Колода',
        on: { click: () => editDeck(section, null) },
      }));

      frag.appendChild(el('div', {
        class: 'section movable',
        attrs: { 'data-section': section.id },
      }, [head, grid]));
      dragSection(head, section);
    }

    // after-sections — метка конца списка. Когда раздел несут в самый
    // низ, ячейка встаёт перед ней, а не после кнопки создания.
    frag.appendChild(el('div', { class: 'section after-sections' }, [
      el('button', {
        class: 'btn sec', attrs: { type: 'button' }, text: '+ Новый раздел',
        on: { click: () => editSection(null) },
      }),
    ]));

    // Экран заворачиваем в один узел: анимация возврата двигает его
    // целиком. Без обёртки уехала бы только первая строка.
    const page = el('div', { class: 'page' });
    page.appendChild(frag);
    return page;
  }

  /** Список избранного с возможностью убрать по одной или все сразу. */
  function manageFavourites() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });

    // Окно перерисовывается на месте: после снятия сердечка список
    // должен обновиться сразу, не закрываясь
    function draw() {
      clear(sheet);
      const favs = collectFavourites();
      sheet.appendChild(el('h3', { text: 'Избранное — ' + cardsLabel(favs.length) }));

      if (favs.length === 0) {
        sheet.appendChild(el('p', { class: 'empty', text: 'Список пуст.' }));
      } else {
        const list = el('div', { class: 'card-list scroll' });
        favs.forEach((f) => {
          const sw = el('span', { class: 'mini-swatch' });
          sw.style.setProperty('background-color', f.card.color);
          sw.style.setProperty('border-color', CARD_EDGE[f.card.color] || f.card.color);
          list.appendChild(el('div', { class: 'mini row' }, [
            sw,
            el('span', { class: 'mini-text', text: f.card.text }),
            el('button', {
              class: 'iconbtn heart on',
              attrs: { type: 'button', 'aria-label': 'Убрать из избранного' },
              text: '♥',
              on: { click: () => { f.card.fav = false; save(); draw(); render(); } },
            }),
          ]));
        });
        sheet.appendChild(list);
        sheet.appendChild(el('button', {
          class: 'btn danger', attrs: { type: 'button' },
          style: { width: '100%', 'margin-top': '12px' },
          text: 'Убрать все из избранного',
          on: {
            click: () => {
              if (!confirm('Убрать все карточки из избранного? Сами карточки останутся.')) return;
              collectFavourites().forEach((x) => { x.card.fav = false; });
              save(); draw(); render();
            },
          },
        }));
      }

      sheet.appendChild(el('p', { class: 'hint', text:
        'Сердечко убирает карточку из избранного. Сама карточка остаётся '
        + 'в своей колоде.' }));
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Готово',
                       on: { click: close } }),
      ]));
    }

    draw();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  function decksLabel(n) {
    const mod10 = n % 10, mod100 = n % 100;
    let word = 'колод';
    if (mod10 === 1 && mod100 !== 11) word = 'колода';
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = 'колоды';
    return n + ' ' + word;
  }

  function collectFavourites() {
    const out = [];
    for (const s of state.sections) {
      for (const d of s.decks) {
        d.cards.forEach((c, idx) => {
          if (c.fav) out.push({ sectionId: s.id, deckId: d.id, index: idx, card: c });
        });
      }
    }
    return out;
  }

  function cardsLabel(n) {
    const mod10 = n % 10, mod100 = n % 100;
    let word = 'карточек';
    if (mod10 === 1 && mod100 !== 11) word = 'карточка';
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = 'карточки';
    return n + ' ' + word;
  }

/* ─── 10-screen-deck.js ────────────────────────────────────────────────
 * Экран 2: карточки колоды и жест «назад»
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Экран 2: карточки колоды
  // ------------------------------------------------------------------
  function renderDeck() {
    const section = findSection(view.sectionId);
    const deck = findDeck(view.sectionId, view.deckId);
    if (!section || !deck) return renderHome();

    const frag = document.createDocumentFragment();
    frag.appendChild(el('div', { class: 'topbar' }, [
      el('button', {
        class: 'iconbtn', attrs: { 'aria-label': 'Назад', type: 'button' },
        text: '‹', on: { click: () => go({ name: 'home' }) },
      }),
      el('h1', { class: 'small', text: deck.name }),
      el('button', {
        class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить колоду', type: 'button' },
        text: '✎', on: { click: () => editDeck(section, deck) },
      }),
    ]));

    const list = el('div', { class: 'card-list' });
    if (deck.cards.length === 0) {
      list.appendChild(el('p', { class: 'empty', text: 'В колоде пока нет карточек.' }));
    }
    deck.cards.forEach((card, i) => {
      const swatch = el('span', { class: 'mini-swatch' });
      swatch.style.setProperty('background-color', card.color);
      swatch.style.setProperty('border-color', CARD_EDGE[card.color] || card.color);
      // Пока у строки открыта кнопка, нажатие по ней ничего не делает —
      // оно только закрывает строку. Проверка стоит здесь, в самих
      // обработчиках: они повешены раньше сторожа из attachRowSwipe, и
      // остановить их снаружи уже нельзя.
      const busy = () => {
        if (openRow === row) return true;
        // Это же нажатие только что закрыло строку — открывать
        // карточку им нельзя, иначе передумать не выйдет
        if (justClosed === row) { justClosed = null; return true; }
        return false;
      };

      // Номер не хранится, а считается от начала списка: после переноса
      // нумерация сама остаётся сплошной
      const open = el('button', {
        class: 'mini-open', attrs: { type: 'button' },
        on: { click: () => {
          if (busy()) return;
          go({ name: 'read', sectionId: section.id, deckId: deck.id, index: i });
        } },
      }, [
        el('span', { class: 'mini-num', text: String(i + 1) }),
        swatch,
        // Есть название — показываем его: искать нужную карточку глазами
        // по названию проще, чем по началу текста. Нет — как и было.
        card.head
          ? paintText(el('span', { class: 'mini-text head' }), card.head, card.headMarks)
          : paintText(el('span', { class: 'mini-text' }), card.text, card.marks),
        card.audio ? el('span', { class: 'mini-audio', text: '♪' }) : null,
        // Полупрозрачная «Б» — у карточки заполнен оборот. Без неё о нём
        // можно забыть насовсем: в списке видно только лицо, а
        // переворачивают карточку уже внутри.
        backFilled(card)
          ? el('span', { class: 'mini-side', text: 'Б',
                         attrs: { title: 'Есть обратная сторона' } })
          : null,
      ]);

      // Сердечко прямо в списке. Раньше в избранное можно было положить
      // только из самой карточки: открой, отметь, вернись. Здесь оно
      // отмечается на месте, одним нажатием, и карточка при этом никуда
      // из колоды не девается — просто появляется ещё и в «Избранном»
      // на главном экране.
      const heart = el('button', {
        class: 'iconbtn heart' + (card.fav ? ' on' : ''),
        attrs: {
          type: 'button',
          'aria-pressed': String(!!card.fav),
          'aria-label': card.fav ? 'Убрать из избранного' : 'В избранное',
        },
        text: card.fav ? '♥' : '♡',
        on: { click: () => {
          if (busy()) return;
          card.fav = !card.fav;
          save();
          render();
        } },
      });

      // Строка — не кнопка, а контейнер: внутри две независимые зоны.
      // Иначе нажатие на сердечко открывало бы заодно и карточку.
      const row = el('div', { class: 'mini' }, [open, heart]);

      // Обёртка нужна двум разным жестам сразу. Кнопка «В колоду» лежит
      // под строкой у правого края и открывается, когда строка уезжает
      // влево. А при переносе вверх-вниз поднимается именно обёртка,
      // целиком со своей кнопкой, — иначе кнопка осталась бы на месте.
      const move = el('button', {
        class: 'row-move', attrs: { type: 'button', 'aria-label':
          'Перенести карточку в другую колоду' },
        on: { click: () => { closeRow(true); moveCardTo(deck, card); } },
      }, [
        el('span', { class: 'row-move-icon', text: '→' }),
        el('span', { class: 'row-move-text', text: 'В колоду' }),
      ]);
      // Вторая кнопка — с другой стороны и с другим смыслом. Строка
      // уезжает вправо, и слева открывается удаление. Две стороны, два
      // действия: перепутать их движением руки нельзя.
      const kill = el('button', {
        class: 'row-kill', attrs: { type: 'button', 'aria-label':
          'Удалить карточку' },
        on: { click: () => {
          closeRow(true);
          if (!confirm('Удалить карточку «' + shortText(card.text) + '»?')) return;
          dropCard(deck, card);
        } },
      }, [
        el('span', { class: 'row-move-icon', text: '✕' }),
        el('span', { class: 'row-move-text', text: 'Удалить' }),
      ]);
      const holder = el('div', { class: 'card-row' }, [
        el('div', { class: 'row-actions left' }, [kill]),
        el('div', { class: 'row-actions' }, [move]),
        row,
      ]);
      attachRowSwipe(row);
      dragCard(row, holder, deck, card);
      list.appendChild(holder);
    });
    frag.appendChild(list);

    frag.appendChild(el('div', { class: 'section' }, [
      el('button', {
        class: 'btn', attrs: { type: 'button' }, text: '+ Карточка',
        on: { click: () => editCard(deck, null) },
      }),
    ]));

    // Возврат на главный экран — двумя пальцами вправо, в любом месте
    // экрана. Одним пальцем здесь занято: движение вправо по строке
    // открывает удаление карточки, влево — перенос в другую колоду.
    // Экран едет за руками, поэтому сразу видно, что жест поймался, и
    // его можно отменить, не доводя до конца. Кнопка «‹» на месте.
    const page = el('div', { class: 'page no-zoom' });
    page.appendChild(frag);
    attachBackSwipe(page, () => go({ name: 'home' }), true);
    return page;
  }

  /**
   * Жест «назад»: тянем слева направо, отпускаем — уходим назад.
   *
   * Слушаем весь экран, а не только левый край: на телефоне край
   * перехватывает сама система под свой жест «назад» в Safari, и наш
   * туда просто не долетает.
   */
  /**
   * Жест «назад» — экран уезжает вслед за рукой.
   *
   * pair — вести двумя пальцами. Так сделано в колоде: одним пальцем
   * там теперь открывается удаление карточки, и если бы «назад» тоже
   * ловился одним, каждое движение вправо значило бы сразу две вещи.
   * Два пальца ни с чем не путаются: на строке карточки такого жеста
   * нет, а прокрутке он не мешает.
   */
  function attachBackSwipe(node, onBack, pair) {
    let id = null, x0 = 0, y0 = 0, dx = 0, axis = null, swiped = false;
    let tPrev = 0, xPrev = 0, speed = 0;
    // Сколько пальцев сейчас на экране. Считаем по касаниям: у события
    // указателя такого числа нет, а знать его надо до первого движения.
    let touches = 0;
    // Начали ли жест у самого края экрана. Такому хватает одного пальца.
    let byEdge = false;

    // Слушаем корневой элемент, а не сам экран. Экран колоды короткий:
    // три карточки — и ниже пусто. Если вешать на него, в пустой области
    // жест просто не по чему поймать.
    const host = root;
    const now = () => Date.now();

    const down = (ev) => {
      if (sliding || drag || rowGesture) return;
      // Два пути к одному и тому же.
      //
      // От левого края — одним пальцем: рука тянется туда сама, и
      // спутать это движение не с чем, строки карточек там жест не
      // берут. В любом другом месте — двумя пальцами: одним там занято
      // открытие кнопок у строки.
      byEdge = ev.clientX <= EDGE_BACK;
      if (pair) {
        if (byEdge ? !ev.isPrimary : touches !== 2) return;
      } else if (!ev.isPrimary) return;
      // Кнопки НЕ исключаем: весь экран колоды состоит из кнопок-карточек,
      // и с таким запретом жест не начинался бы почти нигде. Вместо этого
      // ниже гасим нажатие, если палец поехал вбок.
      const t = ev.target;
      if (t && t.closest && t.closest('input, textarea')) return;
      id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      dx = 0; axis = null; swiped = false; speed = 0;
      tPrev = now(); xPrev = ev.clientX;
      node.style.setProperty('transition', 'none');
    };

    const move = (ev) => {
      if (ev.pointerId !== id) return;
      // Пока карточку несут или ведут вбок, экран уезжать не должен:
      // одно движение пальцем не может значить сразу «назад»,
      // «переставить» и «открыть кнопку»
      if (drag || rowGesture) return;
      // Палец подняли — жест двумя пальцами распался. Доводить его одним
      // нельзя: это уже другое движение. К краевому жесту не относится —
      // он с самого начала одним пальцем.
      if (pair && !byEdge && touches !== 2) { id = null; snapBack(); return; }
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (axis === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        // Вертикальное движение — это прокрутка списка, не мешаем ей.
        // Раньше горизонталь должна была быть в 1,3 раза больше вертикали.
        // Живой палец идёт по дуге, вертикальная составляющая почти всегда
        // есть — и жест то ловился, то нет. Теперь хватает простого
        // перевеса в сторону горизонтали, как при перелистывании карточки.
        axis = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        // Указатель забираем себе: иначе, если палец уедет с кнопки, под
        // которой начался жест, часть событий уходит другому элементу и
        // движение обрывается на полпути
        if (axis === 'x' && host.setPointerCapture) {
          try { host.setPointerCapture(id); } catch (e) { /* не поддержано */ }
        }
        // Слой под сдвиг просим только теперь, когда жест начался.
        // Держать его всё время нельзя: экран длиннее окна, и постоянный
        // слой во всю его высоту ломает прокрутку колесом мыши.
        if (axis === 'x') node.style.setProperty('will-change', 'transform');
      }
      if (axis !== 'x') return;
      if (ev.cancelable) ev.preventDefault();

      // Скорость считаем по последнему отрезку, а не по всему жесту:
      // важно, как палец шёл перед отрывом, а не как он размышлял в начале
      const tNow = now();
      if (tNow > tPrev) {
        speed = (ev.clientX - xPrev) / (tNow - tPrev);
        tPrev = tNow; xPrev = ev.clientX;
      }

      // Влево уходить некуда — там сопротивление
      dx = mx < 0 ? mx * 0.2 : mx;
      // Нажатие гасим не при любом сдвиге вбок, а только при настоящем:
      // с прежней проверкой лёгкое дрожание пальца съедало обычное касание
      // карточки, и она не открывалась
      if (dx > 12) swiped = true;
      node.style.setProperty('transform', 'translateX(' + dx.toFixed(1) + 'px)');
      node.style.setProperty('opacity', String(Math.max(0.55, 1 - dx / 900)));
    };

    // ------------------------------------------------------------------
    // Трекпад на компьютере.
    //
    // Два пальца по трекпаду — это не касания: браузер не присылает ни
    // одного касания и ни одного второго указателя. Он присылает
    // горизонтальную прокрутку. Поэтому на компьютере тот же жест
    // приходится ловить совсем другим событием.
    //
    // Движение пальцев вправо даёт отрицательный сдвиг: содержимое
    // уезжает влево, показывая то, что было слева, — ровно как «назад».
    // ------------------------------------------------------------------
    let padSum = 0, padTimer = null, padDone = false;

    const padReset = () => {
      padSum = 0; padDone = false;
      if (padTimer) { clearTimeout(padTimer); padTimer = null; }
    };

      node.style.setProperty('opacity', '1');

 * Оформление текста: отметки, отрисовка, ссылка, заголовок
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Оформление текста внутри карточки: жирный, курсив, подчёркнутый,
  // зачёркнутый — на выделенном куске.
  //
  // Хранится НЕ как разметка, а как сам текст плюс список отметок
  // {s, e, m}: с какого символа по какой и чем оформлено. Причина
  // простая и важная: во всём приложении текст человека ни разу не
  // становится разметкой — только textContent и createElement. Стоит
  // начать хранить в карточке HTML, и эта гарантия исчезает, а вместе с
  // ней и защита от подсунутого кода. Отметки же — это числа и четыре
  // буквы, подделать через них нечего.
  // ------------------------------------------------------------------
  // MARKS и MARK_LIMIT объявлены в самом начале файла — рядом с
  // остальными пределами. Здесь их нет намеренно: sanitizeMarks
  // вызывается при чтении сохранённого, а это происходит задолго до
  // этого места. См. подробное объяснение там.

  /** Привести отметки к порядку: целые числа, внутри текста, без мусора. */
  function sanitizeMarks(list, len) {
    if (!Array.isArray(list)) return [];
    const out = [];
    for (const raw of list) {
      if (!raw || typeof raw !== 'object') continue;
      let s = Math.floor(Number(raw.s)), e = Math.floor(Number(raw.e));
      if (!isFinite(s) || !isFinite(e)) continue;
      s = Math.max(0, Math.min(s, len));
      e = Math.max(0, Math.min(e, len));
      if (e <= s) continue;
      const m = String(raw.m || '').split('')
        .filter((c, k, all) => MARKS.indexOf(c) >= 0 && all.indexOf(c) === k)
        .sort().join('');
      if (!m) continue;
      out.push({ s: s, e: e, m: m });
      if (out.length >= MARK_LIMIT) break;
    }
    return out;
  }

  /** Отметки → по одному набору букв на каждый символ. */
  function marksToCells(marks, len) {
    const cells = new Array(len);
    for (let i = 0; i < len; i++) cells[i] = '';
    (marks || []).forEach((mk) => {
      for (let i = mk.s; i < mk.e && i < len; i++) {
        for (const c of mk.m) if (cells[i].indexOf(c) < 0) cells[i] += c;
      }
    });
    return cells.map((x) => x.split('').sort().join(''));
  }

  /** Обратно: соседние символы с одинаковым набором сливаются в отрезок. */
  function cellsToMarks(cells) {
    const out = [];
    let at = 0;
    while (at < cells.length) {
      const m = cells[at];
      let to = at + 1;
      while (to < cells.length && cells[to] === m) to++;
      if (m) out.push({ s: at, e: to, m: m });
      at = to;
    }
    return out;
  }

  /**
   * Переключить оформление на куске текста.
   * Если весь кусок уже так оформлен — снимаем, иначе ставим.
   */
  function toggleMark(marks, len, from, to, letter) {
    if (to <= from) return marks;
    const cells = marksToCells(marks, len);
    let all = true;
    for (let i = from; i < to; i++) if (cells[i].indexOf(letter) < 0) { all = false; break; }
    for (let i = from; i < to; i++) {
      const has = cells[i].indexOf(letter) >= 0;
      if (all && has) cells[i] = cells[i].split('').filter((c) => c !== letter).join('');
      else if (!all && !has) cells[i] = (cells[i] + letter).split('').sort().join('');
    }
    return cellsToMarks(cells);
  }

  /**
   * Подвинуть отметки вслед за правкой текста.
   *
   * Без этого достаточно дописать слово в начале — и всё оформление
   * съедет на несколько букв. Сравниваем старый текст с новым, находим
   * общее начало и общий конец, а середину считаем заменённой.
   */
  function shiftMarks(marks, before, after) {
    if (before === after) return marks;
    let p = 0;
    const max = Math.min(before.length, after.length);
    while (p < max && before[p] === after[p]) p++;
    let q = 0;
    while (q < max - p && before[before.length - 1 - q] === after[after.length - 1 - q]) q++;
    const cut = before.length - q;              // конец заменённого куска
    const delta = after.length - before.length;
    const move = (x) => (x <= p ? x : (x >= cut ? x + delta : p));
    const moved = (marks || []).map((mk) => ({ s: move(mk.s), e: move(mk.e), m: mk.m }));
    return sanitizeMarks(moved, after.length);

  /**
   * Нарисовать оформленный текст в узле.
   *
   * Строится из частей через createElement и textContent — разметка из
   * строки не разбирается нигде и никогда.
   */
  function paintText(node, text, marks) {
    clear(node);
    const clean = sanitizeMarks(marks, text.length);
    // Даже неоформленный текст кладём отдельным текстовым узлом, а не в
    // textContent. Для показа разницы нет, но в поле правки по этим узлам
    // считается, какие символы выделены, — а textContent их не создаёт.
    if (!clean.length) {
      if (text) node.appendChild(document.createTextNode(text));
      return node;
    }
    const cells = marksToCells(clean, text.length);
    let at = 0;
    while (at < text.length) {
      const m = cells[at];
      let to = at + 1;
      while (to < text.length && cells[to] === m) to++;
      const piece = text.slice(at, to);
      if (!m) {
        node.appendChild(document.createTextNode(piece));
      } else {
        const cls = ['mk'];
        if (m.indexOf('b') >= 0) cls.push('mk-b');
        if (m.indexOf('i') >= 0) cls.push('mk-i');
        // Текст внутрь кладём отдельным узлом, как и неоформленные куски:
        // по этим узлам поле правки считает выделение
        const span = el('span', { class: cls.join(' ') });
        span.appendChild(document.createTextNode(piece));
        // Подчёркивание и зачёркивание задаём одним свойством: два
        // отдельных правила перебили бы друг друга, и вместе они бы
        // никогда не показались
        const line = (m.indexOf('u') >= 0 ? 'underline ' : '')
          + (m.indexOf('s') >= 0 ? 'line-through' : '');
        if (line.trim()) span.style.setProperty('text-decoration', line.trim());
        node.appendChild(span);
      }
      at = to;
    }
    return node;
  }

  function dressText(node, card, kind) {

    // цвет, отдельные от текста аффирмации

  /**
   * Поле текста аффирмации с оформлением.

   * Обычное поле ввода тут не годится: в нём весь текст одного вида, и

   *
   * Разметка при этом по-прежнему нигде не разбирается: содержимое
   * собирается из частей через createElement, а наружу отдаётся простым
   * текстом плюс список отметок.
   */
  function richField(sheet, f) {
    let text = String(f.value || '');
    let marks = sanitizeMarks(f.marks || [], text.length);

    // f.one — поле в одну строку: название карточки. Высота меньше, а
    // растёт оно само, по мере набора. Всё остальное — те же кнопки,
    // те же отметки — работает и здесь.
    // Своя метка на каждой части поля: f-head у названия, f-text у
    // аффирмации. Полей в окне два, и по метке видно, чьи это кнопки.
    const tag = ' f-' + String(f.key || 'text');
    const box = el('div', {
      class: 'rich-input' + (f.one ? ' one' : '') + tag,
      attrs: { contenteditable: 'true', role: 'textbox', 'aria-multiline': 'true',
               'aria-label': f.label, spellcheck: 'true' },
    });

    /** Сколько символов идёт до этой точки в редактируемой области. */
    const offsetOf = (node, off) => {
      let total = 0, done = false;
      const walk = (n) => {
        if (done) return;
        if (n === node) {
          if (n.nodeType === 3) { total += off; done = true; return; }
          // Точка стоит между детьми: считаем всё, что левее
          const kids = n.childNodes || [];
          for (let i = 0; i < Math.min(off, kids.length); i++) walk(kids[i]);
          done = true;
          return;
        }
        if (n.nodeType === 3) { total += (n.nodeValue || '').length; return; }
        const kids = n.childNodes || [];
        for (let i = 0; i < kids.length; i++) { walk(kids[i]); if (done) return; }
      };
      walk(box);
      return total;
    };

    /**
     * Где сейчас курсор — даже если ничего не выделено.
     *
     * Возвращает { s, e }; при простом курсоре s и e совпадают. Это и
     * есть точка ввода, и без неё нельзя правильно вставить перевод
     * строки: раньше её просто не спрашивали.
     */
    const spot = () => {
      const sel = (typeof window !== 'undefined' && window.getSelection)
        ? window.getSelection() : null;
      if (!sel || !sel.rangeCount || !sel.anchorNode || !sel.focusNode) return null;
      const a = offsetOf(sel.anchorNode, sel.anchorOffset);
      const b = offsetOf(sel.focusNode, sel.focusOffset);
      return { s: Math.min(a, b), e: Math.max(a, b) };
    };

    /** Что сейчас выделено. Пустой курсор выделением не считается. */
    const selection = () => {
      const r = spot();
      return r && r.e > r.s ? r : null;
    };

    /** Вернуть выделение на прежние символы после перерисовки. */
    const select = (from, to) => {
      const sel = (typeof window !== 'undefined' && window.getSelection)
        ? window.getSelection() : null;
      if (!sel || !document.createRange) return;
      const nodes = [];
      const walk = (n) => {
        if (n.nodeType === 3) { nodes.push(n); return; }
        (n.childNodes || []).forEach(walk);
      };
      walk(box);
      let at = 0, a = null, ao = 0, b = null, bo = 0;
      for (const n of nodes) {
        const len = (n.nodeValue || '').length;
        if (a === null && from <= at + len) { a = n; ao = from - at; }
        if (b === null && to <= at + len) { b = n; bo = to - at; }
        at += len;
      }
      if (!a || !b) return;
      const r = document.createRange();
      r.setStart(a, ao); r.setEnd(b, bo);
      sel.removeAllRanges(); sel.addRange(r);
    };

    const paint = () => { paintText(box, text, marks); };

    const buttons = [
      { m: 'b', label: 'Ж', title: 'Жирный' },
      { m: 'i', label: 'К', title: 'Курсив' },
      { m: 'u', label: 'Ч', title: 'Подчёркнутый' },
      { m: 's', label: 'З', title: 'Зачёркнутый' },
    ];
    const bar = el('div', { class: 'rich-bar' + tag });

    /** Подсветить кнопки того оформления, что уже стоит на выделенном. */
    const refresh = () => {
      const r = selection();
      const cells = r ? marksToCells(marks, text.length) : null;
      buttons.forEach((b) => {
        let on = !!r;
        if (r) {
          for (let i = r.s; i < r.e; i++) {
            if (cells[i].indexOf(b.m) < 0) { on = false; break; }
          }
        }
        b.node.setAttribute('aria-pressed', String(on));
        b.node.className = 'rich-btn' + (on ? ' on' : '');
      });
    };

    buttons.forEach((b) => {
      b.node = el('button', {
        class: 'rich-btn',
        attrs: { type: 'button', 'aria-label': b.title, title: b.title,
                 'aria-pressed': 'false' },
        text: b.label,
      });
      // Не даём полю потерять выделение, пока палец идёт к кнопке
      b.node.addEventListener('pointerdown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      b.node.addEventListener('mousedown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      b.node.addEventListener('click', () => { apply(b.m); });
      bar.appendChild(b.node);
    });

    // ----------------------------------------------------------------
    // Вторая строка панели: выравнивание и цвет текста.
    //
    // Выравнивание одно на всю карточку. Кнопки работают как переключатель
    // из четырёх положений: нажал — выбралось, остальные погасли. Видно
    // сразу и в самом поле, не дожидаясь сохранения.
    // ----------------------------------------------------------------
    let align = sanitizeAlign(f.align);
    let ink = sanitizeInk(f.ink);

    const alignRow = el('div', { class: 'rich-bar rich-bar-2' + tag });
    const alignBtns = [
      { v: 'left', title: 'По левому краю' },
      { v: 'center', title: 'По центру' },
      { v: 'right', title: 'По правому краю' },
      { v: 'justify', title: 'По ширине' },
    ];

    /** Показать в поле то, что выбрано: и выравнивание, и цвет. */
    const dress = () => {
      const css = alignCss(align);
      box.style.setProperty('text-align', css);
      box.style.setProperty('color', ink);
      // В поле правки ровно то же, что получится на карточке
      box.className = 'rich-input' + (f.one ? ' one' : '')
        + (css === 'justify' ? ' just' : '') + tag;
      alignBtns.forEach((x) => {
        x.node.setAttribute('aria-pressed', String(x.v === align));
        x.node.className = 'rich-btn align align-' + x.v + (x.v === align ? ' on' : '');
      });
      swatches.forEach((x) => {
        x.node.setAttribute('aria-pressed', String(x.c === ink));
        x.node.className = 'ink-dot' + (x.c === ink ? ' on' : '');
      });
    };

    const swatches = [];

    alignBtns.forEach((x) => {
      x.node = el('button', {
        class: 'rich-btn align align-' + x.v,
        attrs: { type: 'button', 'aria-label': x.title, title: x.title,
                 'aria-pressed': 'false' },
      }, [
        // Значок — три-четыре полоски, нарисованные рамками. Ни картинок,
        // ни шрифтовых символов: те на разных устройствах разной ширины.
        el('span', { class: 'align-mark' }),
      ]);
      // Не даём полю потерять выделение, пока палец идёт к кнопке
      x.node.addEventListener('pointerdown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      x.node.addEventListener('mousedown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      x.node.addEventListener('click', () => { align = x.v; dress(); });
      alignRow.appendChild(x.node);
    });

    // Цвет текста. Готовые цвета, а не круг с оттенками: на карточке
    // должно остаться читаемо, а из круга легко достать блёклое.
    const inkRow = el('div', { class: 'ink-row' + tag });
    INK_COLORS.forEach((c) => {
      const node = el('button', {
        class: 'ink-dot', style: { background: c },
        attrs: { type: 'button', 'aria-pressed': String(c === ink),
                 'aria-label': 'Цвет текста', title: 'Цвет текста' },
      });
      node.addEventListener('pointerdown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      node.addEventListener('mousedown', (ev) => {
        if (ev.preventDefault) ev.preventDefault();
      });
      node.addEventListener('click', () => { ink = c; dress(); });
      swatches.push({ c: c, node: node });
      inkRow.appendChild(node);
    });

    // Правка текста: отметки едут следом, перерисовку не делаем — иначе
    // сбивалась бы точка ввода и подсказки клавиатуры на телефоне
    box.addEventListener('input', () => {
      let now = box.textContent || '';
      if (f.max && now.length > f.max) now = now.slice(0, f.max);
      marks = shiftMarks(marks, text, now);
      text = now;
      refresh();
    });
    ['keyup', 'pointerup', 'mouseup', 'select', 'focus'].forEach((type) => {
      box.addEventListener(type, refresh);
    });

    // Перевод строки вставляем сами: браузеры иначе норовят создать
    // вложенные блоки, а нам нужен ровно один плоский текст.
    //
    // Здесь и была ошибка «Enter не работает». Спрашивали не точку ввода,
    // а выделение, — а выделения при простом курсоре нет. Каждый Enter
    // молча уходил в самый конец текста: встанешь в начало, нажмёшь — и
    // перенос появляется где-то внизу, а не под курсором.
    box.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Enter' || ev.shiftKey) return;
      if (ev.preventDefault) ev.preventDefault();
      const now = box.textContent || '';
      // Текст берём прямо из поля: последние набранные буквы могли ещё
      // не дойти до нашей копии, и тогда перенос встал бы не туда
      if (now !== text) { marks = shiftMarks(marks, text, now); text = now; }
      const r = spot() || { s: text.length, e: text.length };
      const at = Math.max(0, Math.min(r.s, text.length));
      const to = Math.max(at, Math.min(r.e, text.length));
      text = text.slice(0, at) + '\n' + text.slice(to);
      marks = shiftMarks(marks, now, text);
      paint();
      select(at + 1, at + 1);
      refresh();
    });

    /**
     * Применить оформление к тому, что выделено.
     * Общая точка для наших кнопок, сочетаний клавиш и системного меню.
     */
    const apply = (letter) => {
      const r = selection();
      if (!r) return false;
      marks = toggleMark(marks, text.length, r.s, r.e, letter);
      paint();                    // изменения видны сразу, в поле
      select(r.s, r.e);           // выделение остаётся — можно нажать ещё
      refresh();
      return true;
    };

    /**
     * Жирный, курсив и подчёркнутый умеет запрашивать и сама система:
     * сочетанием Cmd+B или через меню «Шрифт» по правой кнопке мыши на
     * Маке. Браузер сообщает об этом заранее, событием beforeinput с
     * пометкой formatBold и подобными.
     *
     * Перехватываем и делаем сами. Если отдать это браузеру, он вставит
     * в поле свою разметку — а приложение хранит оформление отдельным
     * списком отметок и такую вставку просто не заметит: она пропала бы
     * при сохранении. Лучше один путь для всех способов.
     */
    const BY_INPUT = {
      formatBold: 'b', formatItalic: 'i',
      formatUnderline: 'u', formatStrikeThrough: 's',
    };
    box.addEventListener('beforeinput', (ev) => {
      const letter = BY_INPUT[ev.inputType];
      if (!letter) return;
      if (ev.preventDefault) ev.preventDefault();
      apply(letter);
    });
    // Запасной путь для браузеров, которые о таком заранее не сообщают
    box.addEventListener('keydown', (ev) => {
      if (!(ev.metaKey || ev.ctrlKey) || ev.altKey) return;
      const letter = { b: 'b', i: 'i', u: 'u' }[String(ev.key || '').toLowerCase()];
      if (!letter) return;
      if (ev.preventDefault) ev.preventDefault();
      apply(letter);
    });

    paint();
    refresh();
    // Поле НЕ внутри <label>. С обычным полем ввода это работало, а с
    // редактируемой областью ломает саму правку: нажатие по метке Safari
    // переадресует, выделение теряется — и системное меню «Шрифт» с его
    // «жирный / курсив / подчёркнутый» показывается погашенным, потому
    // что редактировать, по мнению браузера, нечего.
    sheet.appendChild(el('div', { class: 'field' + tag }, [
      el('span', { class: 'field-label', text: f.label }), box,
    ]));
    sheet.appendChild(bar);
    sheet.appendChild(alignRow);
    sheet.appendChild(inkRow);
    dress();

    return {
      get value() { return box.textContent || ''; },
      __marks: () => sanitizeMarks(marks, (box.textContent || '').length),
      __align: () => align,
      __ink: () => ink,
    };
  }

/* ─── 13-drag-hold.js ──────────────────────────────────────────────────
 * Перенос удержанием: разделы меняются местами, колоды переезжают
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Перенос удержанием: разделы меняются местами, колоды переезжают
  // внутри раздела и в другие разделы.
  //
  // Почему именно удержание. На одном и том же касании уже висят три
  // разных смысла: нажатие на заголовок сворачивает раздел, нажатие на
  // колоду её открывает, а движение пальцем вверх-вниз прокручивает
  // страницу. Развести их иначе нельзя — палец должен сначала задержаться
  // на месте, и только тогда элемент «поднимается».
  //
  // Как это устроено. Поднятый элемент выходит из потока: он становится
  // absolute и едет за пальцем, а на его месте появляется пунктирная
  // ячейка. Дальше вся работа сводится к тому, чтобы переставлять эту
  // ячейку по странице, — раскладку считает сам браузер, и потому всё
  // сходится точно и при разной высоте разделов, и при переносе колоды
  // из одной сетки в другую. Соседи доезжают на новые места приёмом FLIP:
  // замерили «до», переставили, вернули сдвигом и сняли его с переходом.
  // ------------------------------------------------------------------
  const HOLD_MS = 400;     // сколько держать пальцем, чтобы поднять
  const HOLD_SLOP = 8;     // палец поехал раньше — значит, это прокрутка
  // Мышью не «держат», ею сразу тянут. И держать нечего: мышь не
  // прокручивает страницу перетаскиванием, разводить нечего с чем.
  // Поэтому на компьютере элемент берётся с первым же движением.
  const MOUSE_SLOP = 10;   // с какого сдвига мышь считается тянущей
  const LIFT_MS = 140;     // подъём элемента под пальцем
  const DROP_MS = 220;     // соседи расступаются и элемент опускается
  const EDGE = 64;         // у края экрана страница подкручивается сама
  const EDGE_SPEED = 12;   // на столько пикселей за кадр
  // Насколько должен отойти указатель, чтобы порядок поменялся снова.
  //
  // Без этого запаса перестановка мышью дрожала. Дело в том, что место
  // ячейки считается по тем позициям, которые ЕСТЬ сейчас, а перестановка
  // их и меняет: поставили ячейку — соседи разъехались — под тем же
  // курсором получилось уже другое место — поставили обратно. Мышь
  // присылает движения непрерывно, и так могло продолжаться без конца.
  // Запас разрывает этот круг: пока курсор стоит примерно на месте,
  // решение остаётся прежним.
  const PUT_SLOP = 10;

  let drag = null;         // сведения о текущем переносе
  let dragKill = 0;        // до какого времени гасим случайное нажатие
  let holdTimer = null;

  const cancelHold = () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  };

  const rectOf = (n) => (n && n.getBoundingClientRect
    ? n.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0,
                                    right: 0, bottom: 0 });
  const pageY = () => (typeof window !== 'undefined' && window.scrollY) || 0;
  const list = (cls) => {
    const found = root.querySelectorAll ? root.querySelectorAll('.' + cls) : [];
    return Array.prototype.slice.call(found);
  };

  /**
   * Переставить что-то в разметке так, чтобы соседи доехали на новые
   * места, а не перескочили. Приём известен как FLIP: узлы замеряются
   * до перестановки, после неё возвращаются сдвигом на прежнее место и
   * уже оттуда отпускаются с переходом.
   */
  function flipMove(nodes, mutate) {
    // «До» — там, где элемент виден СЕЙЧАС, вместе с недоигранным сдвигом
    // от прошлой перестановки: getBoundingClientRect его учитывает.
    const before = nodes.map(rectOf);
    mutate();
    // Прежний сдвиг снимаем до замера «после».
    //
    // Здесь и была та ошибка, из-за которой соседние плитки прыгали при
    // переносе мышью. Пальцем переставляют редко, и прошлое движение
    // успевает закончиться. Мышь идёт непрерывно, перестановка случается
    // на каждом втором движении — и «после» замерялось у элемента,
    // который ещё едет. Разница получалась посчитанной от полпути, а
    // сдвиг ставился от начала: элемент мгновенно перескакивал на
    // остаток прошлого хода. Теперь сдвиг сначала снимается, поэтому
    // «после» — это чистая новая раскладка, и элемент продолжает
    // движение оттуда, где его застали.
    nodes.forEach((n) => {
      n.style.setProperty('transition', 'none');
      n.style.setProperty('transform', 'translate3d(0,0,0)');
    });
    let moved = false;
    nodes.forEach((n, k) => {
      const now = rectOf(n);
      const dx = before[k].left - now.left, dy = before[k].top - now.top;
      if (!dx && !dy) return;
      moved = true;
      n.style.setProperty('transform',
        'translate3d(' + dx + 'px,' + dy + 'px,0)');
    });
    if (!moved) return;
    requestAnimationFrame(() => {
      nodes.forEach((n) => {
        n.style.setProperty('transition', 'transform ' + DROP_MS + 'ms ' + SLIDE_EASE);
        n.style.setProperty('transform', 'translate3d(0,0,0)');
      });
    });
  }

  /**
    * Все узлы, которые могут поехать при перестановке ячейки.
    *
    * Поднятый исключаем: его ведёт палец, и общий сдвиг от FLIP затёр бы
    * этот ход — элемент дёрнулся бы в сторону от пальца.
    */
  const shiftable = () => list('movable')
    .concat(list('deck')).concat(list('add-tile')).concat(list('card-row'))
    .filter((n) => !/\blifted\b/.test(n.className || ''));

  /**
   * Ожидание удержания. Общее для разделов и колод: отличается только
   * тем, что делать, когда элемент уже подняли.
   */
  /**
   * Слушать окно, пока идёт жест.
   *
   * Не элемент, а именно окно. Элемент под курсором меняется: он выходит
   * из потока, едет за пальцем, а курсор мышью легко его обгоняет и
   * оказывается над соседями. Захват указателя это чинит не везде и не
   * всегда — в Safari он теряется, когда узел переезжает в разметке, и
   * тогда движения уходят другому элементу, а перенос замирает.
   * Окно же на месте всегда, и до него событие доходит в любом случае.
   */
  function whileGesture(handlers) {
    const w = (typeof window !== 'undefined' && window.addEventListener)
      ? window : null;
    if (!w) return () => {};
    const on = [];
    Object.keys(handlers).forEach((type) => {
      w.addEventListener(type, handlers[type], true);
      on.push([type, handlers[type]]);
    });
    return () => on.forEach((h) => w.removeEventListener(h[0], h[1], true));
  }

  function attachHold(node, pick) {
    let id = null, x0 = 0, y0 = 0, mouse = false, off = null;

    const release = () => { if (off) { off(); off = null; } id = null; };

    /** Поднять элемент и забрать указатель себе. */
    const begin = () => {
      // Сначала поднимаем, и только потом забираем указатель: подъём
      // переносит узел в другое место разметки, а перенос узла сбрасывает
      // захват — в обратном порядке он бы просто потерялся
      pick(id, x0, y0);
      if (node.setPointerCapture) {
        try { node.setPointerCapture(id); } catch (e) { /* не поддержано */ }
      }
    };

    node.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary || drag) return;
      // Карандаш правки — отдельная кнопка, за него не тянем
      const t = ev.target;
      if (t && t.closest && t.closest('.iconbtn')) return;
      release();
      id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      mouse = ev.pointerType === 'mouse';
      cancelHold();

      const onMove = (e) => {
        if (e.pointerId !== id) return;
        if (drag && drag.id === id) { drag.move(e.clientX, e.clientY); return; }
        const dx = Math.abs(e.clientX - x0), dy = Math.abs(e.clientY - y0);
        if (mouse) {
          // Строку карточки могут вести вбок — это другой жест, свой.
          // Он объявляет о себе раньше: его порог меньше нашего.
          if (rowGesture) { release(); return; }
          if (dx < MOUSE_SLOP && dy < MOUSE_SLOP) return;
          begin();
          drag.move(e.clientX, e.clientY);
          return;
        }
        // Палец поехал раньше времени — это прокрутка, а не перенос
        if (dx > HOLD_SLOP || dy > HOLD_SLOP) { cancelHold(); release(); }
      };
      const onUp = (e) => {
        if (e.pointerId !== id) return;
        cancelHold();
        const live = drag && drag.id === id;
        release();
        if (live) drag.drop();
      };
      // Отмена — не то же, что отпускание. Систему может что-то прервать:
      // входящий звонок, второй палец, переключение приложения. Тогда
      // элемент возвращается на своё место, а порядок остаётся прежним:
      // молча переставить что-то из-за прерывания было бы неожиданно.
      const onCancel = (e) => {
        if (e.pointerId !== id) return;
        cancelHold();
        const live = drag && drag.id === id;
        release();
        if (live) drag.cancel();
      };
      off = whileGesture({ pointermove: onMove, pointerup: onUp,
                           pointercancel: onCancel });

      // Ждём удержания только от пальца. Мышь начнёт тянуть сама, с
      // первым движением: если требовать паузы и от неё, человек успевает
      // повести мышь раньше срока, ожидание отменяется порогом сдвига — и
      // не происходит ничего, а по отпусканию открывается карточка.
      if (mouse) return;
      holdTimer = setTimeout(() => { holdTimer = null; begin(); }, HOLD_MS);
    });
  }

  /**
   * Поднять элемент: вынуть из потока, поставить на его место ячейку.
   * Возвращает всё нужное для дальнейшего ведения за пальцем.
   */
  function lift(node, id, x0, y0, kind) {
    // Обёртка экрана — она же точка отсчёта для поднятого элемента
    // (у .page для этого задано position: relative).
    //
    // Ищем её по имени, а не берём первого ребёнка: сверху бывает ещё
    // полоска «готова новая версия», и тогда первым идёт она. Поднятая
    // плитка ушла бы внутрь этой полоски, а координаты считались бы от
    // неё — то есть от полосы высотой в сорок пикселей.
    const page = (root.querySelector && root.querySelector('.page'))
      || root.firstChild;
    const base = rectOf(page), box = rectOf(node);
    // Ячейка занимает ровно то же место, что и поднятый элемент, вместе с
    // внешними отступами: у раздела они есть, у плитки в сетке нет. Без
    // этого страница подпрыгивала бы на высоту отступа в момент подъёма.
    const slot = el('div', { class: 'drop-slot' + (kind ? ' ' + kind : '') });
    slot.style.setProperty('height', box.height + 'px');

    node.style.setProperty('width', box.width + 'px');
    node.style.setProperty('height', box.height + 'px');
    node.style.setProperty('left', (box.left - base.left) + 'px');
    node.style.setProperty('top', (box.top - base.top) + 'px');
    node.className = node.className + ' lifted';
    // Подъём показываем переходом, а следующие движения — уже без него:
    // за пальцем элемент должен идти без запаздывания
    node.style.setProperty('transition', 'transform ' + LIFT_MS + 'ms ease-out');
    node.style.setProperty('transform', 'translate3d(0,0,0) scale(1.03)');

    const parent = node.parentNode;
    if (parent && parent.insertBefore) parent.insertBefore(slot, node);
    else if (parent) parent.appendChild(slot);

    // Переносим поднятый узел прямо в страницу.
    //
    // Это не украшение, а необходимость. Элемент с absolute отсчитывается
    // от ближайшего предка со своим сдвигом, а FLIP как раз и ставит сдвиг
    // на разделы и плитки. Пока плитка лежала внутри своего раздела, стоило
    // разделу получить сдвиг — и отсчёт для плитки начинался уже от него:
    // плитка прыгала из-под пальца. В самой странице сдвиг один и тот же
    // всегда, поэтому координаты остаются теми, что померили при подъёме.
    if (page && page.appendChild) page.appendChild(node);

    return { page: page, base: base, box: box, slot: slot,
             id: id, x0: x0, y0: y0, scroll0: pageY(), first: true,
             putAt: null };
  }

  /**
   * Отошёл ли указатель от того места, где порядок менялся в прошлый раз.
   *
   * Возвращает да — и запоминает новое место. Возвращает нет — значит,
   * оставляем как есть: см. PUT_SLOP.
   */
  function farEnough(st, cx, cy) {
    const was = st.putAt;
    if (was && Math.abs(cx - was.x) < PUT_SLOP
        && Math.abs(cy - was.y) < PUT_SLOP) return false;
    st.putAt = { x: cx, y: cy };
    return true;
  }

  /** Вести поднятый элемент за пальцем. */
  function follow(node, st, cx, cy) {
    if (st.first) { st.first = false; node.style.setProperty('transition', 'none'); }
    const dy = (cy - st.y0) + (pageY() - st.scroll0);
    node.style.setProperty('transform',
      'translate3d(' + (cx - st.x0) + 'px,' + dy + 'px,0) scale(1.03)');
  }

  /**
   * Опустить элемент в ячейку и только потом переписать порядок.
   * Порядок меняем после хода: если сделать это сразу, страница
   * перерисуется под пальцем и движение оборвётся рывком.
   */
  function drop(node, st, commit) {
    stopEdgeScroll();
    // Куда ехать: элемент стоит от своего исходного места (st.box), а
    // ячейка меряется в текущих координатах экрана — поэтому разницу
    // берём между ними, с поправкой на прокрутку, если она была
    const to = rectOf(st.slot);
    const scrolled = pageY() - st.scroll0;
    node.style.setProperty('transition',
      'transform ' + DROP_MS + 'ms ' + SLIDE_EASE);
    node.style.setProperty('transform',
      'translate3d(' + (to.left - st.box.left) + 'px,'
      + (to.top - st.box.top + scrolled) + 'px,0) scale(1)');
    drag = null;
    dragKill = Date.now() + 400;
    setTimeout(() => { commit(); save(); render(); }, DROP_MS);
  }

  /** Вернуть элемент туда, откуда взяли, ничего не переставляя. */
  function back(node, st) {
    stopEdgeScroll();
    node.style.setProperty('transition',
      'transform ' + DROP_MS + 'ms ' + SLIDE_EASE);
    node.style.setProperty('transform', 'translate3d(0,0,0) scale(1)');
    drag = null;
    dragKill = Date.now() + 400;
    setTimeout(() => render(), DROP_MS);
  }

  // Подкрутка страницы, когда палец у самого края экрана: иначе длинный
  // список не пролистать, ведь обычная прокрутка на время переноса
  // отключена
  let edgeTimer = 0, edgeDir = 0;
  const stopEdgeScroll = () => {
    if (edgeTimer) cancelAnimationFrame(edgeTimer);
    edgeTimer = 0; edgeDir = 0;
  };
  function edgeScroll(cy) {
    const h = (typeof window !== 'undefined' && window.innerHeight) || 800;
    const dir = cy < EDGE ? -1 : (cy > h - EDGE ? 1 : 0);
    if (dir === edgeDir) return;
    edgeDir = dir;
    if (edgeTimer) { cancelAnimationFrame(edgeTimer); edgeTimer = 0; }
    if (!dir) return;
    const tick = () => {
      if (!drag || !edgeDir) { edgeTimer = 0; return; }
      if (typeof window !== 'undefined' && window.scrollBy) {
        window.scrollBy(0, edgeDir * EDGE_SPEED);
      }
      drag.move(drag.lastX, drag.lastY);
      edgeTimer = requestAnimationFrame(tick);
    };
    edgeTimer = requestAnimationFrame(tick);
  }

  // ------------------------------------------------------------------
  /** Перенос раздела: меняем разделы местами по вертикали. */
  function dragSection(head, section) {
    attachHold(head, (id, x0, y0) => {
      const node = head.parentNode;              // весь .section
      if (!node) return;
      const st = lift(node, id, x0, y0, 'as-section');
      let at = -1;

      /** Куда встанет раздел, если отпустить прямо сейчас. */
      const aim = (cy) => {
        const others = list('movable').filter((n) => n !== node);
        let k = 0;
        for (const n of others) {
          const r = rectOf(n);
          if (cy > r.top + r.height / 2) k++; else break;
        }
        return { index: k, others: others };
      };

      const put = (cx, cy) => {
        const t = aim(cy);
        if (t.index === at) return;
        if (!farEnough(st, cx, cy)) return;
        at = t.index;
        flipMove(shiftable(), () => {
          // Ниже последнего раздела ячейка встаёт перед меткой конца
          // списка: иначе она оказалась бы под кнопкой «+ Новый раздел»
          const after = t.others[at]
            || (root.querySelector ? root.querySelector('.after-sections') : null);
          const parent = st.slot.parentNode;
          if (parent) parent.removeChild(st.slot);
          if (after && after.parentNode && after.parentNode.insertBefore) {
            after.parentNode.insertBefore(st.slot, after);
          } else if (st.page) {
            st.page.appendChild(st.slot);
          }
        });
      };
      /** Первая расстановка — сразу, запас на неё не распространяется. */
      const putFirst = (cx, cy) => { st.putAt = null; put(cx, cy); };

      drag = {
        id: id, lastX: x0, lastY: y0,
        move: (cx, cy) => {
          drag.lastX = cx; drag.lastY = cy;
          follow(node, st, cx, cy);
          put(cx, cy);
          edgeScroll(cy);
        },
        cancel: () => back(node, st),
        drop: () => {
          const to = at < 0 ? state.sections.indexOf(section) : at;
          drop(node, st, () => {
            const from = state.sections.indexOf(section);
            if (from < 0 || to === from) return;
            state.sections.splice(from, 1);
            state.sections.splice(to, 0, section);
          });
        },
      };
      putFirst(x0, y0);
    });
  }


/* ─── 14-row-swipe.js ──────────────────────────────────────────────────
 * Свайп по строке карточки, перенос карточек и колод
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Свайп по строке карточки: сдвинули влево — справа открылась кнопка
  // «В колоду». Оттуда карточка переезжает в любую другую колоду.
  //
  // Почему влево, а не вправо. Вправо на экране колоды уже занято жестом
  // «назад», он уводит на главный экран. Две разные стороны — две разные
  // задачи, и спутать их нельзя.
  //
  // Строка едет, а кнопка стоит: она лежит под строкой у правого края и
  // просто открывается по мере того, как строка уходит. Так понятнее,
  // чем если бы кнопка выезжала сама.
  // ------------------------------------------------------------------
  const ACTION_W = 96;      // ширина открывающейся кнопки
  let openRow = null;       // сейчас открыта не больше одной строки
  let openSide = 0;         // -1 строка ушла влево, +1 вправо
  // Строка, которую только что закрыли нажатием. Нужна из-за порядка
  // обработчиков: сторож успевает закрыть строку раньше, чем до того же
  // нажатия доберётся открытие карточки, и то видит уже «ничего не
  // открыто». Без этой отметки карточка открывалась бы вместо отмены.
  let justClosed = null;
  let rowGesture = false;   // идёт свайп по строке — жест «назад» молчит

  /** Закрыть открытую строку, если она есть. */
  function closeRow(instant) {
    if (!openRow) return;
    const n = openRow;
    openRow = null;
    openSide = 0;
    n.style.setProperty('transition',
      instant ? 'none' : 'transform ' + DROP_MS + 'ms ' + SLIDE_EASE);
    n.style.setProperty('transform', 'translate3d(0,0,0)');
  }

  /** Короткий кусок текста для вопроса «удалить?». */
  function shortText(s) {
    const one = String(s || '').split('\n')[0].trim();
    return one.length > 40 ? one.slice(0, 40) + '…' : one;
  }

  /**
   * Повесить свайп на строку списка карточек.
   *   row  — сама строка, она и едет
   *   open — что делать, когда нажали открывшуюся кнопку
   */
  function attachRowSwipe(row) {
    let id = null, x0 = 0, y0 = 0, axis = null, dx = 0, was = 0;
    let tPrev = 0, xPrev = 0, speed = 0, eatClick = false, off = null;

    const release = () => { if (off) { off(); off = null; } id = null; };

    row.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary || drag) return;
      // У самого края экрана распоряжается жест «назад». Иначе одно и
      // то же движение значило бы сразу две вещи: и вернуться, и
      // удалить карточку.
      if (ev.clientX <= EDGE_BACK) return;
      release();
      id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      axis = null; speed = 0; eatClick = false;
      was = (openRow === row) ? openSide * ACTION_W : 0;
      dx = was;
      tPrev = Date.now(); xPrev = ev.clientX;
      // Слушаем окно, а не строку: мышью курсор легко уходит со строки
      // вбок, и на самой строке движения тогда просто перестают приходить
      off = whileGesture({ pointermove: onMove, pointerup: onUp,
                           pointercancel: onCancel });
