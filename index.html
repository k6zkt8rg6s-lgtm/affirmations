    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });
    const status = el('div', { class: 'sync-status' });

    // Без accept намеренно. С фильтром по типу файл, пришедший с iPhone
    // через «Поделиться», в окне выбора оказывался серым и не нажимался:
    // система помечает его не тем типом, который мы ожидали. Проверяем
    // не расширение, а содержимое — это и надёжнее, и безопаснее.
    const fileInput = el('input', {
      attrs: { type: 'file' },
      style: { display: 'none' },
    });
    fileInput.addEventListener('change', () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;
      // Потолок поднят: теперь в файл входят и голосовые записи,
      // а они весят куда больше текста
      if (f.size > 200 * 1024 * 1024) {
        report('Файл слишком большой', 'bad'); return;
      }
      report('Читаю файл…', 'wait');
      const reader = new FileReader();
      reader.onerror = () => report('Файл не читается', 'bad');
      reader.onload = () => {
        let parsed = null;
        try { parsed = JSON.parse(String(reader.result)); }
        catch (e) {
          report('Это не файл синхронизации.\nВыбран: ' + (f.name || 'без имени')
                 + '. Нужен файл affirmations-sync.json, сохранённый '
                 + 'кнопкой «Сохранить в файл».', 'bad');
          return;
        }
        const clean = sanitizeState(parsed);
        if (clean.sections.length === 0) {
          report('В файле нет разделов — загружать нечего.', 'bad'); return;
        }
        // Ничего не меняем сразу: сперва показываем, что внутри, и ждём
        // подтверждения. Раньше выбор файла молча всё применял, и было
        // непонятно, сработало вообще или нет.
        showPreview(f, parsed, clean);
      };
      reader.readAsText(f);
    });

    /**
     * Собрать файл синхронизации ВМЕСТЕ с голосовыми записями.
     *
     * Записи лежат в IndexedDB двоичными объектами, а в JSON их не
     * положишь — переводим в base64. Файл от этого растёт примерно на
     * треть от веса звука, но зато на втором устройстве появляются
     * не только тексты, но и голос.
     */
    function buildPayload() {
      const withAudio = [];
      for (const s of state.sections) {
        for (const d of s.decks) {
          for (const c of d.cards) if (c.audio) withAudio.push(c);
        }
      }
      if (withAudio.length === 0) {
        return Promise.resolve(JSON.stringify(
          Object.assign({}, state, { syncedAt: Date.now() }), null, 2));
      }

      report('Собираю записи: 0 из ' + withAudio.length + '…', 'wait');
      const clips = {};
      let done = 0;

      const next = (i) => {
        if (i >= withAudio.length) return Promise.resolve();
        const card = withAudio[i];
        return AudioStore.get(card.id)
          .then((blob) => (blob ? AudioStore.toText(blob) : null))
          .then((text) => { if (text) clips[card.id] = text; })
          .catch(() => { /* запись потерялась — переносим карточку без неё */ })
          .then(() => {
            done++;
            report('Собираю записи: ' + done + ' из '
              + withAudio.length + '…', 'wait');
            return next(i + 1);
          });
      };

      return next(0).then(() => {
        clear(status);
        return JSON.stringify(
          Object.assign({}, state, { syncedAt: Date.now(), clips: clips }), null, 2);
      });
    }

    function sendOut() {
      buildPayload().then(deliver).catch(() => {
        report('Не удалось собрать файл.', 'bad');
      });
    }

    function deliver(text) {
      if (typeof self.__capture === 'function') self.__capture(text);
      const blob = new Blob([text], { type: 'application/json' });
      const mb = blob.size / 1048576;
      const file = new File([blob], 'affirmations-sync.json',
                            { type: 'application/json' });
      // Через системное «Поделиться» файл кладётся прямо в iCloud Drive.
      // Если браузер этого не умеет — обычное скачивание, а дальше
      // пользователь сам перекладывает файл в облачную папку.
      const size = mb < 1 ? Math.round(blob.size / 1024) + ' КБ'
                          : mb.toFixed(1) + ' МБ';
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        // Передаём ТОЛЬКО файл. Если добавить title или text, iOS
        // сохраняет их отдельным текстовым файлом рядом — и на диске
        // оказывается два файла вместо одного.
        navigator.share({ files: [file] })
          .then(() => { state.syncedAt = Date.now(); save(); render();
                        report('Файл сохранён, ' + size + '.', 'ok'); })
          .catch(() => { /* пользователь отменил — это не ошибка */ });
        return;
      }
      const url = URL.createObjectURL(blob);
      const a = el('a', { attrs: { href: url, download: 'affirmations-sync.json' } });
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      state.syncedAt = Date.now(); save(); render();
      report('Файл сохранён (' + size + ').\nПоложите его в папку iCloud Drive.', 'ok');
    }

    /** Крупное заметное сообщение вместо мелкой серой строчки. */
    function report(text, kind) {
      clear(status);
      status.className = 'sync-status ' + (kind || '');
      status.appendChild(el('div', { text: text }));
    }

    /** Показать, что внутри файла, и дождаться подтверждения. */
    function showPreview(file, parsed, clean) {
      let cards = 0, decks = 0;
      for (const s of clean.sections) {
        decks += s.decks.length;
        for (const d of s.decks) cards += d.cards.length;
      }
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      const clipCount = Object.keys(clips).length;
      const when = (typeof parsed.syncedAt === 'number')
        ? humanTime(parsed.syncedAt) : 'дата неизвестна';

      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Что в файле' }));
      sheet.appendChild(el('p', { class: 'hint',
        text: (file.name || 'файл') + ' · ' + when }));
      sheet.appendChild(el('div', { class: 'sync-status ok' }, [
        el('div', { text: 'Разделов: ' + clean.sections.length }),
        el('div', { text: 'Колод: ' + decks }),
        el('div', { text: 'Карточек: ' + cards }),
        el('div', { text: 'Голосовых записей: ' + clipCount }),
      ]));
      sheet.appendChild(el('p', { class: 'hint', text:
        'Ваши карточки не пострадают: добавится только то, чего здесь ещё '
        + 'нет. Совпадающие пропускаются.' }));
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn sec', attrs: { type: 'button' },
                       text: 'Отмена', on: { click: drawMain } }),
        el('button', {
          class: 'btn', attrs: { type: 'button' },
          text: 'Загрузить в приложение',
          on: { click: () => applyImport(parsed, clean) },
        }),
      ]));
    }

    /** Здесь и только здесь данные действительно попадают в приложение. */
    function applyImport(parsed, clean) {
      clear(sheet);
      sheet.appendChild(el('h3', { text: 'Загрузка' }));
      sheet.appendChild(status);
      report('Переношу…', 'wait');

      const res = mergeState(clean);
      state.syncedAt = Date.now();
      save(); render();

      // Записи кладём после слияния: их надо привязать к тем карточкам,
      // которые только что появились, а у них новые идентификаторы
      const clips = (parsed && typeof parsed.clips === 'object' && parsed.clips)
        ? parsed.clips : {};
      importClips(res.audioLinks, clips, {
        set text(v) { report(v, 'wait'); },
      }, res.added, (cards, clipsDone) => {
        clear(sheet);
        sheet.appendChild(el('h3', { text: 'Готово' }));
        const lines = [];
        lines.push('Добавлено карточек: ' + cards);
        lines.push('Перенесено записей: ' + clipsDone);
        if (cards === 0 && clipsDone === 0) {
          lines.push('');
          lines.push('Нового не оказалось — всё это уже есть на устройстве.');
        }
        sheet.appendChild(el('div', { class: 'sync-status ok' },
          lines.map((x) => el('div', { text: x }))));
        sheet.appendChild(el('div', { class: 'sheet-actions' }, [
          el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Закрыть',
                         on: { click: () => { close(); render(); } } }),
        ]));
      });
    }

    function drawMain() {
    clear(sheet);
    sheet.appendChild(el('h3', { text: 'Синхронизация' }));
    sheet.appendChild(el('p', { class: 'hint', text:
      'Перенос карточек и голосовых записей между устройствами через файл '
      + 'в iCloud Drive.' }));

    // Слова «выгрузить» и «загрузить» отличаются одной буквой и легко
    // путаются. Пишем прямо, в какую сторону идут данные.
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn', attrs: { type: 'button' },
                     text: '↑  Сохранить в файл', on: { click: sendOut } }),
      el('p', { class: 'hint', text:
        'Отсюда — в файл. Делайте на том устройстве, где вносили изменения.' }),
    ]));
    sheet.appendChild(el('div', { class: 'sync-row' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' },
                     text: '↓  Взять из файла',
                     on: { click: () => fileInput.click() } }),
      el('p', { class: 'hint', text:
        'Из файла — сюда. Делайте на втором устройстве. Ваши карточки '
        + 'не стираются, добавляются только недостающие.' }),
    ]));
    sheet.appendChild(status);
    if (state.syncedAt) {
      sheet.appendChild(el('p', { class: 'hint',
        text: 'Последний раз: ' + humanTime(state.syncedAt) }));
    }
    sheet.appendChild(el('p', { class: 'hint', text:
      'Голосовые записи переносятся вместе с карточками. Из-за них файл '
      + 'заметно тяжелее — это нормально. Если запись уже есть на этом '
      + 'устройстве, она сохраняется, чужая её не затирает.' }));
    sheet.appendChild(el('div', { class: 'sheet-actions' }, [
      el('button', { class: 'btn sec', attrs: { type: 'button' }, text: 'Закрыть',
                     on: { click: close } }),
    ]));
    sheet.appendChild(fileInput);
    }

    drawMain();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  /**
   * Слить входящие данные с текущими: добавить недостающее, ничего не
   * потерять. Замена «всё на всё» при синхронизации между двумя
   * устройствами гарантированно однажды сотрёт то, что было сделано
   * на другом, — поэтому только добавление, по совпадению текста.
   */
  function mergeState(incoming) {
    let added = 0;
    // Пары «идентификатор в файле → карточка у нас»: по ним потом
    // разложим голосовые записи
    const audioLinks = [];
    for (const inSec of incoming.sections) {
      let sec = state.sections.find((s) => s.name === inSec.name);
      if (!sec) {
        sec = { id: uid(), name: inSec.name, collapsed: false, decks: [] };
        state.sections.push(sec);
      }
      for (const inDeck of inSec.decks) {
        let deck = sec.decks.find((d) => d.name === inDeck.name);
        if (!deck) {
          deck = { id: uid(), name: inDeck.name, color: inDeck.color, cards: [] };
          sec.decks.push(deck);
        }
        const byText = new Map(deck.cards.map((c) => [c.text.trim(), c]));
        for (const inCard of inDeck.cards) {
          const key = inCard.text.trim();
          const mine = byText.get(key);
          if (mine) {
            // Карточка уже есть. Запись подтянем, только если своей нет —
            // затирать собственную запись чужой было бы потерей данных
            if (inCard.audio && !mine.audio) {
              audioLinks.push({ from: inCard.id, card: mine, len: inCard.audioLen });
            }
            continue;
          }
          if (deck.cards.length >= LIMITS.cardsPerDeck) break;
          const fresh = { id: uid(), text: inCard.text, color: inCard.color,
                          fav: inCard.fav, audio: false, audioLen: 0 };
          deck.cards.push(fresh);
          byText.set(key, fresh);
          added++;
          if (inCard.audio) {
            audioLinks.push({ from: inCard.id, card: fresh, len: inCard.audioLen });
          }
        }
      }
    }
    return { added: added, audioLinks: audioLinks };
  }

  /** Разложить голосовые записи из файла по карточкам. */
  function importClips(links, clips, status, addedCards, onDone) {
    const todo = links.filter((l) => typeof clips[l.from] === 'string');
    const finish = (n) => {
      save(); render();
      if (typeof onDone === 'function') { onDone(addedCards, n); return; }
      const parts = [];
      parts.push(addedCards ? 'Добавлено карточек: ' + addedCards
                            : 'Новых карточек нет');
      if (n) parts.push('записей: ' + n);
      status.text = parts.join(', ') + '.';
    };

    if (todo.length === 0) { finish(0); return; }
    status.text = 'Переношу записи: 0 из ' + todo.length + '…';

    let ok = 0;
    const step = (i) => {
      if (i >= todo.length) { finish(ok); return; }
      const link = todo[i];
      const blob = AudioStore.fromText(clips[link.from]);
      const cont = () => {
        status.text = 'Переношу записи: ' + (i + 1) + ' из '
          + todo.length + '…';
        step(i + 1);
      };
      if (!blob) { cont(); return; }
      AudioStore.put(link.card.id, blob).then(() => {
        link.card.audio = true;
        link.card.audioLen = link.len || 0;
        ok++;
        cont();
      }).catch(cont);
    };
    step(0);
  }

  function exportBackup() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = el('a', { attrs: { href: url, download: 'affirmations-backup.json' } });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ------------------------------------------------------------------
  function render() {
    if (readerKeyHandler) {
      document.removeEventListener('keydown', readerKeyHandler);
      readerKeyHandler = null;
    }
    // Останавливаем звук и освобождаем ссылки прошлого экрана: без этого
    // запись продолжала бы играть после перехода на другую карточку
    stopRecording();
    audioCleanup.forEach((fn) => { try { fn(); } catch (e) { /* уже убрано */ } });
    audioCleanup = [];
    // Обработчики жеста «назад» висят на корне и переживают перерисовку —
    // снимаем их сами, иначе накопятся и начнут срабатывать по нескольку раз
    if (backSwipeCleanup) { backSwipeCleanup(); backSwipeCleanup = null; }
    clear(root);
    let content;
    if (view.name === 'read') content = renderReader();
    else if (view.name === 'deck') content = renderDeck();
    else content = renderHome();
    root.appendChild(content);
    window.scrollTo(0, 0);

    // Экран въезжает с той стороны, куда ушёл предыдущий. Смещение
    // ставим сразу, а снимаем на следующем кадре: в одном кадре браузер
    // не увидит промежуточного состояния и анимации не получится.
    if (pageEnter !== 0) {
      const dir = pageEnter;
      pageEnter = 0;
      const target = root.firstChild;
      if (target && target.style) {
        const w = target.offsetWidth || 400;
        target.style.setProperty('transition', 'none');
        target.style.setProperty('transform',
          'translateX(' + (dir > 0 ? w * 0.4 : -w * 0.4) + 'px)');
        target.style.setProperty('opacity', '0.4');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            target.style.setProperty('transition',
              'transform ' + SLIDE_MS + 'ms ' + SLIDE_EASE
              + ', opacity ' + Math.round(SLIDE_MS * 0.6) + 'ms linear');
            target.style.setProperty('transform', 'translateX(0)');
            target.style.setProperty('opacity', '1');
          });
        });
      }
    }
  }

  // ------------------------------------------------------------------
  // Работа без интернета — только для версии, размещённой по https.
  //
  // Проверка протокола обязательна: при открытии файла двойным щелчком
  // рядом нет никакого sw.js, и попытка его зарегистрировать закончилась
  // бы ошибкой в консоли на пустом месте. Обработчик кеша живёт в
  // отдельном файле sw.js рядом с index.html.
  // ------------------------------------------------------------------
  if (location.protocol === 'https:' && 'serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        // Не зарегистрировался — приложение всё равно работает,
        // просто не откроется без сети
      });
    });
  }

  render();
})();
</script>
</body>
</html>
