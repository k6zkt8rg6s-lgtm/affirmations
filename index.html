  // прокрутку колесом на всей странице. Прокрутка нужнее: замок ниже и
  // так не даёт хвосту инерции ничего перелистнуть, а больше он ничего
  // и не делал.

/* ─── 03-text-consts.js ────────────────────────────────────────────────
 * Пределы звука, выравнивание и цвет текста, ссылка карточки
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  const AUDIO_PARTS_MAX = 12;
  const AUDIO_CAP = 300;    // потолок звука на карточку, секунды

  // Буквы оформления текста и предел числа отметок.
  //
  // Стоят именно здесь, в самом начале, и переносить их вниз нельзя.
  // Сохранённые карточки читаются сразу при запуске приложения, а разбор
  // отметок обращается к этим двум значениям. Пока объявление лежало
  // ниже по файлу, до него на тот момент ещё не доходила очередь, и
  // запуск обрывался с ошибкой — приложение открывалось пустым фоном.
  // Заметно это было только у тех, кто успел что-то выделить жирным:
  // у карточки без оформления разбор заканчивается раньше и до этих
  // значений не добирается. Отсюда и «на телефоне работает, на
  // компьютере белый экран».
  // Выравнивание текста карточки и его цвет.
  //
  // Стоят рядом с буквами оформления и по той же причине: сохранённые
  // карточки читаются при самом запуске, и до этих значений очередь
  // доходит раньше, чем до середины файла.
  //
  // Выравнивание одно на всю карточку, а не на абзац. Аффирмация — это
  // две-три строки одной мысли, разнобой внутри неё только мешал бы; да
  // и хранить пришлось бы отметку на каждый абзац, а её ещё переносить
  // между устройствами. Здесь одно значение, и оно всегда сходится.
  // Четыре выравнивания, как в Pages: слева, по центру, справа, по ширине.
  //
  // «По ширине» выравнивает строку сразу по обоим краям, а расстояние
  // между словами при этом меняется — программа немного раздвигает или
  // поджимает пробелы, чтобы строка заняла всю ширину. Так это устроено
  // везде, и так и задумано: в тексте по-прежнему один пробел между
  // словами, в карточке лежит ровно то, что набрано, — распределяет их
  // внутри строки браузер.
  //
  // Последняя строка абзаца не растягивается: в русском тексте она
  // остаётся прижатой влево. В узкой колонке промежутки между словами
  // иногда выходят заметными — это свойство самого выравнивания.
  const ALIGNS = ['left', 'center', 'right', 'justify'];
  const ALIGN_DEFAULT = 'center';        // как было до этой правки

  // Цвета текста. Первый — обычный, тот же, что и раньше; остальные
  // подобраны так, чтобы читаться на жёлтой карточке и не спорить с ней.
  const INK_DEFAULT = '#2B2408';
  const INK_COLORS = [
    INK_DEFAULT,   // обычный, тёмно-коричневый
    '#1C1B19',     // почти чёрный
    '#6B6862',     // приглушённый серый
    '#8C2F1E',     // кирпичный
    '#B0451B',     // терракота
    '#1F6B4A',     // хвойный
    '#1C5C86',     // морской
    '#5B3E8E',     // сливовый
    '#FFFFFF',     // белый — для тёмных карточек
  ];

  /** Выравнивание из сохранённого — только одно из четырёх известных. */
  function sanitizeAlign(v) {
    // «Как набрано» было недолго, между двумя сборками. Выглядело оно
    // как выравнивание по левому краю — им и остаётся, чтобы у тех
    // карточек ничего не переехало.
    if (v === 'none') return 'left';
    return ALIGNS.indexOf(v) >= 0 ? v : ALIGN_DEFAULT;
  }

  /** Во что превращается выравнивание в стилях. */
  function alignCss(v) {
    return sanitizeAlign(v);
  }

  /**
   * Цвет текста из сохранённого.
   *
   * Только шестизначный код цвета и ничего кроме: значение попадает в
   * стиль, и пускать туда произвольную строку нельзя.
   */
  function sanitizeInk(v) {
    const s = String(v || '').trim();
    return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toUpperCase() : INK_DEFAULT;
  }

  // Ссылка у карточки. Одна на карточку и отдельно от текста.
  //
  // В сам текст ссылку не вставляем принципиально. Текст человека здесь
  // нигде не разбирается как разметка — это то, что защищает его от
  // подсунутого кода, — и ради одной ссылки ломать это правило незачем.
  const LINK_MAX = 2000;

  /**
   * Адрес из сохранённого или из строки ввода.
   *
   * Пропускаем только http и https. Всё остальное — javascript:, data:,
   * file: и прочее — это способ выполнить чужой код или вытащить файл с
   * устройства, и в приложении, которое возит данные между телефоном и
   * компьютером файлом, такому месту нет.
   *
   * Адрес без начала («youtube.com/...») дописываем сами: человек
   * копирует по-разному, а требовать «https://» — придирка.
   */
  function sanitizeLink(v) {
    let s = String(v == null ? '' : v).trim();
    if (!s) return '';
    if (s.length > LINK_MAX) return '';
    // Пробелы и переводы строк внутри адреса — это уже не адрес
    if (/[\s<>"']/.test(s)) return '';
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(s)) s = 'https://' + s;
    const low = s.toLowerCase();
    if (low.indexOf('http://') !== 0 && low.indexOf('https://') !== 0) return '';
    // После начала должно быть хоть какое-то имя узла
    const rest = s.slice(low.indexOf('//') + 2);
    if (!rest || rest.charAt(0) === '/' || rest.indexOf('.') < 0) return '';
    return s;
  }

  /** Открыть ссылку снаружи приложения — в браузере. */
  function openLink(url) {
    const safe = sanitizeLink(url);
    if (!safe) return false;
    // noopener обязателен: без него открытая страница получает доступ к
    // окну приложения и может увести его куда угодно
    if (typeof window !== 'undefined' && window.open) {
      window.open(safe, '_blank', 'noopener,noreferrer');
      return true;
    }
    return false;
  }

  const MARKS = 'bius';        // b — жирный, i — курсив, u — подчёркнутый, s — зачёркнутый
  const MARK_LIMIT = 300;      // столько отметок на карточку хватит с запасом

  // Имя файла обмена между устройствами.
  //
  // Расширение .txt выбрано намеренно. iPhone в окне выбора файла делает
  // серым и неактивным всё, что система не умеет открыть сама, — .json
  // как раз из таких: файл виден, но нажать на него нельзя. Обычный текст
  // выбирается без препятствий. Содержимое от этого не меняется: внутри
  // тот же JSON, и он же проверяется при чтении.
  const SYNC_FILE = 'affirmations-sync.txt';

  /**
   * Телефон это или планшет — по наличию касаний.
   *
   * Разница важна для выдачи файлов наружу. На телефоне единственный
   * путь положить файл в iCloud Drive — системное «Поделиться». На
   * компьютере оно не к месту: человек нажал «сохранить в файл» и ждёт
   * окна с папками, а не списка приложений.
   */
  const handheld = () => ((navigator.maxTouchPoints || 0) > 0);

/* ─── 04-audio-data.js ─────────────────────────────────────────────────
 * Данные звука: проверка, куски записи, места (дорожки)
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  function clampStr(value, max) {
    return typeof value === 'string' ? value.slice(0, max) : '';
  }

  /** Форма волны из файла или хранилища — только целые 0–100. */
  function sanitizePeaks(value) {
    if (!Array.isArray(value)) return [];
    const out = [];
    for (const v of value.slice(0, 400)) {
      const n = Math.round(Number(v));
      out.push(isFinite(n) ? Math.max(0, Math.min(100, n)) : 0);
    }
    return out;
  }

  /**
   * Куски записи: [{len, top}] — длина в секундах и громкость самого
   * громкого места. Из файла обмена сюда может прийти что угодно,
   * поэтому числа проверяются так же строго, как всё остальное.
   */
  function sanitizeParts(value) {
    if (!Array.isArray(value)) return [];
    const out = [];
    for (const p of value.slice(0, AUDIO_PARTS_MAX)) {
      if (!p || typeof p !== 'object') continue;
      const len = Number(p.len);
      if (!isFinite(len) || len <= 0) continue;
      const top = Number(p.top);
      // head — сколько тишины в начале куска. Её добавляет сжатие, и
      // между кусками она слышна как провал. Меряется один раз при
      // первом проигрывании и хранится, чтобы пропускать её и потом.
      const head = Number(p.head);
      out.push({
        len: Math.round(Math.min(len, 3600) * 100) / 100,
        top: (isFinite(top) && top > 0) ? Math.min(Math.round(top), 127) : 100,
        head: (isFinite(head) && head > 0) ? Math.min(Math.round(head * 1000) / 1000, 1) : 0,
      });
    }
    return out;
  }

  /**
   * Куски записи карточки — всегда непустым списком.
   *
   * У записей, сделанных до появления дозаписи, списка нет вовсе.
   * Такая запись — это один кусок во всю длину; так она и подаётся
   * дальше, чтобы остальному коду не приходилось разбирать два случая.
   */
  function audioParts(card) {
    const list = sanitizeParts(card && card.parts);
    if (list.length) return list;
    return [{ len: (card && card.audioLen) || 0, top: 100, head: 0 }];
  }

  /**
   * Ключ куска в хранилище.
   *
   * Первый кусок лежит под самим номером карточки — ровно там, где
   * лежали все записи раньше. Иначе прежние записи после обновления
   * оказались бы потеряны.
   */
  function partKey(id, i) { return i ? id + '~' + i : id; }

  /** Все ключи записи карточки — для удаления и для файла обмена. */
  function audioKeys(card) {
    const n = Math.max(1, sanitizeParts(card && card.parts).length);
    const out = [];
    for (let i = 0; i < n; i++) out.push(partKey(card.id, i));
    return out;
  }

  /**
   * Место дорожки в показе — целое число от 0 до 2.
   *
   * Всё, что не похоже на такое число, возвращается как -1: «не указано».
   * Тогда дорожка встаёт туда, где стояла, — по своему месту в списке.
   * Так открываются карточки, записанные до появления перестановки.
   */
  function sanitizePos(value) {
    if (typeof value !== 'number' || !isFinite(value)) return -1;
    const n = Math.round(value);
    return (n >= 0 && n < TRACKS_MAX) ? n : -1;
  }

  /**
   * Место, на котором остановили запись, из сохранённого.
   *
   * Число секунд и только оно. Дальше часа не бывает: столько не длится
   * ни одна запись, а испорченное значение не должно уводить ползунок
   * неведомо куда.
   */
  function sanitizeAt(value) {
    if (typeof value !== 'number' || !isFinite(value) || value <= 0) return 0;
    return Math.min(3600, Math.round(value * 100) / 100);
  }

  // Сколько записей помещается в плейлист. Стоит здесь, а не рядом с
  // самим плейлистом: сохранённое читается при запуске приложения, и
  // проверка места в очереди нужна раньше, чем до плейлиста доходит
  // очередь объявлений.
  const LIST_MAX = 300;

  /** Место записи в плейлисте из сохранённого. */
  function sanitizeListAt(v) {
    if (typeof v !== 'number' || !isFinite(v) || v < 0) return 0;
    return Math.min(LIST_MAX, Math.round(v));
  }

  /**
   * Вторая и третья записи карточки из сохранённого.
   *
   * Каждая проверяется теми же мерками, что и запись самой карточки:
   * номер — строкой, длительность — числом в пределах часа, куски и
   * форма волны — своими проверками. Записи без звука не берём: пустое
   * место в списке ничего не значит.
   */
  function sanitizeExtra(value) {
    if (!Array.isArray(value)) return [];
    const out = [];
    for (const e of value) {
      if (!e || typeof e !== 'object') continue;
      if (e.audio !== true) continue;
      const id = String(e.id || '').slice(0, 64);
      if (!id) continue;
      out.push({
        id: id,
        audio: true,
        audioLen: (typeof e.audioLen === 'number' && isFinite(e.audioLen)
                   && e.audioLen > 0) ? Math.min(e.audioLen, 3600) : 0,
        parts: sanitizeParts(e.parts),
        peaks: sanitizePeaks(e.peaks),
        trackPos: sanitizePos(e.trackPos),
        // Где остановились в прошлый раз — у каждой дорожки своё
        at: sanitizeAt(e.at),
        // Взята ли запись в плейлист и какая она там по счёту
        inList: e.inList === true,
        listAt: sanitizeListAt(e.listAt),
      });
      if (out.length >= TRACKS_MAX - 1) break;
    }
    return out;
  }

  /** Убрать звук карточки целиком: и из хранилища, и с самой карточки. */
  function forgetAudio(card) {
    audioKeys(card).forEach((k) => { AudioStore.del(k).catch(() => {}); });
    card.audio = false; card.audioLen = 0; card.peaks = []; card.parts = [];
  }

  // ------------------------------------------------------------------
  // Несколько записей на одной карточке.
  //
  // Устройство одной записи — куски, склейка без стыка, дозапись, перенос
  // между устройствами — уже сделано и работает. Поэтому здесь ничего из
  // этого не переписывается: вместо одной записи у карточки появляется
  // список «мест», и каждое место выглядит для остального кода точно так
  // же, как карточка со звуком, — те же поля id, audio, audioLen, parts,
  // peaks. Проигрыватель, дозапись и перенос принимают их без единой
  // правки.
  //
  // Первое место — сама карточка. Запись там и остаётся лежать, под тем
  // же номером в хранилище, что и раньше: у того, что уже записано, ничто
  // не сдвигается. Остальные места живут в списке extra, и у каждого свой
  // собственный номер, выданный при создании.
  // ------------------------------------------------------------------
  const TRACKS_MAX = 3;

  /**
   * Записи карточки по порядку показа. Пустых мест в списке нет.
   *
   * Порядок хранится числом на самой дорожке (trackPos), а не тем, как
   * дорожки лежат в списке. Это сделано ради перестановки: поменять
   * дорожки местами надо, не сдвинув ни одного байта звука. Запись лежит
   * в хранилище под номером своего места, и переложить её означало бы
   * скопировать несколько мегабайт под новым номером — на телефоне это и
   * долго, и опасно: оборвётся на середине, и звука не станет. Число
   * переписать ничего не стоит.
   *
   * У дорожек, записанных до появления перестановки, числа нет. Такая
   * встаёт туда, где стояла, — по своему месту в списке.
   */
  function audioSlots(card) {
    const out = [];
    if (card && card.audio) out.push(card);
    const extra = (card && Array.isArray(card.extra)) ? card.extra : [];
    extra.forEach((e) => { if (e && e.audio) out.push(e); });
    const seats = out.map((s, k) => {
      const p = sanitizePos(s.trackPos);
      return { slot: s, was: k, at: p < 0 ? k : p };
    });
    // При равных числах порядок остаётся прежним: сравнение по «was»
    // добавлено намеренно, а не на всякий случай, — иначе две дорожки с
    // одним и тем же числом могли бы меняться местами сами по себе.
    seats.sort((A, B) => (A.at - B.at) || (A.was - B.was));
    return seats.map((s) => s.slot);
  }

  /**
   * Куда положить следующую запись. null — все три места заняты.
   *
   * Пока у карточки нет ни одной записи, берём саму карточку: так запись
   * ложится туда, где она лежала всегда. Дальше новые всегда добавляются
   * в конец списка — чтобы порядок дорожек совпадал с порядком появления,
   * даже если первую потом удалить.
   */
  function freeSlot(card) {
    const busy = audioSlots(card);
    if (busy.length >= TRACKS_MAX) return null;
    /** Новая запись встаёт последней, за всеми уже занятыми местами. */
    const last = (slot) => {
      let top = -1;
      busy.forEach((s) => { const p = sanitizePos(s.trackPos); if (p > top) top = p; });
      slot.trackPos = Math.min(TRACKS_MAX - 1, Math.max(busy.length, top + 1));
      return slot;
    };
    const extra = Array.isArray(card.extra) ? card.extra : [];
    if (!card.audio && !extra.some((e) => e && e.audio)) return last(card);
    if (!Array.isArray(card.extra)) card.extra = [];
    const idle = card.extra.find((e) => e && !e.audio);
    if (idle) return last(idle);
    const fresh = { id: uid(), audio: false, audioLen: 0, parts: [], peaks: [] };
    card.extra.push(fresh);
    return last(fresh);
  }

  /**
   * Переставить дорожку: та, что стояла на месте from, встаёт на to.
   *
   * Двигаются только числа мест — звук остаётся лежать там, где лежал.
   * Числа выдаются заново всем дорожкам подряд, от нуля: так они всегда
   * плотные и не расходятся, сколько бы раз ни переставляли.
   */
  function moveTrack(card, from, to) {
    const slots = audioSlots(card);
    if (from === to) return false;
    if (from < 0 || to < 0 || from >= slots.length || to >= slots.length) return false;
    const order = slots.slice();
    const moved = order.splice(from, 1)[0];
    order.splice(to, 0, moved);
    order.forEach((s, k) => { s.trackPos = k; });
    return true;
  }

/* ─── 05-shots-data.js ─────────────────────────────────────────────────
 * Данные снимков, уменьшение фото, перенос дорожек, форма волны
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Фотографии на карточке.
  //
  // Лежат там же, где голос, — в хранилище устройства, каждая под своим
  // ключом. На карточке остаётся только список: номер, ширина и высота.
  // Размеры нужны, чтобы миниатюра не дёргалась, пока снимок грузится, и
  // чтобы на весь экран он открывался в своих пропорциях.
  //
  // Снимок с iPhone весит три-пять мегабайт. Такие складывать нельзя: и
  // хранилище на телефоне кончится, и файл обмена станет неподъёмным.
  // Поэтому при загрузке каждый снимок уменьшается до 1600 точек по
  // длинной стороне и пересохраняется — выходит около трёхсот килобайт,
  // а на глаз в карточке разницы никакой. Заодно это переводит формат
  // Apple (HEIC) в обычный, который откроется и на другом устройстве.
  // ------------------------------------------------------------------
  const SHOT_SIDE = 1600;       // длинная сторона после уменьшения
  const SHOT_QUALITY = 0.82;
  const SHOTS_MAX = 40;         // столько снимков на одну карточку хватит всем

  /** Ключ снимка в хранилище. Свой вид, чтобы не путать со звуком. */
  const shotKey = () => 'p-' + uid();

  /** Снимки карточки — только годные записи списка. */
  function cardShots(card) {
    const list = (card && Array.isArray(card.shots)) ? card.shots : [];
    return list.filter((s) => s && typeof s.id === 'string' && s.id);
  }

  /** Список снимков из сохранённого: номер, ширина, высота — и всё. */
  function sanitizeShots(value) {
    if (!Array.isArray(value)) return [];
    const out = [];
    for (const s of value) {
      if (!s || typeof s !== 'object') continue;
      const id = String(s.id || '').slice(0, 64);
      if (!id) continue;
      const side = (v) => (typeof v === 'number' && isFinite(v) && v > 0
        ? Math.min(20000, Math.round(v)) : 0);
      out.push({ id: id, w: side(s.w), h: side(s.h) });
      if (out.length >= SHOTS_MAX) break;
    }
    return out;
  }

  /** Ключи всех снимков карточки. */
  function shotKeys(card) { return cardShots(card).map((s) => s.id); }

  /**
   * Уменьшить снимок и отдать готовый к хранению.
   *
   * Через холст: браузер сам раскодирует что угодно, что умеет показать,
   * — включая формат Apple, — а обратно отдаёт обычный jpeg. Не вышло
   * (совсем чужой формат, битый файл) — говорим об этом честно, а не
   * кладём в хранилище то, что потом не откроется.
   */
  function shrinkShot(file) {
    return new Promise((done) => {
      if (typeof Image !== 'function' || !document.createElement) { done(null); return; }
      let url = '';
      try { url = URL.createObjectURL(file); } catch (e) { done(null); return; }
      const img = new Image();
      const give = (res) => {
        try { URL.revokeObjectURL(url); } catch (e) { /* уже нет */ }
        done(res);
      };
      img.onerror = () => give(null);
      img.onload = () => {
        const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
        if (!w0 || !h0) { give(null); return; }
        const k = Math.min(1, SHOT_SIDE / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
        let canvas;
        try {
          canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          if (!ctx) { give(null); return; }
          ctx.drawImage(img, 0, 0, w, h);
        } catch (e) { give(null); return; }
        const ready = (blob) => {
          if (!blob || !blob.size) { give(null); return; }
          give({ blob: blob, w: w, h: h });
        };
        if (canvas.toBlob) canvas.toBlob(ready, 'image/jpeg', SHOT_QUALITY);
        else give(null);
      };
      img.src = url;
    });
  }

  /** Убрать одну дорожку: и звук из хранилища, и место из списка. */
  function dropTrack(card, slot) {
    forgetAudio(slot);
    if (slot !== card && Array.isArray(card.extra)) {
      card.extra = card.extra.filter((e) => e !== slot);
    }
  }

  /**
   * Перенести одну запись на другую карточку.
   *
   * Куда она встанет: в конец, следующей по счёту. Если на той карточке
   * записей не было — станет первой, если была одна — второй, если две —
   * третьей. Больше трёх не берём и говорим об этом прямо.
   *
   * Двух путей здесь не избежать, и вот почему. Запись лежит в хранилище
   * под номером своего места. У второй и третьей дорожек это собственный
   * номер, ни с чем не связанный, — такую дорожку переносим целым
   * объектом, и звук не двигается с места вовсе.
   *
   * А у первой дорожки номер места — это номер самой карточки. Отдать
   * его другой карточке нельзя: карточка остаётся у себя, и запишись на
   * неё что-нибудь снова — новая запись легла бы поверх перенесённой.
   * Поэтому её куски переписываются под новым номером. Старые убираются
   * только после того, как новые прочитаны обратно и оказались на месте:
   * потерять запись на полпути нельзя.
   *
   * done(ok, why) — что получилось. Ошибку показывает вызывающий: он
   * знает, где человек сейчас смотрит.
   */
  function moveTrackToCard(fromCard, slot, toCard, done) {
    const finish = (ok, why) => { if (typeof done === 'function') done(ok, why); };
    if (!slot || !toCard || fromCard === toCard) { finish(false, 'same'); return; }
    if (audioSlots(toCard).length >= TRACKS_MAX) { finish(false, 'full'); return; }

    /** Поставить дорожку в конец списка карточки-получателя. */
    const seat = (dst) => {
      if (!Array.isArray(toCard.extra)) toCard.extra = [];
      const busy = audioSlots(toCard);
      let top = -1;
      busy.forEach((s) => { const p = sanitizePos(s.trackPos); if (p > top) top = p; });
      dst.trackPos = Math.min(TRACKS_MAX - 1, Math.max(busy.length, top + 1));
      toCard.extra.push(dst);
    };

    // Вторая или третья дорожка: переносим объект как есть
    if (slot !== fromCard) {
      if (Array.isArray(fromCard.extra)) {
        fromCard.extra = fromCard.extra.filter((e) => e !== slot);
      }
      seat(slot);
      save();
      finish(true);
      return;
    }

    // Первая дорожка: переписываем куски под новым номером
    const fresh = { id: uid(), audio: false, audioLen: slot.audioLen || 0,
                    parts: sanitizeParts(slot.parts),
                    peaks: sanitizePeaks(slot.peaks) };
    const from = audioKeys(slot);
    const copied = [];
    const step = (i) => {
      if (i >= from.length) return Promise.resolve(true);
      const to = partKey(fresh.id, i);
      return AudioStore.get(from[i])
        .then((blob) => {
          if (!blob || !blob.size) return null;      // кусок потерялся — дальше не идём
          return AudioStore.put(to, blob).then(() => AudioStore.get(to));
        })
        .then((back) => {
          if (!back || !back.size) return false;
          copied.push(to);
          return step(i + 1);
        });
    };
    step(0).then((ok) => {
      if (!ok && !copied.length) {
        finish(false, 'copy');
        return;
      }
      // Дошло хотя бы начало записи — переносим ровно то, что дошло
      fresh.parts = fresh.parts.slice(0, copied.length);
      if (fresh.parts.length) {
        fresh.audioLen = Math.round(
          fresh.parts.reduce((s, p) => s + p.len, 0) * 100) / 100;
      }
      fresh.audio = true;
      seat(fresh);
      // И только теперь убираем прежнее: сначала убедились, что новое на месте
      forgetAudio(slot);
      save();
      finish(true);
    }).catch(() => {
      copied.forEach((k) => { AudioStore.del(k).catch(() => {}); });
      finish(false, 'copy');
    });
  }

  /** Все ключи звука карточки — со всеми её дорожками. */
  function allAudioKeys(card) {
    let out = [];
    if (card && card.audio) out = out.concat(audioKeys(card));
    const extra = (card && Array.isArray(card.extra)) ? card.extra : [];
    extra.forEach((e) => { if (e && e.audio) out = out.concat(audioKeys(e)); });
    return out;
  }

  /** Убрать звук карточки целиком, со всеми дорожками. */
  function forgetAllAudio(card) {
    audioSlots(card).slice().forEach((slot) => { dropTrack(card, slot); });
    card.extra = [];
  }

  /**
   * Склеить рисунок звука: было la секунд с рисунком a, дописали lb с b.
   *
   * Каждый кусок занимает в дорожке долю по своей длине — короткое
   * продолжение и выглядит коротким хвостом. Громкость приводится к
   * общей шкале: замеры каждого куска хранятся нормированными на его
   * собственный максимум, и без пересчёта тихое продолжение смотрелось
   * бы таким же громким, как основная запись.
   */
  function joinPeaks(a, la, ta, b, lb, tb) {
    const A = sanitizePeaks(a), B = sanitizePeaks(b);
    const l1 = Math.max(0, Number(la) || 0), l2 = Math.max(0, Number(lb) || 0);
    const whole = l1 + l2;
    if (!whole) return [];
    const t1 = Math.max(1, Number(ta) || 100), t2 = Math.max(1, Number(tb) || 100);
    const top = Math.max(t1, t2);
    const cut = Math.max(0, Math.min(PEAK_COUNT, Math.round(PEAK_COUNT * l1 / whole)));
    const out = [];
    const take = (src, from, to, k) => {
      const span = Math.max(1, to - from);
      for (let i = from; i < to; i++) {
        if (!src.length) { out.push(0); continue; }
        const at = Math.min(src.length - 1, Math.floor((i - from) / span * src.length));
        out.push(Math.max(0, Math.min(100, Math.round(src[at] * k))));
      }
    };
    take(A, 0, cut, t1 / top);
    take(B, cut, PEAK_COUNT, t2 / top);
    return out;
  }

  /**
   * Посчитать форму волны из записи.
   *
   * Звук раскодируется целиком и делится на PEAK_COUNT отрезков; для
   * каждого берём максимум громкости. Максимум, а не среднее: на среднем
   * тихая речь превращается в ровную полоску, и ориентироваться по ней
   * невозможно.
   */
  function computePeaks(blob) {
    const Ctx = self.AudioContext || self.webkitAudioContext;
    if (!Ctx || !blob) return Promise.resolve([]);
    return blob.arrayBuffer().then((buf) => new Promise((resolve) => {
      const ctx = new Ctx();
      // Без этого Safari на iPhone держит узел спящим и разбор молча
      // не доходит до конца
      if (typeof ctx.resume === 'function') { try { ctx.resume(); } catch (e) {} }
      const done = (peaks) => {
        try { ctx.close(); } catch (e) { /* уже закрыт */ }
        resolve(peaks);
      };
      const onOk = (audio) => {
        try {
          const data = audio.getChannelData(0);
          const step = Math.max(1, Math.floor(data.length / PEAK_COUNT));
          const raw = [];
          let top = 0;
          for (let i = 0; i < PEAK_COUNT; i++) {
            let peak = 0;
            const start = i * step;
            const end = Math.min(data.length, start + step);
            // По каждому четвёртому отсчёту: на слух разницы нет,
            // а на пятиминутной записи это в разы быстрее
            for (let j = start; j < end; j += 4) {
              const v = data[j] < 0 ? -data[j] : data[j];
              if (v > peak) peak = v;
            }
            raw.push(peak);
            if (peak > top) top = peak;
          }
          // Нормируем по самому громкому месту, иначе тихая запись
          // выглядит пустой полосой
          const k = top > 0.001 ? 100 / top : 0;
          done(raw.map((v) => Math.round(v * k)));
        } catch (e) { done([]); }
      };
      try {
        const p = ctx.decodeAudioData(buf, onOk, () => done([]));
        if (p && typeof p.then === 'function') p.then(onOk).catch(() => done([]));
      } catch (e) { done([]); }
    })).catch(() => []);
  }

/* ─── 06-sides.js ──────────────────────────────────────────────────────
 * Две стороны карточки: лицо и оборот
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  // ------------------------------------------------------------------
  // Две стороны карточки.
  //
  // Устройство простое и намеренно повторяет то, как уже сделаны дорожки
  // звука: оборот — это объект, который для остального кода выглядит
  // ровно как карточка. Те же поля text, marks, align, ink, head, link,
  // audio, extra, shots — и свой собственный номер id. Поэтому ни
  // проигрыватель, ни запись голоса, ни ряд миниатюр, ни перенос между
  // устройствами не переписывались: им всё равно, лицо им дали или
  // оборот.
  //
  // Что осталось общим у двух сторон и почему:
  //   * цвет — карточка одна, у настоящей бумажки обе стороны одного
  //     цвета;
  //   * сердечко и звёздочка — иначе одна карточка попадала бы в
  //     «Избранное» и в напоминания дважды, и человек не понимал бы,
  //     откуда взялась вторая.
  //
  // Оборот заводится не при создании карточки, а при первом обращении к
  // нему: у того, кто оборотами не пользуется, в хранилище не появляется
  // ни одного лишнего байта.
  // ------------------------------------------------------------------

  // Как называются стороны. Показываются полупрозрачной буквой в левом
  // верхнем углу карточки — иначе после переворота непонятно, где ты.
  const SIDE_LETTERS = ['А', 'Б'];

  /** Сторона из сохранённого: 0 — лицо, 1 — оборот. Всё прочее — лицо. */
  function sanitizeSideNo(v) { return v === 1 ? 1 : 0; }

  /** Длительность записи из сохранённого: число в пределах часа. */
  function sanitizeLen(v) {
    return (typeof v === 'number' && isFinite(v) && v > 0)
      ? Math.min(v, 3600) : 0;
  }

  /**
   * Оборот из сохранённого. null — оборота нет вовсе.
   *
   * Проверяется теми же мерками, что и сама карточка: чужой JSON не
   * пролезет в интерфейс неожиданным типом ни с лица, ни с оборота.
   * Пустой текст здесь допустим, и это единственное отличие от лица:
   * оборот с одной фотографией и без единого слова — обычное дело.
   */
  function sanitizeBack(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const text = clampStr(raw.text, LIMITS.cardText);
    const head = clampStr(raw.head, LIMITS.cardHead);
    return {
      id: clampStr(raw.id, 40) || uid(),
      text: text,
      marks: sanitizeMarks(raw.marks, text.length),
      align: sanitizeAlign(raw.align),
      ink: sanitizeInk(raw.ink),
      head: head,
      headMarks: sanitizeMarks(raw.headMarks, head.length),
      headAlign: sanitizeAlign(raw.headAlign),
      headInk: sanitizeInk(raw.headInk),
      link: sanitizeLink(raw.link),
      audio: raw.audio === true,
      audioLen: sanitizeLen(raw.audioLen),
      parts: sanitizeParts(raw.parts),
      peaks: sanitizePeaks(raw.peaks),
      extra: sanitizeExtra(raw.extra),
      trackPos: sanitizePos(raw.trackPos),
      at: sanitizeAt(raw.at),
      inList: raw.inList === true,
      listAt: sanitizeListAt(raw.listAt),
      shots: sanitizeShots(raw.shots),
    };
  }

  /**
   * Оборот карточки. Заводится при первом обращении.
   *
   * Свой id обязателен и выдаётся сразу: под ним в хранилище лежит голос
   * оборота. Возьми он номер лица — записи двух сторон легли бы одна
   * поверх другой, и это уже не поправить.
   */
  function backOf(card) {
    if (!card.back || typeof card.back !== 'object') {
      card.back = {
        id: uid(), text: '', marks: [],
        align: ALIGN_DEFAULT, ink: INK_DEFAULT,
        head: '', headMarks: [],
        headAlign: ALIGN_DEFAULT, headInk: INK_DEFAULT,
        link: '', audio: false, audioLen: 0, parts: [], peaks: [], at: 0,
        inList: false, listAt: 0, extra: [], shots: [],
      };
    }
    return card.back;
  }

  /** Обе стороны карточки. Оборота нет — значит, сторона одна. */
  function cardSides(card) {
    return (card && card.back && typeof card.back === 'object')
      ? [card, card.back] : [card];
  }

  /**
   * Та сторона, которая сейчас лежит вверх.
   *
   * Всё содержимое карточки берётся только отсюда — и текст, и звук, и
   * снимки. Общее у сторон (цвет, сердечко, звёздочка) берётся у самой
   * карточки, а не у стороны.
   */
  function faceOf(card) {
    return (card && card.side === 1) ? backOf(card) : card;
  }

  /** Есть ли на обороте хоть что-нибудь. */
  function backFilled(card) {
    const b = card && card.back;
    if (!b || typeof b !== 'object') return false;
    if (String(b.text || '').trim()) return true;
    if (String(b.head || '').trim()) return true;
    if (String(b.link || '').trim()) return true;
    if (audioSlots(b).length) return true;
    if (cardShots(b).length) return true;
    return false;
  }

  /**
   * Оборот для карточки, приехавшей из файла обмена.
   *
   * Текст, название, оформление и ссылка берутся из файла, а звук и
   * снимки — нет: они приезжают отдельно, своими кусками, и отмечаются
   * на стороне только после того, как легли в хранилище. Иначе оборот
   * заявлял бы запись, которой на этом устройстве нет.
   *
   * Номер выдаётся новый. Чужой брать нельзя: под ним на нашем
   * устройстве уже может лежать чей-то звук.
   */
  function backFromFile(raw) {
    const b = sanitizeBack(raw);
    if (!b) return null;
    b.id = uid();
    b.audio = false;
    b.audioLen = 0;
    b.parts = [];
    b.extra = [];
    b.shots = [];
    // Записи ещё нет — значит, и в очереди ей пока делать нечего.
    // Отметка вернётся вместе со звуком, когда он ляжет в хранилище.
    b.inList = false;
    b.listAt = 0;
    return b;
  }

  /** Все дорожки карточки — с обеих сторон. Для файла обмена. */
  function sidesSlots(card) {
    const out = [];
    cardSides(card).forEach((s) => {
      audioSlots(s).forEach((sl) => out.push(sl));
    });
    return out;
  }

  /** Все ключи звука карточки — с обеих сторон. Для удаления. */
  function sidesAudioKeys(card) {
    let out = [];
    cardSides(card).forEach((s) => { out = out.concat(allAudioKeys(s)); });
    return out;
  }

  /** Все ключи снимков карточки — с обеих сторон. */
  function sidesShotKeys(card) {
    let out = [];
    cardSides(card).forEach((s) => { out = out.concat(shotKeys(s)); });
    return out;
  }
/* ─── 06-store.js ──────────────────────────────────────────────────────
 * Проверка сохранённого, чтение и запись хранилища, первый запуск
 *
 * Часть общего кода приложения. Собирается: python3 build.py
 * Карта всех частей: КАРТА-ПРОЕКТА.md
 * ────────────────────────────────────────────────────────────── */

  /** Привести любой ввод к заведомо корректной структуре. */
  function sanitizeState(raw) {
    const out = { sections: [] };
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.sections)) {
      return out;
    }
    if (typeof raw.syncedAt === 'number' && isFinite(raw.syncedAt)
        && raw.syncedAt > 0) {
      out.syncedAt = raw.syncedAt;
    }
    out.favCollapsed = raw.favCollapsed === true;
    // Подсказку про настройку Safari показываем один раз: человек её
    // прочитал и либо включил, либо решил обойтись. Напоминать при
    // каждом сохранении — навязчиво.
    out.hideSaveHint = raw.hideSaveHint === true;
    // Расписание напоминаний. Числа и только числа, в разумных пределах:
    // шаг от часа до полусуток, границы дня — часы обычных суток.
    const hourOf = (v, def) => (typeof v === 'number' && isFinite(v)
      ? Math.max(0, Math.min(23, Math.round(v))) : def);
    out.remindEvery = (typeof raw.remindEvery === 'number' && isFinite(raw.remindEvery))
      ? Math.max(1, Math.min(12, Math.round(raw.remindEvery))) : 3;
    out.remindFrom = hourOf(raw.remindFrom, 9);
    out.remindTo = Math.max(out.remindFrom, hourOf(raw.remindTo, 21));
    for (const s of raw.sections.slice(0, LIMITS.sections)) {
      if (!s || typeof s !== 'object') continue;
      const section = {
        id: clampStr(s.id, 40) || uid(),
        name: clampStr(s.name, LIMITS.sectionName) || 'Раздел',
        collapsed: s.collapsed === true,   // строго булево
        decks: [],
      };
      const decks = Array.isArray(s.decks) ? s.decks : [];
      for (const d of decks.slice(0, LIMITS.decksPerSection)) {
        if (!d || typeof d !== 'object') continue;
        const deck = {
          id: clampStr(d.id, 40) || uid(),
          name: clampStr(d.name, LIMITS.deckName) || 'Колода',
          color: COLORS.includes(d.color) ? d.color : COLORS[0],
          cards: [],
        };
        const cards = Array.isArray(d.cards) ? d.cards : [];
        for (const c of cards.slice(0, LIMITS.cardsPerDeck)) {
          if (!c || typeof c !== 'object') continue;
          const text = clampStr(c.text, LIMITS.cardText);
          if (!text.trim()) continue;
          const card = {
            id: clampStr(c.id, 40) || uid(),
            text: text,
            // Цвет только из списка: иначе через файл копии можно было бы
            // подсунуть в стиль произвольное значение
            color: KNOWN_COLORS.includes(c.color) ? c.color : CARD_COLORS[0],
            fav: c.fav === true,          // строго булево, не «похожее на правду»
            // Отметка «показывать в напоминаниях» — вторая, отдельная
            // от избранного: у них разный смысл и разные списки.
            remind: c.remind === true,
            // Название карточки. Своё поле со своим оформлением: жирный,
            // цвет и выравнивание у него отдельные от текста аффирмации.
            head: clampStr(c.head, LIMITS.cardHead),
            headMarks: sanitizeMarks(c.headMarks,
              clampStr(c.head, LIMITS.cardHead).length),
            headAlign: sanitizeAlign(c.headAlign),
            headInk: sanitizeInk(c.headInk),
            audio: c.audio === true,      // сама запись лежит в IndexedDB
            // Длину записи держим рядом с карточкой. Спрашивать её у
            // самого файла ненадёжно: браузеры часто отдают Infinity для
            // записей, сделанных на лету, и полоса времени ломается.
            audioLen: (typeof c.audioLen === 'number' && isFinite(c.audioLen)
                       && c.audioLen > 0) ? Math.min(c.audioLen, 3600) : 0,
            // Куски записи, если к ней дописывали продолжение. У обычной
            // записи список пуст — она и так одно целое.
            parts: sanitizeParts(c.parts),
            // Форма волны: столбики громкости, целые числа 0–100.
            // Считается один раз при записи и хранится рядом с карточкой,
            // иначе при каждом открытии пришлось бы заново раскодировать
            // весь звук — на телефоне это заметная задержка.
            peaks: sanitizePeaks(c.peaks),
            // Оформление куска текста: только числа и четыре буквы.
            // Разметкой это не становится нигде — рисуется через
            // createElement, поэтому подсунуть через отметки нечего.
            marks: sanitizeMarks(c.marks, text.length),
            // Выравнивание и цвет текста — по одному значению на
            // карточку. Оба проверяются по списку: попадают в стиль.
            align: sanitizeAlign(c.align),
            ink: sanitizeInk(c.ink),
            // Ссылка: только http и https, всё прочее отбрасывается
            link: sanitizeLink(c.link),
            // Вторая и третья записи. Каждая — со своим номером в
            // хранилище и со своими кусками, как у первой.
            extra: sanitizeExtra(c.extra),
            // Место записи самой карточки в показе. Дорожки можно
            // переставлять, и первой не обязательно стоит её собственная.
            trackPos: sanitizePos(c.trackPos),
            // На какой секунде остановили прослушивание. В следующий раз
            // запись продолжится отсюда, а не начнётся заново.
            at: sanitizeAt(c.at),
            // Плейлист: взята ли запись в очередь и какая она там по
            // счёту. Отметка живёт на самой дорожке, а не отдельным
            // списком, — тогда она не может от неё отстать.
            inList: c.inList === true,
            listAt: sanitizeListAt(c.listAt),
            // Снимки: только номера и размеры. Сами картинки лежат
            // в хранилище устройства, как и голос.
            shots: sanitizeShots(c.shots),
            // Какой стороной карточка лежит. Помнится вместе с ней: как
            // оставил, так в следующий раз и откроется.
            side: sanitizeSideNo(c.side),
          };
          // Оборот кладём, только если он и правда есть: у того, кто
          // оборотами не пользуется, в хранилище не заводится ни одного
          // лишнего поля.
          const back = sanitizeBack(c.back);
          if (back) card.back = back;
          deck.cards.push(card);
        }
        section.decks.push(deck);
      }
      out.sections.push(section);
    }
    return out;
  }

  function load() {
    let raw = null;
    try {
      raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    } catch (e) {
      // Битый JSON не должен ронять приложение — начинаем с примера
      raw = null;
    }
    if (!raw) return seed();
    return sanitizeState(raw);
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      // Хранилище переполнено или заблокировано в приватном режиме
      alert('Не удалось сохранить: в браузере кончилось место для данных.');
    }
  }

  function seed() {
    return {
      sections: [
        {
          id: uid(), name: 'Психология',
          decks: [
            { id: uid(), name: 'Опора на себя', color: COLORS[0], cards: [

            { id: uid(), name: 'Границы', color: COLORS[1], cards: [

                text: 'Я имею право сказать «нет»\nбез объяснений.' },

                text: 'Волнение — это энергия.\nЯ направляю её в голос.' },

          ],
        },
