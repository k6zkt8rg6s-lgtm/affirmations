<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  Политика безопасности. Скрипт и стили разрешены по контрольной сумме,
  а не по источнику: подменить их нельзя, сумма не сойдётся.
    default-src 'none'     — по умолчанию запрещено всё
    media-src blob:        — звук только свой, созданный на этом устройстве;
                             подгрузить запись с чужого адреса нельзя
    worker-src 'self'      — офлайн-режим только из своего же файла
    connect-src 'none'     — fetch, XHR, WebSocket заблокированы браузером
    form-action 'none'     — формы никуда не отправляются
    frame-ancestors 'none' — страницу нельзя встроить в чужой сайт
  Данным физически некуда утечь.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'sha256-oqZOtt7gFkKSBZfCqRHvi0/E85gvyH8mKInh+1IOo8Y=';
               style-src 'sha256-eMgpSu6pc0VINF2+L6lITsbIxRzViZFSHxWY6DTLpgY=';
               img-src 'self' data:;
               media-src blob:;
               worker-src 'self';
               manifest-src 'self';
               connect-src 'none';
               form-action 'none';
               base-uri 'none';
               frame-ancestors 'none';
               object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F4F3EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Аффирмации">
<title>Аффирмации</title>
<!--
  Манифест и иконка нужны для добавления на экран «Домой». iOS берёт
  иконку только из apple-touch-icon и только в PNG: со ссылкой на SVG
  он молча подставит вместо неё снимок страницы.
  При открытии одиночного файла этих спутников рядом нет — ссылки просто
  ни к чему не приведут и ничего не сломают.
-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>/* Аффирмации — оформление.
   Один файл, никаких внешних шрифтов и картинок: всё, что грузится
   из сети, — это лишний способ подсунуть код. Шрифты системные. */

:root {
  --paper: #F4F3EF;          /* тон бумаги с фотографии */
  --dot: #C9C7C0;            /* точки на фоне */
  --ink: #1C1B19;
  --ink-soft: #6B6862;
  --card-yellow: #E6C84C;    /* цвет карточки с фотографии */
  --card-yellow-edge: #D4B63C;
  --sheet: #FFFFFF;
  --hair: rgba(0, 0, 0, .08);
  --danger: #C0392B;
  --heart: #E23B3B;
  --radius-l: 22px;
  --radius-m: 16px;
  --tap: 44px;               /* минимальная зона нажатия по гайдлайнам Apple */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overscroll-behavior-y: none;      /* без «резинки» при прокрутке */
  -webkit-text-size-adjust: 100%;   /* iOS не масштабирует текст сам */
}

body {
  font: 400 17px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Helvetica Neue", Arial, sans-serif;
  color: var(--ink);
  background-color: var(--paper);
  /* Точечная сетка как на фотографии — рисуется градиентом, без картинки */
  background-image: radial-gradient(var(--dot) 1.15px, transparent 1.15px);
  background-size: 22px 22px;
  background-position: 0 0;
}

.app {
  min-height: 100%;
  padding: max(12px, env(safe-area-inset-top)) 16px
           max(16px, env(safe-area-inset-bottom)) 16px;
  max-width: 720px;
  margin: 0 auto;
  /* Горизонталь отдана приложению на ВСЕЙ площади экрана, а не только
     внутри обёртки .page. Раньше в пустой области под коротким списком
     действовало значение по умолчанию: браузер считал движение началом
     прокрутки, присылал pointercancel — и жест «назад» обрывался. Именно
     поэтому он работал не везде. pinch-zoom оставляем, иначе пропадёт
     увеличение текста двумя пальцами. */
  touch-action: pan-y pinch-zoom;
}

/* ---------- Шапка ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: var(--tap);
  margin-bottom: 6px;
}
.topbar h1 {
  font: 700 30px/1.15 -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
  margin: 0;
  flex: 1;
  letter-spacing: -.4px;
}
.topbar h1.small { font-size: 22px; }

.iconbtn {
  min-width: var(--tap);
  min-height: var(--tap);
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, .05);
  color: var(--ink);
  font-size: 19px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.iconbtn:active { background: rgba(0, 0, 0, .12); }
.iconbtn.ghost { background: transparent; }

/* Сердечко: пустое — обычное, залитое — красное */
.iconbtn.heart { background: transparent; font-size: 22px; color: var(--ink-soft); }
.iconbtn.heart.on { color: var(--heart); }
.mini-heart { color: var(--heart); font-size: 16px; flex: none; }
.mini-audio { color: var(--ink-soft); font-size: 15px; flex: none; }

/* Кнопка записи. Красная точка, во время записи пульсирует и рядом
   идёт счётчик — иначе непонятно, пишется ли что-то вообще. */
.iconbtn.rec {
  background: transparent;
  color: var(--heart);
  font-size: 17px;
  gap: 6px;
  width: auto;
  padding: 0 8px;
}
.iconbtn.rec.on { background: rgba(226, 59, 59, .12); animation: pulse 1.1s infinite; }
.rec-time {
  font-size: 13px;
  color: var(--heart);
  font-variant-numeric: tabular-nums;   /* цифры не прыгают по ширине */
  min-width: 34px;
}
@keyframes pulse { 50% { opacity: .5; } }

/* Пауза и стоп появляются рядом с кнопкой записи только во время записи */
.rec-box { display: flex; align-items: center; gap: 2px; }
.iconbtn.rec-ctl {
  background: transparent;
  color: var(--ink);
  font-size: 13px;
  min-width: 34px;
  min-height: var(--tap);
}
.iconbtn.rec-ctl:active { background: rgba(0, 0, 0, .10); }

/* Знак паузы всегда один и тот же — меняется только плотность.
   Идёт запись — приглушён; на паузе — наливается цветом и весом. */
.iconbtn.rec-ctl.recording { opacity: .38; font-weight: 400; }
.iconbtn.rec-ctl.paused {
  opacity: 1;
  font-weight: 800;
  color: var(--heart);
  transform: scale(1.12);
}
.iconbtn.rec-ctl { transition: opacity .18s ease, transform .18s ease; }

/* Строка избранного: слева нажимаемая зона, справа отдельное сердечко */
.mini-open {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 0;
  background: transparent;
  padding: 0;
  min-height: var(--tap);
  cursor: pointer;
  font: inherit;
  color: inherit;
  text-align: left;
  min-width: 0;
}
.mini-open:active { opacity: .6; }

/* Полоска проигрывания внизу карточки */
.audio-bar {
  position: absolute;
  left: 14px;
  right: 14px;
  bottom: 12px;
}
.audio-bar:empty { display: none; }
.audio-row { display: flex; align-items: center; gap: 10px; }
.audio-btn {
  min-width: 40px;
  min-height: 40px;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, .14);
  color: #2B2408;
  font-size: 15px;
  cursor: pointer;
  flex: none;
}
.audio-btn:active { background: rgba(0, 0, 0, .24); }
/* Время прослушивания — намеренно тихое: цифры не должны спорить
   с текстом аффирмации, они справочные */
.audio-label {
  display: block;
  text-align: center;
  margin-top: 6px;
  font-size: 13px;
  color: rgba(43, 36, 8, .5);
  font-variant-numeric: tabular-nums;   /* сотые не дёргают ширину */
  letter-spacing: .3px;
}

/* Дорожка звука — «сосуд», который наполняется.
   Пустая часть светлая и прозрачная; пройденная заливается плотным
   непрозрачным тоном, так что наполнение видно именно по плотности,
   а не по цвету. Столбики громкости лежат поверх: на пустой части они
   тёмные, на залитой — светлые, поэтому видны на любом фоне. */
.wave {
  position: relative;
  flex: 1;
  height: 34px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .42);
  box-shadow: inset 0 0 0 1px rgba(43, 36, 8, .12);
  overflow: hidden;
  cursor: pointer;
  touch-action: none;      /* дорожка перематывает, а не листает карточку */
  min-width: 0;
  transition: background .18s ease, box-shadow .18s ease;
}
/* Пока играет, сама дорожка чуть выделяется — видно, что она живая */
.wave.playing {
  background: rgba(255, 255, 255, .60);
  box-shadow: inset 0 0 0 1px rgba(43, 36, 8, .22);
}
/* Собственно наполнение. Ширина задаётся из кода на каждом кадре,
   поэтому никакого перехода тут нет — иначе заливка отставала бы. */
.wave-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0;
  background: #57534A;     /* плотный тёплый серый, без прозрачности */
  pointer-events: none;
}
/* Столбики лежат поверх заливки и не мешают ей: между ними видно фон */
.wave-bars {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 1px;
  padding: 0 6px;
  pointer-events: none;
}
.wave-bars i {
  flex: 1;
  min-width: 0;
  background: rgba(43, 36, 8, .30);
  border-radius: 1px;
  transition: background .1s linear;
}
/* На залитой части фон тёмный — столбики становятся светлыми,
   иначе на сером они бы просто пропали */
.wave-bars i.played { background: rgba(255, 255, 255, .82); }
/* Край наполнения — тонкая тёмная черта: видно точное место */
.wave-head {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 2px;
  margin-left: -1px;
  background: #2B2408;
  pointer-events: none;
}
/* Дошли до конца — сосуд полон, край растворяется */
.wave.full .wave-head { opacity: 0; }

.audio-del {
  border: 0;
  background: transparent;
  color: rgba(43, 36, 8, .55);
  font-size: 15px;
  min-width: 32px;
  min-height: 32px;
  cursor: pointer;
  flex: none;
}

/* ---------- Разделы и колоды ---------- */
.section { margin: 22px 0 6px; }
.section-head {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
}
.section-head h2 {
  font: 600 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  text-transform: uppercase;
  letter-spacing: .8px;
  color: var(--ink-soft);
  margin: 0;
}

/* Заголовок раздела — кнопка сворачивания на всю ширину */
.section-toggle {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  padding: 8px 0;
  min-height: var(--tap);
  cursor: pointer;
  font-family: inherit;
  text-align: left;
}
.section-toggle:active { opacity: .6; }
.chev {
  color: var(--ink-soft);
  font-size: 15px;
  line-height: 1;
  transition: transform .18s ease;
  transform: rotate(0deg);
  flex: none;
}
.chev.closed { transform: rotate(-90deg); }
.section-count { color: var(--ink-soft); font-size: 13px; margin-left: auto; }
.section.collapsed { margin-bottom: 0; }

/* Список избранного в окне управления не должен вытеснять кнопки */
.card-list.scroll { max-height: 46vh; overflow-y: auto; }
.mini.row { cursor: default; }
.mini.row:active { background: var(--sheet); }

.deck-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 10px;
}
@media (max-width: 380px) { .deck-grid { grid-template-columns: 1fr; } }

/* Колода нарисована стопкой: два листа выглядывают из-под верхнего */
.deck {
  position: relative;
  border: 0;
  text-align: left;
  border-radius: var(--radius-m);
  padding: 16px 14px 14px;
  min-height: 104px;
  color: #fff;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
}
.deck::before,
.deck::after {
  content: "";
  position: absolute;
  left: 8px;
  right: 8px;
  border-radius: var(--radius-m);
  background: inherit;
  z-index: -1;
}
.deck::before { bottom: -5px; height: 20px; filter: brightness(.92); }
.deck::after  { left: 15px; right: 15px; bottom: -9px; height: 20px; filter: brightness(.84); }
.deck.single::before, .deck.single::after { display: none; }
.deck:active { transform: scale(.985); }

.deck-title {
  font: 600 17px/1.25 -apple-system, BlinkMacSystemFont, sans-serif;
  margin: 0;
  word-break: break-word;
}
.deck-count { font-size: 13px; opacity: .85; margin-top: 8px; }

/* ---------- Список карточек внутри колоды ---------- */
.card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }

.mini {
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--hair);
  background: var(--sheet);
  border-radius: var(--radius-m);
  padding: 12px 14px;
  min-height: var(--tap);
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 16px;
  color: var(--ink);
}
.mini:active { background: #F7F6F3; }
.mini-swatch {
  width: 34px;
  height: 44px;
  border-radius: 6px;
  background: var(--card-yellow);
  border: 1px solid var(--card-yellow-edge);
  flex: none;
}
.mini-text {
  flex: 1;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-word;
}
.mini-num { color: var(--ink-soft); font-size: 14px; flex: none; }

/* ---------- Полноэкранная карточка ---------- */
.reader {
  position: fixed;
  inset: 0;
  background-color: var(--paper);
  background-image: radial-gradient(var(--dot) 1.15px, transparent 1.15px);
  background-size: 22px 22px;
  display: flex;
  flex-direction: column;
  z-index: 20;
  padding: max(8px, env(safe-area-inset-top)) 12px
           max(12px, env(safe-area-inset-bottom)) 12px;
  /* Соседние карточки стоят за краями экрана. clip, а не hidden: hidden
     заводит внутри область прокрутки, и браузер вынужден проверять её на
     каждом кадре хода — как раз то, от чего мы уходим. clip просто
     отрезает по краю. Старый Safari его не знает и молча пропустит: экран
     всё равно position:fixed, за пределы страницы соседки не вылезут. */
  overflow: clip;
}
.reader-bar { display: flex; align-items: center; gap: 8px; min-height: var(--tap); }
.reader-pos { flex: 1; text-align: center; color: var(--ink-soft); font-size: 14px; }

.stage {
  flex: 1;
  position: relative;
  touch-action: pan-y;
}

/* Каретка: единственное, что двигается при перелистывании. Все три
   карточки лежат внутри и едут вместе с ней.
   will-change и translate3d просят браузер подготовить один слой заранее
   и дальше только сдвигать его. Раньше слоёв было три, и на телефоне их
   сведение на каждом кадре давало рывки. */
.track {
  position: absolute;
  inset: 0;
  will-change: transform;
  transform: translate3d(0, 0, 0);
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* Карточка занимает 80% ширины и 80% доступной высоты — как просили.
   Все карточки, включая текущую, стоят по центру сцены абсолютно: так их
   геометрия совпадает точно и в момент подмены ничего не смещается. */
.bigcard {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 80%;
  max-width: 520px;
  height: 80%;
  border-radius: 10px;
  background-color: var(--card-yellow);
  border: 1px solid var(--card-yellow-edge);
  /* Карточку тянут пальцем — браузер не должен перехватывать жест
     под свою прокрутку, иначе перелистывание срабатывает через раз */
  touch-action: pan-y;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: 0 10px 24px rgba(0, 0, 0, .16), 0 2px 4px rgba(0, 0, 0, .12);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 24px;
  z-index: 1;              /* текущая карточка поверх соседних */
  /* Едва заметная волокнистость бумаги */
  background-image:
    repeating-linear-gradient(90deg, rgba(0,0,0,.018) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 4px);
}
.bigcard-text {
  font: 500 clamp(20px, 5.4vw, 30px)/1.35 -apple-system, BlinkMacSystemFont,
        "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
  text-align: center;
  color: #2B2408;
  overflow-y: auto;
  max-height: 100%;
  width: 100%;
  word-break: break-word;
  white-space: pre-wrap;      /* переносы строк пользователя сохраняются */
}
/* Когда снизу есть плеер, освобождаем под него место, чтобы текст
   не заезжал под кнопку */
/* Дорожка со временем занимает больше места, чем прежняя строчка:
   40 px сама дорожка плюс подпись под ней */
.bigcard:has(.audio-bar:not(:empty)) { padding-bottom: 96px; }
.bigcard:active { cursor: grabbing; }
.bigcard-text { user-select: text; -webkit-user-select: text; }

/* Соседняя карточка — та, что подъезжает при свайпе.
   Размеры и вид те же, что у текущей: в момент подмены они совпадают
   точно, поэтому переход незаметен. Стоит не под карточкой, а сбоку от
   неё, за краем экрана, — в покое её не видно.
   Собственный сдвиг ставится из кода один раз, при сборке экрана: дальше
   двигается только каретка, а карточки внутри неё стоят неподвижно. */
.bigcard.side {
  pointer-events: none;          /* палец её не хватает и текст не выделяет */
  z-index: 0;
  cursor: default;
}
.bigcard.side .bigcard-text { overflow: hidden; user-select: none; }
/* Место под плеер оставляем и у соседней: иначе в момент подмены текст
   карточки с записью прыгнул бы вверх */
.bigcard.side.with-audio { padding-bottom: 96px; }


.reader-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding-top: 10px;
}

/* ---------- Кнопки и формы ---------- */
.btn {
  border: 0;
  border-radius: 12px;
  padding: 12px 18px;
  min-height: var(--tap);
  font: 600 16px/1 -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--ink);
  color: #fff;
  cursor: pointer;
}
.btn.sec { background: rgba(0, 0, 0, .06); color: var(--ink); }
.btn.danger { background: var(--danger); }
.btn:active { opacity: .85; }

.add-tile {
  border: 1.5px dashed rgba(0, 0, 0, .22);
  background: transparent;
  border-radius: var(--radius-m);
  min-height: 104px;
  color: var(--ink-soft);
  font-family: inherit;
  font-weight: 500;
  font-size: 15px;
  line-height: 1.3;
  cursor: pointer;
}
.add-tile:active { background: rgba(0, 0, 0, .04); }

.empty { color: var(--ink-soft); padding: 28px 6px; text-align: center; }

/* ---------- Модальное окно ---------- */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .38);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 40;
}
.sheet {
  background: var(--sheet);
  width: 100%;
  max-width: 560px;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px max(18px, env(safe-area-inset-bottom));
}
@media (min-width: 560px) {
  .modal { align-items: center; }
  .sheet { border-radius: 20px; }
}
.sheet h3 { margin: 0 0 14px; font-size: 19px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; }
.field input, .field textarea {
  width: 100%;
  border: 1px solid var(--hair);
  border-radius: 12px;
  padding: 12px;
  /* Размер и семейство — двумя отдельными строками, и это важно.
     Сокращённая запись «font: 400 17px/1.4 inherit» недействительна:
     семейство шрифта в ней нельзя задать словом inherit, поэтому браузер
     отбрасывал правило целиком. Поле оставалось с системным размером
     около 13 px, а Safari увеличивает страницу на любом поле мельче
     16 px — отсюда и был скачок масштаба при открытии редактирования. */
  font-family: inherit;
  font-weight: 400;
  font-size: 17px;
  line-height: 1.4;
  background: #FCFCFB;
  color: var(--ink);
}
.field textarea { min-height: 132px; resize: vertical; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch {
  width: 38px; height: 38px; border-radius: 10px;
  border: 2px solid transparent; cursor: pointer;
}
.swatch[aria-pressed="true"] { border-color: var(--ink); }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { flex: 1; }

.hint { font-size: 13px; color: var(--ink-soft); margin: 10px 2px 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Отметка о последней синхронизации — справочная, не должна тянуть внимание */
.sync-note {
  margin: -2px 2px 4px;
  font-size: 12px;
  color: var(--ink-soft);
  opacity: .8;
}

/* Обёртка экрана. Нужна для жеста «назад»: экран едет целиком.
   touch-action оставляет вертикальную прокрутку системе, а горизонталь
   отдаёт нам — иначе жест конфликтует со скроллом списка. */
.page {
  touch-action: pan-y pinch-zoom;
  will-change: transform;
  transform: translateX(0);
  /* Обёртка тянется на всю высоту: жест ловится и в пустой области под
     списком, и экран уезжает целиком, а не только та часть, где текст */
  min-height: 100%;
}

/* Блок синхронизации: кнопка и под ней пояснение, куда идут данные */
.sync-row { margin: 14px 0; }
.sync-row .btn { width: 100%; }
.sync-row .hint { margin: 6px 2px 0; }

/* Результат синхронизации. Раньше это была мелкая серая строчка, и её
   попросту не замечали — человек не понимал, сработало или нет. */
.sync-status { margin: 12px 0; }
.sync-status:empty { display: none; }
.sync-status > div {
  font-size: 16px;
  line-height: 1.5;
  white-space: pre-line;
  padding: 2px 0;
}
.sync-status.ok {
  background: #EFF6EF;
  border: 1px solid #CBE3CB;
  border-radius: 12px;
  padding: 12px 14px;
}
.sync-status.bad {
  background: #FBEFEE;
  border: 1px solid #EDC9C5;
  border-radius: 12px;
  padding: 12px 14px;
  color: #8A2A20;
}
.sync-status.wait { color: var(--ink-soft); padding: 4px 2px; }

/* Запасной способ загрузки, если окно выбора файла не даёт нажать файл */
.fallback { margin-top: 14px; border-top: 1px solid var(--hair); padding-top: 10px; }
.fallback summary {
  font-size: 14px;
  color: var(--ink-soft);
  cursor: pointer;
  min-height: 32px;
  display: flex;
  align-items: center;
}
.paste-box {
  width: 100%;
  font: 400 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  border: 1px solid var(--hair);
  border-radius: var(--radius-m);
  padding: 10px 12px;
  background: var(--sheet);
  color: var(--ink);
  resize: vertical;
  margin-bottom: 10px;
}
</style>
</head>
<body>
<main id="app" class="app"></main>
<script>/* Аффирмации — логика приложения.
 *
 * ПРИНЦИПЫ БЕЗОПАСНОСТИ, заложенные в код:
 *
 * 1. Сети нет вообще. Ни fetch, ни XMLHttpRequest, ни WebSocket не
 *    вызываются; в index.html политика CSP запрещает их на уровне браузера
 *    (connect-src 'none'). Данные физически не могут утечь.
 * 2. Текст пользователя НИКОГДА не попадает в innerHTML. Только
 *    textContent и createElement. Это закрывает XSS: даже если вставить
 *    в карточку <img onerror=...>, это останется видимым текстом.
 * 3. Ничего не выполняется динамически: ни eval, ни new Function,
 *    ни строковых обработчиков в разметке.
 * 4. Всё, что читается из хранилища, проходит проверку типов и длин.
 *    Испорченный или подменённый JSON не свалит приложение и не пролезет
 *    в интерфейс неожиданным типом.
 * 5. Импорт резервной копии проходит ту же проверку, что и хранилище.
 */
'use strict';

(function () {
  const STORE_KEY = 'affirmations.v1';

  // Ограничения длины: защита и от случайной вставки книги, и от попытки
  // раздуть хранилище до отказа
  const LIMITS = {
    sectionName: 60,
    deckName: 60,
    cardText: 2000,
    sections: 50,
    decksPerSection: 100,
    cardsPerDeck: 500,
  };

  // Цвета плиток колод
  const COLORS = ['#D9534F', '#7E8A6E', '#E8974A', '#8C93E0',
                  '#7FBF7F', '#5E86C7', '#B87FBF', '#4F9E9E'];

  // Цвета карточки. Все восемь одинаково насыщенные: прежние бледные
  // оттенки выглядели полупрозрачными рядом с жёлтым, и казалось, будто
  // они недоступны. Тёмный текст на каждом из них держит контраст не
  // ниже 5,7 : 1 — это выше требования 4,5 : 1.
  const CARD_COLORS = ['#E6C84C', '#F0A93C', '#EE8172', '#6FB0E3',
                       '#6FC58C', '#AE72E0', '#5FC7C0', '#EE76AC'];

  // Бледная палитра прежних версий. В выборе её больше нет, но карточки,
  // покрашенные раньше, должны сохранить свой цвет: без этого списка
  // проверка данных сочла бы цвет чужим и перекрасила бы всё в жёлтый.
  const LEGACY_COLORS = ['#F2E6C9', '#F3C9C0', '#CFE0EE', '#CFE6D2',
                         '#E8D7EE', '#FFFDF6', '#DCD6C8'];
  const KNOWN_COLORS = CARD_COLORS.concat(LEGACY_COLORS);

  const CARD_EDGE = {
    '#E6C84C': '#C5AC41', '#F0A93C': '#CE9133', '#EE8172': '#CC6E62',
    '#6FB0E3': '#5F97C3', '#6FC58C': '#5FA978', '#AE72E0': '#9562C0',
    '#5FC7C0': '#51ABA5', '#EE76AC': '#CC6593',
    // прежние бледные
    '#F2E6C9': '#DFD0AF', '#F3C9C0': '#DFAFA6', '#CFE0EE': '#B2C9DA',
    '#CFE6D2': '#B2D0B6', '#E8D7EE': '#CDB8D6', '#FFFDF6': '#E6E2D6',
    '#DCD6C8': '#C4BCA9',
  };

  // ------------------------------------------------------------------
  // Хранилище
  // ------------------------------------------------------------------
  function uid() {
    // crypto.randomUUID есть в Safari 15.4+; запасной путь — тоже из
    // криптографического генератора, а не из Math.random
    if (self.crypto && typeof self.crypto.randomUUID === 'function') {
      return self.crypto.randomUUID();
    }
    const a = new Uint8Array(16);
    self.crypto.getRandomValues(a);
    return Array.from(a, (b) => b.toString(16).padStart(2, '0')).join('');
  }

  const PEAK_COUNT = 190;   // столько столбиков рисуем в дорожке

  // Имя файла обмена между устройствами.
  //
  // Расширение .txt выбрано намеренно. iPhone в окне выбора файла делает
  // серым и неактивным всё, что система не умеет открыть сама, — .json
  // как раз из таких: файл виден, но нажать на него нельзя. Обычный текст
  // выбирается без препятствий. Содержимое от этого не меняется: внутри
  // тот же JSON, и он же проверяется при чтении.
  const SYNC_FILE = 'affirmations-sync.txt';

  function clampStr(value, max) {
    return typeof value === 'string' ? value.slice(0, max) : '';
  }

  /** Форма волны из файла или хранилища — только целые 0–100. */
  function sanitizePeaks(value) {
    if (!Array.isArray(value)) return [];
    const out = [];
    for (const v of value.slice(0, 400)) {
      const n = Math.round(Number(v));
      out.push(isFinite(n) ? Math.max(0, Math.min(100, n)) : 0);
    }
    return out;
  }

  /**
   * Посчитать форму волны из записи.
   *
   * Звук раскодируется целиком и делится на PEAK_COUNT отрезков; для
   * каждого берём максимум громкости. Максимум, а не среднее: на среднем
   * тихая речь превращается в ровную полоску, и ориентироваться по ней
   * невозможно.
   */
  function computePeaks(blob) {
    const Ctx = self.AudioContext || self.webkitAudioContext;
    if (!Ctx || !blob) return Promise.resolve([]);
    return blob.arrayBuffer().then((buf) => new Promise((resolve) => {
      const ctx = new Ctx();
      // Без этого Safari на iPhone держит узел спящим и разбор молча
      // не доходит до конца
      if (typeof ctx.resume === 'function') { try { ctx.resume(); } catch (e) {} }
      const done = (peaks) => {
        try { ctx.close(); } catch (e) { /* уже закрыт */ }
        resolve(peaks);
      };
      const onOk = (audio) => {
        try {
          const data = audio.getChannelData(0);
          const step = Math.max(1, Math.floor(data.length / PEAK_COUNT));
          const raw = [];
          let top = 0;
          for (let i = 0; i < PEAK_COUNT; i++) {
            let peak = 0;
            const start = i * step;
            const end = Math.min(data.length, start + step);
            // По каждому четвёртому отсчёту: на слух разницы нет,
            // а на пятиминутной записи это в разы быстрее
            for (let j = start; j < end; j += 4) {
              const v = data[j] < 0 ? -data[j] : data[j];
              if (v > peak) peak = v;
            }
            raw.push(peak);
            if (peak > top) top = peak;
          }
          // Нормируем по самому громкому месту, иначе тихая запись
          // выглядит пустой полосой
          const k = top > 0.001 ? 100 / top : 0;
          done(raw.map((v) => Math.round(v * k)));
        } catch (e) { done([]); }
      };
      try {
        const p = ctx.decodeAudioData(buf, onOk, () => done([]));
        if (p && typeof p.then === 'function') p.then(onOk).catch(() => done([]));
      } catch (e) { done([]); }
    })).catch(() => []);
  }

  /** Привести любой ввод к заведомо корректной структуре. */
  function sanitizeState(raw) {
    const out = { sections: [] };
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.sections)) {
      return out;
    }
    if (typeof raw.syncedAt === 'number' && isFinite(raw.syncedAt)
        && raw.syncedAt > 0) {
      out.syncedAt = raw.syncedAt;
    }
    out.favCollapsed = raw.favCollapsed === true;
    for (const s of raw.sections.slice(0, LIMITS.sections)) {
      if (!s || typeof s !== 'object') continue;
      const section = {
        id: clampStr(s.id, 40) || uid(),
        name: clampStr(s.name, LIMITS.sectionName) || 'Раздел',
        collapsed: s.collapsed === true,   // строго булево
        decks: [],
      };
      const decks = Array.isArray(s.decks) ? s.decks : [];
      for (const d of decks.slice(0, LIMITS.decksPerSection)) {
        if (!d || typeof d !== 'object') continue;
        const deck = {
          id: clampStr(d.id, 40) || uid(),
          name: clampStr(d.name, LIMITS.deckName) || 'Колода',
          color: COLORS.includes(d.color) ? d.color : COLORS[0],
          cards: [],
        };
        const cards = Array.isArray(d.cards) ? d.cards : [];
        for (const c of cards.slice(0, LIMITS.cardsPerDeck)) {
          if (!c || typeof c !== 'object') continue;
          const text = clampStr(c.text, LIMITS.cardText);
          if (!text.trim()) continue;
          deck.cards.push({
            id: clampStr(c.id, 40) || uid(),
            text: text,
            // Цвет только из списка: иначе через файл копии можно было бы
            // подсунуть в стиль произвольное значение
            color: KNOWN_COLORS.includes(c.color) ? c.color : CARD_COLORS[0],
            fav: c.fav === true,          // строго булево, не «похожее на правду»
            audio: c.audio === true,      // сама запись лежит в IndexedDB
            // Длину записи держим рядом с карточкой. Спрашивать её у
            // самого файла ненадёжно: браузеры часто отдают Infinity для
            // записей, сделанных на лету, и полоса времени ломается.
            audioLen: (typeof c.audioLen === 'number' && isFinite(c.audioLen)
                       && c.audioLen > 0) ? Math.min(c.audioLen, 3600) : 0,
            // Форма волны: столбики громкости, целые числа 0–100.
            // Считается один раз при записи и хранится рядом с карточкой,
            // иначе при каждом открытии пришлось бы заново раскодировать
            // весь звук — на телефоне это заметная задержка.
            peaks: sanitizePeaks(c.peaks),
          });
        }
        section.decks.push(deck);
      }
      out.sections.push(section);
    }
    return out;
  }

  function load() {
    let raw = null;
    try {
      raw = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    } catch (e) {
      // Битый JSON не должен ронять приложение — начинаем с примера
      raw = null;
    }
    if (!raw) return seed();
    return sanitizeState(raw);
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      // Хранилище переполнено или заблокировано в приватном режиме
      alert('Не удалось сохранить: в браузере кончилось место для данных.');
    }
  }

  function seed() {
    return {
      sections: [
        {
          id: uid(), name: 'Психология',
          decks: [
            { id: uid(), name: 'Опора на себя', color: COLORS[0], cards: [
              { id: uid(), color: CARD_COLORS[0], fav: false,
                text: 'Я справляюсь с тем, что от меня зависит,\nи отпускаю остальное.' },
              { id: uid(), color: CARD_COLORS[1], fav: false,
                text: 'Моё спокойствие не зависит\nот чужого настроения.' },
            ]},
            { id: uid(), name: 'Границы', color: COLORS[1], cards: [
              { id: uid(), color: CARD_COLORS[3], fav: false,
                text: 'Я имею право сказать «нет»\nбез объяснений.' },
            ]},
          ],
        },
        {
          id: uid(), name: 'Страхи',
          decks: [
            { id: uid(), name: 'Перед выступлением', color: COLORS[2], cards: [
              { id: uid(), color: CARD_COLORS[4], fav: false,
                text: 'Волнение — это энергия.\nЯ направляю её в голос.' },
            ]},
          ],
        },
      ],
    };
  }

  // ------------------------------------------------------------------
  // Хранилище голосовых записей
  //
  // Отдельно от карточек и намеренно. В localStorage лежат только строки,
  // и объём там около 5 МБ на весь сайт — одна минута записи в base64
  // съела бы почти всё. Поэтому звук идёт в IndexedDB, где хранится
  // двоичными объектами как есть, без раздувания.
  //
  // Никуда не отправляется: connect-src 'none' запрещает любые запросы,
  // запись остаётся на устройстве.
  // ------------------------------------------------------------------
  const AudioStore = (function () {
    const DB = 'affirmations-audio', STORE = 'clips';
    let dbp = null;

    function open() {
      if (dbp) return dbp;
      dbp = new Promise((resolve, reject) => {
        if (!self.indexedDB) { reject(new Error('no-indexeddb')); return; }
        const req = self.indexedDB.open(DB, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      return dbp;
    }

    /**
     * Одна операция с хранилищем.
     *
     * Запись считается состоявшейся не тогда, когда прошёл запрос, а
     * когда закрылась вся сделка (oncomplete). Разница не теоретическая:
     * запрос успевает отчитаться раньше, чем данные легли на диск, и
     * если в этот момент перерисовать страницу, запись может пропасть —
     * карточка будет говорить, что звук есть, а звука не будет.
     */
    function tx(mode, fn) {
      return open().then((db) => new Promise((resolve, reject) => {
        let t;
        try { t = db.transaction(STORE, mode); }
        catch (e) { reject(e); return; }
        let out;
        const req = fn(t.objectStore(STORE));
        req.onsuccess = () => { out = req.result; };
        req.onerror = () => reject(req.error);
        t.onabort = () => reject(t.error || new Error('aborted'));
        t.onerror = () => reject(t.error);
        // Ждём именно закрытия сделки. Проверять, поддерживается ли
        // такое событие, незачем: оно есть во всех реализациях, а
        // запасной путь «резолвить по успеху запроса» возвращал бы нас
        // ровно к той ошибке, из-за которой запись пропадала.
        t.oncomplete = () => resolve(out);
      }));
    }

    /**
     * Записи храним не объектом Blob, а его содержимым.
     *
     * Safari кладёт Blob в хранилище отдельным файлом, и эта связка
     * ненадёжна: объект сохраняется, а при чтении возвращается пустым.
     * Простой массив байтов лежит внутри самой базы и читается везде
     * одинаково. Тип звука держим рядом, чтобы собрать Blob обратно.
     */
    function pack(blob) {
      if (!blob) return Promise.resolve(null);
      if (typeof blob.arrayBuffer === 'function') {
        return blob.arrayBuffer().then((buf) => (
          { kind: 'clip', type: blob.type || 'audio/webm', buf: buf }));
      }
      return Promise.resolve(blob);   // старый браузер — кладём как есть
    }

    function unpack(value) {
      if (!value) return null;
      // Записи, сохранённые прежними версиями, лежат объектом Blob
      if (!value.kind) return value;
      try { return new Blob([value.buf], { type: value.type || 'audio/webm' }); }
      catch (e) { return null; }
    }

    return {
      put: (id, blob) => pack(blob).then((v) => tx('readwrite', (s) => s.put(v, id))),
      get: (id) => tx('readonly', (s) => s.get(id)).then(unpack),
      del: (id) => tx('readwrite', (s) => s.delete(id)),
      available: () => !!self.indexedDB,

      /** Запись → строка, пригодная для файла синхронизации. */
      toText: (blob) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result));   // data:audio/...;base64,...
        r.onerror = () => reject(r.error);
        r.readAsDataURL(blob);
      }),

      /** Обратно: строка из файла → запись.
       *  Через fetch на data-адрес было бы короче, но connect-src 'none'
       *  такие запросы запрещает — разбираем base64 вручную. */
      fromText: (text) => {
        const str = String(text || '');
        if (str.slice(0, 5) !== 'data:') return null;
        const comma = str.indexOf(',');
        if (comma < 0) return null;

        // Заголовок разбираем по частям, а не одним шаблоном.
        //
        // Здесь была ошибка, из-за которой записи не доезжали до второго
        // устройства. Шаблон ждал ровно «data:тип;base64,», а браузеры
        // пишут в тип ещё и кодек: «audio/webm;codecs=opus»,
        // «audio/mp4;codecs=mp4a.40.2». Такая строка под шаблон не
        // подходила, разбор возвращал пустоту, и запись молча
        // пропускалась — при том что в файле она была.
        const head = str.slice(5, comma).split(';');
        const type = head[0] || 'audio/webm';
        let base64 = false;
        for (let i = 1; i < head.length; i++) {
          if (head[i].trim().toLowerCase() === 'base64') base64 = true;
        }
        const body = str.slice(comma + 1);

        try {
          if (base64) {
            // Пробелы и переводы строк иногда добавляют почтовые и
            // облачные посредники — они не часть данных
            const bin = atob(body.replace(/\s+/g, ''));
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            if (!bytes.length) return null;
            return new Blob([bytes], { type: type });
          }
          return new Blob([decodeURIComponent(body)], { type: type });
        } catch (e) {
          return null;   // повреждённая строка — просто пропускаем запись
        }
      },
    };
  })();

  /**
   * Убрать отметку «есть запись» у карточек, у которых записи нет.
   *
   * Такое расхождение возникает законным путём: резервная копия — это
   * только текст, звук в неё не входит. Восстановив её, приложение
   * получало карточки, уверенные в наличии звука, а при нажатии на
   * «играть» упиралось в пустоту. Здесь мы сверяем отметки с
   * действительностью один раз и приводим их в порядок.
   *
   * onDone получает число исправленных карточек.
   */
  function healAudioFlags(onDone) {
    const done = (n) => { if (typeof onDone === 'function') onDone(n); };
    if (!AudioStore.available()) { done(0); return; }
    const suspects = [];
    for (const sec of state.sections) {
      for (const deck of sec.decks) {
        for (const card of deck.cards) if (card.audio) suspects.push(card);
      }
    }
    if (!suspects.length) { done(0); return; }

    let fixed = 0;
    const step = (i) => {
      if (i >= suspects.length) {
        if (fixed) { save(); render(); }
        done(fixed);
        return;
      }
      const card = suspects[i];
      AudioStore.get(card.id).then((blob) => {
        // Пустой объект считаем отсутствующим: именно так выглядит
        // запись, которая не долежала до конца сделки с хранилищем
        if (!blob || !blob.size) {
          card.audio = false; card.audioLen = 0; card.peaks = [];
          fixed++;
        }
        step(i + 1);
      }).catch(() => step(i + 1));   // хранилище недоступно — не трогаем
    };
    step(0);
  }

  /** Можно ли вообще записывать здесь и сейчас. */
  function recordingSupport() {
    if (!self.isSecureContext) {
      return { ok: false, why: 'context' };   // открыто как файл, не через сервер
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia
        || typeof self.MediaRecorder === 'undefined') {
      return { ok: false, why: 'unsupported' };
    }
    if (!AudioStore.available()) return { ok: false, why: 'storage' };
    return { ok: true };
  }

  const RECORD_HELP = {
    context: 'Запись звука недоступна, когда файл открыт напрямую: браузер '
      + 'разрешает микрофон только на защищённой странице. Запустите '
      + 'приложение через start.command — по адресу localhost запись '
      + 'работает. На iPhone нужен тот же способ.',
    unsupported: 'Этот браузер не умеет записывать звук. Попробуйте Safari '
      + 'или Chrome посвежее.',
    storage: 'Браузер не даёт сохранить запись. В приватном окне это '
      + 'ограничение обычное — откройте обычное окно.',
  };

  // ------------------------------------------------------------------
  // Утилиты DOM. Текст только через textContent — никакого innerHTML.
  // ------------------------------------------------------------------
  function el(tag, opts, children) {
    const node = document.createElement(tag);
    if (opts) {
      if (opts.class) node.className = opts.class;
      if (opts.text != null) node.textContent = String(opts.text);
      if (opts.attrs) {
        for (const k of Object.keys(opts.attrs)) {
          node.setAttribute(k, String(opts.attrs[k]));
        }
      }
      if (opts.style) {
        for (const k of Object.keys(opts.style)) {
          node.style.setProperty(k, String(opts.style[k]));
        }
      }
      if (opts.on) {
        for (const k of Object.keys(opts.on)) node.addEventListener(k, opts.on[k]);
      }
    }
    if (children) {
      for (const c of children) if (c) node.appendChild(c);
    }
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  // ------------------------------------------------------------------
  // Состояние навигации
  // ------------------------------------------------------------------
  let state = load();
  let view = { name: 'home', sectionId: null, deckId: null, index: 0 };
  const root = document.getElementById('app');

  function findSection(id) { return state.sections.find((s) => s.id === id) || null; }
  function findDeck(sectionId, deckId) {
    const s = findSection(sectionId);
    return s ? (s.decks.find((d) => d.id === deckId) || null) : null;
  }

  function go(next) {
    view = Object.assign({ name: 'home', sectionId: null, deckId: null, index: 0 }, next);
    render();
  }

  // ------------------------------------------------------------------
  // Экран 1: разделы и колоды
  // ------------------------------------------------------------------
  function renderHome() {
    const frag = document.createDocumentFragment();

    frag.appendChild(el('div', { class: 'topbar' }, [
      el('h1', { text: 'Аффирмации' }),
      el('button', {
        class: 'iconbtn', attrs: { 'aria-label': 'Синхронизация', type: 'button' },
        text: '↻', on: { click: openSync },
      }),
      el('button', {
        class: 'iconbtn', attrs: { 'aria-label': 'Настройки', type: 'button' },
        text: '⋯', on: { click: openSettings },
      }),
    ]));

    if (state.syncedAt) {
      frag.appendChild(el('p', { class: 'sync-note',
        text: 'Последняя синхронизация: ' + humanTime(state.syncedAt) }));
    }

    if (state.sections.length === 0) {
      frag.appendChild(el('p', { class: 'empty', text: 'Пока пусто. Создайте первый раздел.' }));
    }

    // Избранное — не отдельная колода, а ссылки на настоящие карточки.
    // Так удаление и правка всегда идут по одному живому объекту, и не
    // возникает копии, которая рассинхронизируется с оригиналом.
    const favs = collectFavourites();
    if (favs.length > 0) {
      const favHead = el('div', { class: 'section-head' }, [
        el('button', {
          class: 'section-toggle', attrs: {
            type: 'button', 'aria-expanded': String(!state.favCollapsed) },
          on: { click: () => { state.favCollapsed = !state.favCollapsed; save(); render(); } },
        }, [
          el('span', { class: 'chev' + (state.favCollapsed ? ' closed' : ''), text: '⌄' }),
          el('h2', { text: 'Избранное' }),
          el('span', { class: 'section-count', text: cardsLabel(favs.length) }),
        ]),
        el('button', {
          class: 'iconbtn ghost',
          attrs: { 'aria-label': 'Управление избранным', type: 'button' },
          text: '✎', on: { click: manageFavourites },
        }),
      ]);

      const favSection = el('div', { class: 'section' }, [favHead]);
      if (!state.favCollapsed) {
        const list = el('div', { class: 'card-list' });
        favs.forEach((f) => {
          const sw = el('span', { class: 'mini-swatch' });
          sw.style.setProperty('background-color', f.card.color);
          sw.style.setProperty('border-color', CARD_EDGE[f.card.color] || f.card.color);

          // Строка — не кнопка, а контейнер: внутри две независимые зоны.
          // Иначе нажатие на сердечко срабатывало бы и как открытие карточки.
          const open = el('button', {
            class: 'mini-open', attrs: { type: 'button' },
            on: { click: () => go({ name: 'read', sectionId: f.sectionId,
                                    deckId: f.deckId, index: f.index }) },
          }, [
            sw,
            el('span', { class: 'mini-text', text: f.card.text }),
            f.card.audio ? el('span', { class: 'mini-audio', text: '♪' }) : null,
          ]);

          const heart = el('button', {
            class: 'iconbtn heart on', attrs: {
              type: 'button', 'aria-pressed': 'true',
              'aria-label': 'Убрать из избранного' },
            text: '♥',
            on: { click: () => { f.card.fav = false; save(); render(); } },
          });

          list.appendChild(el('div', { class: 'mini' }, [open, heart]));
        });
        favSection.appendChild(list);
      }
      frag.appendChild(favSection);
    }

    for (const section of state.sections) {
      // Заголовок раздела — кнопка: нажатие сворачивает и разворачивает.
      // Карандаш вынесен отдельной кнопкой рядом, иначе правка и
      // сворачивание конфликтовали бы на одном нажатии.
      const toggle = el('button', {
        class: 'section-toggle', attrs: {
          type: 'button',
          'aria-expanded': String(!section.collapsed),
        },
        on: { click: () => { section.collapsed = !section.collapsed; save(); render(); } },
      }, [
        el('span', { class: 'chev' + (section.collapsed ? ' closed' : ''), text: '⌄' }),
        el('h2', { text: section.name }),
        el('span', { class: 'section-count', text: decksLabel(section.decks.length) }),
      ]);

      const head = el('div', { class: 'section-head' }, [
        toggle,
        el('button', {
          class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить раздел', type: 'button' },
          text: '✎', on: { click: () => editSection(section) },
        }),
      ]);

      if (section.collapsed) {
        frag.appendChild(el('div', { class: 'section collapsed' }, [head]));
        continue;
      }

      const grid = el('div', { class: 'deck-grid' });
      for (const deck of section.decks) {
        const single = deck.cards.length <= 1;
        grid.appendChild(el('button', {
          class: 'deck' + (single ? ' single' : ''),
          style: { background: deck.color },
          attrs: { type: 'button' },
          on: { click: () => go({ name: 'deck', sectionId: section.id, deckId: deck.id }) },
        }, [
          el('p', { class: 'deck-title', text: deck.name }),
          el('span', { class: 'deck-count', text: cardsLabel(deck.cards.length) }),
        ]));
      }
      grid.appendChild(el('button', {
        class: 'add-tile', attrs: { type: 'button' },
        text: '+ Колода',
        on: { click: () => editDeck(section, null) },
      }));

      frag.appendChild(el('div', { class: 'section' }, [head, grid]));
    }

    frag.appendChild(el('div', { class: 'section' }, [
      el('button', {
        class: 'btn sec', attrs: { type: 'button' }, text: '+ Новый раздел',
        on: { click: () => editSection(null) },
      }),
    ]));

    // Экран заворачиваем в один узел: анимация возврата двигает его
    // целиком. Без обёртки уехала бы только первая строка.
    const page = el('div', { class: 'page' });
    page.appendChild(frag);
    return page;
  }

  /** Список избранного с возможностью убрать по одной или все сразу. */
  function manageFavourites() {
    const wrap = el('div', { class: 'modal' });
    const close = () => { if (wrap.parentNode) wrap.parentNode.removeChild(wrap); };
    const sheet = el('div', { class: 'sheet' });

    // Окно перерисовывается на месте: после снятия сердечка список
    // должен обновиться сразу, не закрываясь
    function draw() {
      clear(sheet);
      const favs = collectFavourites();
      sheet.appendChild(el('h3', { text: 'Избранное — ' + cardsLabel(favs.length) }));

      if (favs.length === 0) {
        sheet.appendChild(el('p', { class: 'empty', text: 'Список пуст.' }));
      } else {
        const list = el('div', { class: 'card-list scroll' });
        favs.forEach((f) => {
          const sw = el('span', { class: 'mini-swatch' });
          sw.style.setProperty('background-color', f.card.color);
          sw.style.setProperty('border-color', CARD_EDGE[f.card.color] || f.card.color);
          list.appendChild(el('div', { class: 'mini row' }, [
            sw,
            el('span', { class: 'mini-text', text: f.card.text }),
            el('button', {
              class: 'iconbtn heart on',
              attrs: { type: 'button', 'aria-label': 'Убрать из избранного' },
              text: '♥',
              on: { click: () => { f.card.fav = false; save(); draw(); render(); } },
            }),
          ]));
        });
        sheet.appendChild(list);
        sheet.appendChild(el('button', {
          class: 'btn danger', attrs: { type: 'button' },
          style: { width: '100%', 'margin-top': '12px' },
          text: 'Убрать все из избранного',
          on: {
            click: () => {
              if (!confirm('Убрать все карточки из избранного? Сами карточки останутся.')) return;
              collectFavourites().forEach((x) => { x.card.fav = false; });
              save(); draw(); render();
            },
          },
        }));
      }

      sheet.appendChild(el('p', { class: 'hint', text:
        'Сердечко убирает карточку из избранного. Сама карточка остаётся '
        + 'в своей колоде.' }));
      sheet.appendChild(el('div', { class: 'sheet-actions' }, [
        el('button', { class: 'btn', attrs: { type: 'button' }, text: 'Готово',
                       on: { click: close } }),
      ]));
    }

    draw();
    wrap.appendChild(sheet);
    wrap.addEventListener('click', (ev) => { if (ev.target === wrap) close(); });
    document.body.appendChild(wrap);
  }

  function decksLabel(n) {
    const mod10 = n % 10, mod100 = n % 100;
    let word = 'колод';
    if (mod10 === 1 && mod100 !== 11) word = 'колода';
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = 'колоды';
    return n + ' ' + word;
  }

  function collectFavourites() {
    const out = [];
    for (const s of state.sections) {
      for (const d of s.decks) {
        d.cards.forEach((c, idx) => {
          if (c.fav) out.push({ sectionId: s.id, deckId: d.id, index: idx, card: c });
        });
      }
    }
    return out;
  }

  function cardsLabel(n) {
    const mod10 = n % 10, mod100 = n % 100;
    let word = 'карточек';
    if (mod10 === 1 && mod100 !== 11) word = 'карточка';
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 12 || mod100 > 14)) word = 'карточки';
    return n + ' ' + word;
  }

  // ------------------------------------------------------------------
  // Экран 2: карточки колоды
  // ------------------------------------------------------------------
  function renderDeck() {
    const section = findSection(view.sectionId);
    const deck = findDeck(view.sectionId, view.deckId);
    if (!section || !deck) return renderHome();

    const frag = document.createDocumentFragment();
    frag.appendChild(el('div', { class: 'topbar' }, [
      el('button', {
        class: 'iconbtn', attrs: { 'aria-label': 'Назад', type: 'button' },
        text: '‹', on: { click: () => go({ name: 'home' }) },
      }),
      el('h1', { class: 'small', text: deck.name }),
      el('button', {
        class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить колоду', type: 'button' },
        text: '✎', on: { click: () => editDeck(section, deck) },
      }),
    ]));

    const list = el('div', { class: 'card-list' });
    if (deck.cards.length === 0) {
      list.appendChild(el('p', { class: 'empty', text: 'В колоде пока нет карточек.' }));
    }
    deck.cards.forEach((card, i) => {
      const swatch = el('span', { class: 'mini-swatch' });
      swatch.style.setProperty('background-color', card.color);
      swatch.style.setProperty('border-color', CARD_EDGE[card.color] || card.color);
      list.appendChild(el('button', {
        class: 'mini', attrs: { type: 'button' },
        on: { click: () => go({ name: 'read', sectionId: section.id, deckId: deck.id, index: i }) },
      }, [
        el('span', { class: 'mini-num', text: String(i + 1) }),
        swatch,
        el('span', { class: 'mini-text', text: card.text }),
        card.audio ? el('span', { class: 'mini-audio', text: '♪' }) : null,
        card.fav ? el('span', { class: 'mini-heart', text: '♥' }) : null,
      ]));
    });
    frag.appendChild(list);

    frag.appendChild(el('div', { class: 'section' }, [
      el('button', {
        class: 'btn', attrs: { type: 'button' }, text: '+ Карточка',
        on: { click: () => editCard(deck, null) },
      }),
    ]));

    // Свайп слева направо возвращает на главный экран. Экран едет за
    // пальцем, поэтому сразу видно, что жест поймался, и его можно
    // отменить, не доводя до конца. Кнопка «‹» остаётся на месте.
    const page = el('div', { class: 'page' });
    page.appendChild(frag);
    attachBackSwipe(page, () => go({ name: 'home' }));
    return page;
  }

  /**
   * Жест «назад»: тянем слева направо, отпускаем — уходим назад.
   *
   * Слушаем весь экран, а не только левый край: на телефоне край
   * перехватывает сама система под свой жест «назад» в Safari, и наш
   * туда просто не долетает.
   */
  function attachBackSwipe(node, onBack) {
    let id = null, x0 = 0, y0 = 0, dx = 0, axis = null, swiped = false;
    let tPrev = 0, xPrev = 0, speed = 0;

    // Слушаем корневой элемент, а не сам экран. Экран колоды короткий:
    // три карточки — и ниже пусто. Если вешать на него, в пустой области
    // жест просто не по чему поймать.
    const host = root;
    const now = () => Date.now();

    const down = (ev) => {
      if (!ev.isPrimary || sliding) return;
      // Кнопки НЕ исключаем: весь экран колоды состоит из кнопок-карточек,
      // и с таким запретом жест не начинался бы почти нигде. Вместо этого
      // ниже гасим нажатие, если палец поехал вбок.
      const t = ev.target;
      if (t && t.closest && t.closest('input, textarea')) return;
      id = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      dx = 0; axis = null; swiped = false; speed = 0;
      tPrev = now(); xPrev = ev.clientX;
      node.style.setProperty('transition', 'none');
    };

    const move = (ev) => {
      if (ev.pointerId !== id) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      if (axis === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        // Вертикальное движение — это прокрутка списка, не мешаем ей.
        // Раньше горизонталь должна была быть в 1,3 раза больше вертикали.
        // Живой палец идёт по дуге, вертикальная составляющая почти всегда
        // есть — и жест то ловился, то нет. Теперь хватает простого
        // перевеса в сторону горизонтали, как при перелистывании карточки.
        axis = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        // Указатель забираем себе: иначе, если палец уедет с кнопки, под
        // которой начался жест, часть событий уходит другому элементу и
        // движение обрывается на полпути
        if (axis === 'x' && host.setPointerCapture) {
          try { host.setPointerCapture(id); } catch (e) { /* не поддержано */ }
        }
      }
      if (axis !== 'x') return;
      if (ev.cancelable) ev.preventDefault();

      // Скорость считаем по последнему отрезку, а не по всему жесту:
      // важно, как палец шёл перед отрывом, а не как он размышлял в начале
      const tNow = now();
      if (tNow > tPrev) {
        speed = (ev.clientX - xPrev) / (tNow - tPrev);
        tPrev = tNow; xPrev = ev.clientX;
      }

      // Влево уходить некуда — там сопротивление
      dx = mx < 0 ? mx * 0.2 : mx;
      // Нажатие гасим не при любом сдвиге вбок, а только при настоящем:
      // с прежней проверкой лёгкое дрожание пальца съедало обычное касание
      // карточки, и она не открывалась
      if (dx > 12) swiped = true;
      node.style.setProperty('transform', 'translateX(' + dx.toFixed(1) + 'px)');
      node.style.setProperty('opacity', String(Math.max(0.55, 1 - dx / 900)));
    };

    const finish = (ev) => {
      if (ev.pointerId !== id) return;
      id = null;
      node.style.setProperty('transition',
        'transform ' + SLIDE_MS + 'ms ' + SLIDE_EASE + ', opacity '
        + Math.round(SLIDE_MS * 0.7) + 'ms linear');
      // Быстрый короткий взмах приравниваем к длинному: если палец
      // уходил вправо и в момент отрыва шёл быстро, дотягивать не нужно
      if (axis === 'x' && dx > 0 && swipePassed(dx, Math.max(speed, 0))) {
        const w = node.offsetWidth || 400;
        node.style.setProperty('transform', 'translateX(' + w + 'px)');
        node.style.setProperty('opacity', '0');
        pageEnter = -1;                    // главный экран въедет слева
        setTimeout(onBack, Math.round(SLIDE_MS * 0.55));
        return;
      }
      node.style.setProperty('transform', 'translateX(0)');
      node.style.setProperty('opacity', '1');
    };

    // Если палец поехал вбок, нажатие на карточку под ним не должно
    // сработать: иначе свайп заодно открывал бы карточку
    const killClick = (ev) => {
      if (!swiped) return;
      swiped = false;
      ev.preventDefault();
      ev.stopPropagation();
    };

    host.addEventListener('pointerdown', down);
    host.addEventListener('pointermove', move);
    host.addEventListener('pointerup', finish);
    host.addEventListener('pointercancel', finish);
    host.addEventListener('click', killClick, true);

    backSwipeCleanup = () => {
      host.removeEventListener('pointerdown', down);
      host.removeEventListener('pointermove', move);
      host.removeEventListener('pointerup', finish);
      host.removeEventListener('pointercancel', finish);
      host.removeEventListener('click', killClick, true);
    };
  }

  let backSwipeCleanup = null;

  // ------------------------------------------------------------------
  // Экран 3: полноэкранная карточка со свайпом
  // ------------------------------------------------------------------
  function renderReader() {
    const deck = findDeck(view.sectionId, view.deckId);
    if (!deck || deck.cards.length === 0) return renderDeck();

    const total = deck.cards.length;
    const i = Math.min(Math.max(view.index, 0), total - 1);
    const card = deck.cards[i];

    const paint = (node, colour) => {
      node.style.setProperty('background-color', colour);
      node.style.setProperty('border-color', CARD_EDGE[colour] || colour);
    };

    // На сцене три карточки: текущая и по одной соседней слева и справа.
    // Соседние стоят за краями экрана и едут той же кареткой, что и
    // текущая, — поэтому при свайпе следующая заходит из-за края вслед за
    // уходящей, а не появляется потом сама по себе.
    //
    // Прошлая попытка показать соседнюю провалилась: она лежала ПОД
    // текущей и выглядела застрявшей тенью. Здесь соседние не под
    // карточкой, а сбоку от неё, и в покое их не видно вовсе.
    const stage = el('div', { class: 'stage' });
    // Полоска проигрывания внизу карточки — появляется, только если
    // к карточке действительно прикреплена запись
    const audioBar = el('div', { class: 'audio-bar' });
    const big = el('div', { class: 'bigcard' }, [
      el('div', { class: 'bigcard-text', text: card.text }),
      audioBar,
    ]);
    paint(big, card.color);

    /**
     * Соседняя карточка: цвет, текст и дорожка звука, если запись есть.
     * Живого плеера ей не нужно — играть на подъезжающей карточке нельзя,
     * но выглядеть она должна точь-в-точь как настоящая.
     */
    const dress = [];        // чьи дорожки дорисовать следующим кадром
    const neighbour = (c) => {
      const bar = el('div', { class: 'audio-bar' });
      const g = el('div', {
        class: 'bigcard side' + (c.audio ? ' with-audio' : ''),
        attrs: { 'aria-hidden': 'true' },
      }, [
        el('div', { class: 'bigcard-text', text: c.text }),
        bar,
      ]);
      paint(g, c.color);
      if (c.audio) dress.push({ bar: bar, card: c });
      return g;
    };

    // Дорожка — это почти двести столбиков громкости на каждую карточку.
    // Рисуем их следующим кадром, а не сразу: в тот кадр, когда карточка
    // подменяется после свайпа, каждая лишняя работа видна как рывок.
    // Соседки в это время всё равно за краем экрана.
    const dressSides = () => {
      while (dress.length) {
        const it = dress.pop();
        stillPlayer(it.bar, it.card);
      }
    };

    // Все три карточки лежат в одной каретке, и двигается только она.
    //
    // Раньше каждая карточка ехала сама: браузер держал под них три
    // отдельных слоя и на каждом кадре сводил их вместе — на телефоне это
    // и давало рывки. Теперь слой один: он рисуется один раз, а дальше
    // только сдвигается, чем и занимается видеоядро.
    // Колода замкнута в круг: за последней карточкой снова идёт первая, а
    // перед первой стоит последняя. Поэтому соседей берём по остатку —
    // упора у краёв больше нет, листать можно в любую сторону без конца.
    // Круга нет только у колоды из одной карточки: ходить некуда.
    const track = el('div', { class: 'track' });
    const loop = total > 1;
    const before = loop ? neighbour(deck.cards[(i - 1 + total) % total]) : null;
    const after = loop ? neighbour(deck.cards[(i + 1) % total]) : null;
    if (before) track.appendChild(before);
    if (after) track.appendChild(after);
    track.appendChild(big);
    stage.appendChild(track);
    if (card.audio) buildPlayer(audioBar, card);

    /**
     * Насколько соседняя карточка отстоит от текущей.
     *
     * Считаем от середины сцены: полширины сцены, чтобы дойти до края
     * экрана, плюс полширины карточки, чтобы вывести её за край целиком,
     * плюс просвет между карточками. Просвет виден во время хода — это та
     * полоска бумаги, которая идёт между уходящей и приезжающей.
     *
     * Меряем при первом обращении, а не при сборке: пока карточка не
     * вставлена в страницу, ширины у неё нет.
     */
    let gap = 0;
    const measure = () => {
      // При самой первой сборке карточка ещё не в странице и меряться ей
      // нечем. Тогда считаем от ширины окна: так соседки с первого же
      // кадра стоят почти точно и не дёргаются, когда придут настоящие
      // размеры. Прежний запасной вариант был просто «360».
      const guess = (typeof window !== 'undefined' && window.innerWidth)
        ? window.innerWidth - 24 : 360;
      const sw = stage.clientWidth || guess;
      const cw = big.offsetWidth || Math.min(Math.round(sw * 0.8), 520);
      gap = Math.round((sw + cw) / 2) + CARD_GAP;
      return gap;
    };

    // Соседки стоят на своих местах и больше не двигаются: их сдвиг
    // выставляется один раз, дальше едет вся каретка целиком
    const seat = () => {
      measure();
      if (before) {
        before.style.setProperty('transform',
          'translate(-50%, -50%) translate3d(' + (-gap) + 'px, 0, 0)');
      }
      if (after) {
        after.style.setProperty('transform',
          'translate(-50%, -50%) translate3d(' + gap + 'px, 0, 0)');
      }
    };

    /**
     * Сдвинуть каретку. ms = 0 значит «сразу», без перехода: так карточка
     * идёт точно за пальцем.
     *
     * translate3d, а не translateX: так браузер наверняка отдаёт сдвиг
     * видеоядру и не перерисовывает карточки на каждом кадре.
     */
    let easing = '';
    const place = (px, ms) => {
      // Переход переписываем только когда он правда меняется. За один
      // свайп pointermove приходит сотни раз, и каждая лишняя запись в
      // стиль — это работа для браузера ровно в тот момент, когда он
      // должен рисовать кадр.
      const move = ms ? 'transform ' + ms + 'ms ' + SLIDE_EASE : 'none';
      if (move !== easing) {
        easing = move;
        track.style.setProperty('transition', move);
      }
      track.style.setProperty('transform',
        'translate3d(' + px.toFixed(1) + 'px, 0, 0)');
    };
    seat();
    place(0, 0);
    // Пока карточка не вставлена в страницу, её ширина неизвестна и просвет
    // посчитан на глазок. Со следующего кадра размеры настоящие — ставим
    // соседок точно и дорисовываем им дорожки, до того как человек успеет
    // коснуться экрана.
    requestAnimationFrame(() => { seat(); dressSides(); });

    // Перелистывание — сдвиг всей каретки ровно на один шаг. Соседняя
    // карточка приезжает точно в середину, поэтому подменять содержимое
    // можно только ПОСЛЕ конца хода: раньше она ещё не на месте, и в
    // прежней версии это давало заметный скачок.
    //
    // Ждём именно конца перехода, а не таймера: таймер и переход считают
    // время по-разному, и подмена то опережала ход, то запаздывала —
    // отсюда и был рывок в самом конце. Таймер остаётся страховкой на
    // случай, когда перехода нет вовсе (свёрнутая вкладка, отключённая
    // анимация в настройках телефона).
    function step(delta) {
      if (!loop || sliding) return;
      // По кругу: с последней уходим на первую, с первой — на последнюю
      const next = (i + delta + total) % total;
      sliding = true;
      dressSides();            // кнопками и клавишами тоже листают
      place(-delta * measure(), SLIDE_MS);

      let settled = false;
      const settle = () => {
        if (settled) return;
        settled = true;
        sliding = false;
        go({ name: 'read', sectionId: view.sectionId, deckId: view.deckId, index: next });
      };
      if (track.addEventListener) {
        track.addEventListener('transitionend', settle, { once: true });
      }
      setTimeout(settle, SLIDE_MS + 60);
    }

    // Перетаскивание карточки. Через Pointer Events, а не touch: так один
    // и тот же код работает и пальцем на iPhone, и мышью на компьютере.
    // Карточка едет за пальцем — без этого непонятно, поймался ли жест.
    let dragId = null, x0 = 0, y0 = 0, dx = 0, locked = null;
    // Порог и скорость — общие для всего приложения (SWIPE_NEED и рядом).
    // Раньше здесь было своё число 60, и одно движение пальцем в читалке
    // и в колоде срабатывало по-разному.
    let tPrev = 0, xPrev = 0, speed = 0, raw = 0;

    big.addEventListener('pointerdown', (ev) => {
      if (!ev.isPrimary) return;
      dragId = ev.pointerId; x0 = ev.clientX; y0 = ev.clientY;
      dx = 0; raw = 0; locked = null; speed = 0;
      tPrev = Date.now(); xPrev = ev.clientX;
      // Если кадр с дорисовкой почему-то не успел пройти, дорисовываем
      // сейчас: соседка обязана выехать уже со своей дорожкой
      dressSides();
      // Переход снимаем сразу, ещё до первого движения: если сделать это
      // на первом же pointermove, палец успевает уйти, а карточка секунду
      // догоняет его по прежней кривой — отсюда ощущение рывка в начале
      place(0, 0);
    });

    big.addEventListener('pointermove', (ev) => {
      if (ev.pointerId !== dragId) return;
      const mx = ev.clientX - x0, my = ev.clientY - y0;
      // Пока не решили, жест горизонтальный или вертикальный, ничего не
      // двигаем: иначе перелистывание сработает при обычной прокрутке
      if (locked === null) {
        if (Math.abs(mx) < SWIPE_START && Math.abs(my) < SWIPE_START) return;
        locked = Math.abs(mx) >= Math.abs(my) ? 'x' : 'y';
        if (locked === 'x' && big.setPointerCapture) {
          try { big.setPointerCapture(dragId); } catch (e) { /* не поддержано */ }
        }
      }
      if (locked !== 'x') return;
      ev.preventDefault();
      const tNow = Date.now();
      if (tNow > tPrev) {
        speed = Math.abs(ev.clientX - xPrev) / (tNow - tPrev);
        tPrev = tNow; xPrev = ev.clientX;
      }
      // Колода замкнута в круг, упираться больше некуда — карточка идёт
      // за пальцем один к одному в обе стороны. Туго она идёт только в
      // колоде из одной карточки: там и правда ходить некуда.
      // raw — сколько прошёл палец, dx — насколько уехала каретка.
      raw = mx;
      dx = loop ? mx : mx * 0.25;
      place(dx, 0);
    });

    const endDrag = (ev) => {
      if (ev.pointerId !== dragId) return;
      dragId = null;
      // loop проверяем здесь, а не только внутри step: в колоде из одной
      // карточки шага нет, и каретку надо вернуть на место, а не оставить
      // висеть там, где отпустили
      if (locked === 'x' && loop && swipePassed(Math.abs(raw), speed)) {
        // Свайп ВЛЕВО — следующая, ВПРАВО — предыдущая. По кругу, поэтому
        // из читалки этот жест уже никуда не выводит: с первой карточки
        // вправо попадаем на последнюю, а не в список колоды. Выйти —
        // крестиком в углу или клавишей Esc.
        // Карточка не возвращается на место, а продолжает движение
        // с того места, где её отпустили
        step(raw < 0 ? 1 : -1);
        return;
      }
      // Не дотянули до порога — вся каретка мягко возвращается на место,
      // и подъехавшая соседка уходит обратно за край
      place(0, Math.round(SLIDE_MS * 0.7));
    };
    big.addEventListener('pointerup', endDrag);
    big.addEventListener('pointercancel', endDrag);

    // Свайп двумя пальцами по трекпаду MacBook. Это НЕ перетаскивание:
    // система шлёт события колеса с горизонтальной составляющей, а
    // pointermove при этом не приходит вовсе — именно поэтому жест
    // раньше не работал на ноутбуке.
    //
    // Две сложности, которые приходится учитывать:
    //  * событий приходит десятки подряд, поэтому копим сумму сдвига;
    //  * после отрыва пальцев macOS ещё долго досылает «инерцию»,
    //    поэтому после срабатывания ставим паузу, иначе один жест
    //    перелистнёт сразу несколько карточек.
    let wheelAcc = 0, wheelUntil = 0, wheelTimer = null;
    const WHEEL_TRIGGER = 90;
    const WHEEL_COOLDOWN = 550;

    stage.addEventListener('wheel', (ev) => {
      if (!loop) return;                                       // одна карточка — листать нечего
      if (Math.abs(ev.deltaX) <= Math.abs(ev.deltaY)) return;  // это вертикальная прокрутка
      ev.preventDefault();
      const now = Date.now();
      if (now < wheelUntil) return;                            // ещё идёт инерция

      wheelAcc += ev.deltaX;
      clearTimeout(wheelTimer);
      wheelTimer = setTimeout(() => { wheelAcc = 0; }, 180);   // пауза — начинаем заново

      if (Math.abs(wheelAcc) < WHEEL_TRIGGER) {
        // Пока порог не набран, показываем сдвиг всей каретки: видно, что
        // жест ловится и какая карточка подъезжает
        place(Math.max(-70, Math.min(70, -wheelAcc)), 0);
        return;
      }

      // Пальцы влево по трекпаду дают deltaX > 0 — это «вперёд»
      const dir = wheelAcc > 0 ? 1 : -1;
      wheelAcc = 0;
      wheelUntil = now + WHEEL_COOLDOWN;
      step(dir);
    }, { passive: false });

    stage.addEventListener('pointerleave', () => {
      if (dragId === null && !sliding) place(0, Math.round(SLIDE_MS * 0.4));
    });

    const reader = el('div', { class: 'reader' }, [
      el('div', { class: 'reader-bar' }, [
        el('button', {
          class: 'iconbtn', attrs: { 'aria-label': 'Закрыть', type: 'button' },
          text: '✕',
          on: { click: () => go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId }) },
        }),
        el('span', { class: 'reader-pos', text: (i + 1) + ' / ' + total }),
        makeRecordControls(card, audioBar),
        el('button', {
          class: 'iconbtn heart' + (card.fav ? ' on' : ''),
          attrs: {
            type: 'button',
            'aria-pressed': String(!!card.fav),
            'aria-label': card.fav ? 'Убрать из избранного' : 'В избранное',
          },
          text: card.fav ? '♥' : '♡',
          on: { click: () => { card.fav = !card.fav; save(); render(); } },
        }),
        el('button', {
          class: 'iconbtn ghost', attrs: { 'aria-label': 'Изменить', type: 'button' },
          text: '✎', on: { click: () => editCard(deck, card) },
        }),
      ]),
      stage,
      el('div', { class: 'reader-actions' }, [
        el('button', {
          class: 'btn sec', attrs: { type: 'button', 'aria-label': 'Предыдущая' },
          text: '‹ Назад', on: { click: () => step(-1) },
        }),
        el('button', {
          class: 'btn sec', attrs: { type: 'button', 'aria-label': 'Следующая' },
          text: 'Вперёд ›', on: { click: () => step(1) },
        }),
      ]),
    ]);

    // Клавиатура — чтобы удобно проверять на компьютере
    const onKey = (ev) => {
      if (ev.key === 'ArrowLeft') step(-1);
      else if (ev.key === 'ArrowRight') step(1);
      else if (ev.key === 'Escape') {
        go({ name: 'deck', sectionId: view.sectionId, deckId: view.deckId });
      }
    };
    // Снимается в render() перед следующей отрисовкой. Событий вида
    // DOMNodeRemoved намеренно избегаем: они устарели и в части браузеров
    // не срабатывают, обработчик остался бы висеть навсегда.
    document.addEventListener('keydown', onKey);
    readerKeyHandler = onKey;

    return reader;
  }

  let readerKeyHandler = null;

  // Параметры перелистывания. Кривая — та же, что в системных переходах
  // iOS: быстрый старт и долгое мягкое торможение в конце.
  const SLIDE_MS = 524;   // 380 → 456 → 524: замедлено на 20%, затем ещё на 15%
  const SLIDE_EASE = 'cubic-bezier(.32,.72,0,1)';
  // Отдельного «въезда» новой карточки больше нет: соседняя приезжает в
  // середину сама, вместе с кареткой, и подмена происходит уже на месте
  let pageEnter = 0;      // с какой стороны въезжает экран при жесте «назад»
  let sliding = false;    // идёт анимация — новые жесты игнорируем

  // Порог жеста — один на всё приложение. Раньше «назад» требовал 90 px,
  // а перелистывание карточки 60: одно и то же движение пальцем на разных
  // экранах срабатывало по-разному, и жест приходилось «дотягивать».
  const SWIPE_NEED = 48;      // столько хватает при спокойном движении
  const SWIPE_FLICK = 22;     // короткий взмах — если он быстрый
  const SWIPE_SPEED = 0.35;   // px/мс, порог «быстрого»
  const SWIPE_START = 6;      // с какого сдвига решаем, куда пошёл палец

  // Просвет между карточками в читалке. Видно его во время хода: полоска
  // бумаги между уходящей и приезжающей. Он же держит соседок за краем
  // экрана в покое — вместе с их тенью.
  const CARD_GAP = 56;

  /**
   * Дотянул ли человек до срабатывания. Одна проверка для всех жестов:
   * и для «назад» в колоде, и для перелистывания карточки.
   *
   * Два пути. Либо протянуть спокойно 48 px, либо махнуть коротко и
   * быстро — второй путь и делает жест коротким на ощупь: пальцем от
   * середины экрана достаточно дёрнуть на пару сантиметров.
   *
   * speed — px/мс на последнем отрезке движения, всегда по модулю.
   */
  function swipePassed(dist, speed) {
    if (dist >= SWIPE_NEED) return true;
    return dist >= SWIPE_FLICK && speed >= SWIPE_SPEED;
  }

  // ------------------------------------------------------------------
  // Запись и проигрывание голоса
  // ------------------------------------------------------------------
  let activeRecorder = null;     // чтобы не начать вторую запись поверх первой

  function mmss(sec) {
    const s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  /**
   * 00:02,25 — минуты, секунды и сотые, как в «Диктофоне».
   *
   * Сотые именно отбрасываются, а не округляются: пока секунда не
   * наступила, показывать её нельзя. Но сначала подчищаем до тысячных —
   * дробные числа хранятся неточно, и, скажем, 125,07 внутри лежит как
   * 125,06999…, отчего на экране появлялось бы «,06».
   */
  function mmsscc(sec) {
    const cc100 = Math.floor(Math.round(Math.max(0, sec) * 1000) / 10);
    const cc = cc100 % 100;
    const whole = (cc100 - cc) / 100;
    const m = Math.floor(whole / 60);
    const s = whole % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0')
      + ',' + String(cc).padStart(2, '0');
  }

  /** Блок записи: одна кнопка до старта, три во время. */
  function makeRecordControls(card, audioBar) {
    const box = el('div', { class: 'rec-box' });

    const startBtn = el('button', {
      class: 'iconbtn rec', attrs: { type: 'button', 'aria-label': 'Записать голос' },
      text: '●',
    });
    const pauseBtn = el('button', {
      class: 'iconbtn rec-ctl', attrs: { type: 'button', 'aria-label': 'Пауза' },
      text: '❚❚',
    });
    const stopBtn = el('button', {
      class: 'iconbtn rec-ctl', attrs: { type: 'button', 'aria-label': 'Завершить запись' },
      text: '■',
    });
    const timer = el('span', { class: 'rec-time' });

    // До старта видна только круглая кнопка. Пауза и стоп появляются
    // рядом с ней уже во время записи.
    const idle = () => {
      clear(box);
      box.appendChild(startBtn);
      startBtn.classList.remove('on');
      startBtn.textContent = '●';
      startBtn.setAttribute('aria-label', 'Записать голос');
      timer.textContent = '';
    };
    const live = () => {
      clear(box);
      box.appendChild(startBtn);
      if (canPause()) box.appendChild(pauseBtn);
      box.appendChild(stopBtn);
      box.appendChild(timer);
      markPaused(false);
    };

    function canPause() {
      return typeof self.MediaRecorder !== 'undefined'
        && typeof self.MediaRecorder.prototype.pause === 'function';
    }

    startBtn.addEventListener('click', () => {
      if (activeRecorder) return;                 // уже пишем
      const sup = recordingSupport();
      if (!sup.ok) { alert(RECORD_HELP[sup.why]); return; }
      startRecording(card, audioBar, { timer, live, idle, pauseBtn });
    });

    // Значок паузы не меняется никогда — меняется только его плотность.
    // Идёт запись — знак приглушён; поставили на паузу — наливается
    // цветом. Подмена значка на кружок сбивала с толку: он становился
    // похож на кнопку старта, хотя делает совсем другое.
    const markPaused = (paused) => {
      pauseBtn.classList.toggle('paused', paused);
      pauseBtn.classList.toggle('recording', !paused);
      pauseBtn.setAttribute('aria-label', paused ? 'Продолжить запись' : 'Пауза');
      startBtn.classList.toggle('on', !paused);   // пульсация только при записи
    };

    pauseBtn.addEventListener('click', () => {
      const r = activeRecorder;
      if (!r) return;
      if (r.state === 'recording') { r.pause(); markPaused(true); }
      else if (r.state === 'paused') { r.resume(); markPaused(false); }
    });

    stopBtn.addEventListener('click', stopRecording);

    idle();
    return box;
  }

  /**
   * Замер громкости прямо с микрофона во время записи.
   *
